name: r8-w7b-freeform-attribution-authority

on:
  push:
    branches:
      - feat/r8-w7b-freeform-attribution
    paths:
      - "src/nmd/freeform_attribution_authority.py"
      - "src/nmd/freeform_attribution_cache.py"
      - "src/nmd/freeform_attribution_training.py"
      - "scripts/r8_w7b_build_cache.py"
      - "scripts/r8_w7b_train_candidate.py"
      - "scripts/r8_w7b_freeze_candidates.py"
      - "scripts/r8_w7b_confirm.py"
      - "tests/test_freeform_attribution_authority.py"
      - "tests/test_freeform_attribution_cache.py"
      - "tests/test_freeform_attribution_training.py"
      - "tests/test_freeform_attribution_execution_contracts.py"
      - ".github/workflows/r8-w7b-freeform-attribution-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w7b-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W7b stack
        run: |
          python -m py_compile src/nmd/freeform_attribution_authority.py src/nmd/freeform_attribution_cache.py src/nmd/freeform_attribution_training.py scripts/r8_w7b_build_cache.py scripts/r8_w7b_train_candidate.py scripts/r8_w7b_freeze_candidates.py scripts/r8_w7b_confirm.py
      - name: Run W7b contracts
        run: |
          pytest -q tests/test_freeform_attribution_authority.py tests/test_freeform_attribution_cache.py tests/test_freeform_attribution_training.py tests/test_freeform_attribution_execution_contracts.py tests/test_competitive_coarse_runtime.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W6e joint-primary artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .digest)" = "sha256:fe0f176514b1cee0964212978b839b351ba6f35260ce0a035a1346680fc855bd"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-primary
          path: inputs/upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202
      - name: Verify exact W6e receipt and hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/upstream")
          x=json.load(open(root/"receipt.json"))
          assert x["schema_version"] == "r8-w6e-candidate-receipt-v1"
          assert x["status"] == "PASS"
          assert x["candidate"] == "multi-source-joint-primary"
          assert x["selected_epoch"] == 6
          assert x["confirm_l_exposed"] is False
          assert x["confirm_m_exposed"] is False
          expected={
              "hira.pt":"d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588",
              "scorer.pt":"6d5a7f2d3ed63ecd756181b1cb54e4704f68e5f74983a897f0a68fb4d1d63d2e",
          }
          for name,digest in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual == digest, (name,actual)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7b-frozen-w6e-joint-primary
          path: inputs/upstream
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh AN-AQ TRAIN and DEV-AR cache
        run: |
          python scripts/r8_w7b_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
      - name: Verify pre-confirm cache boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["schema_version"] == "r8-w7b-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["train_case_count"] == 384
          assert x["dev_case_count"] == 192
          assert x["train_decision_count"] == 1920
          assert x["dev_decision_count"] == 960
          assert x["train_domain_counts"] == {"AN":96,"AO":96,"AP":96,"AQ":96}
          assert x["dev_domain_counts"] == {"AR":192}
          assert x["state_encodes_per_case_train"] == 1.0
          assert x["state_encodes_per_case_dev"] == 1.0
          assert x["train_factor_encoder_batches"] == 0
          assert x["dev_factor_encoder_batches"] == 0
          assert x["train_factor_text_count"] == 0
          assert x["dev_factor_text_count"] == 0
          assert x["prior_authority_value_overlap"] == []
          assert x["confirm_as_exposed"] is False
          assert x["confirm_at_exposed"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6j_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7b-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 30

  candidate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - frozen-w6e-control
          - typed-only-retune
          - pair-only-retune
          - typed-plus-pair-primary
          - typed-plus-pair-replica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7b-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7b-frozen-w6e-joint-primary
          path: inputs/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Train/freeze candidate on DEV-AR only
        run: |
          python scripts/r8_w7b_train_candidate.py --train-cache inputs/cache/train.pt --dev-cache inputs/cache/dev-ar.pt --w6e-hira inputs/upstream/hira.pt --w6e-scorer inputs/upstream/scorer.pt --candidate "${{ matrix.candidate }}" --out artifacts/candidate
          cat artifacts/candidate/receipt.json
      - name: Verify candidate receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/candidate/receipt.json"))
          assert x["schema_version"] == "r8-w7b-candidate-receipt-v1"
          assert x["status"] == "PASS"
          names={
              "frozen-w6e-control",
              "typed-only-retune",
              "pair-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          assert x["candidate"] in names
          expected=0 if x["candidate"]=="frozen-w6e-control" else 32769
          assert x["trainable_parameter_count"] == expected
          assert x["scorer_parameter_count"] == 32769
          assert x["hira_frozen"] is True
          assert x["factor_branch_enabled"] is False
          assert x["confirm_as_exposed"] is False
          assert x["confirm_at_exposed"] is False
          if x["candidate"]=="frozen-w6e-control":
              assert x["selected_epoch"] == 0
              assert x["optimizer_case_steps"] == 0
          else:
              assert 1 <= x["selected_epoch"] <= 6
              assert x["optimizer_case_steps"] == 384*6
              assert len(x["history"]) == 6
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7b-candidate-${{ matrix.candidate }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 30

  freeze:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w7b-candidate-*
          path: inputs/candidates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Freeze all DEV-AR checkpoints
        run: |
          python scripts/r8_w7b_freeze_candidates.py --candidates inputs/candidates --out artifacts/freeze
          cat artifacts/freeze/freeze.json
      - name: Verify freeze boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/freeze/freeze.json"))
          assert x["schema_version"] == "r8-w7b-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          assert x["selection_authority"] == "DEV_AR_INDEPENDENT_PER_CANDIDATE"
          assert {r["candidate"] for r in x["candidates"]} == {
              "frozen-w6e-control",
              "typed-only-retune",
              "pair-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          assert x["equal_train_case_budget"] is True
          assert x["equal_optimizer_steps"] is True
          assert x["primary_replica_seed_independence"] is True
          assert x["confirm_as_exposed"] is False
          assert x["confirm_at_exposed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7b-freeze
          path: artifacts/freeze
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7b-freeze
          path: inputs/freeze
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Generate untouched AS/AT and evaluate frozen candidates
        run: |
          python scripts/r8_w7b_confirm.py --freeze inputs/freeze/freeze.json --checkpoints inputs/freeze --out artifacts/confirm
          cat artifacts/confirm/confirm.json
      - name: Verify confirm receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/confirm.json"))
          assert x["schema_version"] == "r8-w7b-confirm-v1"
          assert x["status"] == "PASS"
          assert x["confirm_generated_after_all_dev_freezes"] is True
          assert x["confirm_domains"] == ["AS","AT"]
          assert x["confirm_as_case_count"] == 192
          assert x["confirm_at_case_count"] == 192
          assert x["confirm_as_decision_count"] == 960
          assert x["confirm_at_decision_count"] == 960
          assert x["state_encodes_per_case_as"] == 1.0
          assert x["state_encodes_per_case_at"] == 1.0
          assert x["factor_encoder_batches_as"] == 0
          assert x["factor_encoder_batches_at"] == 0
          assert set(x["paths"]) == {"AS","AT"}
          names={
              "frozen-w6e-control",
              "typed-only-retune",
              "pair-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          assert set(x["paths"]["AS"]) == names
          assert set(x["paths"]["AT"]) == names
          assert x["verdict"] in {
              "FREEFORM_RETUNE_REPLICATION_ATTRIBUTED",
              "FREEFORM_RETUNE_REPLICATION_UNATTRIBUTED",
              "FREEFORM_RETUNE_NONREPLICATING",
          }
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6j_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7b-authoritative-confirm
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90
