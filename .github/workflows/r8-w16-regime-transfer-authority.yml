name: r8-w16-regime-transfer-authority

on:
  push:
    branches:
      - feat/r8-w16-regime-transfer-decomposition
    paths:
      - ".github/workflows/r8-w16-regime-transfer-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w16-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W16 stack
        run: |
          python -m py_compile \
            src/nmd/regime_transfer_authority.py \
            src/nmd/regime_transfer_cache.py \
            src/nmd/regime_transfer_eval.py \
            scripts/r8_w16_build_cache.py \
            scripts/r8_w16_evaluate.py
      - name: Run frozen W16 contracts
        run: pytest -q tests/test_regime_transfer.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W9 freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .digest)" = "sha256:6f0eee6ae58d489f0486372f0311e0f420065a0d9499185af7904377ae6a4712"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w9-freeze
          path: inputs/freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36122220588
      - name: Verify frozen projection provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("inputs/freeze/freeze.json").read_text())
          assert x["schema_version"] == "r8-w9-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          rows={r["candidate"]:r for r in x["candidates"]}
          assert "projection-semantic-control" in rows
          assert rows["projection-semantic-control"]["scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          print("w16_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w16-frozen-w9-checkpoints
          path: inputs/freeze
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first eligible W16 exposure
        run: echo R8_W16_CG_CJ_A13_EXPOSURE_BEGIN
      - name: Build fresh matched regime-transfer cache
        run: |
          python scripts/r8_w16_build_cache.py --out artifacts/w16-cache
          cat artifacts/w16-cache/receipt.json
      - name: Verify cache receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w16-cache/receipt.json"))
          assert x["schema_version"] == "r8-w16-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 256
          assert x["view_count"] == 2304
          assert x["state_encoder_batches"] == 256
          assert x["encoded_state_text_count"] == 512
          assert x["state_encoder_batches_per_base"] == 1.0
          assert x["encoded_state_texts_per_base"] == 2.0
          assert x["r2_additional_encoder_calls"] == 0
          assert x["prefix_token_identity_rate"] == 1.0
          assert x["domain_base_counts"] == {"CG":64,"CH":64,"CI":64,"CJ":64}
          assert x["prior_exact_text_overlap"] == []
          assert x["training_performed"] is False
          assert x["w14_rows_used"] is False
          assert x["w15_rows_used"] is False
          assert x["w15_ce_cf_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print("w16_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w16-regime-transfer-cache
          path: artifacts/w16-cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w16-frozen-w9-checkpoints
          path: inputs/freeze
      - uses: actions/download-artifact@v4
        with:
          name: r8-w16-regime-transfer-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen evaluator stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]"
      - name: Evaluate frozen matched regime transfer
        run: |
          python scripts/r8_w16_evaluate.py --cache inputs/cache/diagnostic.pt --freeze inputs/freeze/freeze.json --checkpoints inputs/freeze --out artifacts/w16-audit
          cat artifacts/w16-audit/audit.json
      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w16-audit/audit.json"))
          assert x["schema_version"] == "r8-w16-regime-transfer-v1"
          assert x["status"] == "PASS"
          assert x["training_performed"] is False
          assert x["cached_base_count"] == 256
          assert x["cached_view_count"] == 2304
          assert x["state_encoder_batches_per_base"] == 1.0
          assert x["encoded_state_texts_per_base"] == 2.0
          assert x["r2_additional_encoder_calls"] == 0
          assert x["prefix_token_identity_rate"] == 1.0
          assert x["reference_model"] == "sentence-transformers/all-MiniLM-L6-v2"
          assert x["reference_revision"] == "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
          assert x["reference_weight_sha256"] == "53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db"
          assert x["reference_is_hira_candidate"] is False
          assert x["outcome"] in {
              "STABLE_REGIME_TRANSFER_LOCALIZATION",
              "MIXED_REGIME_TRANSFER_LOCALIZATION",
              "REGIME_TRANSFER_UNRESOLVED",
          }
          assert x["w14_rows_used"] is False
          assert x["w15_rows_used"] is False
          assert x["w15_ce_cf_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print(x["outcome"], x["stable_classification"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w16-regime-transfer-audit
          path: artifacts/w16-audit
          if-no-files-found: error
          retention-days: 90
