name: hira-v1-s33-matched-query-explicit-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s33-query-explicit-relation
    paths:
      - "research/HIRA-V1-S33-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s33-a0-query-explicit-relation
          path: inputs/S33A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36988606786

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S33 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S33 contracts
        run: |
          python -m py_compile             src/nmd/v1_query_explicit_relation.py             src/nmd/v1_s33_authority.py             src/nmd/v1_s33_checkpoint.py             scripts/hira_v1_s33_a0_query_explicit_relation.py             scripts/hira_v1_s33_train_dev.py
          pytest -q             tests/test_v1_query_explicit_relation.py             tests/test_v1_s33_authority.py             tests/test_v1_s33_checkpoint.py             tests/test_v1_relation_canonicalization.py             tests/test_v1_a13_lora.py             tests/test_v1_evidence_fusion.py             tests/test_v1_gradient_isolated_fusion.py             tests/test_v1_norm_balanced_gradient.py             tests/test_v1_invariance.py             tests/test_v1_triadic_semantic.py

      - name: Verify canonical S33-A0 authority
        run: |
          (cd inputs/S33A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S33A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s33-a0-query-explicit-relation-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S33_A0_QUERY_EXPLICIT_RELATION_READY"
          assert r["scientific_authority"]=="S33_A0_QUERY_EXPLICIT_RELATION_ONLY"
          assert r["base_relation_logit_identity_max_abs"]==0.0
          assert r["base_relation_signature_identity_max_abs"]==0.0
          assert r["query_anchor_reference_max_abs"]==0.0
          assert r["base_signature_dimension"]==128
          assert r["query_option_block_dimension"]==128
          assert r["treatment_signature_dimension"]==256
          assert r["base_score_weight"]==0.5
          assert r["query_option_score_weight"]==0.5
          assert r["operator_added_parameter_count"]==0
          assert r["physical_trainable_parameter_count"]==49152
          assert r["lora_parameter_count"]==16384
          assert r["projection_parameter_count"]==32768
          assert r["runtime_trainable_parameter_count"]==0
          assert r["original_a13_trainable_parameter_count"]==0
          assert r["hira_core_trainable_parameter_count"]==0
          assert r["checkpoint_key_count"]==8
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["treatment_probability_mass_error"]<=1e-6
          assert r["full_k"] is True
          assert r["question_anchor_intervention_max_abs"]>0.0
          assert r["query_option_signature_intervention_max_abs"]>0.0
          assert r["query_option_logits_intervention_max_abs"]>0.0
          assert r["q_a_option0_minus_option1"]>0.0
          assert r["q_b_option1_minus_option0"]>0.0
          assert r["option_permutation_logit_error"]==0.0
          assert r["option_permutation_signature_error"]==0.0
          assert all(v>0.0 for v in r["gradient"]["lora_b_gradient_l1"])
          assert r["gradient"]["projection_gradient_l1"]>0.0
          assert r["gradient"]["relation_block"]>0.0
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh matched S33 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s33_train_dev.py             --bundle inputs/M4/hira-v0-m4-runtime             --a0-result inputs/S33A0/result.json             --out artifacts/s33-train-dev

      - name: Verify S33 matched receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/s33-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s33-matched-query-explicit-relation-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S33_MATCHED_QUERY_EXPLICIT_DEV_COMPLETE",
              "HIRA_V1_S33_MATCHED_QUERY_EXPLICIT_CONTROL_DEV_READY",
              "HIRA_V1_S33_MATCHED_QUERY_EXPLICIT_TREATMENT_DEV_READY",
              "HIRA_V1_S33_MATCHED_QUERY_EXPLICIT_BOTH_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S33_FRESH_MATCHED_CONTROL_VS_QUERY_EXPLICIT"
          assert r["seed"]==54001
          assert r["optimizer"]["epochs"]==24
          assert r["optimizer"]["batch_size_semantic_cases"]==16
          assert r["optimizer"]["lr"]==2e-4
          assert r["optimizer"]["weight_decay"]==0.01
          assert r["optimizer"]["grad_clip"]==1.0

          loss=r["loss"]
          assert loss["control_relation_operator"]=="S13_CrossViewRelationCanonicalizer"
          assert loss["treatment_relation_operator"]=="S33_QueryExplicitRelationCanonicalizer"
          assert loss["treatment_base_score_weight"]==0.5
          assert loss["treatment_query_option_score_weight"]==0.5
          assert loss["treatment_signature_dimension"]==256
          assert loss["treatment_added_parameters"]==0
          assert loss["fused_primary_relation_logits_detached"] is True
          assert loss["norm_balanced_gradient"]=="equal_direction_relation_priority_projection"

          p=r["partitions"]
          assert p["train_semantic_cases"]==768
          assert p["dev_semantic_cases"]==192
          assert len(p["domains"])==12
          assert p["k"]==4
          assert p["views_per_option"]==2
          assert p["identical_rows_across_arms"] is True
          assert p["identical_batch_order_across_arms"] is True
          assert p["prior_track_exact_rows_used"] is False
          assert p["s33_a0_rows_used"] is False
          assert p["m5_final_rows_used"] is False
          assert p["w29_w34_sealed_rows_used"] is False

          for arm in ("control","query"):
              a=r[f"{arm}_arm"]
              assert 1<=a["selected_dev_epoch"]<=24
              assert len(a["history"])==24
              assert a["parameter_surface"]["total_trainable_parameters"]==49152
              assert a["parameter_surface"]["lora_trainable_parameters"]==16384
              assert a["parameter_surface"]["projection_trainable_parameters"]==32768
              assert a["parameter_surface"]["original_a13_trainable"]==0
              assert a["parameter_surface"]["hira_core_trainable"]==0
              assert a["parameter_surface"]["fusion_added_parameters"]==0
              assert a["parameter_surface"]["learned_downstream_scorer_parameters"]==0
              assert a["selected_dev"]["full_k"] is True
              assert a["selected_dev"]["fused_option_order_flip_rate"]==0.0
              assert a["selected_dev"]["fused_max_probability_mass_error"]<=1e-6

          assert isinstance(r["matched_selected_dev_delta_query_minus_control"],dict)
          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False

          assert (root/"control-relation-candidate.pt").is_file()
          assert (root/"query-relation-candidate.pt").is_file()
          PY

      - name: Verify S33 checkpoint schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_s33_checkpoint import load_hira_v1_s33_checkpoint

          root=Path("artifacts/s33-train-dev")
          r=json.loads((root/"result.json").read_text())
          for arm in ("control","query"):
              path=root/f"{arm}-relation-candidate.pt"
              _lora,_proj,meta=load_hira_v1_s33_checkpoint(
                  path,
                  arm=arm,
                  expected_sha256=r[f"{arm}_arm"]["checkpoint_sha256"],
              )
              assert meta["selected_dev_epoch"]==r[f"{arm}_arm"]["selected_dev_epoch"]
              assert meta["total_parameter_count"]==49152
          PY

      - name: Freeze S33 matched integrity
        run: |
          (cd artifacts/s33-train-dev &&             sha256sum               result.json               train-manifest.json               dev-manifest.json               control-relation-candidate.pt               query-relation-candidate.pt               > INTEGRITY.sha256 &&             sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s33-matched-query-explicit-train-dev
          path: artifacts/s33-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
