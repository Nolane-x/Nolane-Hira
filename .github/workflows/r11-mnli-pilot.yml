name: r11-mnli-pilot

on:
  push:
    branches:
      - feat/r11-batched-relation-learning

jobs:
  mnli-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Run frozen-A13 cached MultiNLI pilot
        run: |
          python scripts/r11_mnli_pilot.py \
            --out artifacts/r11-mnli \
            --train-n 5000 \
            --val-n 1000 \
            --epochs 8 \
            --encode-batch-size 32 \
            --train-batch-size 64 \
            --segments 8 \
            --lr 0.002 \
            --seed 13
          cat artifacts/r11-mnli/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: r11-mnli-pilot
          path: |
            artifacts/r11-mnli/receipt.json
            artifacts/r11-mnli/hira-head.pt
          if-no-files-found: error
      - name: Package exact R11 repository snapshot
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/NOLANE-HIRA-R11-FULL.zip HEAD
          cp research/R11-BATCHED-RELATION-HANDOFF.md dist/R11-HANDOFF.md
          sha256sum dist/NOLANE-HIRA-R11-FULL.zip > dist/NOLANE-HIRA-R11-FULL.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r11-full-bundle
          path: dist
          if-no-files-found: error
