name: r8-w6c-unit

on:
  push:
    branches:
      - feat/r8-w6c-reliability-calibration
    paths:
      - "src/nmd/calibration.py"
      - "src/nmd/runtime.py"
      - "tests/test_typed_reliability_calibration.py"
      - ".github/workflows/r8-w6c-unit.yml"
  pull_request:
    paths:
      - "src/nmd/calibration.py"
      - "src/nmd/runtime.py"
      - "tests/test_typed_reliability_calibration.py"
      - ".github/workflows/r8-w6c-unit.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: |
          python -m py_compile src/nmd/calibration.py src/nmd/runtime.py tests/test_typed_reliability_calibration.py
      - name: Run W6c Phase A contracts
        run: pytest -q tests/test_typed_reliability_calibration.py
      - name: Run W6/W6b regressions
        run: |
          pytest -q tests/test_competitive_coarse_runtime.py
          pytest -q tests/test_typed_competitive_cache.py
