name: r8-w16-unit

on:
  push:
    branches:
      - feat/r8-w16-regime-transfer-decomposition
    paths:
      - "src/nmd/regime_transfer_authority.py"
      - "src/nmd/regime_transfer_cache.py"
      - "src/nmd/regime_transfer_eval.py"
      - "tests/test_regime_transfer.py"
      - "scripts/r8_w16_build_cache.py"
      - "scripts/r8_w16_evaluate.py"
      - "research/R8-W16-HANDOFF.md"
      - "research/R8-W16-PRIOR-ART.md"
      - ".github/workflows/r8-w16-unit.yml"
  pull_request:
    paths:
      - "src/nmd/regime_transfer_authority.py"
      - "src/nmd/regime_transfer_cache.py"
      - "src/nmd/regime_transfer_eval.py"
      - "tests/test_regime_transfer.py"
      - "scripts/r8_w16_build_cache.py"
      - "scripts/r8_w16_evaluate.py"
      - "research/R8-W16-HANDOFF.md"
      - "research/R8-W16-PRIOR-ART.md"
      - ".github/workflows/r8-w16-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w16-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W16 stack
        run: |
          python -m py_compile \
            src/nmd/regime_transfer_authority.py \
            src/nmd/regime_transfer_cache.py \
            src/nmd/regime_transfer_eval.py \
            scripts/r8_w16_build_cache.py \
            scripts/r8_w16_evaluate.py
      - name: Run W16 pre-data contracts
        run: |
          pytest -q tests/test_regime_transfer.py
