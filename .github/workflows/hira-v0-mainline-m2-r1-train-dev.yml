name: hira-v0-mainline-m2-r1-train-dev

on:
  push:
    branches:
      - feat/hira-v0-mainline-m2-high-k
    paths:
      - "research/HIRA-V0-MAINLINE-M2-R1-ENABLE-TRAIN"

permissions:
  contents: read
  actions: read

concurrency:
  group: hira-v0-mainline-m2-r1-train-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen M2-R1 stack
        run: |
          python -m py_compile \
            src/nmd/mainline.py \
            src/nmd/mainline_m2_authority.py \
            src/nmd/mainline_m2_eval.py \
            src/nmd/mainline_m2_r1_authority.py \
            src/nmd/mainline_m2_r1_training.py \
            scripts/hira_v0_m2_r1_train.py \
            scripts/hira_v0_m2_semantic_confirm.py

      - name: Run M2-R1 pre-exposure contracts
        run: |
          pytest -q \
            tests/test_mainline_high_k.py \
            tests/test_mainline_m2_authority.py \
            tests/test_mainline_m2_eval.py \
            tests/test_mainline_m2_r1_authority.py \
            tests/test_mainline_m2_r1_training.py \
            tests/test_mainline.py

      - name: Verify failed baseline authority
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10928764745 --jq .digest)" = "sha256:18903d770c1917db94e395c49feb72c0e2fea1c01ef70e976c54ad40ed223148"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10928764745 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/runs/36311890201 --jq .conclusion)" = "success"

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

      - name: Verify exact W34 provisional transfer artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .digest)" = "sha256:8374f2eb849cf80d1201e4ad05a8c8bf4c9bf1f824da17306f57c87456fd186c"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .expired)" = "false"

  train:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w34-coevidence-training
          path: inputs/W34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36299087572

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen M2-R1 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" sentencepiece

      - name: Mark first HKA-HKD HKH-HKI rescue exposure
        run: echo HIRA_V0_M2_R1_TRAIN_DEV_EXPOSURE_BEGIN

      - name: Run frozen M2-R1 TRAIN DEV
        run: |
          python scripts/hira_v0_m2_r1_train.py \
            --t0-dir inputs/T0 \
            --w34-dir inputs/W34 \
            --out artifacts/m2-r1-train-dev

      - name: Verify M2-R1 receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/m2-r1-train-dev/receipt.json"))
          assert x["schema_version"]=="hira-v0-mainline-m2-r1-train-dev-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "HIRA_V0_M2_R1_DEV_QUALIFIED",
            "HIRA_V0_M2_R1_DEV_FAIL",
          }
          assert x["train_partitions"]==["HKA","HKB","HKC","HKD"]
          assert x["train_k"]==[4,8,16,32]
          assert x["train_case_count"]==64
          assert x["dev_partitions"]==["HKH","HKI"]
          assert x["dev_k"]==[64,128]
          assert x["dev_case_count"]==48
          assert x["candidate_count"]==4
          assert x["candidate_parameter_count"]==8192
          assert x["decision_core_trainable_parameter_count"]==0
          assert x["only_w34_candidate_parameters_trained"] is True
          assert x["encoder_gradient_updates"] is False
          assert x["w28_projection_gradient_updates"] is False
          assert x["hira_core_gradient_updates"] is False
          assert x["hke_hkf_rows_used_for_training"] is False
          assert x["hke_hkf_rows_used_for_selection"] is False
          assert x["hkg_exposed"] is False
          assert x["hkg_rows_used"] is False
          assert x["sealed_exposure_authorized"] is x["dev_qualification"]["pass"]
          assert x["candidate_pruning_used"] is False
          assert x["relation_refinement_used"] is False
          assert x["adaptive_budget_used"] is False
          print("HIRA_V0_M2_R1_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "selected_family":x["selected_family"],
            "primary_candidate":x["primary_candidate"],
            "replica_candidate":x["replica_candidate"],
            "primary_runtime":x["primary_runtime"],
            "replica_runtime":x["replica_runtime"],
            "dev_qualification":x["dev_qualification"],
            "sealed_exposure_authorized":x["sealed_exposure_authorized"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m2-r1-train-dev
          path: artifacts/m2-r1-train-dev
          if-no-files-found: error
          retention-days: 90
