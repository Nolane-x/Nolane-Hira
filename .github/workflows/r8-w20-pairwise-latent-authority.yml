name: r8-w20-pairwise-latent-authority

on:
  push:
    branches:
      - feat/r8-w20-pairwise-latent-boundary
    paths:
      - ".github/workflows/r8-w20-pairwise-latent-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w20-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W20 stack
        run: |
          python -m py_compile \
            src/nmd/pairwise_latent_authority.py \
            src/nmd/pairwise_latent_cache.py \
            src/nmd/pairwise_latent_eval.py \
            scripts/r8_w20_build_cache.py \
            scripts/r8_w20_evaluate.py
      - name: Run frozen W20 contracts
        run: pytest -q tests/test_pairwise_latent.py
      - name: Verify freshness preflight
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.pairwise_latent_authority import all_w20_text_atoms
          spec=importlib.util.spec_from_file_location("w20build","scripts/r8_w20_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w20_text_atoms() & mod.prior_text_atoms())
          print("w20_authority_preflight_pass")
          PY

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W9 freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .digest)" = "sha256:6f0eee6ae58d489f0486372f0311e0f420065a0d9499185af7904377ae6a4712"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w9-freeze
          path: inputs/w9
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36122220588
      - name: Verify W9 projection-semantic provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/w9")
          x=json.loads((root/"freeze.json").read_text())
          assert x["schema_version"] == "r8-w9-freeze-v1"
          assert x["status"] == "PASS"
          rows={r["candidate"]:r for r in x["candidates"]}
          row=rows["projection-semantic-control"]
          assert row["scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          checkpoint=root/row["checkpoint_dir"]
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(checkpoint/"hira.pt") == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert sha(checkpoint/"scorer.pt") == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          print("w20_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w20-frozen-w9-checkpoints
          path: inputs/w9
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first eligible W20 exposure
        run: echo R8_W20_CZ_DC_A13_EXPOSURE_BEGIN
      - name: Build fresh CZ-DA-DB-DC isolated pairwise cache
        run: |
          python scripts/r8_w20_build_cache.py --out artifacts/w20-cache
          cat artifacts/w20-cache/receipt.json
      - name: Verify fresh cache receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w20-cache/receipt.json"))
          assert x["schema_version"] == "r8-w20-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["case_count"] == 384
          assert x["domains"] == ["CZ","DA","DB","DC"]
          assert x["domain_seeds"] == {"CZ":391101,"DA":391107,"DB":391119,"DC":391131}
          assert x["prior_exact_text_overlap"] == []
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["trainable_parameter_count"] == 0
          assert x["logical_state_compiles_per_case"] == 1
          assert x["a13_invocations_per_case"] == 1
          assert x["encoded_sequences_per_case"] == 2
          assert x["w19_rows_used"] is False
          assert x["w18_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print("w20_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w20-fresh-cache
          path: artifacts/w20-cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w20-frozen-w9-checkpoints
          path: inputs/w9
      - uses: actions/download-artifact@v4
        with:
          name: r8-w20-fresh-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]"
      - name: Evaluate flat vs local pairwise latent boundaries
        run: |
          python scripts/r8_w20_evaluate.py \
            --cache inputs/cache/w20.pt \
            --w9-freeze inputs/w9/freeze.json \
            --w9-checkpoints inputs/w9 \
            --out artifacts/w20-audit
      - name: Verify frozen W20 audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w20-audit/audit.json"))
          assert x["schema_version"] == "r8-w20-audit-v1"
          assert x["status"] == "PASS"
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["trainable_parameter_count"] == 0
          assert x["reference_model"] == "sentence-transformers/all-MiniLM-L6-v2"
          assert x["reference_revision"] == "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
          assert x["reference_weight_sha256"] == "53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db"
          assert x["reference_is_hira_candidate"] is False
          assert x["w9_hira_sha256"] == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert x["w9_scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert set(x["per_domain"]) == {"CZ","DA","DB","DC"}
          assert all(v["integrity"] for v in x["per_domain"].values())
          assert x["outcome"] in {
              "STABLE_LATENT_BOUNDARY_LOCALIZATION",
              "MIXED_LATENT_BOUNDARY_LOCALIZATION",
              "LATENT_BOUNDARY_UNRESOLVED",
          }
          assert x["w19_rows_used"] is False
          assert x["w18_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          pooled=x["metrics"]["pooled"]
          ref=x["reference"]["pooled"]
          summary={
              "outcome":x["outcome"],
              "stable_classification":x["stable_classification"],
              "classification_counts":x["classification_counts"],
              "hira_flat_local_severity":pooled["flat"]["severity_local_mean_top1"],
              "hira_flat_local_confidence":pooled["flat"]["confidence_local_mean_top1"],
              "hira_pair_severity":pooled["pairwise"]["severity_mean_top1"],
              "hira_pair_confidence":pooled["pairwise"]["confidence_mean_top1"],
              "hira_global_severity":pooled["global_reconstruction"]["severity"]["top1"],
              "hira_global_confidence":pooled["global_reconstruction"]["confidence"]["top1"],
              "reference_pair_severity":ref["pairwise"]["severity_mean_top1"],
              "reference_pair_confidence":ref["pairwise"]["confidence_mean_top1"],
          }
          print("W20_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w20-authoritative-audit
          path: artifacts/w20-audit
          if-no-files-found: error
          retention-days: 90
