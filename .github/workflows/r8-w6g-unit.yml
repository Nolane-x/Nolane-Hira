name: r8-w6g-unit

on:
  push:
    branches:
      - feat/r8-w6g-second-order-localization
    paths:
      - "src/nmd/second_order_localization_authority.py"
      - "src/nmd/second_order_localization.py"
      - "tests/test_second_order_localization_authority.py"
      - "tests/test_second_order_localization.py"
      - "research/R8-W6G-HANDOFF.md"
      - ".github/workflows/r8-w6g-unit.yml"
  pull_request:
    paths:
      - "src/nmd/second_order_localization_authority.py"
      - "src/nmd/second_order_localization.py"
      - "tests/test_second_order_localization_authority.py"
      - "tests/test_second_order_localization.py"
      - "research/R8-W6G-HANDOFF.md"
      - ".github/workflows/r8-w6g-unit.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6g pre-diagnostic stack
        run: |
          python -m py_compile \
            src/nmd/second_order_localization_authority.py \
            src/nmd/second_order_localization.py \
            tests/test_second_order_localization_authority.py \
            tests/test_second_order_localization.py
      - name: Run W6g authority contracts
        run: |
          pytest -q \
            tests/test_second_order_localization_authority.py \
            tests/test_second_order_localization.py \
            tests/test_competitive_coarse_runtime.py
