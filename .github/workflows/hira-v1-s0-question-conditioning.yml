name: hira-v1-s0-question-conditioning

on:
  push:
    branches:
      - feat/hira-v1-s0-query-conditioned-semantic
    paths:
      - "research/HIRA-V1-S0-ENABLE-QUESTION-DIAGNOSTIC"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install v1 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile v1 runtime
        run: |
          python -m py_compile             src/nmd/v1_query_conditioned_semantic.py             src/nmd/runtime.py             scripts/hira_v1_s0_question_blindness.py
      - name: Run v1 and frozen semantic regression contracts
        run: |
          pytest -q             tests/test_v1_query_conditioned_semantic.py             tests/test_w33_coevidence_semantic.py             tests/test_symmetric_semantic_runtime.py

  v0-question-diagnostic:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify and install exact frozen M4 wheel
        run: |
          (
            cd inputs/M4/hira-v0-m4-runtime
            sha256sum -c INTEGRITY.sha256
          )
          WHEEL="$(find inputs/M4/hira-v0-m4-runtime/python -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL"             "transformers>=4.45,<6"             "safetensors>=0.4"             "huggingface_hub>=0.24"

      - name: Confirm imported runtime is the frozen M4 package
        run: |
          python - <<'PY'
          import inspect
          import json
          from pathlib import Path
          import nmd
          from nmd.local_runtime import read_runtime_bundle_manifest

          manifest = read_runtime_bundle_manifest("inputs/M4/hira-v0-m4-runtime")
          assert manifest["hira_manifest"]["version"] == "0.0-m4a"
          assert manifest["hira_manifest"]["production_ready"] is False

          package_path = Path(inspect.getfile(nmd)).resolve()
          repo_src = (Path.cwd() / "src").resolve()
          assert repo_src not in package_path.parents, package_path
          print("FROZEN_M4_IMPORT=" + str(package_path))
          PY

      - name: Run v0 question-blindness localization
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s0_question_blindness.py             --bundle inputs/M4/hira-v0-m4-runtime             --out artifacts/s0-question-blindness

      - name: Verify diagnostic receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/s0-question-blindness")
          r = json.loads((root / "result.json").read_text(encoding="utf-8"))

          assert r["schema_version"] == "hira-v1-s0-question-blindness-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] == "HIRA_V1_S0_QUESTION_BLINDNESS_CONFIRMED"
          assert r["scientific_authority"] == "V1_S0_LOCALIZATION_ONLY"
          assert r["case_count"] == 8
          assert r["languages"] == ["en", "vi"]
          assert r["gold_answer_changes_with_question_rate"] == 1.0
          assert r["question_token_embeddings_change_rate"] == 1.0
          assert r["identical_logit_rate"] == 1.0
          assert r["identical_probability_rate"] == 1.0
          assert r["identical_choice_rate"] == 1.0
          assert r["state_encode_calls"] == 8
          assert r["runtime"]["manifest"]["version"] == "0.0-m4a"
          assert r["runtime"]["parameter_report"]["trainable_total"] == 0
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          assert len((root / "per-case.jsonl").read_text(encoding="utf-8").splitlines()) == 8
          PY

      - name: Freeze localization integrity
        run: |
          (
            cd artifacts/s0-question-blindness
            sha256sum suite.json result.json per-case.jsonl > INTEGRITY.sha256
            sha256sum -c INTEGRITY.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s0-question-blindness
          path: artifacts/s0-question-blindness
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
