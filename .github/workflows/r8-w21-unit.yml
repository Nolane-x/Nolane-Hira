name: r8-w21-unit

on:
  push:
    branches:
      - feat/r8-w21-prototype-grounded-latent
    paths:
      - "src/nmd/prototype_latent_authority.py"
      - "src/nmd/prototype_latent_cache.py"
      - "src/nmd/prototype_latent_eval.py"
      - "scripts/r8_w21_build_cache.py"
      - "scripts/r8_w21_evaluate.py"
      - "tests/test_prototype_latent.py"
      - "research/R8-W21-HANDOFF.md"
      - ".github/workflows/r8-w21-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w21-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W21 stack
        run: |
          python -m py_compile \
            src/nmd/prototype_latent_authority.py \
            src/nmd/prototype_latent_cache.py \
            src/nmd/prototype_latent_eval.py \
            scripts/r8_w21_build_cache.py \
            scripts/r8_w21_evaluate.py
      - name: Run W21 contracts
        run: pytest -q tests/test_prototype_latent.py
      - name: Preflight exact-text freshness without materialization
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.prototype_latent_authority import (
              all_w21_prototype_texts,
              all_w21_query_texts,
              all_w21_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w21build","scripts/r8_w21_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w21_text_atoms() & mod.prior_text_atoms())
          assert not (all_w21_query_texts() & all_w21_prototype_texts())
          print("w21_preflight_fresh")
          PY
