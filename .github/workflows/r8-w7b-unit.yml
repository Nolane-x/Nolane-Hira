name: r8-w7b-unit

on:
  push:
    branches:
      - feat/r8-w7b-freeform-attribution
    paths:
      - "src/nmd/freeform_attribution_authority.py"
      - "src/nmd/freeform_attribution_training.py"
      - "src/nmd/freeform_attribution_cache.py"
      - "scripts/r8_w7b_build_cache.py"
      - "scripts/r8_w7b_train_candidate.py"
      - "scripts/r8_w7b_freeze_candidates.py"
      - "scripts/r8_w7b_confirm.py"
      - "tests/test_freeform_attribution_authority.py"
      - "tests/test_freeform_attribution_training.py"
      - "tests/test_freeform_attribution_cache.py"
      - "tests/test_freeform_attribution_execution_contracts.py"
      - "research/R8-W7B-HANDOFF.md"
      - ".github/workflows/r8-w7b-unit.yml"
permissions:
  contents: read

concurrency:
  group: r8-w7b-unit-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W7b execution stack
        run: |
          python -m py_compile             src/nmd/freeform_attribution_authority.py             src/nmd/freeform_attribution_training.py             scripts/r8_w7b_build_cache.py             scripts/r8_w7b_train_candidate.py             scripts/r8_w7b_freeze_candidates.py             scripts/r8_w7b_confirm.py             tests/test_freeform_attribution_authority.py             tests/test_freeform_attribution_training.py             tests/test_freeform_attribution_execution_contracts.py
      - name: Run W7b and production contracts
        run: |
          pytest -q             tests/test_freeform_attribution_authority.py             tests/test_freeform_attribution_training.py             tests/test_freeform_attribution_execution_contracts.py             tests/test_conjunctive_cache.py             tests/test_competitive_coarse_runtime.py
