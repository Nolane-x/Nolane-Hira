name: r8-w6j-high-cardinality-decomposition

on:
  push:
    branches:
      - feat/r8-w6j-high-cardinality-decomposition
    paths:
      - "src/nmd/high_cardinality_decomposition.py"
      - "src/nmd/high_cardinality_decomposition_authority.py"
      - "src/nmd/high_cardinality_decomposition_eval.py"
      - "scripts/r8_w6j_build_cache.py"
      - "scripts/r8_w6j_evaluate.py"
      - "tests/test_high_cardinality_decomposition.py"
      - "tests/test_high_cardinality_decomposition_authority.py"
      - "tests/test_high_cardinality_decomposition_eval.py"
      - ".github/workflows/r8-w6j-high-cardinality-decomposition.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w6j-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W6j stack
        run: |
          python -m py_compile \
            src/nmd/high_cardinality_decomposition.py \
            src/nmd/high_cardinality_decomposition_authority.py \
            src/nmd/high_cardinality_decomposition_eval.py \
            scripts/r8_w6j_build_cache.py \
            scripts/r8_w6j_evaluate.py \
            tests/test_high_cardinality_decomposition.py \
            tests/test_high_cardinality_decomposition_authority.py \
            tests/test_high_cardinality_decomposition_eval.py
      - name: Run W6j and production contracts
        run: |
          pytest -q \
            tests/test_high_cardinality_decomposition.py \
            tests/test_high_cardinality_decomposition_authority.py \
            tests/test_high_cardinality_decomposition_eval.py \
            tests/test_competitive_coarse_runtime.py \
            tests/test_typed_competitive_cache.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact upstream artifact digests and availability
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .digest)" = "sha256:fe0f176514b1cee0964212978b839b351ba6f35260ce0a035a1346680fc855bd"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10816055074 --jq .digest)" = "sha256:54a673b057e8b509a6086e1b46c60263d195150ccfd4e7f4aca8f1667b9d74c1"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10815347443 --jq .digest)" = "sha256:d9c7e2089140247a33822f5acdb6810dbc88ffa078390d1b56dacedd5f486da1"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10816055074 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10815347443 --jq .expired)" = "false"

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-primary
          path: inputs/w6e-joint-primary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6h-candidate-projection-retune-control
          path: inputs/w6h-projection-retune
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36016490423

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6h-candidate-semantic-residual-adapter
          path: inputs/w6h-semantic-adapter
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36016490423

      - name: Verify exact frozen receipts and model hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def digest(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          w6e=Path("inputs/w6e-joint-primary")
          x=json.load(open(w6e/"receipt.json"))
          assert x["schema_version"] == "r8-w6e-candidate-receipt-v1"
          assert x["status"] == "PASS"
          assert x["candidate"] == "multi-source-joint-primary"
          assert x["confirm_l_exposed"] is False
          assert x["confirm_m_exposed"] is False
          assert digest(w6e/"hira.pt") == x["hira_sha256"]
          assert digest(w6e/"scorer.pt") == x["scorer_sha256"]
          assert x["hira_sha256"] == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert x["scorer_sha256"] == "6d5a7f2d3ed63ecd756181b1cb54e4704f68e5f74983a897f0a68fb4d1d63d2e"

          expected_w6h = {
              "projection-retune-control": "39235c425d22d01adcea47a7d9dca3330d022488191e5d0ea33bfbb4ee8af9e2",
              "semantic-residual-adapter": "9d34e50152706b7a2164b78427abf27dd98966938c3bcce58f71e36163e03469",
          }
          for path, candidate in (
              ("inputs/w6h-projection-retune", "projection-retune-control"),
              ("inputs/w6h-semantic-adapter", "semantic-residual-adapter"),
          ):
              root=Path(path)
              x=json.load(open(root/"receipt.json"))
              assert x["schema_version"] == "r8-w6h-candidate-receipt-v1"
              assert x["status"] == "PASS"
              assert x["candidate"] == candidate
              assert x["confirm_y_exposed"] is False
              assert x["confirm_z_exposed"] is False
              assert x["w6e_confirm_rows_used"] is False
              assert x["w6f_diagnostic_rows_used"] is False
              assert x["w6g_diagnostic_rows_used"] is False
              assert digest(root/"hira.pt") == x["hira_sha256"]
              assert digest(root/"scorer.pt") == x["scorer_sha256"]
              assert x["hira_sha256"] == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
              assert x["scorer_sha256"] == expected_w6h[candidate]
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6j-frozen-checkpoints
          path: inputs
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen A13 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh W6j decomposition cache
        run: |
          python scripts/r8_w6j_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
      - name: Verify fresh cache boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["schema_version"] == "r8-w6j-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 192
          assert x["view_count"] == 768
          assert x["domain_base_counts"] == {"AD":64,"AE":64,"AF":64}
          assert x["view_ids"] == ["k8","k16","k32","k64"]
          assert x["state_encode_calls"] == 192
          assert x["state_encodes_per_base"] == 1.0
          assert x["prior_authority_value_overlap"] == []
          assert x["training_performed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["w6d_confirm_rows_used"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["w6g_diagnostic_rows_used"] is False
          assert x["w6h_confirm_rows_used"] is False
          assert x["w6h_train_dev_rows_used"] is False
          assert x["w6i_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          assert len(x["case_id_sha256"]) == 64
          assert len(x["semantic_view_sha256"]) == 64
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6j-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6j-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6j-frozen-checkpoints
          path: inputs/checkpoints
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fixed-checkpoint evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Evaluate frozen high-cardinality decomposition
        run: |
          python scripts/r8_w6j_evaluate.py \
            --cache inputs/cache/diagnostics.pt \
            --w6e-joint-primary inputs/checkpoints/w6e-joint-primary \
            --w6h-projection-retune inputs/checkpoints/w6h-projection-retune \
            --w6h-semantic-adapter inputs/checkpoints/w6h-semantic-adapter \
            --out artifacts/audit
          cat artifacts/audit/audit.json
      - name: Verify immutable diagnostic result
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/audit/audit.json"))
          assert x["schema_version"] == "r8-w6j-high-cardinality-decomposition-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 192
          assert x["view_count"] == 768
          assert x["state_encodes_per_base"] == 1.0
          assert set(x["candidate_provenance"]) == {
              "w6e-joint-primary",
              "w6h-projection-retune",
              "w6h-semantic-adapter",
          }
          assert x["probability_mass_max_error"] <= 1e-6
          assert x["training_performed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["w6d_confirm_rows_used"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["w6g_diagnostic_rows_used"] is False
          assert x["w6h_confirm_rows_used"] is False
          assert x["w6h_train_dev_rows_used"] is False
          assert x["w6i_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0

          allowed = {
              "PAIRWISE_MULTIPLICITY_LIMIT",
              "SET_CONTEXT_RANK_REVERSAL",
              "COARSE_CONJUNCTION_LIMIT",
              "RELATION_DECOMPOSITION_DAMAGE",
              "MIXED_HIGH_CARDINALITY_ARCHITECTURE",
              "HIGH_CARDINALITY_DECOMPOSITION_UNRESOLVED",
          }
          assert set(x["results"]) == {
              "w6e-joint-primary",
              "w6h-projection-retune",
              "w6h-semantic-adapter",
          }
          for checkpoint in x["results"].values():
              assert set(checkpoint["per_domain"]) == {"AD","AE","AF"}
              for row in checkpoint["per_domain"].values():
                  assert row["classification"]["classification"] in allowed
              assert checkpoint["pooled"]["classification"]["classification"] in allowed

          assert x["stability"]["outcome"] in {
              "STABLE_HIGH_CARDINALITY_ARCHITECTURE",
              "MIXED_HIGH_CARDINALITY_ARCHITECTURE",
              "HIGH_CARDINALITY_DECOMPOSITION_UNRESOLVED",
          }
          assert x["rescue_lane_authorized"] == (
              x["stability"]["outcome"] == "STABLE_HIGH_CARDINALITY_ARCHITECTURE"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6j-high-cardinality-decomposition
          path: artifacts/audit
          if-no-files-found: error
          retention-days: 90
