name: r8-w7-conjunctive-authority

on:
  push:
    branches:
      - feat/r8-w7-conjunctive-coarse
    paths:
      - "src/nmd/conjunctive_coarse.py"
      - "src/nmd/conjunctive_authority.py"
      - "src/nmd/conjunctive_cache.py"
      - "src/nmd/conjunctive_training.py"
      - "scripts/r8_w7_build_cache.py"
      - "scripts/r8_w7_train_candidate.py"
      - "scripts/r8_w7_freeze_candidates.py"
      - "scripts/r8_w7_confirm.py"
      - "tests/test_conjunctive_coarse.py"
      - "tests/test_conjunctive_authority.py"
      - "tests/test_conjunctive_cache.py"
      - "tests/test_conjunctive_training.py"
      - "tests/test_conjunctive_execution_contracts.py"
      - ".github/workflows/r8-w7-conjunctive-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w7-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W7 stack
        run: |
          python -m py_compile \
            src/nmd/conjunctive_coarse.py \
            src/nmd/conjunctive_authority.py \
            src/nmd/conjunctive_cache.py \
            src/nmd/conjunctive_training.py \
            scripts/r8_w7_build_cache.py \
            scripts/r8_w7_train_candidate.py \
            scripts/r8_w7_freeze_candidates.py \
            scripts/r8_w7_confirm.py
      - name: Run W7 contracts
        run: |
          pytest -q \
            tests/test_conjunctive_coarse.py \
            tests/test_conjunctive_authority.py \
            tests/test_conjunctive_cache.py \
            tests/test_conjunctive_training.py \
            tests/test_conjunctive_execution_contracts.py \
            tests/test_competitive_coarse_runtime.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W6e joint-primary artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .digest)" = "sha256:fe0f176514b1cee0964212978b839b351ba6f35260ce0a035a1346680fc855bd"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-primary
          path: inputs/upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202
      - name: Verify exact W6e receipt and checkpoint hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/upstream")
          x=json.load(open(root/"receipt.json"))
          assert x["schema_version"] == "r8-w6e-candidate-receipt-v1"
          assert x["status"] == "PASS"
          assert x["candidate"] == "multi-source-joint-primary"
          assert x["selected_epoch"] == 6
          assert x["trainable_parameter_count"] == 454928
          assert x["total_parameter_count"] == 454928
          assert x["confirm_l_exposed"] is False
          assert x["confirm_m_exposed"] is False
          expected={
              "hira.pt":"d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588",
              "scorer.pt":"6d5a7f2d3ed63ecd756181b1cb54e4704f68e5f74983a897f0a68fb4d1d63d2e",
          }
          for name, digest in expected.items():
              actual=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7-frozen-w6e-joint-primary
          path: inputs/upstream
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh AG-AJ TRAIN and DEV-AK cache
        run: |
          python scripts/r8_w7_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
      - name: Verify cache exposure boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["schema_version"] == "r8-w7-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["train_case_count"] == 384
          assert x["dev_case_count"] == 192
          assert x["train_decision_count"] == 1920
          assert x["dev_decision_count"] == 960
          assert x["train_domain_counts"] == {"AG":96,"AH":96,"AI":96,"AJ":96}
          assert x["dev_domain_counts"] == {"AK":192}
          assert x["state_encodes_per_case_train"] == 1.0
          assert x["state_encodes_per_case_dev"] == 1.0
          assert x["train_factor_encoder_batches"] == 384
          assert x["dev_factor_encoder_batches"] == 192
          assert x["train_factor_text_count"] == 46080
          assert x["dev_factor_text_count"] == 23040
          assert x["prior_authority_value_overlap"] == []
          assert x["confirm_al_exposed"] is False
          assert x["confirm_am_exposed"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6j_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          assert len(x["train_factor_identity_sha256"]) == 64
          assert len(x["dev_factor_identity_sha256"]) == 64
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 30

  candidate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - frozen-w6e-control
          - freeform-retune-control
          - conjunctive-primary
          - conjunctive-replica
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7-frozen-w6e-joint-primary
          path: inputs/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Train/freeze candidate on DEV-AK only
        run: |
          python scripts/r8_w7_train_candidate.py \
            --train-cache inputs/cache/train.pt \
            --dev-cache inputs/cache/dev-ak.pt \
            --w6e-hira inputs/upstream/hira.pt \
            --w6e-scorer inputs/upstream/scorer.pt \
            --candidate "${{ matrix.candidate }}" \
            --out artifacts/candidate
          cat artifacts/candidate/receipt.json
      - name: Verify candidate receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/candidate/receipt.json"))
          assert x["schema_version"] == "r8-w7-candidate-receipt-v1"
          assert x["status"] == "PASS"
          expected_trainable={
              "frozen-w6e-control":0,
              "freeform-retune-control":32769,
              "conjunctive-primary":32772,
              "conjunctive-replica":32772,
          }
          expected_scorer={
              "frozen-w6e-control":32769,
              "freeform-retune-control":32769,
              "conjunctive-primary":32772,
              "conjunctive-replica":32772,
          }
          name=x["candidate"]
          assert name in expected_trainable
          assert x["trainable_parameter_count"] == expected_trainable[name]
          assert x["scorer_parameter_count"] == expected_scorer[name]
          assert x["hira_frozen"] is True
          assert x["confirm_al_exposed"] is False
          assert x["confirm_am_exposed"] is False
          if name == "frozen-w6e-control":
              assert x["selected_epoch"] == 0
              assert x["optimizer_case_steps"] == 0
              assert x["train_case_count"] == 0
          else:
              assert 1 <= x["selected_epoch"] <= 6
              assert x["optimizer_case_steps"] == 384 * 6
              assert x["train_case_count"] == 384
              assert len(x["history"]) == 6
          if name.startswith("conjunctive-"):
              assert x["factor_branch_enabled"] is True
          else:
              assert x["factor_branch_enabled"] is False
          assert "64" in x["selected_dev_metrics"]["diagnosis_per_k"]
          assert "32" in x["selected_dev_metrics"]["diagnosis_per_k"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7-candidate-${{ matrix.candidate }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 30

  freeze:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w7-candidate-*
          path: inputs/candidates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Freeze all DEV-AK checkpoints
        run: |
          python scripts/r8_w7_freeze_candidates.py \
            --candidates inputs/candidates \
            --out artifacts/freeze
          cat artifacts/freeze/freeze.json
      - name: Verify freeze boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/freeze/freeze.json"))
          assert x["schema_version"] == "r8-w7-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          assert x["selection_authority"] == "DEV_AK_INDEPENDENT_PER_CANDIDATE"
          assert {r["candidate"] for r in x["candidates"]} == {
              "frozen-w6e-control",
              "freeform-retune-control",
              "conjunctive-primary",
              "conjunctive-replica",
          }
          assert x["equal_train_case_budget"] is True
          assert x["equal_optimizer_steps"] is True
          assert x["primary_replica_seed_independence"] is True
          assert x["confirm_al_exposed"] is False
          assert x["confirm_am_exposed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7-freeze
          path: artifacts/freeze
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7-freeze
          path: inputs/freeze
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Generate untouched AL/AM and evaluate all frozen candidates
        run: |
          python scripts/r8_w7_confirm.py \
            --freeze inputs/freeze/freeze.json \
            --checkpoints inputs/freeze \
            --out artifacts/confirm
          cat artifacts/confirm/confirm.json
      - name: Verify confirm receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/confirm.json"))
          assert x["schema_version"] == "r8-w7-confirm-v1"
          assert x["status"] == "PASS"
          assert x["confirm_generated_after_all_dev_freezes"] is True
          assert x["confirm_domains"] == ["AL","AM"]
          assert x["confirm_al_case_count"] == 192
          assert x["confirm_am_case_count"] == 192
          assert x["confirm_al_decision_count"] == 960
          assert x["confirm_am_decision_count"] == 960
          assert x["state_encodes_per_case_al"] == 1.0
          assert x["state_encodes_per_case_am"] == 1.0
          assert x["factor_encoder_batches_al"] == 192
          assert x["factor_encoder_batches_am"] == 192
          assert set(x["paths"]) == {"AL","AM"}
          for domain in ("AL","AM"):
              assert set(x["paths"][domain]) == {
                  "frozen-w6e-control",
                  "freeform-retune-control",
                  "conjunctive-primary",
                  "conjunctive-replica",
              }
          assert x["verdict"] in {
              "CONJUNCTIVE_COARSE_RESCUE",
              "CONJUNCTIVE_COARSE_PARTIAL",
              "CONJUNCTIVE_COARSE_FAIL",
          }
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6j_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7-authoritative-confirm
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90
