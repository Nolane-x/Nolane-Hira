name: hira-v1-s24-a0-reliability-fusion

on:
  push:
    branches:
      - feat/hira-v1-s24-reliability-weighted-fusion
    paths:
      - "research/HIRA-V1-S24-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S24 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile S24 modules
        run: |
          python -m py_compile src/nmd/v1_reliability_weighted_fusion.py src/nmd/v1_s24_semantic_core.py src/nmd/v1_s24_authority.py src/nmd/v1_s24_checkpoint.py scripts/hira_v1_s24_train_dev.py scripts/hira_v1_s24_a0_reliability_fusion.py
      - name: Run S24 and inherited contracts
        run: |
          pytest -q tests/test_v1_reliability_weighted_fusion.py tests/test_v1_s24_authority.py tests/test_v1_s24_checkpoint.py tests/test_v1_neutral_bisector_gradient.py tests/test_v1_role_gated_content_triadic.py tests/test_v1_evidence_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_a13_lora.py tests/test_v1_triadic_semantic.py

  a0:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S24 source and HF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Verify exact frozen M4 bundle
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh S24-A0 reliability-fusion authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s24_a0_reliability_fusion.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s24-a0
      - name: Verify S24-A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s24-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s24-a0-reliability-fusion-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S24_A0_RELIABILITY_FUSION_READY"
          assert r["scientific_authority"]=="S24_A0_RELIABILITY_FUSION_ONLY"
          assert r["semantic_case_count"]==16
          assert r["decision_count"]==64
          assert r["state_view_count"]==32
          assert r["k"]==4
          assert r["views_per_option"]==2
          assert r["a13_token_output_identity"] is True
          assert r["a13_pooled_output_identity"] is True
          assert r["s23_logit_identity_rate"]==1.0
          assert r["s23_choice_identity_rate"]==1.0
          assert r["s23_relation_logit_identity_rate"]==1.0
          assert r["s23_relation_choice_identity_rate"]==1.0
          assert r["candidate_parameter_count"]==49152
          assert r["runtime_trainable_parameter_count"]==0
          assert r["factorization_added_parameter_count"]==0
          assert r["fusion_added_parameter_count"]==0
          assert r["synthetic_role_content_court_passed"] is True
          assert r["reliability_expert_swap_max_abs"]<=1e-7
          assert r["reliability_option_permutation_max_abs"]<=1e-7
          assert r["reliability_equal_gap_vs_s14_max_abs"]<=1e-7
          assert abs(r["reliability_equal_primary_weight"]-0.5)<=1e-7
          assert abs(r["reliability_equal_relation_weight"]-0.5)<=1e-7
          assert r["reliability_flat_flat_max_abs"]==0.0
          assert r["reliability_flat_nonflat_relation_weight"]>0.999
          assert r["reliability_affine_max_abs"]<=2e-6
          assert r["reliability_weight_sum_abs"]<=1e-7
          assert r["reliability_primary_gradient_l1"]>0.0
          assert r["reliability_relation_direct_gradient_zero"] is True
          assert r["reliability_parameter_count"]==0
          assert r["neutral_bisector_projection_coefficient"]==0.0
          assert r["fused_option_order_flip_rate"]==0.0
          assert r["fused_max_probability_mass_error"]<=1e-6
          assert r["option_order_flip_rate"]==0.0
          assert r["state_encode_calls"]==32
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Freeze S24-A0 integrity
        run: |
          (cd artifacts/s24-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s24-a0-reliability-fusion
          path: artifacts/s24-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
