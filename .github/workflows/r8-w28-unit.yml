name: r8-w28-unit

on:
  push:
    branches:
      - feat/r8-w28-compositional-projection-replication
    paths:
      - "src/nmd/compositional_projection_*.py"
      - "scripts/r8_w28_*.py"
      - "tests/test_compositional_projection.py"
      - "research/R8-W28-HANDOFF.md"
      - ".github/workflows/r8-w28-unit.yml"
      - ".github/workflows/r8-w28-reference-qualification.yml"

permissions:
  contents: read

concurrency:
  group: r8-w28-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W28 stack
        run: |
          python -m py_compile \
            src/nmd/compositional_projection_authority.py \
            src/nmd/compositional_projection_reference.py \
            scripts/r8_w28_qualify_reference.py
      - name: Run W28 contracts
        run: pytest -q tests/test_compositional_projection.py
      - name: Preflight exact-text freshness without exposure
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.compositional_projection_authority import (
              all_w28_query_texts,
              all_w28_schema_texts,
              all_w28_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w28qual","scripts/r8_w28_qualify_reference.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          overlap=sorted(all_w28_text_atoms() & mod.prior_text_atoms())
          print("W28_PRIOR_OVERLAP="+repr(overlap))
          assert not overlap
          assert not (all_w28_query_texts() & all_w28_schema_texts())
          print("w28_pre_exposure_freshness_pass")
          PY
