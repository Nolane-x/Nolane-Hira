name: hira-v0-mainline-m3-paired-dev

on:
  push:
    branches:
      - feat/hira-v0-mainline-m3-multilingual
    paths:
      - "research/HIRA-V0-MAINLINE-M3-ENABLE-DEV"

permissions:
  contents: read
  actions: read

concurrency:
  group: hira-v0-mainline-m3-paired-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen M3 stack
        run: |
          python -m py_compile \
            src/nmd/mainline.py \
            src/nmd/mainline_m3_authority.py \
            src/nmd/mainline_m3_eval.py \
            scripts/hira_v0_m3_paired_dev.py \
            scripts/hira_v0_m3_paired_confirm.py

      - name: Run M3 pre-exposure contracts
        run: |
          pytest -q \
            tests/test_mainline_m3_authority.py \
            tests/test_mainline_m3_eval.py \
            tests/test_mainline.py \
            tests/test_mainline_high_k.py

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

      - name: Verify exact W34 provisional transfer artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .digest)" = "sha256:8374f2eb849cf80d1201e4ad05a8c8bf4c9bf1f824da17306f57c87456fd186c"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .expired)" = "false"

      - name: Verify M2 mechanics authority
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10928771833 --jq .digest)" = "sha256:99e8c02aeb48fa32910a591d71b92e3e6f96258c0fa8501f38682ea4a2b7f453"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/runs/36310118240 --jq .conclusion)" = "success"

  baseline:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w34-coevidence-training
          path: inputs/W34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36299087572

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen M3 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" sentencepiece

      - name: Mark first MVA MVB paired exposure
        run: echo HIRA_V0_M3_MVA_MVB_EN_VI_DEV_EXPOSURE_BEGIN

      - name: Run zero-training paired EN VI DEV
        run: |
          python scripts/hira_v0_m3_paired_dev.py \
            --t0-dir inputs/T0 \
            --w34-dir inputs/W34 \
            --out artifacts/m3-paired-dev

      - name: Verify M3 DEV receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/m3-paired-dev/receipt.json"))
          assert x["schema_version"]=="hira-v0-mainline-m3-paired-dev-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "HIRA_V0_M3_PAIRED_DEV_QUALIFIED",
            "HIRA_V0_M3_PAIRED_DEV_FAIL",
          }
          assert x["pair_count"]==72
          assert x["language_case_count"]==144
          assert x["evaluation"]["state_encode_count"]==144
          assert x["evaluation"]["state_encodes_per_language_case"]==1.0
          assert x["gradient_updates_used"] is False
          assert x["massive_rows_used"] is False
          assert x["xnli_rows_used"] is False
          assert x["m2_semantic_rows_used"] is False
          assert x["w34_confirm_rows_used"] is False
          assert x["confirm_partition_exposed"] is False
          assert x["confirm_pair_count_used"]==0
          assert x["sealed_exposure_authorized"] is x["dev_qualification"]["pass"]
          assert x["semantic_frontend_changed"] is False
          assert x["multilingual_promoted"] is False
          print("HIRA_V0_M3_DEV_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "en":x["evaluation"]["en"],
            "vi":x["evaluation"]["vi"],
            "vi_en_top1_ratio":x["evaluation"]["vi_en_top1_ratio"],
            "vi_en_mrr_ratio":x["evaluation"]["vi_en_mrr_ratio"],
            "paired_prediction_agreement":x["evaluation"]["paired_prediction_agreement"],
            "dev_qualification":x["dev_qualification"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m3-paired-dev
          path: artifacts/m3-paired-dev
          if-no-files-found: error
          retention-days: 90
