name: hira-v1-s53-token-query-option-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s53-token-query-option-late-interaction
    paths:
      - "research/HIRA-V1-S53-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s53-a0-token-query-option-late-interaction
          path: inputs/S53A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37205099128

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S53 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S53 contracts
        run: |
          python -m py_compile src/nmd/v1_token_query_option_late_interaction.py src/nmd/v1_s53_authority.py scripts/hira_v1_s53_train_dev.py
          pytest -q tests/test_v1_token_query_option_late_interaction.py tests/test_v1_s53_authority.py tests/test_v1_s53_matched_harness.py tests/test_v1_s53_a0_harness.py tests/test_v1_query_free_option_identity.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify canonical S53-A0 authority
        run: |
          (cd inputs/S53A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S53A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s53-a0-token-query-option-late-interaction-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S53_A0_TOKEN_QUERY_OPTION_LATE_INTERACTION_READY"
          assert r["seed"]==74001
          assert r["reference_private_trainable_parameter_count"]==114688
          assert r["treatment_private_trainable_parameter_count"]==114688
          assert r["late_interaction_parameter_count"]==0
          assert r["pooled_query_bypass_absent"] is True
          assert r["used_for_model_selection"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          r=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert r["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert r["seed"]==72001
          assert r["epoch"]==24
          assert r["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert r["native_tensor_digest"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert r["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==r["checkpoint_file_sha256"]
          assert r["dev_encoded"] is False
          assert r["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S53 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s53_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S53A0/result.json \
            --out artifacts/s53-train-dev

      - name: Verify S53 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s53-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s53-token-query-option-late-interaction-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S53_TOKEN_QUERY_OPTION_LATE_INTERACTION_DEV_COMPLETE",
              "HIRA_V1_S53_TOKEN_QUERY_OPTION_LATE_INTERACTION_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S53_FRESH_TOKEN_QUERY_OPTION_LATE_INTERACTION"
          assert r["seed"]==74001

          p=r["parent_native_authority"]
          assert p["run"]==37192490832
          assert p["artifact_id"]==11299783210
          assert p["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert p["native_trainable_parameters"]==0
          assert p["native_optimizer_constructed"] is False
          assert p["native_training_performed"] is False

          a=r["a0_authority"]
          assert a["run"]==37205099128
          assert a["artifact_id"]==11304188134
          assert a["artifact_digest"]=="sha256:08dbedcf29c7c71646c0c17a7e079de7df4d763ea0888db01282887867dbc841"

          cache=r["shared_cache"]
          assert cache["reference_treatment_same_cache_bytes"] is True
          assert cache["private_state_view_encodes"]==0
          assert cache["cache_regenerated_after_dev"] is False
          assert len(cache["train_digest"])==64
          assert len(cache["dev_digest"])==64

          cv=r["controlled_variable"]
          assert cv["reference_query_context"]=="pooled_global_query_context"
          assert cv["treatment_query_context"]=="option_conditioned_token_level_query_context"
          assert cv["token_temperature"]==0.10
          assert cv["reference_private_trainable_parameters"]==114688
          assert cv["treatment_private_trainable_parameters"]==114688
          assert cv["late_interaction_trainable_parameters"]==0
          assert cv["initialization_bit_identical"] is True

          for name in ("reference_branch","treatment_branch"):
              b=r[name]
              assert len(b["history"])==24
              assert 1<=b["selected_dev_epoch"]<=24
              assert b["parameter_surface"]["private_trainable_parameters"]==114688
              assert b["parameter_surface"]["correction_trainable_parameters"]==114688
              assert b["parameter_surface"]["native_trainable_parameters"]==0
              assert b["parameter_surface"]["identity_trainable_parameters"]==0
              assert b["selected_dev"]["state_view_encodes"]==0
              assert b["selected_dev"]["full_k"] is True
              assert b["selected_dev"]["fused_max_probability_mass_error"]<=1e-6

          diag=r["treatment_token_diagnostics"]
          assert diag["mean_token_attention_entropy"]>=0.0
          assert 0.0<=diag["mean_max_token_weight"]<=1.0
          assert -1.0<=diag["context_cross_view_same_option_cosine"]<=1.0
          assert diag["context_norm_max_error"]<=1e-5

          for filename,branch_name in (
              ("reference-private-candidate.pt","reference"),
              ("treatment-private-candidate.pt","treatment"),
          ):
              payload=torch.load(root/filename,map_location="cpu",weights_only=True)
              assert payload["schema_version"]=="hira-v1-s53-private-candidate-v1"
              assert payload["branch"]==branch_name
              assert payload["seed"]==74001
              assert 1<=payload["selected_dev_epoch"]<=24
              assert payload["private_trainable_parameter_count"]==114688
              assert payload["correction_parameter_count"]==114688
              assert payload["native_parameter_count_in_optimizer"]==0

          part=r["partitions"]
          assert part["train_semantic_cases"]==768
          assert part["dev_semantic_cases"]==192
          assert len(part["domains"])==12
          assert part["k"]==4

          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["native_retraining_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S53 integrity
        run: |
          (cd artifacts/s53-train-dev && sha256sum result.json reference-private-candidate.pt treatment-private-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s53-token-query-option-late-interaction
          path: artifacts/s53-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
