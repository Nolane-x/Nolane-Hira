name: hira-v1-s24-reliability-fusion-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s24-reliability-weighted-fusion
    paths:
      - "research/HIRA-V1-S24-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s24-a0-reliability-fusion
          path: inputs/S24A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36793018851
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S24 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Compile and run S24 contracts
        run: |
          python -m py_compile src/nmd/v1_reliability_weighted_fusion.py src/nmd/v1_s24_semantic_core.py src/nmd/v1_s24_authority.py src/nmd/v1_s24_checkpoint.py scripts/hira_v1_s24_a0_reliability_fusion.py scripts/hira_v1_s24_train_dev.py
          pytest -q tests/test_v1_reliability_weighted_fusion.py tests/test_v1_s24_authority.py tests/test_v1_s24_checkpoint.py tests/test_v1_neutral_bisector_gradient.py tests/test_v1_role_gated_content_triadic.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_a13_lora.py tests/test_v1_triadic_semantic.py
      - name: Verify S24-A0 authority
        run: |
          (cd inputs/S24A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("inputs/S24A0/result.json").read_text())
          assert r["schema_version"] == "hira-v1-s24-a0-reliability-fusion-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] == "HIRA_V1_S24_A0_RELIABILITY_FUSION_READY"
          assert r["scientific_authority"] == "S24_A0_RELIABILITY_FUSION_ONLY"
          assert r["s23_logit_identity_rate"] == 1.0
          assert r["s23_choice_identity_rate"] == 1.0
          assert r["s23_relation_logit_identity_rate"] == 1.0
          assert r["s23_relation_choice_identity_rate"] == 1.0
          assert r["candidate_parameter_count"] == 49152
          assert r["runtime_trainable_parameter_count"] == 0
          assert r["fusion_added_parameter_count"] == 0
          assert r["reliability_parameter_count"] == 0
          assert r["reliability_expert_swap_max_abs"] <= 1e-7
          assert r["reliability_option_permutation_max_abs"] <= 1e-7
          assert r["reliability_equal_gap_vs_s14_max_abs"] <= 1e-7
          assert abs(r["reliability_equal_primary_weight"] - 0.5) <= 1e-7
          assert abs(r["reliability_equal_relation_weight"] - 0.5) <= 1e-7
          assert r["reliability_flat_nonflat_relation_weight"] > 0.999
          assert r["reliability_affine_max_abs"] <= 2e-6
          assert r["reliability_weight_sum_abs"] <= 1e-7
          assert r["reliability_primary_gradient_l1"] > 0.0
          assert r["reliability_relation_direct_gradient_zero"] is True
          assert r["fused_option_order_flip_rate"] == 0.0
          assert r["fused_max_probability_mass_error"] <= 1e-6
          assert r["state_encode_calls"] == 32
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh English S24 reliability-fusion TRAIN DEV authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s24_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S24A0/result.json --out artifacts/s24-train-dev
      - name: Verify S24 TRAIN DEV receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/s24-train-dev")
          r = json.loads((root / "result.json").read_text())
          assert r["schema_version"] == "hira-v1-s24-reliability-fusion-role-content-train-dev-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] in {"HIRA_V1_S24_RELIABILITY_FUSION_DEV_READY", "HIRA_V1_S24_RELIABILITY_FUSION_DEV_FAIL"}
          assert r["scientific_authority"] == "V1_S24_FRESH_ENGLISH_RELIABILITY_FUSION_ROLE_CONTENT"
          assert r["seed"] == 42001
          assert r["optimizer"]["epochs"] == 24
          assert r["optimizer"]["batch_size_semantic_cases"] == 16
          assert r["optimizer"]["lr"] == 2e-4
          assert r["optimizer"]["weight_decay"] == 0.01
          assert r["partitions"]["train_semantic_cases"] == 768
          assert r["partitions"]["dev_semantic_cases"] == 192
          assert len(r["partitions"]["domains"]) == 12
          assert r["partitions"]["k"] == 4
          assert r["partitions"]["views_per_option"] == 2
          assert r["partitions"]["prior_track_exact_rows_used"] is False
          assert r["partitions"]["s24_a0_rows_used"] is False
          assert r["partitions"]["m5_final_rows_used"] is False
          assert r["partitions"]["w29_w34_sealed_rows_used"] is False
          assert r["parameter_surface"]["total_trainable_parameters"] == 49152
          assert r["parameter_surface"]["lora_trainable_parameters"] == 16384
          assert r["parameter_surface"]["projection_trainable_parameters"] == 32768
          assert r["parameter_surface"]["original_a13_trainable"] == 0
          assert r["parameter_surface"]["hira_core_trainable"] == 0
          assert r["parameter_surface"]["canonicalizer_added_parameters"] == 0
          assert r["parameter_surface"]["fusion_added_parameters"] == 0
          assert r["loss"]["cross_view_js_coefficient"] == 0.25
          assert r["loss"]["relation_structured_binding_coefficient"] == 0.10
          assert r["loss"]["cross_view_relation_canonicalization_coefficient"] == 0.15
          assert r["loss"]["signature_separation_margin"] == 0.20
          assert r["loss"]["fusion_epsilon"] == 1e-6
          assert r["loss"]["fusion_rule"] == "standardized_top2_gap_reliability"
          assert r["loss"]["fusion_reliability_epsilon"] == 1e-6
          assert r["loss"]["fused_primary_relation_logits_detached"] is True
          assert r["loss"]["inference_numerically_identical_to_s14"] is False
          assert r["loss"]["s24_fusion_change_preregistered"] is True
          assert r["loss"]["optimizer_conflict_priority"] == "neutral"
          assert r["loss"]["norm_balanced_gradient"] == "equal_direction_neutral_bisector_no_projection"
          assert r["loss"]["balance_epsilon"] == 1e-12
          assert r["state_once"]["train_state_view_encodes_per_epoch"] == 1536
          assert r["state_once"]["dev_state_view_encodes_per_eval"] == 384
          assert r["post_dev_tuning_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          assert (root / "reliability-fusion-role-content-candidate.pt").is_file()
          PY
      - name: Freeze S24 TRAIN DEV integrity
        run: |
          (cd artifacts/s24-train-dev && sha256sum result.json train-manifest.json dev-manifest.json reliability-fusion-role-content-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s24-reliability-fusion-train-dev
          path: artifacts/s24-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
