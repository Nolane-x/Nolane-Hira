name: hira-v1-s61-a0-confidence-adaptive-bounded-hybrid

on:
  push:
    branches:
      - feat/hira-v1-s61-confidence-adaptive-bounded-hybrid
    paths:
      - "research/HIRA-V1-S61-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S61 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S61 contracts
        run: |
          python -m py_compile src/nmd/v1_confidence_adaptive_bounded_hybrid.py scripts/hira_v1_s61_a0_confidence_adaptive_bounded_hybrid.py
          pytest -q tests/test_v1_confidence_adaptive_bounded_hybrid.py tests/test_v1_s61_a0_harness.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run S61 A0 adaptive-gate court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s61_a0_confidence_adaptive_bounded_hybrid.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --out artifacts/s61-a0

      - name: Verify S61 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s61-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s61-a0-confidence-adaptive-bounded-hybrid-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S61_A0_CONFIDENCE_ADAPTIVE_BOUNDED_HYBRID_READY"
          assert r["scientific_authority"]=="S61_A0_CONFIDENCE_ADAPTIVE_BOUNDED_HYBRID_ONLY"
          assert r["seed"]==82001
          assert r["correction_trainable_parameter_count"]==114688
          assert r["pairwise_trainable_parameter_count"]==32832
          assert r["gate_parameter_count"]==5
          assert r["gate_trainable_parameter_count"]==5
          assert r["gate_trainable_tensor_names"]==["b","w"]
          assert r["feature_dimension"]==4
          assert r["features_require_grad"] is False
          assert r["initial_w_exact_zero"] is True
          assert r["initial_alpha_max_abs_error"]<=1e-7
          assert r["alpha_max"]==0.35
          assert r["gate_gradient_w_l1"]>0.0
          assert r["gate_gradient_b_l1"]>0.0
          assert r["gate_gradient_to_upstream_zero"] is True
          assert r["adaptive_probe_separated"] is True
          assert r["adaptive_probe_alpha_0"]!=r["adaptive_probe_alpha_1"]
          assert 0.0<r["adaptive_probe_alpha_0"]<0.35
          assert 0.0<r["adaptive_probe_alpha_1"]<0.35
          assert r["identity_override_max_abs_error"]==0.0
          assert r["residual_bound_violation_max"]<=1e-7
          assert r["feature_affine_invariance_max_abs_error"]<=2e-6
          assert r["option_permutation_max_abs_error"]<=1e-6
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["teacher_dependency"] is False
          assert r["pseudo_target_dependency"] is False
          assert r["self_anchor_dependency"] is False
          assert r["pairwise_only_final_path"] is False
          assert r["one_encoder_state_once"] is True
          assert r["gate_checkpoint_replay_max_abs_error"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Freeze S61 A0 integrity
        run: |
          (cd artifacts/s61-a0 && sha256sum result.json gate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s61-a0-confidence-adaptive-bounded-hybrid
          path: artifacts/s61-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
