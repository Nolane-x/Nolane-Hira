name: hira-v1-s5-closure-bundle

on:
  push:
    branches:
      - feat/hira-v1-s5-projection-relearning
    paths:
      - "research/HIRA-V1-S5-CLOSURE-BUNDLE"

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s5-a0-identity
          path: inputs/S5A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36400104371

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s5-projection-train-dev
          path: inputs/S5TRAIN
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36400648104

      - name: Verify source authorities
        run: |
          (
            cd inputs/S5A0
            sha256sum -c INTEGRITY.sha256
          )
          (
            cd inputs/S5TRAIN
            sha256sum -c INTEGRITY.sha256
          )
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("inputs/S5A0/result.json").read_text())
          t = json.loads(Path("inputs/S5TRAIN/result.json").read_text())
          assert a["outcome"] == "HIRA_V1_S5_A0_IDENTITY_READY"
          assert t["outcome"] == "HIRA_V1_S5_PROJECTION_DEV_FAIL"
          assert t["post_dev_tuning_performed"] is False
          assert t["sealed_confirm_opened"] is False
          assert t["multilingual_probe_opened"] is False
          assert t["production_ready_claimed"] is False
          PY

      - name: Build canonical S5 full closure archive
        run: |
          mkdir -p artifacts/s5-full/research
          mkdir -p artifacts/s5-full/a0
          mkdir -p artifacts/s5-full/train-dev

          cp research/HIRA-V1-S5-CONTRACT.md artifacts/s5-full/research/
          cp research/HIRA-V1-S5-A0-RECEIPT.md artifacts/s5-full/research/
          cp research/HIRA-V1-S5-CLOSURE.md artifacts/s5-full/research/
          cp research/HIRA-V1-S5-HANDOFF.md artifacts/s5-full/research/

          cp -a inputs/S5A0/. artifacts/s5-full/a0/
          cp -a inputs/S5TRAIN/. artifacts/s5-full/train-dev/

          (
            cd artifacts/s5-full
            find . -type f ! -name INTEGRITY.sha256 -print0 | sort -z | xargs -0 sha256sum > INTEGRITY.sha256
            sha256sum -c INTEGRITY.sha256
          )

          (
            cd artifacts
            zip -qr NOLANE-HIRA-V1-S5-FULL.zip s5-full
            sha256sum NOLANE-HIRA-V1-S5-FULL.zip > S5-ARCHIVE-SHA256.txt
          )

      - name: Write closure receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          t = json.loads(Path("inputs/S5TRAIN/result.json").read_text())
          archive = Path("artifacts/NOLANE-HIRA-V1-S5-FULL.zip")
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()

          receipt = {
              "schema_version": "hira-v1-s5-closure-bundle-v1",
              "status": "PASS",
              "outcome": "HIRA_V1_S5_CLOSED_DEV_FAIL",
              "a0_run_id": 36400104371,
              "a0_artifact_id": 10960266188,
              "a0_artifact_digest": "sha256:0ba8a60dd46a8cae47ed7098c558cce9fa7e8b4e137231116bb458943a386607",
              "train_dev_run_id": 36400648104,
              "train_dev_artifact_id": 10960895474,
              "train_dev_artifact_digest": "sha256:b6cb1154ccb5fe0fce38481f82bdb00881e6d4c277fa66a4e2cad0a3a1fd06c6",
              "selected_dev_epoch": t["selected_dev_epoch"],
              "selected_dev_accuracy": t["selected_dev"]["accuracy"],
              "paired_both_correct_rate": t["selected_dev"]["paired_both_correct_rate"],
              "question_swap_choice_change_rate": t["selected_dev"]["question_swap_choice_change_rate"],
              "sealed_confirm_opened": False,
              "multilingual_probe_opened": False,
              "production_ready_claimed": False,
              "archive": archive.name,
              "archive_bytes": archive.stat().st_size,
              "archive_sha256": digest,
          }
          Path("artifacts/S5-CLOSURE-RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print("HIRA_V1_S5_CLOSURE_RECEIPT=" + json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s5-closure-full-bundle
          path: |
            artifacts/NOLANE-HIRA-V1-S5-FULL.zip
            artifacts/S5-ARCHIVE-SHA256.txt
            artifacts/S5-CLOSURE-RECEIPT.json
            artifacts/s5-full
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
