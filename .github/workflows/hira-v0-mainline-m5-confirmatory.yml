name: hira-v0-mainline-m5-confirmatory

on:
  push:
    branches:
      - feat/hira-v0-mainline-m5-matched-benchmark
    paths:
      - "research/HIRA-V0-MAINLINE-M5-ENABLE-CONFIRMATORY"

permissions:
  contents: read
  actions: read

jobs:
  confirmatory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-contract
          path: inputs/M5A
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36358456335

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-banking77-direct
          path: inputs/M5B1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36358746320

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-english-heldout
          path: inputs/M5B2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36359178166

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-xnli
          path: inputs/M5B3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36359330862

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-jev-btzsc
          path: inputs/M5B4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36359563201

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-systems-cpu
          path: inputs/M5C
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36359707957

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m5-massive-intent
          path: inputs/M5B5
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36359747332

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact frozen runtime
        run: |
          WHEEL="$(find inputs/M4/hira-v0-m4-runtime/python -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m pip install --upgrade pip
          python -m pip install "$WHEEL" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Verify authority chain
        run: |
          (
            cd inputs/M4/hira-v0-m4-runtime
            sha256sum -c INTEGRITY.sha256
          )
          python - <<'PY'
          import json
          from pathlib import Path

          checks = [
              ("inputs/M5A/receipt.json", "HIRA_V0_M5_CONTRACT_READY"),
              ("inputs/M5B1/result.json", "HIRA_V0_M5_BANKING77_DIRECT_READY"),
              ("inputs/M5B2/result.json", "HIRA_V0_M5_ENGLISH_HELDOUT_READY"),
              ("inputs/M5B3/result.json", "HIRA_V0_M5_XNLI_READY"),
              ("inputs/M5B4/result.json", "HIRA_V0_M5_JEV_BTZSC_READY"),
              ("inputs/M5C/result.json", "HIRA_V0_M5_SYSTEMS_CPU_READY"),
              ("inputs/M5B5/result.json", "HIRA_V0_M5_MASSIVE_INTENT_READY"),
          ]
          for path, expected in checks:
              row = json.loads(Path(path).read_text(encoding="utf-8"))
              assert row["status"] == "PASS", path
              assert row["outcome"] == expected, (path, row.get("outcome"), expected)
              if "used_for_model_selection" in row:
                  assert row["used_for_model_selection"] is False, path
              if "production_ready_claimed" in row:
                  assert row["production_ready_claimed"] is False, path
          PY

      - name: Freeze confirmatory suite before execution
        run: |
          python - <<'PY'
          from scripts.hira_v0_m5_confirmatory import build_suite, suite_sha256
          cases = build_suite()
          assert len(cases) == 24
          assert sum(c.language == "en" for c in cases) == 12
          assert sum(c.language == "vi" for c in cases) == 12
          assert len({c.case_id for c in cases}) == 24
          assert all(len(c.criteria) == 4 for c in cases)
          assert all(0 <= c.gold_index < 4 for c in cases)
          print("HIRA_V0_M5_CONFIRMATORY_SUITE_SHA256=" + suite_sha256(cases))
          PY

      - name: Run fresh frozen M5-D confirmatory suite
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v0_m5_confirmatory.py             --bundle inputs/M4/hira-v0-m4-runtime             --out artifacts/m5-confirmatory

      - name: Verify confirmatory receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/m5-confirmatory")
          r = json.loads((root / "result.json").read_text(encoding="utf-8"))
          assert r["schema_version"] == "hira-v0-mainline-m5-confirmatory-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] == "HIRA_V0_M5_CONFIRMATORY_READY"
          assert r["scientific_authority"] == "M5_FRESH_CONFIRMATORY_ROBUSTNESS"
          assert r["suite"]["base_cases"] == 24
          assert r["suite"]["queries"] == 48
          assert r["suite"]["languages"] == ["en", "vi"]
          assert r["suite"]["opaque_option_ids"] is True
          assert r["suite"]["fresh_rows_not_from_laya_jev_public_sets"] is True
          assert r["runtime"]["state_encode_calls"] == 24
          assert r["runtime"]["queries_per_state"] == 2
          assert r["runtime"]["parameter_report"]["trainable_total"] == 0
          assert r["used_for_model_selection"] is False
          assert r["model_weights_changed_after_public_exposure"] is False
          assert r["production_ready_claimed"] is False
          assert len((root / "per-case.jsonl").read_text(encoding="utf-8").splitlines()) == 24
          PY

      - name: Freeze confirmatory integrity
        run: |
          (
            cd artifacts/m5-confirmatory
            sha256sum suite.json result.json per-case.jsonl > INTEGRITY.sha256
            sha256sum -c INTEGRITY.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m5-confirmatory
          path: artifacts/m5-confirmatory
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
