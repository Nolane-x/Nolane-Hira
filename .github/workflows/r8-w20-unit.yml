name: r8-w20-unit

on:
  push:
    branches:
      - feat/r8-w20-pairwise-latent-boundary
    paths:
      - "src/nmd/pairwise_latent_authority.py"
      - "src/nmd/pairwise_latent_cache.py"
      - "src/nmd/pairwise_latent_eval.py"
      - "scripts/r8_w20_build_cache.py"
      - "scripts/r8_w20_evaluate.py"
      - "tests/test_pairwise_latent.py"
      - "research/R8-W20-HANDOFF.md"
      - ".github/workflows/r8-w20-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w20-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W20 stack
        run: |
          python -m py_compile \
            src/nmd/pairwise_latent_authority.py \
            src/nmd/pairwise_latent_cache.py \
            src/nmd/pairwise_latent_eval.py \
            scripts/r8_w20_build_cache.py \
            scripts/r8_w20_evaluate.py
      - name: Run W20 contracts
        run: pytest -q tests/test_pairwise_latent.py
      - name: Preflight exact-text freshness without materialization
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.pairwise_latent_authority import all_w20_text_atoms
          spec=importlib.util.spec_from_file_location("w20build","scripts/r8_w20_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          overlap=all_w20_text_atoms() & mod.prior_text_atoms()
          assert not overlap, sorted(overlap)
          print("w20_preflight_fresh")
          PY
