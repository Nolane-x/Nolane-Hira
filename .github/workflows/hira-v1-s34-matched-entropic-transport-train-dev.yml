name: hira-v1-s34-matched-entropic-transport-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s34-entropic-relation-transport
    paths:
      - "research/HIRA-V1-S34-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s34-a0-entropic-relation-transport
          path: inputs/S34A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36998495974

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S34 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S34 contracts
        run: |
          python -m py_compile             src/nmd/v1_entropic_relation_transport.py             src/nmd/v1_s34_authority.py             src/nmd/v1_s34_checkpoint.py             scripts/hira_v1_s34_a0_entropic_relation_transport.py             scripts/hira_v1_s34_train_dev.py
          pytest -q             tests/test_v1_entropic_relation_transport.py             tests/test_v1_s34_authority_checkpoint.py             tests/test_v1_relation_canonicalization.py             tests/test_v1_a13_lora.py             tests/test_v1_evidence_fusion.py             tests/test_v1_gradient_isolated_fusion.py             tests/test_v1_norm_balanced_gradient.py             tests/test_v1_invariance.py             tests/test_v1_triadic_semantic.py

      - name: Verify canonical S34-A0 authority
        run: |
          (cd inputs/S34A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S34A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s34-a0-entropic-relation-transport-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S34_A0_ENTROPIC_RELATION_TRANSPORT_READY"
          assert r["scientific_authority"]=="S34_A0_QUERY_CONDITIONED_ENTROPIC_TRANSPORT_ONLY"
          assert r["state_relevance_temperature"]==0.1
          assert r["option_relevance_temperature"]==0.1
          assert r["kernel_temperature"]==0.1
          assert r["logit_temperature"]==0.1
          assert r["sinkhorn_iterations"]==12
          assert r["epsilon"]==1e-12
          assert r["operator_added_parameter_count"]==0
          assert r["physical_trainable_parameter_count"]==49152
          assert r["lora_parameter_count"]==16384
          assert r["projection_parameter_count"]==32768
          assert r["runtime_trainable_parameter_count"]==0
          assert r["original_a13_trainable_parameter_count"]==0
          assert r["hira_core_trainable_parameter_count"]==0
          assert r["controlled_q_a_selected_option"]==0
          assert r["controlled_q_b_selected_option"]==1
          assert r["controlled_state_marginal_intervention_max_abs"]>0.0
          assert r["controlled_option_marginal_intervention_max_abs"]>0.0
          assert r["controlled_transport_plan_intervention_max_abs"]>0.0
          assert r["controlled_max_row_marginal_residual"]<=1e-4
          assert r["controlled_max_column_marginal_residual"]<=1e-4
          assert r["real_max_row_marginal_residual"]<=1e-4
          assert r["real_max_column_marginal_residual"]<=1e-4
          assert r["controlled_degenerate_finite"] is True
          assert all(v>0.0 for v in r["gradient"]["lora_b_gradient_l1"])
          assert r["gradient"]["projection_gradient_l1"]>0.0
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh matched S34 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s34_train_dev.py             --bundle inputs/M4/hira-v0-m4-runtime             --a0-result inputs/S34A0/result.json             --out artifacts/s34-train-dev

      - name: Verify S34 matched receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/s34-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s34-matched-entropic-relation-transport-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S34_MATCHED_TRANSPORT_DEV_COMPLETE",
              "HIRA_V1_S34_MATCHED_TRANSPORT_CONTROL_DEV_READY",
              "HIRA_V1_S34_MATCHED_TRANSPORT_TREATMENT_DEV_READY",
              "HIRA_V1_S34_MATCHED_TRANSPORT_BOTH_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S34_FRESH_MATCHED_CONTROL_VS_ENTROPIC_TRANSPORT"
          assert r["seed"]==55001
          assert r["optimizer"]["epochs"]==24
          assert r["optimizer"]["batch_size_semantic_cases"]==16
          assert r["optimizer"]["lr"]==2e-4
          assert r["optimizer"]["weight_decay"]==0.01
          assert r["optimizer"]["grad_clip"]==1.0

          loss=r["loss"]
          assert loss["control_relation_operator"]=="S13_CrossViewRelationCanonicalizer"
          assert loss["treatment_relation_operator"]=="S34_QueryConditionedEntropicRelationTransport"
          assert loss["state_relevance_temperature"]==0.1
          assert loss["option_relevance_temperature"]==0.1
          assert loss["transport_kernel_temperature"]==0.1
          assert loss["transport_logit_temperature"]==0.1
          assert loss["sinkhorn_iterations"]==12
          assert loss["transport_epsilon"]==1e-12
          assert loss["treatment_added_parameters"]==0
          assert loss["fused_primary_relation_logits_detached"] is True
          assert loss["norm_balanced_gradient"]=="equal_direction_relation_priority_projection"

          p=r["partitions"]
          assert p["train_semantic_cases"]==768
          assert p["dev_semantic_cases"]==192
          assert len(p["domains"])==12
          assert p["k"]==4
          assert p["views_per_option"]==2
          assert p["identical_rows_across_arms"] is True
          assert p["identical_batch_order_across_arms"] is True
          assert p["prior_track_exact_rows_used"] is False
          assert p["s34_a0_rows_used"] is False
          assert p["m5_final_rows_used"] is False
          assert p["w29_w34_sealed_rows_used"] is False

          for arm in ("control","transport"):
              a=r[f"{arm}_arm"]
              assert 1<=a["selected_dev_epoch"]<=24
              assert len(a["history"])==24
              assert a["parameter_surface"]["total_trainable_parameters"]==49152
              assert a["parameter_surface"]["lora_trainable_parameters"]==16384
              assert a["parameter_surface"]["projection_trainable_parameters"]==32768
              assert a["parameter_surface"]["original_a13_trainable"]==0
              assert a["parameter_surface"]["hira_core_trainable"]==0
              assert a["parameter_surface"]["fusion_added_parameters"]==0
              assert a["parameter_surface"]["learned_downstream_scorer_parameters"]==0
              assert a["selected_dev"]["full_k"] is True
              assert a["selected_dev"]["fused_option_order_flip_rate"]==0.0
              assert a["selected_dev"]["fused_max_probability_mass_error"]<=1e-6

          assert isinstance(r["matched_selected_dev_delta_transport_minus_control"],dict)
          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False

          assert (root/"control-relation-candidate.pt").is_file()
          assert (root/"transport-relation-candidate.pt").is_file()
          PY

      - name: Verify S34 checkpoint schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_s34_checkpoint import load_hira_v1_s34_checkpoint

          root=Path("artifacts/s34-train-dev")
          r=json.loads((root/"result.json").read_text())
          for arm in ("control","transport"):
              path=root/f"{arm}-relation-candidate.pt"
              _lora,_proj,meta=load_hira_v1_s34_checkpoint(
                  path,
                  arm=arm,
                  expected_sha256=r[f"{arm}_arm"]["checkpoint_sha256"],
              )
              assert meta["selected_dev_epoch"]==r[f"{arm}_arm"]["selected_dev_epoch"]
              assert meta["total_parameter_count"]==49152
          PY

      - name: Freeze S34 matched integrity
        run: |
          (cd artifacts/s34-train-dev &&             sha256sum               result.json               train-manifest.json               dev-manifest.json               control-relation-candidate.pt               transport-relation-candidate.pt               > INTEGRITY.sha256 &&             sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s34-matched-entropic-transport-train-dev
          path: artifacts/s34-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
