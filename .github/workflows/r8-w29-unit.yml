name: r8-w29-unit

on:
  push:
    branches:
      - feat/r8-w29-hira-v0-semantic-core
    paths:
      - "src/nmd/contracts.py"
      - "src/nmd/schema.py"
      - "src/nmd/runtime.py"
      - "src/nmd/symmetric_semantic.py"
      - "src/nmd/semantic_core.py"
      - "src/nmd/hira_v0_*.py"
      - "scripts/r8_w29_*.py"
      - "tests/test_symmetric_semantic_runtime.py"
      - "tests/test_hira_v0_authority.py"
      - "research/R8-W29-HANDOFF.md"
      - ".github/workflows/r8-w29-unit.yml"
      - ".github/workflows/r8-w29-semantic-core-authority.yml"

permissions:
  contents: read

concurrency:
  group: r8-w29-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W29 production and authority stack
        run: |
          python -m py_compile \
            src/nmd/contracts.py \
            src/nmd/schema.py \
            src/nmd/runtime.py \
            src/nmd/symmetric_semantic.py \
            src/nmd/semantic_core.py \
            src/nmd/hira_v0_authority.py \
            src/nmd/hira_v0_eval.py \
            scripts/r8_w29_evaluate.py
      - name: Run W29 semantic-core contracts
        run: |
          pytest -q \
            tests/test_symmetric_semantic_runtime.py \
            tests/test_hira_v0_authority.py
      - name: Run backward-compatibility runtime contracts
        run: |
          pytest -q \
            tests/test_runtime.py \
            tests/test_competitive_coarse_runtime.py
      - name: Preflight exact-text freshness without exposure
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.hira_v0_authority import (
              all_w29_query_texts,
              all_w29_schema_texts,
              all_w29_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w29eval","scripts/r8_w29_evaluate.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w29_text_atoms() & mod.prior_text_atoms())
          assert not (all_w29_query_texts() & all_w29_schema_texts())
          print("w29_pre_exposure_freshness_pass")
          PY
