name: hira-v1-s23-neutral-bisector-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s23-neutral-bisector-gradient
    paths:
      - "research/HIRA-V1-S23-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s23-a0-neutral-bisector
          path: inputs/S23A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36721891033
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S23 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Compile and run S23 contracts
        run: |
          python -m py_compile src/nmd/v1_neutral_bisector_gradient.py src/nmd/v1_s23_semantic_core.py src/nmd/v1_s23_authority.py src/nmd/v1_s23_checkpoint.py scripts/hira_v1_s23_a0_neutral_bisector.py scripts/hira_v1_s23_train_dev.py
          pytest -q tests/test_v1_neutral_bisector_gradient.py tests/test_v1_s23_authority.py tests/test_v1_s23_checkpoint.py tests/test_v1_role_gated_content_triadic.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_a13_lora.py tests/test_v1_triadic_semantic.py
      - name: Verify S23-A0 authority
        run: |
          (cd inputs/S23A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("inputs/S23A0/result.json").read_text())
          assert r["schema_version"] == "hira-v1-s23-a0-neutral-bisector-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] == "HIRA_V1_S23_A0_NEUTRAL_BISECTOR_READY"
          assert r["scientific_authority"] == "S23_A0_NEUTRAL_BISECTOR_ONLY"
          assert r["s21_logit_identity_rate"] == 1.0
          assert r["s21_choice_identity_rate"] == 1.0
          assert r["candidate_parameter_count"] == 49152
          assert r["runtime_trainable_parameter_count"] == 0
          assert r["factorization_added_parameter_count"] == 0
          assert r["synthetic_role_content_court_passed"] is True
          assert r["neutral_bisector_conflict"] is True
          assert r["neutral_bisector_pre_dot"] < 0.0
          assert r["neutral_bisector_post_dot"] == r["neutral_bisector_pre_dot"]
          assert r["neutral_bisector_projection_coefficient"] == 0.0
          assert r["neutral_bisector_expected_direction_max_abs"] <= 1e-6
          assert r["neutral_bisector_exchange_symmetry_max_abs"] <= 1e-7
          assert r["neutral_bisector_exchange_conflict_identity"] is True
          assert r["neutral_bisector_no_conflict_matches_s17_max_abs"] <= 1e-7
          assert r["neutral_bisector_joint_scale_max_abs"] <= 1e-5
          assert r["neutral_bisector_near_opposite_finite"] is True
          assert r["neutral_bisector_both_zero_exact"] is True
          assert r["neutral_bisector_primary_only_exact"] is True
          assert r["neutral_bisector_relation_only_exact"] is True
          assert r["fusion_vs_s14_forward_max_abs"] == 0.0
          assert r["fused_option_order_flip_rate"] == 0.0
          assert r["fused_max_probability_mass_error"] <= 1e-6
          assert r["used_for_model_selection"] is False
          PY
      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh English S23 neutral-bisector TRAIN DEV authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s23_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S23A0/result.json --out artifacts/s23-train-dev
      - name: Verify S23 TRAIN DEV receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/s23-train-dev")
          r = json.loads((root / "result.json").read_text())
          assert r["schema_version"] == "hira-v1-s23-neutral-bisector-role-content-train-dev-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] in {"HIRA_V1_S23_NEUTRAL_BISECTOR_DEV_READY", "HIRA_V1_S23_NEUTRAL_BISECTOR_DEV_FAIL"}
          assert r["scientific_authority"] == "V1_S23_FRESH_ENGLISH_NEUTRAL_BISECTOR_ROLE_CONTENT"
          assert r["seed"] == 40001
          assert r["optimizer"]["epochs"] == 24
          assert r["optimizer"]["batch_size_semantic_cases"] == 16
          assert r["optimizer"]["lr"] == 2e-4
          assert r["partitions"]["train_semantic_cases"] == 768
          assert r["partitions"]["dev_semantic_cases"] == 192
          assert len(r["partitions"]["domains"]) == 12
          assert r["partitions"]["k"] == 4
          assert r["partitions"]["views_per_option"] == 2
          assert r["partitions"]["prior_track_exact_rows_used"] is False
          assert r["partitions"]["s23_a0_rows_used"] is False
          assert r["parameter_surface"]["total_trainable_parameters"] == 49152
          assert r["parameter_surface"]["lora_trainable_parameters"] == 16384
          assert r["parameter_surface"]["projection_trainable_parameters"] == 32768
          assert r["parameter_surface"]["original_a13_trainable"] == 0
          assert r["parameter_surface"]["hira_core_trainable"] == 0
          assert r["parameter_surface"]["canonicalizer_added_parameters"] == 0
          assert r["parameter_surface"]["fusion_added_parameters"] == 0
          assert r["parameter_surface"]["learned_downstream_scorer_parameters"] == 0
          assert r["parameter_surface"]["role_content_factorization_added_parameters"] == 0
          assert r["loss"]["cross_view_js_coefficient"] == 0.25
          assert r["loss"]["relation_structured_binding_coefficient"] == 0.10
          assert r["loss"]["cross_view_relation_canonicalization_coefficient"] == 0.15
          assert r["loss"]["signature_separation_margin"] == 0.20
          assert r["loss"]["fusion_epsilon"] == 1e-6
          assert r["loss"]["fusion_equal_weight"] == 0.5
          assert r["loss"]["raw_triadic_ce_used"] is False
          assert r["loss"]["fused_primary_relation_logits_detached"] is True
          assert r["loss"]["primary_operator"] == "role_gated_content_triadic"
          assert r["loss"]["optimizer_conflict_priority"] == "neutral"
          assert r["loss"]["primary_role_temperature"] == 0.10
          assert r["loss"]["primary_role_weight"] == 0.50
          assert r["loss"]["primary_content_weight"] == 0.50
          assert r["loss"]["norm_balanced_gradient"] == "equal_direction_neutral_bisector_no_projection"
          assert r["loss"]["balance_epsilon"] == 1e-12
          assert r["loss"]["balance_primary_block"] == "decision + 0.05*option_alignment + 0.25*fused_cross_view_js"
          assert r["norm_balancing"]["rule"] == "equal_direction_neutral_bisector_no_projection"
          assert r["norm_balancing"]["epsilon"] == 1e-12
          assert r["state_once"]["train_state_view_encodes_per_epoch"] == 1536
          assert r["state_once"]["dev_state_view_encodes_per_eval"] == 384
          assert r["post_dev_tuning_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          assert (root / "neutral-bisector-role-content-candidate.pt").is_file()
          PY
      - name: Freeze S23 TRAIN DEV integrity
        run: |
          (cd artifacts/s23-train-dev && sha256sum result.json train-manifest.json dev-manifest.json neutral-bisector-role-content-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s23-neutral-bisector-train-dev
          path: artifacts/s23-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
