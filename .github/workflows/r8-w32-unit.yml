name: r8-w32-unit

on:
  push:
    branches:
      - feat/r8-w32-interaction-semantic-adapter
    paths:
      - "src/nmd/w32_interaction_semantic_adapter.py"
      - "src/nmd/w32_transfer_authority.py"
      - "src/nmd/runtime.py"
      - "scripts/r8_w32_qualify.py"
      - ".github/workflows/r8-w32-reference-qualification.yml"
      - "tests/test_w32_interaction_semantic_adapter.py"
      - "tests/test_w32_transfer_authority.py"
      - "research/R8-W32-HANDOFF.md"
      - ".github/workflows/r8-w32-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w32-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W32 pre-qualification stack
        run: |
          python -m py_compile \
            src/nmd/w32_interaction_semantic_adapter.py \
            src/nmd/w32_transfer_authority.py \
            src/nmd/runtime.py \
            scripts/r8_w32_qualify.py
      - name: Run W32 contracts
        run: |
          pytest -q \
            tests/test_w32_interaction_semantic_adapter.py \
            tests/test_w32_transfer_authority.py \
            tests/test_w31_dual_semantic_adapter.py \
            tests/test_symmetric_semantic_runtime.py
      - name: Runtime regressions
        run: |
          pytest -q \
            tests/test_runtime.py \
            tests/test_competitive_coarse_runtime.py
