name: hira-v1-s73-counterfactual-safety-veto-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s73-counterfactual-safety-veto
    paths:
      - "research/HIRA-V1-S73-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s73-a0-counterfactual-safety-veto
          path: inputs/S73A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37476327384

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S73 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S73 contracts
        run: |
          python -m py_compile src/nmd/v1_counterfactual_safety_veto.py src/nmd/v1_s73_authority.py scripts/hira_v1_s73_train_dev.py
          pytest -q tests/test_v1_counterfactual_safety_veto.py tests/test_v1_s73_a0_harness.py tests/test_v1_s73_authority.py tests/test_v1_s73_matched_harness.py tests/test_v1_s73_train_dev_workflow.py tests/test_v1_opponent_profile_vector_residual.py tests/test_v1_multistat_pairwise_row_composer.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_query_gated_identity_interaction.py

      - name: Verify frozen S72 parent evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/HIRA-V1-S72-MATCHED-RECEIPT.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S72_OPPONENT_PROFILE_VECTOR_RESIDUAL_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S72_FRESH_OPPONENT_PROFILE_VECTOR_RESIDUAL"
          assert r["seed"]==93001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          PY

      - name: Verify canonical S73 A0 authority
        run: |
          (cd inputs/S73A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact id: 11418978543"
          echo "Pinned GitHub artifact digest: sha256:bab338c55ae37bd322fcc20d838ed3b4250da959e2d7135525ec611da8f9c083"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S73A0/result.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S73_A0_COUNTERFACTUAL_SAFETY_VETO_READY"
          assert r["scientific_authority"]=="S73_A0_COUNTERFACTUAL_SAFETY_VETO_ONLY"
          assert r["seed"]==94001
          assert r["reference_predictor_parameter_count"]==9
          assert r["treatment_predictor_parameter_count"]==9
          assert r["added_treatment_parameter_count"]==0
          assert r["predictor_initialization_bit_identical"] is True
          assert r["hard_accept_threshold"]==0.5
          assert r["endpoint_only_max_abs_error"]==0.0
          assert r["features_detached"] is True
          assert r["targets_detached"] is True
          assert r["predictor_gradient_to_upstream_zero"] is True
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S73 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s73_train_dev.py             --bundle inputs/M4/hira-v0-m4-runtime             --authority-checkpoint inputs/S51AUTH/native-authority.pt             --authority-receipt inputs/S51AUTH/authority-receipt.json             --a0-result inputs/S73A0/result.json             --out artifacts/s73-train-dev

      - name: Verify S73 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s73-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s73-counterfactual-safety-veto-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S73_COUNTERFACTUAL_SAFETY_VETO_DEV_COMPLETE",
              "HIRA_V1_S73_COUNTERFACTUAL_SAFETY_VETO_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S73_FRESH_COUNTERFACTUAL_SAFETY_VETO"
          assert r["seed"]==94001

          parent=r["parent_s72"]
          assert parent["merged_main"]=="16eb7a583376cd824421d5e7ae9df948979b3953"
          assert parent["scientific_run"]==37470998139
          assert parent["artifact_id"]==11416962628
          assert parent["artifact_digest"]=="sha256:9a653a681e0cb3182819634fe24eb345ce82a48f2d078d15e510d1d3ebfb0834"
          assert parent["verdict"]=="CASE_B"

          a0=r["a0_authority"]
          assert a0["run"]==37476327384
          assert a0["artifact_id"]==11418978543
          assert a0["artifact_digest"]=="sha256:bab338c55ae37bd322fcc20d838ed3b4250da959e2d7135525ec611da8f9c083"

          cv=r["controlled_variable"]
          assert cv["veto_predictor_trainable_parameters_per_arm"]==9
          assert cv["veto_predictor_shared_state"] is True
          assert cv["reference_veto_usage"]=="ignored_always_candidate"
          assert cv["treatment_veto_usage"]=="hard_candidate_or_fused"
          assert cv["hard_accept_threshold"]==0.5
          assert cv["veto_output_mode"]=="endpoint_only"
          assert cv["dev_target_dependency"] is False

          assert len(r["training_trajectory"])==24
          ref=r["reference_branch"]
          trt=r["treatment_branch"]
          assert ref["selected_dev_epoch"]==trt["selected_dev_epoch"]==cv["shared_selected_dev_epoch"]
          assert ref["correction_state_sha256"]==trt["correction_state_sha256"]
          assert ref["pairwise_head_state_sha256"]==trt["pairwise_head_state_sha256"]
          assert ref["composer_state_sha256"]==trt["composer_state_sha256"]
          assert ref["veto_predictor_state_sha256"]==trt["veto_predictor_state_sha256"]
          assert ref["selected_dev"]["pairwise_gold_pair_accuracy"]==trt["selected_dev"]["pairwise_gold_pair_accuracy"]
          assert ref["selected_dev"]["pairwise_mean_gold_pair_margin"]==trt["selected_dev"]["pairwise_mean_gold_pair_margin"]
          for key in ("composer_mean_alpha","composer_min_alpha","composer_max_alpha","composer_std_alpha"):
              assert ref["selected_dev"][key]==trt["selected_dev"][key]

          assert ref["selected_dev"]["veto_accept_rate"]==1.0
          assert 0.0<=trt["selected_dev"]["veto_accept_rate"]<=1.0
          assert trt["selected_dev"]["veto_threshold"]==0.5

          for name,use_veto in (("reference_branch",False),("treatment_branch",True)):
              b=r[name]
              m=b["selected_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["pairwise_antisymmetry_max_abs_error"]==0.0
              assert m["fused_max_probability_mass_error"]<=1e-6
              assert 0.0<=m["composer_min_alpha"]<=m["composer_mean_alpha"]<=m["composer_max_alpha"]<=0.35
              ckpt=torch.load(root/b["checkpoint_file"],map_location="cpu",weights_only=False)
              assert ckpt["branch"]==name.removesuffix("_branch")
              assert ckpt["use_hard_veto"] is use_veto
              assert ckpt["veto_threshold"]==0.5
              assert ckpt["veto_output_mode"]=="candidate_or_fused_endpoint_only"

          assert r["post_dev_tuning_performed"] is False
          assert r["threshold_sweep_performed"] is False
          assert r["feature_sweep_performed"] is False
          assert r["class_weight_or_smoothing_changed"] is False
          assert r["safety_target_changed"] is False
          assert r["residual_or_representation_or_head_changed"] is False
          assert r["optimizer_lr_weight_decay_changed"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S73 integrity
        run: |
          (cd artifacts/s73-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s73-counterfactual-safety-veto
          path: artifacts/s73-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
