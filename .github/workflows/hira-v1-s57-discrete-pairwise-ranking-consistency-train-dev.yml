name: hira-v1-s57-discrete-pairwise-ranking-consistency-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s57-discrete-pairwise-ranking-consistency
    paths:
      - "research/HIRA-V1-S57-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s57-a0-discrete-pairwise-ranking-consistency
          path: inputs/S57A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37266891469

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S57 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S57 contracts
        run: |
          python -m py_compile src/nmd/v1_pairwise_ranking_consistency.py src/nmd/v1_s57_authority.py scripts/hira_v1_s57_train_dev.py
          pytest -q tests/test_v1_pairwise_ranking_consistency.py tests/test_v1_s57_authority.py tests/test_v1_s57_a0_harness.py tests/test_v1_s57_matched_harness.py tests/test_v1_s57_train_dev_workflow.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_query_free_option_identity.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify canonical S57-A0 authority
        run: |
          (cd inputs/S57A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S57A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s57-a0-discrete-pairwise-ranking-consistency-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S57_A0_DISCRETE_PAIRWISE_RANKING_CONSISTENCY_READY"
          assert r["scientific_authority"]=="S57_A0_DISCRETE_PAIRWISE_RANKING_CONSISTENCY_ONLY"
          assert r["seed"]==78001
          assert r["anchor_sign_detached"] is True
          assert r["matching_ordinal_loss"]<r["sign_flip_ordinal_loss"]
          assert r["wrong_gold_filtered_direction_count"]>0
          assert r["correct_gold_active_direction_count"]>0
          assert r["non_gold_active_direction_fraction"]>0.0
          assert r["flat_active_directional_anchor_fraction"]==0.0
          assert r["reference_auxiliary_exact_zero"] is True
          assert r["treatment_auxiliary_gradient_l1"]>0.0
          assert r["reference_private_trainable_parameter_count"]==114688
          assert r["treatment_private_trainable_parameter_count"]==114688
          assert r["added_trainable_parameter_count"]==0
          assert r["used_for_model_selection"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S57 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s57_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S57A0/result.json \
            --out artifacts/s57-train-dev

      - name: Verify S57 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s57-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s57-discrete-pairwise-ranking-consistency-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S57_DISCRETE_PAIRWISE_RANKING_CONSISTENCY_DEV_COMPLETE",
              "HIRA_V1_S57_DISCRETE_PAIRWISE_RANKING_CONSISTENCY_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S57_FRESH_DISCRETE_PAIRWISE_RANKING_CONSISTENCY"
          assert r["seed"]==78001

          parent=r["parent_native_authority"]
          assert parent["run"]==37192490832
          assert parent["artifact_id"]==11299783210
          assert parent["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert parent["native_trainable_parameters"]==0
          assert parent["native_optimizer_constructed"] is False
          assert parent["native_training_performed"] is False

          a0=r["a0_authority"]
          assert a0["run"]==37266891469
          assert a0["artifact_id"]==11326757222
          assert a0["artifact_digest"]=="sha256:fcfbececa46f5bac0e1fe75ae51348d1b4c543b5b7dc3166410c148a35dd75ce"

          cache=r["shared_cache"]
          assert cache["reference_treatment_same_cache_bytes"] is True
          assert cache["private_state_view_encodes"]==0
          assert cache["cache_regenerated_after_dev"] is False

          for name in ("reference_branch","treatment_branch"):
              b=r[name]
              assert len(b["history"])==24
              assert 1<=b["selected_dev_epoch"]<=24
              assert b["parameter_surface"]["private_trainable_parameters"]==114688
              assert b["parameter_surface"]["added_trainable_parameters"]==0
              assert b["parameter_surface"]["native_trainable_parameters"]==0
              assert b["parameter_surface"]["identity_trainable_parameters"]==0
              assert b["selected_dev"]["state_view_encodes"]==0
              assert b["selected_dev"]["full_k"] is True
              assert b["selected_dev"]["fused_max_probability_mass_error"]<=1e-6

          cv=r["controlled_variable"]
          assert cv["reference_ordinal_consistency_coefficient"]==0.0
          assert cv["treatment_ordinal_consistency_coefficient"]==0.05
          assert cv["standardization_epsilon"]==1e-6
          assert cv["active_threshold"]==0.25
          assert cv["preserved_margin_floor"]==0.05
          assert cv["gold_order_protection"] is True
          assert cv["reference_private_trainable_parameters"]==114688
          assert cv["treatment_private_trainable_parameters"]==114688
          assert cv["added_trainable_parameters"]==0
          assert cv["initialization_bit_identical"] is True

          for name in ("reference_branch","treatment_branch"):
              d=r[name]["ordinal_diagnostics"]
              assert 0.0<=d["mean_active_directional_anchor_fraction"]<=1.0
              assert 0.0<=d["mean_gold_filtered_direction_fraction"]<=1.0
              assert 0.0<=d["mean_sign_disagreement_fraction"]<=1.0
              assert 0.0<=d["mean_non_gold_active_direction_fraction"]<=1.0

          for filename,branch_name in (
              ("reference-private-candidate.pt","reference"),
              ("treatment-private-candidate.pt","treatment"),
          ):
              payload=torch.load(root/filename,map_location="cpu",weights_only=True)
              assert payload["schema_version"]=="hira-v1-s57-private-candidate-v1"
              assert payload["branch"]==branch_name
              assert payload["seed"]==78001
              assert 1<=payload["selected_dev_epoch"]<=24
              assert payload["private_trainable_parameter_count"]==114688
              assert payload["correction_parameter_count"]==114688
              assert payload["native_parameter_count_in_optimizer"]==0

          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["native_retraining_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S57 integrity
        run: |
          (cd artifacts/s57-train-dev && sha256sum result.json reference-private-candidate.pt treatment-private-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s57-discrete-pairwise-ranking-consistency
          path: artifacts/s57-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
