name: hira-v1-s20-standardized-triadic-consistency-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s20-standardized-triadic-consistency
    paths:
      - "research/HIRA-V1-S20-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s20-a0-identity
          path: inputs/S20A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36677124443
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S20 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Compile and run S20 contracts
        run: |
          python -m py_compile src/nmd/v1_evidence_fusion.py src/nmd/v1_gradient_isolated_fusion.py src/nmd/v1_norm_balanced_gradient.py src/nmd/v1_relation_canonicalization.py src/nmd/v1_standardized_triadic_consistency.py src/nmd/v1_s20_semantic_core.py src/nmd/v1_s20_authority.py src/nmd/v1_s20_checkpoint.py scripts/hira_v1_s20_a0_identity.py scripts/hira_v1_s20_train_dev.py
          pytest -q tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_standardized_triadic_consistency.py tests/test_v1_s20_authority.py tests/test_v1_s20_checkpoint.py tests/test_v1_invariance.py tests/test_v1_a13_lora.py tests/test_v1_triadic_semantic.py
      - name: Verify S20-A0 authority
        run: |
          (cd inputs/S20A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("inputs/S20A0/result.json").read_text())
          assert r["outcome"] == "HIRA_V1_S20_A0_IDENTITY_READY"
          assert r["a13_token_output_identity"] is True
          assert r["a13_pooled_output_identity"] is True
          assert r["exact_logit_identity_rate"] == 1.0
          assert r["exact_choice_identity_rate"] == 1.0
          assert r["candidate_parameter_count"] == 49152
          assert r["runtime_trainable_parameter_count"] == 0
          assert r["canonicalizer_added_parameter_count"] == 0
          assert r["fusion_added_parameter_count"] == 0
          assert r["fusion_epsilon"] == 1e-6
          assert r["fusion_expert_swap_max_abs"] == 0.0
          assert r["s20_vs_s14_forward_max_abs"] == 0.0
          assert r["primary_triadic_gradient_nonzero"] is True
          assert r["primary_relation_direct_gradient_zero"] is True
          assert r["relation_auxiliary_gradient_nonzero"] is True
          p = r["shared_surface_gradient_probe"]
          assert p["surface_parameter_count"] == 49152
          assert p["balance_epsilon"] == 1e-12
          assert p["normalized_post_dot"] >= -1e-5
          assert r["standardized_consistency_identical"] == 0.0
          assert r["standardized_consistency_mismatch"] > 0.0
          assert r["standardized_consistency_swap_max_abs"] <= 1e-7
          assert r["standardized_consistency_permutation_max_abs"] <= 1e-7
          assert r["standardized_consistency_affine_max_abs"] <= 2e-6
          assert r["standardized_consistency_scale_max_abs"] <= 2e-6
          assert r["standardized_consistency_gradients_nonzero"] is True
          assert r["standardized_consistency_flat_loss"] == 0.0
          assert r["standardized_consistency_flat_zero"] is True
          assert r["standardized_consistency_flat_finite"] is True
          assert r["standardized_consistency_parameter_count"] == 0
          assert r["standardized_triadic_consistency_coefficient"] == 0.25
          assert r["standardized_triadic_consistency_epsilon"] == 1e-6
          assert r["fused_option_order_flip_rate"] == 0.0
          assert r["role_temperature"] == 0.10
          assert r["pair_temperature"] == 0.10
          assert r["contrastive_temperature"] == 0.10
          assert r["mean_same_option_signature_cosine"] <= 1.0
          assert r["used_for_model_selection"] is False
          PY
      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh English S20 standardized-triadic consistency TRAIN DEV authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s20_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S20A0/result.json --out artifacts/s20-train-dev
      - name: Verify S20 TRAIN DEV receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/s20-train-dev")
          r = json.loads((root / "result.json").read_text())
          assert r["schema_version"] == "hira-v1-s20-standardized-triadic-consistency-train-dev-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] in {"HIRA_V1_S20_STANDARDIZED_TRIADIC_CONSISTENCY_DEV_READY", "HIRA_V1_S20_STANDARDIZED_TRIADIC_CONSISTENCY_DEV_FAIL"}
          assert r["scientific_authority"] == "V1_S20_FRESH_ENGLISH_STANDARDIZED_TRIADIC_CONSISTENCY"
          assert r["seed"] == 34001
          assert r["optimizer"]["epochs"] == 24
          assert r["optimizer"]["batch_size_semantic_cases"] == 16
          assert r["partitions"]["train_semantic_cases"] == 768
          assert r["partitions"]["dev_semantic_cases"] == 192
          assert len(r["partitions"]["domains"]) == 12
          assert r["partitions"]["k"] == 4
          assert r["partitions"]["views_per_option"] == 2
          assert r["parameter_surface"]["total_trainable_parameters"] == 49152
          assert r["parameter_surface"]["lora_trainable_parameters"] == 16384
          assert r["parameter_surface"]["projection_trainable_parameters"] == 32768
          assert r["parameter_surface"]["original_a13_trainable"] == 0
          assert r["parameter_surface"]["hira_core_trainable"] == 0
          assert r["parameter_surface"]["canonicalizer_added_parameters"] == 0
          assert r["parameter_surface"]["fusion_added_parameters"] == 0
          assert r["parameter_surface"]["learned_downstream_scorer_parameters"] == 0
          assert r["loss"]["relation_structured_binding_coefficient"] == 0.10
          assert r["loss"]["cross_view_relation_canonicalization_coefficient"] == 0.15
          assert r["loss"]["signature_separation_margin"] == 0.20
          assert r["loss"]["fusion_epsilon"] == 1e-6
          assert r["loss"]["fusion_equal_weight"] == 0.5
          assert r["loss"]["raw_triadic_ce_used"] is False
          assert r["loss"]["fused_primary_relation_logits_detached"] is True
          assert r["loss"]["inference_numerically_identical_to_s14"] is True
          assert r["loss"]["norm_balanced_gradient"] == "equal_direction_relation_priority_projection"
          assert r["loss"]["balance_epsilon"] == 1e-12
          assert r["loss"]["standardized_triadic_consistency_coefficient"] == 0.25
          assert r["loss"]["standardized_triadic_consistency_epsilon"] == 1e-6
          assert "raw_triadic_cross_view_js_coefficient" not in r["loss"]
          assert "paired_view_margin_coefficient" not in r["loss"]
          assert r["loss"]["balance_primary_block"] == "decision + 0.05*option_alignment + 0.25*standardized_triadic_consistency"
          assert r["norm_balancing"]["rule"] == "equal_direction_relation_priority_projection"
          assert r["norm_balancing"]["epsilon"] == 1e-12
          assert r["loss"]["role_temperature"] == 0.10
          assert r["loss"]["pair_temperature"] == 0.10
          assert r["loss"]["binding_contrastive_temperature"] == 0.10
          assert r["state_once"]["train_state_view_encodes_per_epoch"] == 1536
          assert r["state_once"]["dev_state_view_encodes_per_eval"] == 384
          assert r["post_dev_tuning_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          assert (root / "standardized-triadic-consistency-candidate.pt").is_file()
          PY
      - name: Freeze S20 TRAIN DEV integrity
        run: |
          (cd artifacts/s20-train-dev && sha256sum result.json train-manifest.json dev-manifest.json standardized-triadic-consistency-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s20-standardized-triadic-consistency-train-dev
          path: artifacts/s20-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
