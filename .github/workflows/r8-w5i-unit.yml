name: r8-w5i-unit

on:
  push:
    branches:
      - feat/r8-w5i-cross-candidate-binding
    paths:
      - "src/nmd/semantic_cross_candidate_binding.py"
      - "scripts/r8_w5i_build_cache.py"
      - "scripts/r8_w5i_train_candidate.py"
      - "scripts/r8_w5i_select_candidate.py"
      - "scripts/r8_w5i_confirm.py"
      - "tests/test_semantic_cross_candidate_binding.py"
      - "research/R8-W5I-HANDOFF.md"
      - ".github/workflows/r8-w5i-unit.yml"
  pull_request:
    paths:
      - "src/nmd/semantic_cross_candidate_binding.py"
      - "scripts/r8_w5i_build_cache.py"
      - "scripts/r8_w5i_train_candidate.py"
      - "scripts/r8_w5i_select_candidate.py"
      - "scripts/r8_w5i_confirm.py"
      - "tests/test_semantic_cross_candidate_binding.py"
      - "research/R8-W5I-HANDOFF.md"
      - ".github/workflows/r8-w5i-unit.yml"

concurrency:
  group: r8-w5i-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W5i
        run: |
          python -m py_compile src/nmd/semantic_cross_candidate_binding.py scripts/r8_w5i_build_cache.py scripts/r8_w5i_train_candidate.py scripts/r8_w5i_select_candidate.py scripts/r8_w5i_confirm.py
      - name: Run W5i unit tests
        run: pytest -q tests/test_semantic_cross_candidate_binding.py
