name: hira-v1-s40-a0-reference-anchored-coadaptation

on:
  push:
    branches:
      - feat/hira-v1-s40-reference-anchored-coadaptation
    paths:
      - "research/HIRA-V1-S40-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S40 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S40 contracts
        run: |
          python -m py_compile src/nmd/v1_reference_anchor_projection.py src/nmd/v1_s40_authority.py scripts/hira_v1_s40_a0_reference_anchored_coadaptation.py
          pytest -q tests/test_v1_reference_anchor_projection.py tests/test_v1_s40_authority.py tests/test_v1_s40_a0_harness.py tests/test_v1_bilinear_signature_readout.py tests/test_v1_native_relation_geometry.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_invariance.py

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run S40 A0 reference-anchored court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s40_a0_reference_anchored_coadaptation.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s40-a0

      - name: Verify S40 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s40-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s40-a0-reference-anchored-projected-coadaptation-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S40_A0_REFERENCE_ANCHORED_PROJECTED_COADAPTATION_READY"
          assert r["scientific_authority"]=="S40_A0_REFERENCE_ANCHORED_PROJECTED_FULL_BILINEAR_ONLY"
          assert r["operator_added_parameter_count"]==65536
          assert r["reference_trainable_parameter_count"]==49152
          assert r["treatment_trainable_parameter_count"]==114688
          assert r["anchor_coefficient"] is None
          assert r["projection_epsilon"]==1e-12
          assert r["zero_init_relation_logit_max_abs"]==0.0
          assert r["zero_init_signature_max_abs"]==0.0
          assert r["zero_init_fused_logit_max_abs"]==0.0
          assert r["zero_init_selected_choice_identity_rate"]==1.0
          assert r["zero_init_reference_treatment_relation_max_abs"]==0.0
          assert r["zero_init_reference_treatment_signature_max_abs"]==0.0
          assert r["synthetic_signature_anchor"]>0.0
          assert r["anchor_treatment_lora_gradient_l1"]>0.0
          assert r["anchor_reference_runtime_gradient_l1"]==0.0
          assert r["anchor_w_gradient_l1"]==0.0
          assert r["joint_correctness_w_gradient_l1"]>0.0
          assert r["joint_correctness_w_offdiagonal_gradient_l1"]>0.0
          assert r["joint_correctness_lora_gradient_l1"]>0.0
          assert r["conflict_projected"] is True
          assert r["conflict_pre_dot"]<0.0
          assert abs(r["conflict_post_dot"])<=2e-6
          assert r["nonconflict_projected"] is False
          assert r["nonconflict_identity_max_abs"]==0.0
          assert r["w_projection_max_abs"]==0.0
          assert r["synthetic_anchor_after_projected_step"]<=r["synthetic_anchor_before_step"]+1e-7
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["full_k"] is True
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S40 A0 integrity
        run: |
          (cd artifacts/s40-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s40-a0-reference-anchored-coadaptation
          path: artifacts/s40-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
