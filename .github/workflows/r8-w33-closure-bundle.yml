name: r8-w33-closure-bundle

on:
  push:
    branches:
      - feat/r8-w33-coevidence-composition
    paths:
      - "research/R8-W33-CLOSURE-BUNDLE"

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen W33 qualification artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924395669 --jq .digest)" = "sha256:ce511450337120be77f4d864ee48d0d5fa2029dab785bf20c0b616b6b2cf0ad1"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924395669 --jq .expired)" = "false"

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w33-reference-qualification
          path: inputs/qualification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36295893504

      - name: Build complete W33 qualification closure bundle
        run: |
          python scripts/r8_w33_bundle.py \
            --repo-root . \
            --t0-dir inputs/T0 \
            --qualification-dir inputs/qualification \
            --out artifacts/w33-bundle

      - name: Verify W33 bundle integrity
        run: |
          test -f artifacts/w33-bundle/NOLANE-HIRA-R8-W33-FULL.zip
          test -f artifacts/w33-bundle/R8-W33-HANDOFF.md
          test -f artifacts/w33-bundle/R8-W33-CLOSURE.md
          test -f artifacts/w33-bundle/R8-W33-INTEGRITY.sha256
          cd artifacts/w33-bundle
          sha256sum -c R8-W33-INTEGRITY.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w33-closure-full-bundle
          path: artifacts/w33-bundle
          if-no-files-found: error
          retention-days: 90
