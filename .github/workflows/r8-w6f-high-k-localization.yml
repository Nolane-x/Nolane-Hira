name: r8-w6f-high-k-localization

on:
  push:
    branches:
      - feat/r8-w6f-high-k-localization
    paths:
      - "src/nmd/high_k_localization_authority.py"
      - "src/nmd/high_k_localization.py"
      - "scripts/r8_w6f_build_cache.py"
      - "scripts/r8_w6f_evaluate.py"
      - "tests/test_high_k_localization_authority.py"
      - "tests/test_high_k_localization.py"
      - "research/R8-W6F-HANDOFF.md"
      - ".github/workflows/r8-w6f-high-k-localization.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w6f-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6f stack
        run: |
          python -m py_compile             src/nmd/high_k_localization_authority.py             src/nmd/high_k_localization.py             scripts/r8_w6f_build_cache.py             scripts/r8_w6f_evaluate.py
      - name: Run localization contracts
        run: |
          pytest -q             tests/test_high_k_localization_authority.py             tests/test_high_k_localization.py             tests/test_competitive_coarse_runtime.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen W6e artifact identities
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805971002 --jq .digest)" = "sha256:d08f00881e40a3aa5e8a24995299c1f9cb15d34a34b9b53fa544718165bd4fe2"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .digest)" = "sha256:fe0f176514b1cee0964212978b839b351ba6f35260ce0a035a1346680fc855bd"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805871471 --jq .digest)" = "sha256:fcc542322965108095f9c689ace970bfdd779905471140fb3318844ddba30a80"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805971002 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805871471 --jq .expired)" = "false"

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-scorer-only
          path: inputs/scorer-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-primary
          path: inputs/joint-primary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-replica
          path: inputs/joint-replica
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - name: Verify upstream receipts remain pre-CONFIRM candidates
        run: |
          python - <<'PY'
          import json
          expected = {
              "inputs/scorer-only": "multi-source-scorer-only",
              "inputs/joint-primary": "multi-source-joint-primary",
              "inputs/joint-replica": "multi-source-joint-replica",
          }
          for path, name in expected.items():
              x=json.load(open(path+"/receipt.json"))
              assert x["schema_version"] == "r8-w6e-candidate-receipt-v1"
              assert x["status"] == "PASS"
              assert x["candidate"] == name
              assert x["confirm_l_exposed"] is False
              assert x["confirm_m_exposed"] is False
              assert x["train_case_count"] == 384
              assert x["optimizer_case_steps"] == 2304
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6f-frozen-w6e-checkpoints
          path: inputs
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh nested W6f cache
        run: |
          python scripts/r8_w6f_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["status"] == "PASS"
          assert x["base_count"] == 288
          assert x["view_count"] == 1152
          assert x["domain_counts"] == {"N":384,"O":384,"P":384}
          assert x["k_counts"] == {"8":288,"16":288,"32":288,"64":288}
          assert x["state_encodes_per_view"] == 1.0
          assert x["prior_authority_value_overlap"] == []
          assert x["training_performed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["w6d_confirm_rows_used"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6f-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6f-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6f-frozen-w6e-checkpoints
          path: inputs/checkpoints
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run fixed-checkpoint rank-path localization
        run: |
          python scripts/r8_w6f_evaluate.py             --cache inputs/cache/diagnostics.pt             --scorer-only inputs/checkpoints/scorer-only             --joint-primary inputs/checkpoints/joint-primary             --joint-replica inputs/checkpoints/joint-replica             --out artifacts/localization
          cat artifacts/localization/localization.json
      - name: Verify diagnostic scope
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/localization/localization.json"))
          assert x["schema_version"] == "r8-w6f-localization-v1"
          assert x["status"] == "PASS"
          assert x["view_count"] == 1152
          assert x["base_count"] == 288
          assert x["training_performed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["w6d_confirm_rows_used"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          allowed={
              "CANDIDATE_RELATIVE_SALIENCE_IMPLICATED",
              "RELATION_RERANKING_IMPLICATED",
              "COARSE_BINDING_LIMIT",
              "MIXED_HIGH_K_FAILURE",
              "UNRESOLVED_HIGH_K_FAILURE",
          }
          assert set(x["pooled_classifications"].values()) <= allowed
          assert set(x["candidate_provenance"]) == {
              "multi-source-scorer-only",
              "multi-source-joint-primary",
              "multi-source-joint-replica",
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6f-localization
          path: artifacts/localization
          if-no-files-found: error
          retention-days: 90
