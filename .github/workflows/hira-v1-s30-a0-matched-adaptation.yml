name: hira-v1-s30-a0-matched-adaptation

on:
  push:
    branches:
      - feat/hira-v1-s30-matched-attention-vs-ffn
    paths:
      - "research/HIRA-V1-S30-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S30 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile S30 stack
        run: |
          python -m py_compile src/nmd/v1_a13_ffn_lora.py src/nmd/v1_s30_semantic_core.py src/nmd/v1_s30_authority.py scripts/hira_v1_s30_a0_matched_adaptation.py
      - name: Run S30 and inherited contracts
        run: |
          pytest -q tests/test_v1_a13_ffn_lora.py tests/test_v1_s30_semantic_core.py tests/test_v1_s30_authority.py tests/test_v1_a13_lora.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_triadic_semantic.py

  a0:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S30 source and HF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Verify frozen M4 runtime
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh S30-A0 matched court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s30_a0_matched_adaptation.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s30-a0
      - name: Verify S30-A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s30-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s30-a0-matched-adaptation-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S30_A0_MATCHED_ADAPTATION_READY"
          assert r["scientific_authority"]=="S30_A0_MATCHED_ATTENTION_VS_FFN_ONLY"
          assert r["semantic_case_count"]==16
          assert r["decision_count"]==64
          assert r["state_view_count"]==32
          assert r["k"]==4
          assert r["views_per_option"]==2
          assert r["arm_token_output_identity_max_abs"]==0.0
          assert r["arm_pooled_output_identity_max_abs"]==0.0
          assert r["exact_logit_identity_rate"]==1.0
          assert r["exact_choice_identity_rate"]==1.0
          for key in (
              "fused_c_max_abs","fused_p_max_abs","raw_c_max_abs","raw_p_max_abs",
              "relation_c_max_abs","relation_p_max_abs","signature_c_max_abs","signature_p_max_abs",
          ):
              assert r[key]==0.0
          a=r["attention_arm"]
          f=r["ffn_arm"]
          assert a["lora_parameter_count"]==16384
          assert a["projection_parameter_count"]==32768
          assert a["physical_parameter_count"]==49152
          assert a["runtime_trainable_parameter_count"]==0
          assert a["original_a13_trainable_parameter_count"]==0
          assert a["hira_core_trainable_parameter_count"]==0
          assert a["checkpoint_key_count"]==8
          assert a["checkpoint_roundtrip_exact"] is True
          assert len(a["gradient"]["lora_b_gradient_l1"])==4
          assert all(v>0.0 for v in a["gradient"]["lora_b_gradient_l1"])
          assert a["gradient"]["projection_gradient_l1"]>0.0
          assert a["gradient"]["primary_block_gradient_norm"]>0.0
          assert a["gradient"]["relation_block_gradient_norm"]>0.0
          assert a["state_encode_calls"]==32
          assert a["option_order_flip_rate"]==0.0
          assert a["max_probability_mass_error"]<=1e-6
          assert f["lora_parameter_count"]==20480
          assert f["projection_parameter_count"]==32768
          assert f["physical_parameter_count"]==53248
          assert f["runtime_trainable_parameter_count"]==0
          assert f["original_a13_trainable_parameter_count"]==0
          assert f["hira_core_trainable_parameter_count"]==0
          assert f["checkpoint_key_count"]==4
          assert f["checkpoint_roundtrip_exact"] is True
          assert len(f["gradient"]["lora_b_gradient_l1"])==2
          assert all(v>0.0 for v in f["gradient"]["lora_b_gradient_l1"])
          assert f["gradient"]["projection_gradient_l1"]>0.0
          assert f["gradient"]["primary_block_gradient_norm"]>0.0
          assert f["gradient"]["relation_block_gradient_norm"]>0.0
          assert f["state_encode_calls"]==32
          assert f["option_order_flip_rate"]==0.0
          assert f["max_probability_mass_error"]<=1e-6
          assert r["full_k"] is True
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Freeze S30-A0 integrity
        run: |
          (cd artifacts/s30-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s30-a0-matched-adaptation
          path: artifacts/s30-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
