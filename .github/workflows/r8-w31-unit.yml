name: r8-w31-unit

on:
  push:
    branches:
      - feat/r8-w31-qualified-dual-semantic-adapter
    paths:
      - "src/nmd/w31_dual_semantic_adapter.py"
      - "src/nmd/runtime.py"
      - "tests/test_w31_dual_semantic_adapter.py"
      - "research/R8-W31-HANDOFF.md"
      - ".github/workflows/r8-w31-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w31-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W31 core
        run: |
          python -m py_compile             src/nmd/w31_dual_semantic_adapter.py             src/nmd/runtime.py
      - name: Run W31 contracts
        run: |
          pytest -q             tests/test_w31_dual_semantic_adapter.py             tests/test_symmetric_semantic_runtime.py             tests/test_semantic_transfer_bridge.py
      - name: Runtime regressions
        run: |
          pytest -q             tests/test_runtime.py             tests/test_competitive_coarse_runtime.py
