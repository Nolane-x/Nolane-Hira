name: hira-v0-mainline-m2-semantic-dev

on:
  push:
    branches:
      - feat/hira-v0-mainline-m2-high-k
    paths:
      - "research/HIRA-V0-MAINLINE-M2-ENABLE-SEMANTIC-DEV"

permissions:
  contents: read
  actions: read

concurrency:
  group: hira-v0-mainline-m2-semantic-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen M2 semantic DEV stack
        run: |
          python -m py_compile \
            src/nmd/mainline.py \
            src/nmd/mainline_m2_authority.py \
            src/nmd/mainline_m2_eval.py \
            scripts/hira_v0_m2_semantic_dev.py

      - name: Run M2 semantic pre-exposure contracts
        run: |
          pytest -q \
            tests/test_mainline_high_k.py \
            tests/test_mainline_m2_authority.py \
            tests/test_mainline_m2_eval.py \
            tests/test_mainline.py

      - name: Verify exact M2 mechanics authority
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10928771833 --jq .digest)" = "sha256:99e8c02aeb48fa32910a591d71b92e3e6f96258c0fa8501f38682ea4a2b7f453"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10928771833 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/runs/36310118240 --jq .conclusion)" = "success"

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

      - name: Verify exact W34 provisional transfer artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .digest)" = "sha256:8374f2eb849cf80d1201e4ad05a8c8bf4c9bf1f824da17306f57c87456fd186c"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .expired)" = "false"

  baseline:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w34-coevidence-training
          path: inputs/W34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36299087572

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen M2 semantic stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" sentencepiece

      - name: Mark first HKE HKF semantic exposure
        run: echo HIRA_V0_M2_HKE_HKF_SEMANTIC_DEV_EXPOSURE_BEGIN

      - name: Run frozen zero-training M2 semantic DEV
        run: |
          python scripts/hira_v0_m2_semantic_dev.py \
            --t0-dir inputs/T0 \
            --w34-dir inputs/W34 \
            --out artifacts/m2-semantic-dev

      - name: Verify M2 semantic DEV receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/m2-semantic-dev/receipt.json"))
          assert x["schema_version"]=="hira-v0-mainline-m2-semantic-dev-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "HIRA_V0_M2_SEMANTIC_DEV_QUALIFIED",
            "HIRA_V0_M2_SEMANTIC_DEV_FAIL",
          }
          assert x["case_counts"]=={"HKE_K64":16,"HKF_K128":16,"total":32}
          assert x["evaluation"]["state_encode_count"]==32
          assert x["train_partitions_exposed"] is False
          assert x["train_case_count_used"]==0
          assert x["confirm_partition_exposed"] is False
          assert x["confirm_case_count_used"]==0
          assert x["sealed_exposure_authorized"] is x["dev_qualification"]["pass"]
          assert x["candidate_pruning_used"] is False
          assert x["relation_refinement_used"] is False
          assert x["adaptive_budget_used"] is False
          assert x["gradient_updates_used"] is False
          assert x["semantic_quality_promoted"] is False
          print("HIRA_V0_M2_SEMANTIC_DEV_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "evaluation":x["evaluation"],
            "dev_qualification":x["dev_qualification"],
            "sealed_exposure_authorized":x["sealed_exposure_authorized"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m2-semantic-dev
          path: artifacts/m2-semantic-dev
          if-no-files-found: error
          retention-days: 90
