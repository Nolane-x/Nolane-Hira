name: hira-v1-s69-query-gated-interaction-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s69-query-gated-interaction-rep
    paths:
      - "research/HIRA-V1-S69-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s69-a0-query-gated-interaction
          path: inputs/S69A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37417409926

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S69 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S69 contracts
        run: |
          python -m py_compile src/nmd/v1_query_gated_identity_interaction.py src/nmd/v1_s69_authority.py scripts/hira_v1_s69_train_dev.py
          pytest -q tests/test_v1_query_gated_identity_interaction.py tests/test_v1_s69_a0_harness.py tests/test_v1_s69_a0_workflow.py tests/test_v1_s69_authority.py tests/test_v1_s69_matched_harness.py tests/test_v1_s69_train_dev_workflow.py tests/test_v1_per_view_responsibility.py tests/test_v1_contextual_reliability_gate.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py

      - name: Verify frozen S68 parent evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/HIRA-V1-S68-MATCHED-RECEIPT.json").read_text())
          assert r["schema_version"]=="hira-v1-s68-context-modulated-pairwise-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S68_CONTEXT_MODULATED_PAIRWISE_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S68_FRESH_CONTEXT_MODULATED_PAIRWISE"
          assert r["seed"]==89001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          PY

      - name: Verify canonical S69 A0 authority
        run: |
          (cd inputs/S69A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:40c2e13e6a40f9e0b2a51a4cdeb7a6819511da4dd29d9ce19f3d688ad0617383"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S69A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s69-a0-query-gated-interaction-rep-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S69_A0_QUERY_GATED_INTERACTION_REP_READY"
          assert r["scientific_authority"]=="S69_A0_QUERY_GATED_INTERACTION_REP_ONLY"
          assert r["seed"]==90001
          assert r["reference_representation_parameter_count"]==0
          assert r["treatment_representation_parameter_count"]==0
          assert r["representation_dimension"]==512
          assert r["interaction_scale"]==16.0
          assert r["reference_pairwise_parameter_count"]==32832
          assert r["treatment_pairwise_parameter_count"]==32832
          assert r["added_treatment_parameter_count"]==0
          assert r["pairwise_trainable_tensor_names"]==["A","u"]
          assert r["head_parameter_initialization_bit_identical"] is True
          assert r["reference_vs_s59_max_abs_error"]==0.0
          assert r["treatment_reference_max_abs_difference"]>1e-7
          assert r["real_cache_treatment_reference_max_abs_difference"]>1e-7
          assert r["zero_identity_neutralization_max_abs_error"]==0.0
          assert r["reference_option_permutation_max_abs_error"]==0.0
          assert r["treatment_option_permutation_max_abs_error"]==0.0
          assert r["pairwise_permutation_max_abs_error"]<=2e-6
          assert r["antisymmetry_max_abs_error"]==0.0
          assert r["diagonal_max_abs_error"]==0.0
          assert r["reference_gradient_A_l1"]>0.0
          assert r["reference_gradient_u_l1"]>0.0
          assert r["treatment_gradient_A_l1"]>0.0
          assert r["treatment_gradient_u_l1"]>0.0
          assert r["representation_received_pairwise_gradient"] is False
          assert r["teacher_dependency"] is False
          assert r["pseudo_target_dependency"] is False
          assert r["one_encoder_state_once"] is True
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["matched_head_checkpoint_replay_max_abs_error"]==0.0
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S69 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s69_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S69A0/result.json \
            --out artifacts/s69-train-dev

      - name: Verify S69 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s69-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s69-query-gated-interaction-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S69_QUERY_GATED_INTERACTION_DEV_COMPLETE",
              "HIRA_V1_S69_QUERY_GATED_INTERACTION_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S69_FRESH_QUERY_GATED_INTERACTION"
          assert r["seed"]==90001

          parent=r["parent_s68"]
          assert parent["merged_main"]=="4cfdbc6fe100715bd950c9a0e2f504f71c486e9c"
          assert parent["scientific_run"]==37389861004
          assert parent["artifact_id"]==11381470793
          assert parent["artifact_digest"]=="sha256:0156bb57125f6b8c4f380649505803ed76cf49b8edf1c5bd4774fd8790386eaa"
          assert parent["verdict"]=="CASE_C"

          a0=r["a0_authority"]
          assert a0["run"]==37417409926
          assert a0["artifact_id"]==11391117254
          assert a0["artifact_digest"]=="sha256:40c2e13e6a40f9e0b2a51a4cdeb7a6819511da4dd29d9ce19f3d688ad0617383"

          cv=r["controlled_variable"]
          assert cv["reference_representation_family"]=="s59_concat"
          assert cv["treatment_representation_family"]=="s69_query_gated_identity_interaction"
          assert cv["reference_representation_parameters"]==0
          assert cv["treatment_representation_parameters"]==0
          assert cv["representation_dimension"]==512
          assert cv["interaction_scale"]==16.0
          assert cv["reference_pairwise_trainable_parameters"]==32832
          assert cv["treatment_pairwise_trainable_parameters"]==32832
          assert cv["added_treatment_parameters"]==0
          assert cv["pairwise_parameter_initialization_bit_identical"] is True
          assert cv["pairwise_family_both_arms"]=="s59_explicit_pairwise"
          assert cv["pairwise_objective_both_arms"]=="gold_vs_distractor_pairwise_softplus"
          assert cv["gate_family_both_arms"]=="s64_context_injected"
          assert cv["gate_trainable_parameters_per_arm"]==60
          assert cv["gate_objective_both_arms"]=="per_view_counterfactual_responsibility_bce"
          assert cv["gate_context_source_both_arms"]=="exact_s59_reference_representation"
          assert cv["gate_context_projection_seed"]==64064
          assert cv["correction_trainable_parameters"]==114688
          assert cv["same_train_rows_and_order"] is True
          assert cv["same_optimizer_lr_weight_decay"] is True
          assert cv["same_frozen_selector"] is True
          assert cv["teacher_dependency"] is False
          assert cv["pseudo_target_dependency"] is False
          assert cv["pairwise_gradient_enters_representation"] is False
          assert cv["pairwise_gradient_enters_native"] is False
          assert cv["reliability_target_reopened"] is False

          assert len(r["training_trajectory"])==24
          assert any(x["reference_gate_phi_gradient_ever_live"] for x in r["training_trajectory"])
          assert any(x["treatment_gate_phi_gradient_ever_live"] for x in r["training_trajectory"])
          for e,row in enumerate(r["training_trajectory"],start=1):
              assert row["epoch"]==e
              assert row["reference_train_pairwise"]["antisymmetry_max_abs_error"]==0.0
              assert row["treatment_train_pairwise"]["antisymmetry_max_abs_error"]==0.0
              assert len(row["correction_state_sha256"])==64
              assert len(row["reference_pairwise_head_state_sha256"])==64
              assert len(row["treatment_pairwise_head_state_sha256"])==64
              assert len(row["reference_gate_state_sha256"])==64
              assert len(row["treatment_gate_state_sha256"])==64

          for name,rep_family,interaction_scale in (
              ("reference_branch","s59_concat",0.0),
              ("treatment_branch","s69_query_gated_identity_interaction",16.0),
          ):
              b=r[name]
              assert 1<=b["selected_dev_epoch"]<=24
              m=b["selected_dev"]
              pm=b["selected_pairwise_aggregate_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["pairwise_antisymmetry_max_abs_error"]==0.0
              assert m["pairwise_diagonal_max_abs_error"]==0.0
              assert m["fused_max_probability_mass_error"]<=1e-6
              assert pm["antisymmetry_max_abs_error"]==0.0
              assert pm["diagonal_max_abs_error"]==0.0
              assert pm["max_probability_mass_error"]<=1e-6

              p=torch.load(root/b["checkpoint_file"],map_location="cpu",weights_only=True)
              assert p["schema_version"]=="hira-v1-s69-private-candidate-v1"
              assert p["seed"]==90001
              assert p["representation_family"]==rep_family
              assert p["representation_dimension"]==512
              assert p["representation_parameter_count"]==0
              assert p["interaction_scale"]==interaction_scale
              assert p["pairwise_parameter_count"]==32832
              assert p["pairwise_family"]=="s59_explicit_pairwise"
              assert p["gate_parameter_count"]==60
              assert p["gate_family"]=="s64_context_injected"
              assert p["gate_objective"]=="per_view_counterfactual_responsibility_bce"
              assert p["gate_context_source"]=="exact_s59_reference_representation"
              assert p["native_parameter_count_in_optimizer"]==0
              assert p["teacher_dependency"] is False

          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["exact_s68_state_question_option_overlap"]==0
          assert r["partitions"]["k"]==4

          assert r["post_dev_tuning_performed"] is False
          assert r["interaction_scale_changed"] is False
          assert r["interaction_formula_changed"] is False
          assert r["normalization_changed"] is False
          assert r["representation_dimension_changed"] is False
          assert r["learned_representation_adapter_added"] is False
          assert r["pairwise_width_rank_changed"] is False
          assert r["loss_optimizer_changed"] is False
          assert r["reliability_target_reopened"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S69 integrity
        run: |
          (cd artifacts/s69-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s69-query-gated-interaction
          path: artifacts/s69-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
