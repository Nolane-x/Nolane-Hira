name: r8-w14-unit

on:
  push:
    branches:
      - feat/r8-w14-continuous-reliability
    paths:
      - "src/nmd/continuous_reliability.py"
      - "src/nmd/continuous_reliability_authority.py"
      - "tests/test_continuous_reliability.py"
      - ".github/workflows/r8-w14-unit.yml"
      - "research/R8-W14-HANDOFF.md"
  pull_request:
    paths:
      - "src/nmd/continuous_reliability.py"
      - "src/nmd/continuous_reliability_authority.py"
      - "tests/test_continuous_reliability.py"
      - ".github/workflows/r8-w14-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w14-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W14 pre-data core
        run: |
          python -m py_compile             src/nmd/continuous_reliability.py             src/nmd/continuous_reliability_authority.py
      - name: Run W14 pre-data contracts
        run: pytest -q tests/test_continuous_reliability.py
