name: r8-w27-f2-qualification

on:
  push:
    branches:
      - feat/r8-w27-compositional-f2-authority
    paths:
      - "research/R8-W27-ENABLE-QUALIFICATION"

permissions:
  contents: read

concurrency:
  group: r8-w27-f2-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen reference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first W27 EJ-EM reference exposure
        run: echo R8_W27_EJ_EM_F2_REFERENCE_EXPOSURE_BEGIN
      - name: Run reference-only compositional F2 qualification
        run: |
          python scripts/r8_w27_qualify_f2.py --out artifacts/w27-qualification
      - name: Verify qualification artifact integrity
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w27-qualification/qualification.json"))
          assert x["schema_version"] == "r8-w27-f2-compositional-qualification-v1"
          assert x["status"] == "PASS"
          assert x["outcome"] in {
              "W27_ATOMIC_REFERENCE_INADEQUATE",
              "F2_DIRECT_PACKAGING_LIMIT",
              "F2_AUTHORITY_FULLY_QUALIFIED",
          }
          assert x["case_count"] == 384
          assert x["domains"] == ["EJ","EK","EL","EM"]
          assert x["cases_per_domain"] == 96
          assert x["cases_per_evidence_cell_per_domain"] == 24
          assert x["f2_composition"] == "U_AND_C"
          assert x["a13_materialized"] is False
          assert x["hira_materialized"] is False
          assert x["t0_t1_executed"] is False
          assert x["reference_outputs_used_as_hira_training_targets"] is False
          assert x["prior_exact_text_overlap"] == []
          assert x["query_schema_exact_sentence_overlap"] == []
          assert x["actual_reference_weight_sha256"]["deberta_nli"] == "d8148c6d49e0a7925134294c56326c71fe0ab1dc390e37355e00c7efbb488afa"
          assert x["actual_reference_weight_sha256"]["roberta_nli"] == "efc90996d2ed80123c26c9091c91385ffddc6d2fd0b2bacf3187fbd6c5b87953"
          assert x["w26_rows_used"] is False
          assert x["w25_rows_used"] is False
          assert x["w24_rows_used"] is False
          assert x["w23_rows_used"] is False
          assert x["w22_rows_used"] is False
          assert x["w21_rows_used"] is False
          assert x["w20_rows_used"] is False
          assert x["w19_rows_used"] is False
          assert x["w18_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          summary={
              "outcome":x["outcome"],
              "atomic_qualified_domain_count":x["atomic_qualified_domain_count"],
              "direct_qualified_domain_count":x["direct_qualified_domain_count"],
              "atomic_per_domain":x["atomic_per_domain"],
              "direct_per_domain":x["direct_per_domain"],
          }
          print("W27_QUALIFICATION_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w27-f2-qualification
          path: artifacts/w27-qualification
          if-no-files-found: error
          retention-days: 90
