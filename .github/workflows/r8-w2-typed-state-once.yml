name: r8-w2-typed-state-once

on:
  push:
    branches:
      - feat/r8-w2-typed-state-once
    paths:
      - "src/nmd/typed_decisions.py"
      - "src/nmd/typed_eval.py"
      - "src/nmd/runtime.py"
      - "src/nmd/training.py"
      - "src/nmd/losses.py"
      - "tests/test_typed_decisions.py"
      - "tests/test_runtime.py"
      - "tests/test_training.py"
      - "tests/test_losses.py"
      - "research/R8-W2-HANDOFF.md"
      - ".github/workflows/r8-w2-typed-state-once.yml"
  pull_request:
    paths:
      - "src/nmd/typed_decisions.py"
      - "src/nmd/typed_eval.py"
      - "src/nmd/runtime.py"
      - "src/nmd/training.py"
      - "src/nmd/losses.py"
      - "tests/test_typed_decisions.py"
      - "tests/test_runtime.py"
      - "tests/test_training.py"
      - "tests/test_losses.py"
      - "research/R8-W2-HANDOFF.md"
      - ".github/workflows/r8-w2-typed-state-once.yml"

jobs:
  typed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W2 modules
        run: |
          python -m py_compile             src/nmd/typed_decisions.py             src/nmd/typed_eval.py             src/nmd/runtime.py             src/nmd/training.py             src/nmd/losses.py

      - name: Run W2 contract tests
        run: |
          pytest -q             tests/test_typed_decisions.py             tests/test_runtime.py             tests/test_training.py             tests/test_losses.py
