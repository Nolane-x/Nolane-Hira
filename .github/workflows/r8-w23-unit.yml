name: r8-w23-unit

on:
  push:
    branches:
      - feat/r8-w23-cross-encoder-authority
    paths:
      - "src/nmd/cross_encoder_authority.py"
      - "src/nmd/cross_encoder_cache.py"
      - "src/nmd/cross_encoder_eval.py"
      - "scripts/r8_w23_build_cache.py"
      - "scripts/r8_w23_evaluate.py"
      - "tests/test_cross_encoder_authority.py"
      - "research/R8-W23-HANDOFF.md"
      - ".github/workflows/r8-w23-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w23-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W23 stack
        run: |
          python -m py_compile \
            src/nmd/cross_encoder_authority.py \
            src/nmd/cross_encoder_cache.py \
            src/nmd/cross_encoder_eval.py \
            scripts/r8_w23_build_cache.py \
            scripts/r8_w23_evaluate.py
      - name: Run W23 contracts
        run: pytest -q tests/test_cross_encoder_authority.py
      - name: Preflight exact-text freshness without materialization
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.cross_encoder_authority import (
              all_w23_prototype_texts,
              all_w23_query_texts,
              all_w23_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w23build","scripts/r8_w23_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          overlap=all_w23_text_atoms() & mod.prior_text_atoms()
          assert not overlap, sorted(overlap)
          assert not (all_w23_query_texts() & all_w23_prototype_texts())
          print("w23_preflight_fresh")
          PY
