name: r8-w25-atomic-geometry-authority

on:
  push:
    branches:
      - feat/r8-w25-atomic-severity-geometry
    paths:
      - ".github/workflows/r8-w25-atomic-geometry-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w25-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W25 stack
        run: |
          python -m py_compile \
            src/nmd/atomic_geometry_authority.py \
            src/nmd/atomic_geometry_cache.py \
            src/nmd/atomic_geometry_eval.py \
            scripts/r8_w25_build_cache.py \
            scripts/r8_w25_train_candidate.py \
            scripts/r8_w25_evaluate_confirm.py
      - name: Run frozen W25 contracts
        run: pytest -q tests/test_atomic_geometry.py
      - name: Verify frozen freshness
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.atomic_geometry_authority import (
              all_w25_query_texts,
              all_w25_schema_texts,
              all_w25_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w25build","scripts/r8_w25_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w25_text_atoms() & mod.prior_text_atoms())
          assert not (all_w25_query_texts() & all_w25_schema_texts())
          print("w25_authority_preflight_pass")
          PY

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W9 freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .digest)" = "sha256:6f0eee6ae58d489f0486372f0311e0f420065a0d9499185af7904377ae6a4712"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w9-freeze
          path: inputs/w9
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36122220588
      - name: Verify W9 projection-semantic provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/w9")
          x=json.loads((root/"freeze.json").read_text())
          assert x["schema_version"] == "r8-w9-freeze-v1"
          assert x["status"] == "PASS"
          rows={r["candidate"]:r for r in x["candidates"]}
          row=rows["projection-semantic-control"]
          assert row["scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          checkpoint=root/row["checkpoint_dir"]
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(checkpoint/"hira.pt") == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert sha(checkpoint/"scorer.pt") == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          print("w25_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w25-frozen-w9-checkpoints
          path: inputs/w9
          if-no-files-found: error
          retention-days: 14

  train_dev_cache:
    if: ${{ false }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark W25 TRAIN-DEV exposure
        run: echo R8_W25_DT_DX_TRAIN_DEV_EXPOSURE_BEGIN
      - name: Build fresh TRAIN and DEV caches
        run: |
          python scripts/r8_w25_build_cache.py --partition train --out artifacts/train
          python scripts/r8_w25_build_cache.py --partition dev --out artifacts/dev
      - name: Verify TRAIN and DEV receipts
        run: |
          python - <<'PY'
          import json
          train=json.load(open("artifacts/train/receipt.json"))
          dev=json.load(open("artifacts/dev/receipt.json"))
          for x in (train,dev):
              assert x["schema_version"] == "r8-w25-cache-receipt-v1"
              assert x["status"] == "PASS"
              assert x["prior_exact_text_overlap"] == []
              assert x["query_schema_exact_sentence_overlap"] == []
              assert x["training_performed"] is False
              assert x["selection_performed"] is False
              assert x["a13_query_invocations_per_case"] == 1
              assert x["encoded_query_sequences_per_case"] == 1
              assert x["confirm_materialized_after_all_candidate_freezes"] is False
              assert x["w24_rows_used"] is False
              assert x["w23_rows_used"] is False
              assert x["banking77_rows_used"] is False
              assert x["typed_decisions_final_or_test_used"] is False
              assert x["campaign_cells_populated"] == 0
          assert train["partition"] == "train"
          assert train["domains"] == ["DT","DU","DV","DW"]
          assert train["case_count"] == 384
          assert dev["partition"] == "dev"
          assert dev["domains"] == ["DX"]
          assert dev["case_count"] == 96
          print("w25_train_dev_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w25-train-dev-cache
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  candidates:
    needs: [upstream, train_dev_cache]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        candidate: [Q0, Q1, T0, T1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-frozen-w9-checkpoints
          path: inputs/w9
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-train-dev-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research,dev]"
      - name: Train and DEV-freeze ${{ matrix.candidate }}
        run: |
          python scripts/r8_w25_train_candidate.py \
            --train-cache inputs/cache/train/w25-train.pt \
            --dev-cache inputs/cache/dev/w25-dev.pt \
            --w9-freeze inputs/w9/freeze.json \
            --w9-checkpoints inputs/w9 \
            --candidate ${{ matrix.candidate }} \
            --out artifacts/${{ matrix.candidate }}
      - name: Verify frozen candidate receipt
        run: |
          CANDIDATE="${{ matrix.candidate }}" python - <<'PY'
          import json, os
          c=os.environ["CANDIDATE"]
          x=json.load(open(f"artifacts/{c}/receipt.json"))
          assert x["schema_version"] == "r8-w25-candidate-receipt-v1"
          assert x["status"] == "PASS"
          assert x["candidate"] == c
          assert x["selected_dev_epoch"] >= 1
          assert x["selection_partition"] == "DX"
          assert x["batch_size"] == 32
          assert x["confirm_exposed"] is False
          assert x["a13_frozen"] is True
          assert x["w24_rows_used"] is False
          assert x["banking77_rows_used"] is False
          if c in {"Q0","Q1"}:
              assert x["epochs"] == 20
              assert x["optimizer_steps"] == 240
              assert x["trainable_parameter_count"] == (771 if c=="Q0" else 387)
          else:
              assert x["epochs"] == 8
              assert x["optimizer_steps"] == 96
              assert x["trainable_parameter_count"] == 32768
              assert x["projection_temperature"] == 0.07
              assert x["initialization"] == "exact-frozen-w9-projection"
          print("w25_candidate_freeze_verified",c,x["selected_dev_epoch"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w25-candidate-${{ matrix.candidate }}
          path: artifacts/${{ matrix.candidate }}
          if-no-files-found: error
          retention-days: 90

  confirm_cache:
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-Q0
          path: inputs/Q0
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-Q1
          path: inputs/Q1
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-T0
          path: inputs/T0
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-T1
          path: inputs/T1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Verify all candidate freezes precede CONFIRM
        run: |
          python - <<'PY'
          import json
          for c in ("Q0","Q1","T0","T1"):
              x=json.load(open(f"inputs/{c}/receipt.json"))
              assert x["status"] == "PASS"
              assert x["candidate"] == c
              assert x["confirm_exposed"] is False
              assert x["selected_dev_epoch"] >= 1
          print("w25_all_candidates_frozen_before_confirm")
          PY
      - name: Mark first sealed W25 CONFIRM exposure
        run: echo R8_W25_DY_DZ_SEALED_CONFIRM_EXPOSURE_BEGIN
      - name: Materialize sealed DY-DZ CONFIRM
        run: |
          python scripts/r8_w25_build_cache.py \
            --partition confirm \
            --freeze-receipt inputs/Q0/receipt.json \
            --freeze-receipt inputs/Q1/receipt.json \
            --freeze-receipt inputs/T0/receipt.json \
            --freeze-receipt inputs/T1/receipt.json \
            --out artifacts/confirm
      - name: Verify sealed CONFIRM receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/receipt.json"))
          assert x["schema_version"] == "r8-w25-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["partition"] == "confirm"
          assert x["domains"] == ["DY","DZ"]
          assert x["case_count"] == 192
          assert x["confirm_materialized_after_all_candidate_freezes"] is True
          assert set(x["candidate_freeze_receipts"]) == {"Q0","Q1","T0","T1"}
          assert x["prior_exact_text_overlap"] == []
          assert x["w24_rows_used"] is False
          assert x["banking77_rows_used"] is False
          print("w25_confirm_seal_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w25-sealed-confirm-cache
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90

  evaluate:
    needs: [upstream, candidates, confirm_cache]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-frozen-w9-checkpoints
          path: inputs/w9
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-sealed-confirm-cache
          path: inputs/confirm
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-Q0
          path: inputs/Q0
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-Q1
          path: inputs/Q1
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-T0
          path: inputs/T0
      - uses: actions/download-artifact@v4
        with:
          name: r8-w25-candidate-T1
          path: inputs/T1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece
      - name: Evaluate sealed W25 CONFIRM
        run: |
          python scripts/r8_w25_evaluate_confirm.py \
            --confirm-cache inputs/confirm/w25-confirm.pt \
            --w9-freeze inputs/w9/freeze.json \
            --w9-checkpoints inputs/w9 \
            --q0-dir inputs/Q0 \
            --q1-dir inputs/Q1 \
            --t0-dir inputs/T0 \
            --t1-dir inputs/T1 \
            --out artifacts/w25-audit
      - name: Verify frozen W25 audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w25-audit/audit.json"))
          assert x["schema_version"] == "r8-w25-atomic-geometry-audit-v1"
          assert x["status"] == "PASS"
          assert x["outcome"] in {
              "W25_REFERENCE_INADEQUATE",
              "TRAINABLE_PROJECTION_RESCUE",
              "W9_PROJECTION_INFORMATION_LOSS",
              "SEMANTIC_MATCHING_INTERFACE_LIMIT",
              "A13_LINEAR_PROBE_LIMIT",
              "ATOMIC_GEOMETRY_DECOMPOSITION_UNRESOLVED",
          }
          assert set(x["per_domain"]) == {"DY","DZ"}
          assert all(v["integrity"] for v in x["per_domain"].values())
          assert set(x["evaluations"]) == {"A0","P0","Q0","Q1","T0","T1"}
          assert x["actual_reference_weight_sha256"] == "d8148c6d49e0a7925134294c56326c71fe0ab1dc390e37355e00c7efbb488afa"
          assert x["confirm_materialized_after_all_candidate_freezes"] is True
          assert x["a13_frozen_all_paths"] is True
          assert x["reference_supplied_training_targets"] is False
          assert x["w24_rows_used"] is False
          assert x["w23_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          summary={
              "outcome":x["outcome"],
              "reference_adequate_domain_count":x["reference_adequate_domain_count"],
              "DY":x["per_domain"]["DY"],
              "DZ":x["per_domain"]["DZ"],
              "pooled":{
                  name:x["evaluations"][name]["pooled"]["composed_severity_top1"]
                  for name in ("A0","P0","Q0","Q1","T0","T1")
              },
              "reference_composed":x["reference"]["pooled"]["composed_severity_top1"],
          }
          print("W25_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w25-authoritative-audit
          path: artifacts/w25-audit
          if-no-files-found: error
          retention-days: 90
