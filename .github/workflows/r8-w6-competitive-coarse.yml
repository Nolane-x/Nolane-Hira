name: r8-w6-competitive-coarse

on:
  push:
    branches:
      - feat/r8-w6-production-competitive-coarse
    paths:
      - "src/nmd/contracts.py"
      - "src/nmd/semantic.py"
      - "src/nmd/schema.py"
      - "src/nmd/competitive.py"
      - "src/nmd/hira.py"
      - "src/nmd/runtime.py"
      - "src/nmd/training.py"
      - "src/nmd/typed_decisions.py"
      - "src/nmd/typed_eval.py"
      - "tests/test_competitive_coarse_runtime.py"
      - "tests/test_runtime.py"
      - "tests/test_token_relation_modes.py"
      - "tests/test_training.py"
      - "tests/test_typed_decisions.py"
      - "research/R8-W6-HANDOFF.md"
      - ".github/workflows/r8-w6-competitive-coarse.yml"
  pull_request:
    paths:
      - "src/nmd/contracts.py"
      - "src/nmd/semantic.py"
      - "src/nmd/schema.py"
      - "src/nmd/competitive.py"
      - "src/nmd/hira.py"
      - "src/nmd/runtime.py"
      - "src/nmd/training.py"
      - "src/nmd/typed_decisions.py"
      - "src/nmd/typed_eval.py"
      - "tests/test_competitive_coarse_runtime.py"
      - "tests/test_runtime.py"
      - "tests/test_token_relation_modes.py"
      - "tests/test_training.py"
      - "tests/test_typed_decisions.py"
      - "research/R8-W6-HANDOFF.md"
      - ".github/workflows/r8-w6-competitive-coarse.yml"

concurrency:
  group: r8-w6-competitive-coarse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6
        run: |
          python -m py_compile src/nmd/contracts.py src/nmd/semantic.py src/nmd/schema.py src/nmd/competitive.py src/nmd/hira.py src/nmd/runtime.py src/nmd/training.py src/nmd/typed_decisions.py src/nmd/typed_eval.py
      - name: Run W6 and regression contracts
        run: |
          pytest -q \
            tests/test_competitive_coarse_runtime.py \
            tests/test_runtime.py \
            tests/test_token_relation_modes.py \
            tests/test_training.py \
            tests/test_typed_decisions.py
