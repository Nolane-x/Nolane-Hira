name: r8-w22-unit

on:
  push:
    branches:
      - feat/r8-w22-reference-panel-ceiling
    paths:
      - "src/nmd/reference_panel_authority.py"
      - "src/nmd/reference_panel_cache.py"
      - "src/nmd/reference_panel_eval.py"
      - "scripts/r8_w22_build_cache.py"
      - "scripts/r8_w22_evaluate.py"
      - "tests/test_reference_panel.py"
      - "research/R8-W22-HANDOFF.md"
      - ".github/workflows/r8-w22-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w22-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W22 stack
        run: |
          python -m py_compile             src/nmd/reference_panel_authority.py             src/nmd/reference_panel_cache.py             src/nmd/reference_panel_eval.py             scripts/r8_w22_build_cache.py             scripts/r8_w22_evaluate.py
      - name: Run W22 contracts
        run: pytest -q tests/test_reference_panel.py
      - name: Preflight exact-text freshness without materialization
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.reference_panel_authority import (
              all_w22_prototype_texts,
              all_w22_query_texts,
              all_w22_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w22build","scripts/r8_w22_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          overlap=all_w22_text_atoms() & mod.prior_text_atoms()
          assert not overlap, sorted(overlap)
          assert not (all_w22_query_texts() & all_w22_prototype_texts())
          print("w22_preflight_fresh")
          PY
