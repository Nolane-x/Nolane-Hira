name: hira-v1-s57-a0-discrete-pairwise-ranking-consistency

on:
  push:
    branches:
      - feat/hira-v1-s57-discrete-pairwise-ranking-consistency
    paths:
      - "research/HIRA-V1-S57-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S57 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S57 contracts
        run: |
          python -m py_compile src/nmd/v1_pairwise_ranking_consistency.py scripts/hira_v1_s57_a0_discrete_pairwise_ranking_consistency.py
          pytest -q tests/test_v1_pairwise_ranking_consistency.py tests/test_v1_s57_a0_harness.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_query_free_option_identity.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run S57 A0 ordinal-consistency court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s57_a0_discrete_pairwise_ranking_consistency.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --out artifacts/s57-a0

      - name: Verify S57 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s57-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s57-a0-discrete-pairwise-ranking-consistency-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S57_A0_DISCRETE_PAIRWISE_RANKING_CONSISTENCY_READY"
          assert r["scientific_authority"]=="S57_A0_DISCRETE_PAIRWISE_RANKING_CONSISTENCY_ONLY"
          assert r["seed"]==78001
          assert r["native_trainable_parameter_count"]==0
          assert r["reference_private_trainable_parameter_count"]==114688
          assert r["treatment_private_trainable_parameter_count"]==114688
          assert r["added_trainable_parameter_count"]==0
          assert r["identity_parameter_count"]==0
          assert r["initialization_bit_identical"] is True
          assert r["anchor_sign_detached"] is True
          assert r["matching_ordinal_loss"]<r["sign_flip_ordinal_loss"]
          assert r["shared_offset_invariance_error"]<=1e-6
          assert r["positive_scale_invariance_error"]<=3e-5
          assert r["wrong_gold_filtered_direction_count"]>0
          assert r["correct_gold_active_direction_count"]>0
          assert r["non_gold_active_direction_fraction"]>0.0
          assert r["flat_weighted_ordinal_auxiliary"]==0.0
          assert r["flat_active_directional_anchor_fraction"]==0.0
          assert r["uniform_top1_top2_probability_gap"]==0.0
          assert r["uniform_logit_rms"]==0.0
          assert r["option_permutation_loss_error"]<=1e-7
          assert r["reference_auxiliary_exact_zero"] is True
          assert r["treatment_auxiliary_gradient_l1"]>0.0
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["second_encoder_pass"] is False
          assert r["used_for_model_selection"] is False
          PY

      - name: Freeze S57 A0 integrity
        run: |
          (cd artifacts/s57-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s57-a0-discrete-pairwise-ranking-consistency
          path: artifacts/s57-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
