name: r8-w30-semantic-transfer-authority

on:
  push:
    branches:
      - feat/r8-w30-semantic-transfer-bridge
    paths:
      - "research/R8-W30-ENABLE-AUTHORITY"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w30-semantic-transfer-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W30 stack
        run: |
          python -m py_compile             src/nmd/semantic_transfer_bridge.py             src/nmd/semantic_transfer_core.py             src/nmd/semantic_transfer_authority.py             src/nmd/semantic_transfer_cache.py             src/nmd/semantic_transfer_eval.py             src/nmd/runtime.py             scripts/r8_w30_train.py             scripts/r8_w30_confirm.py             scripts/r8_w30_bundle.py
      - name: Run W30 and backward-compat contracts
        run: |
          pytest -q             tests/test_semantic_transfer_bridge.py             tests/test_semantic_transfer_authority.py             tests/test_symmetric_semantic_runtime.py             tests/test_hira_v0_authority.py             tests/test_runtime.py             tests/test_competitive_coarse_runtime.py
      - name: Preflight exact-text firewall
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from nmd.hira_v0_authority import all_w29_text_atoms
          from nmd.semantic_transfer_authority import all_w30_text_atoms

          spec=importlib.util.spec_from_file_location("w29eval",Path("scripts/r8_w29_evaluate.py"))
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          exposed=set(mod.prior_text_atoms()) | set(all_w29_text_atoms())
          overlap=sorted(all_w30_text_atoms() & exposed)
          assert overlap == [], overlap
          print("w30_pre_exposure_firewall_pass")
          PY

  t0:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948
      - name: Verify exact T0 checkpoint
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("inputs/T0")
          receipt=json.loads((root/"receipt.json").read_text())
          sha=hashlib.sha256((root/"candidate.pt").read_bytes()).hexdigest()
          assert receipt["status"]=="PASS"
          assert receipt["candidate"]=="T0"
          assert receipt["checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert sha==receipt["checkpoint_sha256"]
          assert receipt["trainable_parameter_count"]==32768
          print("w30_t0_provenance_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w30-frozen-t0
          path: inputs/T0
          if-no-files-found: error
          retention-days: 90

  train:
    needs: t0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-frozen-t0
          path: inputs/T0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen empirical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece
      - name: Mark W30 TRAIN/DEV exposure
        run: echo R8_W30_TRAIN_DEV_EXPOSURE_BEGIN
      - name: Train and select bridge on TRAIN/DEV only
        run: |
          python scripts/r8_w30_train.py             --t0-dir inputs/T0             --out artifacts/w30-train
      - name: Verify training receipt
        run: |
          python - <<'PY'
          import hashlib,json
          x=json.load(open("artifacts/w30-train/receipt.json"))
          sha=hashlib.sha256(open("artifacts/w30-train/bridge.pt","rb").read()).hexdigest()
          assert x["schema_version"]=="r8-w30-transfer-training-receipt-v1"
          assert x["status"]=="PASS"
          assert x["checkpoint_sha256"]==sha
          assert x["t0_checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert x["train_case_count"]==384
          assert x["dev_case_count"]==96
          assert x["confirm_case_count_used"]==0
          assert x["w29_rows_used"] is False
          assert x["older_authority_rows_used"] is False
          assert x["projection_training_performed"] is False
          assert x["bridge_training_performed"] is True
          assert x["bridge_parameter_count"]==2048
          assert x["bridge_rank"]==8
          assert x["seed"]==3011
          assert x["epochs"]==12
          assert x["batch_size"]==32
          assert abs(x["temperature"]-0.07)<1e-12
          assert x["exact_text_overlap"]==[]
          print("W30_TRAIN_RECEIPT="+json.dumps({
            "checkpoint_sha256":x["checkpoint_sha256"],
            "selected_dev_epoch":x["selected_dev_epoch"],
            "baseline_dev":x["baseline_dev"],
            "bridged_dev":x["bridged_dev"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w30-bridge-training
          path: artifacts/w30-train
          if-no-files-found: error
          retention-days: 90

  confirm:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-frozen-t0
          path: inputs/T0
      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-bridge-training
          path: inputs/bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece
      - name: Mark first W30 sealed CONFIRM exposure
        run: echo R8_W30_FF_FG_SEALED_CONFIRM_EXPOSURE_BEGIN
      - name: Run sealed W30 authority
        run: |
          python scripts/r8_w30_confirm.py             --t0-dir inputs/T0             --bridge-dir inputs/bridge             --out artifacts/w30-confirm
      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w30-confirm/audit.json"))
          assert x["schema_version"]=="r8-w30-transfer-core-audit-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "W30_REFERENCE_INADEQUATE",
            "W30_TRANSFER_BRIDGE_FAIL",
            "HIRA_V0_TRANSFER_CORE_READY",
          }
          assert x["domains"]==["FF","FG"]
          assert x["case_count"]==192
          assert x["t0_checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert x["w29_rows_used"] is False
          assert x["older_authority_rows_used"] is False
          assert x["reference_outputs_used_as_model_inputs"] is False
          assert x["candidate_truncation_used"] is False
          assert x["relation_refinement_used"] is False
          assert x["confirm_used_for_training_or_selection"] is False
          assert x["exact_text_overlap"]==[]
          print("W30_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "reference":x["reference_per_domain"],
            "quality":x["quality_per_domain"],
            "runtime":x["runtime_per_domain"],
            "transfer_gate":x["transfer_gate"],
            "severity_delta":x["severity_delta_vs_unbridged"],
            "baseline":x["baseline"]["pooled"],
            "bridged":x["bridged"]["pooled"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w30-authoritative-audit
          path: artifacts/w30-confirm
          if-no-files-found: error
          retention-days: 90

  bundle:
    needs: confirm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-frozen-t0
          path: inputs/T0
      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-bridge-training
          path: inputs/bridge
      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-authoritative-audit
          path: inputs/confirm
      - name: Build full W30 handoff bundle
        run: |
          python scripts/r8_w30_bundle.py             --repo-root .             --t0-dir inputs/T0             --train-dir inputs/bridge             --confirm-dir inputs/confirm             --out artifacts/w30-bundle
      - name: Verify bundle contract
        run: |
          test -f artifacts/w30-bundle/NOLANE-HIRA-R8-W30-FULL.zip
          test -f artifacts/w30-bundle/R8-W30-HANDOFF.md
          test -f artifacts/w30-bundle/R8-W30-INTEGRITY.sha256
          sha256sum -c artifacts/w30-bundle/R8-W30-INTEGRITY.sha256 --ignore-missing
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w30-full-bundle
          path: artifacts/w30-bundle
          if-no-files-found: error
          retention-days: 90
