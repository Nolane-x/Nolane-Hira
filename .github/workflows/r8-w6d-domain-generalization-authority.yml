name: r8-w6d-domain-generalization-authority

on:
  push:
    branches:
      - feat/r8-w6d-domain-generalization
    paths:
      - "src/nmd/typed_domain_generalization_authority.py"
      - "src/nmd/typed_domain_generalization.py"
      - "scripts/r8_w6d_build_cache.py"
      - "scripts/r8_w6d_train_candidate.py"
      - "scripts/r8_w6d_freeze_candidates.py"
      - "scripts/r8_w6d_confirm.py"
      - "tests/test_typed_domain_generalization_authority.py"
      - "tests/test_typed_domain_generalization.py"
      - "research/R8-W6D-HANDOFF.md"
      - ".github/workflows/r8-w6d-domain-generalization-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w6d-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6d stack
        run: |
          python -m py_compile             src/nmd/typed_domain_generalization_authority.py             src/nmd/typed_domain_generalization.py             scripts/r8_w6d_build_cache.py             scripts/r8_w6d_train_candidate.py             scripts/r8_w6d_freeze_candidates.py             scripts/r8_w6d_confirm.py
      - name: Run W6d contracts and production regressions
        run: |
          pytest -q \
            tests/test_typed_domain_generalization_authority.py \
            tests/test_typed_domain_generalization.py \
            tests/test_competitive_coarse_runtime.py \
            tests/test_runtime.py \
            tests/test_token_relation_modes.py \
            tests/test_training.py \
            tests/test_typed_decisions.py \
            tests/test_typed_competitive_cache.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen W6b selected artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10792488690 --jq .digest)" = "sha256:3f0fe10a60701a0a654e5c71170432d55a96d1345b42fa2e53a38e9cb1778711"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10792488690 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6b-selected
          path: inputs/w6b
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35959578866
      - name: Verify frozen production checkpoint identity
        run: |
          test "$(sha256sum inputs/w6b/competitive-hira.pt | cut -d' ' -f1)" = "925f74094ac4ae583c015ea2a0be32ec692d885ec64dcf9cf3d94b64be0ccf42"
          test "$(sha256sum inputs/w6b/competitive-scorer.pt | cut -d' ' -f1)" = "50abb2e8136599bcaf5c41d61036e3c335a7589c6244536cc0292dcea15b1ef0"
          python - <<'PY'
          import json
          x=json.load(open("inputs/w6b/selection.json"))
          assert x["status"] == "PASS"
          assert x["selected_competitive_candidate"] == "competitive-w5i-scorer-only"
          assert x["selected_competitive_hira_sha256"] == "925f74094ac4ae583c015ea2a0be32ec692d885ec64dcf9cf3d94b64be0ccf42"
          assert x["selected_competitive_scorer_sha256"] == "50abb2e8136599bcaf5c41d61036e3c335a7589c6244536cc0292dcea15b1ef0"
          assert x["confirm_exposed"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6d-frozen-w6b
          path: inputs/w6b
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build equal-budget source and held-out DEV caches
        run: |
          python scripts/r8_w6d_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["status"] == "PASS"
          assert x["single_case_count"] == 384
          assert x["multi_case_count"] == 384
          assert x["dev_case_count"] == 192
          assert x["single_decision_count"] == 1920
          assert x["multi_decision_count"] == 1920
          assert x["dev_decision_count"] == 960
          assert x["multi_source_domain_counts"] == {
              "A":96, "B":96, "C":96, "D":96
          }
          assert x["multi_a_is_single_semantic_subset"] is True
          assert x["multi_a_shared_semantic_count"] == 96
          assert x["all_value_count"] == 576
          assert x["prior_authority_value_overlap"] == []
          assert x["state_encodes_per_case_single"] == 1.0
          assert x["state_encodes_per_case_multi"] == 1.0
          assert x["state_encodes_per_case_dev"] == 1.0
          assert x["confirm_exposed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6d-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - frozen-w6b-control
          - single-source-scorer-only
          - multi-source-scorer-only
          - multi-source-joint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6d-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6d-frozen-w6b
          path: inputs/w6b
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cached training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Freeze/train W6d path on held-out DEV-E
        run: |
          python scripts/r8_w6d_train_candidate.py             --single-cache inputs/cache/train-single.pt             --multi-cache inputs/cache/train-multi.pt             --dev-cache inputs/cache/dev-e.pt             --w6b-hira inputs/w6b/competitive-hira.pt             --w6b-scorer inputs/w6b/competitive-scorer.pt             --candidate "${{ matrix.candidate }}"             --out "artifacts/candidates/${{ matrix.candidate }}"
          cat "artifacts/candidates/${{ matrix.candidate }}/receipt.json"
          python - "${{ matrix.candidate }}" <<'PY'
          import json, pathlib, sys
          name=sys.argv[1]
          x=json.load(open(pathlib.Path("artifacts/candidates")/name/"receipt.json"))
          assert x["status"] == "PASS"
          assert x["candidate"] == name
          expected_trainable={
              "frozen-w6b-control":0,
              "single-source-scorer-only":32769,
              "multi-source-scorer-only":32769,
              "multi-source-joint":454928,
          }[name]
          assert x["trainable_parameter_count"] == expected_trainable
          assert x["total_parameter_count"] == 454928
          if name == "frozen-w6b-control":
              assert x["train_case_count"] == 0
              assert x["optimizer_case_steps"] == 0
          else:
              assert x["train_case_count"] == 384
              assert x["optimizer_case_steps"] == 2304
              assert x["epochs"] == 6
          assert x["confirm_exposed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6d-candidate-${{ matrix.candidate }}
          path: artifacts/candidates/${{ matrix.candidate }}
          if-no-files-found: error
          retention-days: 14

  freeze:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w6d-candidate-*
          path: inputs/candidates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install freeze stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Freeze every preregistered DEV-E checkpoint
        run: |
          python scripts/r8_w6d_freeze_candidates.py             --candidates inputs/candidates             --out artifacts/frozen
          cat artifacts/frozen/freeze.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/frozen/freeze.json"))
          assert x["status"] == "PASS"
          assert x["selection_authority"] == "DEV_E_INDEPENDENT_PER_CANDIDATE"
          assert x["all_candidates_frozen_before_confirm"] is True
          assert len(x["candidates"]) == 4
          assert x["scorer_only_equal_case_budget"] is True
          assert x["scorer_only_equal_optimizer_steps"] is True
          assert x["scorer_only_equal_trainable_parameters"] is True
          assert x["confirm_exposed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6d-frozen
          path: artifacts/frozen
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6d-frozen
          path: inputs/frozen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen CONFIRM stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Evaluate untouched held-out domain F
        run: |
          python scripts/r8_w6d_confirm.py             --freeze inputs/frozen/freeze.json             --checkpoints inputs/frozen             --out artifacts/confirm
          cat artifacts/confirm/confirm.json
      - name: Verify frozen scientific scope
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/confirm.json"))
          assert x["schema_version"] == "r8-w6d-confirm-v1"
          assert x["status"] == "PASS"
          assert x["confirm_generated_after_all_dev_freezes"] is True
          assert x["confirm_domain"] == "F"
          assert x["confirm_seed"] == 183353
          assert x["confirm_case_count"] == 192
          assert x["confirm_decision_count"] == 960
          assert x["state_encodes_per_case"] == 1.0
          assert len(x["paths"]) == 4
          assert x["scorer_only_equal_case_budget"] is True
          assert x["scorer_only_equal_optimizer_steps"] is True
          assert x["scorer_only_equal_trainable_parameters"] is True
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          assert x["verdict"] in {
              "MULTISOURCE_SCORER_GENERALIZATION_RESCUE",
              "JOINT_ADAPTATION_GENERALIZATION_RESCUE",
              "MULTISOURCE_GENERALIZATION_PARTIAL",
              "GENERALIZATION_FAIL",
          }
          for metrics in x["paths"].values():
              assert metrics["probability_mass_max_error"] <= 1e-6
              assert metrics["source_state_encodes_per_case"] == 1.0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6d-confirm
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90
