name: r8-w24-atomic-severity-authority

on:
  push:
    branches:
      - feat/r8-w24-atomic-severity-factors
    paths:
      - ".github/workflows/r8-w24-atomic-severity-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w24-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W24 stack
        run: |
          python -m py_compile \
            src/nmd/atomic_severity_authority.py \
            src/nmd/atomic_severity_cache.py \
            src/nmd/atomic_severity_eval.py \
            scripts/r8_w24_build_cache.py \
            scripts/r8_w24_evaluate.py
      - name: Run frozen W24 contracts
        run: pytest -q tests/test_atomic_severity_authority.py
      - name: Verify frozen freshness
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.atomic_severity_authority import (
              all_w24_prototype_texts,
              all_w24_query_texts,
              all_w24_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w24build","scripts/r8_w24_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w24_text_atoms() & mod.prior_text_atoms())
          assert not (all_w24_query_texts() & all_w24_prototype_texts())
          print("w24_authority_preflight_pass")
          PY

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W9 freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .digest)" = "sha256:6f0eee6ae58d489f0486372f0311e0f420065a0d9499185af7904377ae6a4712"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w9-freeze
          path: inputs/w9
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36122220588
      - name: Verify W9 projection-semantic provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/w9")
          x=json.loads((root/"freeze.json").read_text())
          assert x["schema_version"] == "r8-w9-freeze-v1"
          assert x["status"] == "PASS"
          rows={r["candidate"]:r for r in x["candidates"]}
          row=rows["projection-semantic-control"]
          assert row["scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          checkpoint=root/row["checkpoint_dir"]
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(checkpoint/"hira.pt") == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert sha(checkpoint/"scorer.pt") == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          print("w24_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w24-frozen-w9-checkpoints
          path: inputs/w9
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first eligible W24 exposure
        run: echo R8_W24_DP_DS_ATOMIC_SEVERITY_EXPOSURE_BEGIN
      - name: Build fresh DP-DQ-DR-DS atomic severity cache
        run: |
          python scripts/r8_w24_build_cache.py --out artifacts/w24-cache
          cat artifacts/w24-cache/receipt.json
      - name: Verify fresh cache receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w24-cache/receipt.json"))
          assert x["schema_version"] == "r8-w24-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["case_count"] == 384
          assert x["domains"] == ["DP","DQ","DR","DS"]
          assert x["domain_seeds"] == {"DP":431101,"DQ":431107,"DR":431119,"DS":431131}
          assert x["factor_ids"] == ["F0","F1","F2"]
          assert x["factor_decoder"] == {"000":0,"100":1,"110":2,"111":3}
          assert x["prior_exact_text_overlap"] == []
          assert x["query_prototype_exact_sentence_overlap"] == []
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["trainable_parameter_count"] == 0
          assert x["logical_state_compiles_per_case"] == 1
          assert x["a13_query_invocations_per_case"] == 1
          assert x["encoded_query_sequences_per_case"] == 2
          assert x["w23_rows_used"] is False
          assert x["w22_rows_used"] is False
          assert x["w21_rows_used"] is False
          assert x["w20_rows_used"] is False
          assert x["w19_rows_used"] is False
          assert x["w18_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print("w24_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w24-fresh-cache
          path: artifacts/w24-cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w24-frozen-w9-checkpoints
          path: inputs/w9
      - uses: actions/download-artifact@v4
        with:
          name: r8-w24-fresh-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece
      - name: Evaluate frozen atomic severity authority
        run: |
          python scripts/r8_w24_evaluate.py \
            --cache inputs/cache/w24.pt \
            --w9-freeze inputs/w9/freeze.json \
            --w9-checkpoints inputs/w9 \
            --out artifacts/w24-audit
      - name: Verify frozen W24 audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w24-audit/audit.json"))
          assert x["schema_version"] == "r8-w24-atomic-severity-audit-v1"
          assert x["status"] == "PASS"
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["trainable_parameter_count"] == 0
          assert x["reference_models_are_hira_candidates"] is False
          assert x["reference_protocol_frozen_before_exposure"] is True
          assert x["factor_scoring_direction"] == "premise=query; hypothesis=factor-option; entailment-probability"
          assert x["direct_control_scoring"] == "w23-bidirectional-prototype-entailment"
          assert x["w9_hira_sha256"] == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert x["w9_scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert x["actual_cross_encoder_weight_sha256"]["deberta_nli"] == "d8148c6d49e0a7925134294c56326c71fe0ab1dc390e37355e00c7efbb488afa"
          assert x["actual_cross_encoder_weight_sha256"]["roberta_nli"] == "efc90996d2ed80123c26c9091c91385ffddc6d2fd0b2bacf3187fbd6c5b87953"
          assert set(x["per_domain"]) == {"DP","DQ","DR","DS"}
          assert all(v["integrity"] for v in x["per_domain"].values())
          assert x["outcome"] in {
              "STABLE_ATOMIC_SEVERITY_LOCALIZATION",
              "REFERENCE_ENVIRONMENT_UNSTABLE",
              "ATOMIC_AUTHORITY_UNRESOLVED",
              "MIXED_ATOMIC_SEVERITY_LOCALIZATION",
              "ATOMIC_SEVERITY_UNRESOLVED",
          }
          assert x["w23_rows_used"] is False
          assert x["w22_rows_used"] is False
          assert x["w21_rows_used"] is False
          assert x["w20_rows_used"] is False
          assert x["w19_rows_used"] is False
          assert x["w18_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          summary={
              "outcome":x["outcome"],
              "stable_classification":x["stable_classification"],
              "classification_counts":x["classification_counts"],
              "reference_environment_stable_domain_count":x["reference_environment_stable_domain_count"],
              "atomic_reference_adequate_domain_count":x["atomic_reference_adequate_domain_count"],
              "hira_direct_severity":x["metrics"]["pooled"]["direct_severity"]["top1"],
              "hira_composed_severity":x["metrics"]["pooled"]["composed_severity_top1"],
              "hira_factorization_gain":x["metrics"]["pooled"]["factorization_gain"],
              "reference_composed_severity":x["atomic_reference"]["pooled"]["composed_severity_top1"],
          }
          print("W24_SUMMARY="+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w24-authoritative-audit
          path: artifacts/w24-audit
          if-no-files-found: error
          retention-days: 90
