name: hira-v1-s60-train-calibrated-bounded-hybrid-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s60-train-calibrated-bounded-hybrid
    paths:
      - "research/HIRA-V1-S60-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s60-a0-train-calibrated-bounded-hybrid
          path: inputs/S60A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37291693731

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S60 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S60 contracts
        run: |
          python -m py_compile src/nmd/v1_train_calibrated_bounded_hybrid.py src/nmd/v1_s60_authority.py scripts/hira_v1_s60_train_dev.py
          pytest -q tests/test_v1_train_calibrated_bounded_hybrid.py tests/test_v1_s60_a0_harness.py tests/test_v1_s60_authority.py tests/test_v1_s60_matched_harness.py tests/test_v1_s60_train_dev_workflow.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify canonical S60 A0 authority
        run: |
          (cd inputs/S60A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:0a8f44e150932c0df4393cb74af94a380f93680e7b3fde2e0ea642295356c182"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S60A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s60-a0-train-calibrated-bounded-hybrid-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S60_A0_TRAIN_CALIBRATED_BOUNDED_HYBRID_READY"
          assert r["scientific_authority"]=="S60_A0_TRAIN_CALIBRATED_BOUNDED_HYBRID_ONLY"
          assert r["seed"]==81001
          assert r["correction_trainable_parameter_count"]==114688
          assert r["pairwise_trainable_parameter_count"]==32832
          assert r["composer_trainable_parameter_count"]==1
          assert r["composer_trainable_tensor_names"]==["a"]
          assert abs(r["alpha_initial_observed"]-0.10)<=1e-7
          assert r["alpha_max"]==0.35
          assert r["identity_override_max_abs_error"]==0.0
          assert r["flat_pairwise_residual_max_abs_error"]==0.0
          assert r["adversarial_residual_bound_violation_max"]<=1e-7
          assert r["composer_gradient_l1"]>0.0
          assert r["composer_gradient_to_upstream_zero"] is True
          assert r["pairwise_only_final_path"] is False
          assert r["teacher_dependency"] is False
          assert r["pseudo_target_dependency"] is False
          assert r["self_anchor_dependency"] is False
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["one_encoder_state_once"] is True
          assert r["composer_checkpoint_replay_max_abs_error"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S60 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s60_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S60A0/result.json \
            --out artifacts/s60-train-dev

      - name: Verify S60 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s60-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s60-train-calibrated-bounded-hybrid-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S60_TRAIN_CALIBRATED_BOUNDED_HYBRID_DEV_COMPLETE",
              "HIRA_V1_S60_TRAIN_CALIBRATED_BOUNDED_HYBRID_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S60_FRESH_TRAIN_CALIBRATED_BOUNDED_HYBRID"
          assert r["seed"]==81001

          parent=r["parent_native_authority"]
          assert parent["run"]==37192490832
          assert parent["artifact_id"]==11299783210
          assert parent["native_trainable_parameters"]==0
          assert parent["native_optimizer_constructed"] is False
          assert parent["native_training_performed"] is False

          a0=r["a0_authority"]
          assert a0["run"]==37291693731
          assert a0["artifact_id"]==11337255933
          assert a0["artifact_digest"]=="sha256:0a8f44e150932c0df4393cb74af94a380f93680e7b3fde2e0ea642295356c182"

          rep=r["pairwise_representation_cache"]
          assert rep["precomputed_once_before_training"] is True
          assert rep["requires_grad"] is False

          cv=r["controlled_variable"]
          assert cv["reference_decision_shell"]=="existing_fused"
          assert cv["treatment_decision_shell"]=="train_calibrated_bounded_hybrid"
          assert cv["correction_trainable_parameters"]==114688
          assert cv["pairwise_trainable_parameters"]==32832
          assert cv["composer_trainable_parameters"]==1
          assert cv["alpha_initial"]==0.10
          assert cv["alpha_max"]==0.35
          assert cv["composer_weight_decay"]==0.0
          assert cv["teacher_dependency"] is False
          assert cv["pseudo_target_dependency"] is False
          assert cv["self_anchor_dependency"] is False
          assert cv["composer_gradient_enters_correction"] is False
          assert cv["composer_gradient_enters_pairwise"] is False
          assert cv["composer_gradient_enters_native"] is False
          assert cv["pairwise_only_final_path"] is False
          assert cv["shared_training_trajectory"] is True
          assert cv["same_frozen_selector"] is True

          assert len(r["training_trajectory"])==24
          for e,row in enumerate(r["training_trajectory"],start=1):
              assert row["epoch"]==e
              assert 0.0<row["composer_alpha"]<0.35
              assert len(row["correction_state_sha256"])==64
              assert len(row["pairwise_head_state_sha256"])==64
              assert len(row["composer_state_sha256"])==64
              assert row["train_pairwise"]["antisymmetry_max_abs_error"]==0.0

          for name in ("reference_branch","treatment_branch"):
              b=r[name]
              assert 1<=b["selected_dev_epoch"]<=24
              assert 0.0<b["selected_alpha"]<0.35
              assert len(b["correction_state_sha256"])==64
              assert len(b["pairwise_head_state_sha256"])==64
              assert len(b["composer_state_sha256"])==64
              assert b["selected_dev"]["state_view_encodes"]==0
              assert b["selected_dev"]["full_k"] is True
              assert b["selected_dev"]["fused_max_probability_mass_error"]<=1e-6

          t=r["treatment_branch"]["selected_dev"]
          assert t["pairwise_antisymmetry_max_abs_error"]==0.0
          assert t["pairwise_diagonal_max_abs_error"]==0.0
          assert 0.0<t["composer_alpha"]<0.35
          assert t["composer_residual_max_abs"]<=t["composer_bound_max"]+1e-7

          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["exact_s59_state_question_option_overlap"]==0

          for filename,branch_name in (
              ("reference-candidate.pt","reference"),
              ("treatment-candidate.pt","treatment"),
          ):
              p=torch.load(root/filename,map_location="cpu",weights_only=True)
              assert p["schema_version"]=="hira-v1-s60-private-candidate-v1"
              assert p["branch"]==branch_name
              assert p["seed"]==81001
              assert p["correction_parameter_count"]==114688
              assert p["pairwise_parameter_count"]==32832
              assert p["composer_parameter_count"]==1
              assert p["native_parameter_count_in_optimizer"]==0
              assert p["teacher_dependency"] is False

          assert r["post_dev_tuning_performed"] is False
          assert r["alpha_max_sweep_performed"] is False
          assert r["alpha_initialization_sweep_performed"] is False
          assert r["calibration_objective_variant_performed"] is False
          assert r["optimizer_variant_performed"] is False
          assert r["residual_nonlinearity_variant_performed"] is False
          assert r["normalization_variant_performed"] is False
          assert r["per_query_gate_added"] is False
          assert r["pairwise_correction_gradient_coupling_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S60 integrity
        run: |
          (cd artifacts/s60-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s60-train-calibrated-bounded-hybrid
          path: artifacts/s60-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
