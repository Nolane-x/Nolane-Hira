name: r8-w10-unit

on:
  push:
    branches:
      - feat/r8-w10-representation-ceiling
    paths:
      - "src/nmd/representation_ceiling*.py"
      - "scripts/r8_w10_*.py"
      - "tests/test_representation_ceiling.py"
      - ".github/workflows/r8-w10-unit.yml"
      - "research/R8-W10-HANDOFF.md"
  pull_request:
    branches:
      - main
    paths:
      - "src/nmd/representation_ceiling*.py"
      - "scripts/r8_w10_*.py"
      - "tests/test_representation_ceiling.py"
      - ".github/workflows/r8-w10-unit.yml"
      - "research/R8-W10-HANDOFF.md"

permissions:
  contents: read

concurrency:
  group: r8-w10-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W10 stack
        run: |
          python -m py_compile             src/nmd/representation_ceiling.py             src/nmd/representation_ceiling_authority.py             src/nmd/representation_ceiling_cache.py             src/nmd/representation_ceiling_eval.py             scripts/r8_w10_build_cache.py             scripts/r8_w10_evaluate.py
      - name: Run W10 pre-data contracts
        run: pytest -q tests/test_representation_ceiling.py
