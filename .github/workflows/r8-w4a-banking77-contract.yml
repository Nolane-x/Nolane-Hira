name: r8-w4a-banking77-contract

on:
  push:
    branches:
      - feat/r8-w4a-banking77-direct-evaluator
    paths:
      - "src/nmd/banking77_direct.py"
      - "scripts/r8_w4a_banking77_direct.py"
      - "tests/test_banking77_direct.py"
      - ".github/workflows/r8-w4a-banking77-contract.yml"
      - ".github/workflows/r8-w4a-banking77-one-shot.yml"
      - "benchmarks/laya_protocol_manifest.json"
      - "benchmarks/source_registry.json"
  pull_request:
    paths:
      - "src/nmd/banking77_direct.py"
      - "scripts/r8_w4a_banking77_direct.py"
      - "tests/test_banking77_direct.py"
      - ".github/workflows/r8-w4a-banking77-contract.yml"
      - ".github/workflows/r8-w4a-banking77-one-shot.yml"
      - "benchmarks/laya_protocol_manifest.json"
      - "benchmarks/source_registry.json"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W4a evaluator
        run: |
          python -m py_compile             src/nmd/banking77_direct.py             scripts/r8_w4a_banking77_direct.py

      - name: Run W4a synthetic contract tests
        run: |
          pytest -q             tests/test_banking77_direct.py             tests/test_scorecard.py             tests/test_source_registry.py             tests/test_benchmark_contracts.py
