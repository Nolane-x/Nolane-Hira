name: hira-v1-s2-closure-bundle

on:
  push:
    branches:
      - feat/hira-v1-s2-query-token-residual-fusion
    paths:
      - "research/HIRA-V1-S2-CLOSURE-BUNDLE"

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s2-a0-question-as-evidence
          path: inputs/A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36390086785

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s2-qtrf-train-dev
          path: inputs/TRAINDEV
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36391742553

      - name: Verify frozen S2 authorities
        run: |
          (
            cd inputs/A0
            sha256sum -c INTEGRITY.sha256
          )
          (
            cd inputs/TRAINDEV
            sha256sum -c INTEGRITY.sha256
          )
          python - <<'PY'
          import json
          from pathlib import Path

          a0 = json.loads(Path("inputs/A0/result.json").read_text(encoding="utf-8"))
          td = json.loads(Path("inputs/TRAINDEV/result.json").read_text(encoding="utf-8"))

          assert a0["status"] == "PASS"
          assert a0["outcome"] == "HIRA_V1_S2_A0_QUESTION_AS_EVIDENCE_READY"
          assert a0["added_parameter_count"] == 0
          assert a0["a0"]["accuracy"] == 0.25
          assert a0["a0"]["question_changes_logits_rate"] == 1.0
          assert a0["a0"]["question_changes_choice_rate"] == 0.0625
          assert a0["used_for_model_selection"] is False
          assert a0["production_ready_claimed"] is False

          assert td["status"] == "PASS"
          assert td["outcome"] == "HIRA_V1_S2_QTRF_DEV_FAIL"
          assert td["selected_dev_epoch"] == 2
          assert td["checkpoint_sha256"] == "dc2cff637771aea70ab7f7011d108cfc08a63048e8ef2502767099126eea4af2"
          assert td["selected_dev"]["accuracy"] == 0.2578125
          assert td["selected_dev"]["paired_both_correct_rate"] == 0.09375
          assert td["selected_dev"]["question_swap_choice_change_rate"] == 0.546875
          assert td["selected_dev"]["option_order_flip_rate"] == 0.0
          assert td["parameter_surface"]["fusion_trainable_parameters"] == 8192
          assert td["parameter_surface"]["w34_base_trainable"] == 0
          assert td["post_dev_tuning_performed"] is False
          assert td["sealed_confirm_opened"] is False
          assert td["multilingual_probe_opened"] is False
          assert td["production_ready_claimed"] is False
          PY

      - name: Build canonical S2 closure bundle
        run: |
          mkdir -p artifacts/s2-closure/evidence/A0
          mkdir -p artifacts/s2-closure/evidence/TRAINDEV
          cp -a inputs/A0/. artifacts/s2-closure/evidence/A0/
          cp -a inputs/TRAINDEV/. artifacts/s2-closure/evidence/TRAINDEV/
          cp research/HIRA-V1-S2-CONTRACT.md artifacts/s2-closure/
          cp research/HIRA-V1-S2-A0-RECEIPT.md artifacts/s2-closure/
          cp research/HIRA-V1-S2-CLOSURE.md artifacts/s2-closure/
          cp research/HIRA-V1-S2-HANDOFF.md artifacts/s2-closure/

          (
            cd artifacts/s2-closure
            find . -type f ! -name HIRA-V1-S2-INTEGRITY.sha256 ! -name NOLANE-HIRA-V1-S2-FULL.zip -print0 \
              | sort -z \
              | xargs -0 sha256sum > HIRA-V1-S2-INTEGRITY.sha256
            sha256sum -c HIRA-V1-S2-INTEGRITY.sha256
            zip -qr NOLANE-HIRA-V1-S2-FULL.zip \
              evidence \
              HIRA-V1-S2-CONTRACT.md \
              HIRA-V1-S2-A0-RECEIPT.md \
              HIRA-V1-S2-CLOSURE.md \
              HIRA-V1-S2-HANDOFF.md \
              HIRA-V1-S2-INTEGRITY.sha256
          )

      - name: Emit closure receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/s2-closure")
          archive = root / "NOLANE-HIRA-V1-S2-FULL.zip"
          receipt = {
              "schema_version": "hira-v1-s2-closure-bundle-v1",
              "status": "PASS",
              "outcome": "HIRA_V1_S2_CLOSED_DEV_FAIL",
              "archive": archive.name,
              "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "archive_bytes": archive.stat().st_size,
              "a0_run_id": 36390086785,
              "a0_artifact_id": 10955893093,
              "a0_artifact_digest": "sha256:e17ccf529e503450686895c983d77df945b21e90570a8945da8c48e95c57c471",
              "first_preexposure_train_dev_run_id": 36390503180,
              "qualified_train_dev_run_id": 36391742553,
              "qualified_train_dev_artifact_id": 10957020098,
              "qualified_train_dev_artifact_digest": "sha256:0e665e01074eada113ef481fe980fd78076692337344f6312d7022ef4d170472",
              "selected_dev_epoch": 2,
              "selected_dev_accuracy": 0.2578125,
              "paired_both_correct_rate": 0.09375,
              "question_swap_choice_change_rate": 0.546875,
              "sealed_confirm_opened": False,
              "multilingual_probe_opened": False,
              "production_ready_claimed": False,
          }
          (root / "closure-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("HIRA_V1_S2_CLOSURE_RECEIPT=" + json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s2-closure-full-bundle
          path: artifacts/s2-closure
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
