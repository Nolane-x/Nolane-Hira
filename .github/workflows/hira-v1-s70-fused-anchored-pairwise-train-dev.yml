name: hira-v1-s70-fused-anchored-pairwise-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s70-fused-anchored-pairwise-aggregation
    paths:
      - "research/HIRA-V1-S70-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s70-a0-fused-anchored-pairwise
          path: inputs/S70A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37422000871

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S70 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S70 contracts
        run: |
          python -m py_compile src/nmd/v1_fused_anchored_pairwise_aggregation.py src/nmd/v1_s70_authority.py scripts/hira_v1_s70_train_dev.py
          pytest -q tests/test_v1_fused_anchored_pairwise_aggregation.py tests/test_v1_s70_a0_harness.py tests/test_v1_s70_a0_workflow.py tests/test_v1_s70_authority.py tests/test_v1_s70_matched_harness.py tests/test_v1_s70_train_dev_workflow.py tests/test_v1_per_view_responsibility.py tests/test_v1_contextual_reliability_gate.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_query_gated_identity_interaction.py

      - name: Verify frozen S69 parent evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/HIRA-V1-S69-MATCHED-RECEIPT.json").read_text())
          assert r["schema_version"]=="hira-v1-s69-query-gated-interaction-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S69_QUERY_GATED_INTERACTION_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S69_FRESH_QUERY_GATED_INTERACTION"
          assert r["seed"]==90001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          PY

      - name: Verify canonical S70 A0 authority
        run: |
          (cd inputs/S70A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:6e021d9fe8807eb6ff097bfe16b9bb464a8ee87e949d064883ec43d6cfe5a9ff"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S70A0/result.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S70_A0_FUSED_ANCHORED_PAIRWISE_AGGREGATION_READY"
          assert r["scientific_authority"]=="S70_A0_FUSED_ANCHORED_PAIRWISE_AGGREGATION_ONLY"
          assert r["seed"]==91001
          assert r["aggregation_parameter_count"]==0
          assert r["softmax_temperature"]==1.0
          assert r["reference_gate_parameter_count"]==60
          assert r["treatment_gate_parameter_count"]==60
          assert r["added_treatment_parameter_count"]==0
          assert r["uniform_prior_collapse_max_abs_error"]<=2e-7
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S70 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s70_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S70A0/result.json \
            --out artifacts/s70-train-dev

      - name: Verify S70 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s70-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s70-fused-anchored-pairwise-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S70_FUSED_ANCHORED_PAIRWISE_DEV_COMPLETE",
              "HIRA_V1_S70_FUSED_ANCHORED_PAIRWISE_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S70_FRESH_FUSED_ANCHORED_PAIRWISE_AGGREGATION"
          assert r["seed"]==91001

          parent=r["parent_s69"]
          assert parent["merged_main"]=="1ada877bcd9381486395599519363e87ef3dd831"
          assert parent["scientific_run"]==37420104460
          assert parent["artifact_id"]==11392672918
          assert parent["artifact_digest"]=="sha256:c24c00e9b79d23b3e7e3fe4d17013270e0410d822b85c62230bb85e972a2f94d"
          assert parent["verdict"]=="CASE_B"

          a0=r["a0_authority"]
          assert a0["run"]==37422000871
          assert a0["artifact_id"]==11393387610
          assert a0["artifact_digest"]=="sha256:6e021d9fe8807eb6ff097bfe16b9bb464a8ee87e949d064883ec43d6cfe5a9ff"

          cv=r["controlled_variable"]
          assert cv["reference_aggregation_family"]=="uniform_row_mean"
          assert cv["treatment_aggregation_family"]=="fused_softmax_opponent_weighted"
          assert cv["aggregation_trainable_parameters_per_arm"]==0
          assert cv["softmax_temperature"]==1.0
          assert cv["representation_family_both_arms"]=="s69_query_gated_identity_interaction"
          assert cv["representation_parameters_both_arms"]==0
          assert cv["pairwise_family_both_arms"]=="s59_explicit_pairwise"
          assert cv["pairwise_trainable_parameters"]==32832
          assert cv["shared_pairwise_head"] is True
          assert cv["shared_pairwise_training_trajectory"] is True
          assert cv["shared_correction_trajectory"] is True
          assert cv["shared_selection_epoch"] is True
          assert 1<=cv["shared_selected_dev_epoch"]<=24
          assert cv["gate_family_both_arms"]=="s64_context_injected"
          assert cv["gate_trainable_parameters_per_arm"]==60
          assert cv["gate_objective_both_arms"]=="per_view_counterfactual_responsibility_bce"
          assert cv["gate_context_source_both_arms"]=="exact_s59_reference_representation"
          assert cv["same_train_rows_and_order"] is True
          assert cv["same_optimizer_lr_weight_decay"] is True
          assert cv["teacher_dependency"] is False
          assert cv["pseudo_target_dependency"] is False
          assert cv["reliability_target_reopened"] is False

          assert len(r["training_trajectory"])==24
          for e,row in enumerate(r["training_trajectory"],start=1):
              assert row["epoch"]==e
              assert row["shared_train_pairwise"]["antisymmetry_max_abs_error"]==0.0
              assert len(row["correction_state_sha256"])==64
              assert len(row["shared_pairwise_head_state_sha256"])==64
              assert len(row["reference_gate_state_sha256"])==64
              assert len(row["treatment_gate_state_sha256"])==64

          ref=r["reference_branch"]
          trt=r["treatment_branch"]
          assert ref["selected_dev_epoch"]==trt["selected_dev_epoch"]==cv["shared_selected_dev_epoch"]
          assert ref["correction_state_sha256"]==trt["correction_state_sha256"]
          assert ref["pairwise_head_state_sha256"]==trt["pairwise_head_state_sha256"]
          assert ref["selected_dev"]["pairwise_gold_pair_accuracy"]==trt["selected_dev"]["pairwise_gold_pair_accuracy"]
          assert ref["selected_dev"]["pairwise_mean_gold_pair_margin"]==trt["selected_dev"]["pairwise_mean_gold_pair_margin"]

          for name,aggregation in (
              ("reference_branch","uniform_row_mean"),
              ("treatment_branch","fused_softmax_opponent_weighted"),
          ):
              b=r[name]
              m=b["selected_dev"]
              a=b["selected_aggregate_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["pairwise_antisymmetry_max_abs_error"]==0.0
              assert m["pairwise_diagonal_max_abs_error"]==0.0
              assert m["fused_max_probability_mass_error"]<=1e-6
              assert a["antisymmetry_max_abs_error"]==0.0
              assert a["diagonal_max_abs_error"]==0.0
              assert a["max_probability_mass_error"]<=1e-6

              p=torch.load(root/b["checkpoint_file"],map_location="cpu",weights_only=True)
              assert p["schema_version"]=="hira-v1-s70-private-candidate-v1"
              assert p["seed"]==91001
              assert p["shared_selected_dev_epoch"]==cv["shared_selected_dev_epoch"]
              assert p["representation_family"]=="s69_query_gated_identity_interaction"
              assert p["representation_parameter_count"]==0
              assert p["pairwise_parameter_count"]==32832
              assert p["pairwise_family"]=="s59_explicit_pairwise"
              assert p["shared_pairwise_head"] is True
              assert p["aggregation_family"]==aggregation
              assert p["aggregation_parameter_count"]==0
              assert p["softmax_temperature"]==1.0
              assert p["gate_parameter_count"]==60
              assert p["gate_family"]=="s64_context_injected"
              assert p["gate_objective"]=="per_view_counterfactual_responsibility_bce"
              assert p["gate_context_source"]=="exact_s59_reference_representation"
              assert p["native_parameter_count_in_optimizer"]==0
              assert p["teacher_dependency"] is False

          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["exact_s69_state_question_option_overlap"]==0
          assert r["partitions"]["k"]==4

          assert r["post_dev_tuning_performed"] is False
          assert r["softmax_temperature_changed"] is False
          assert r["topk_opponent_selection_performed"] is False
          assert r["weighting_function_changed"] is False
          assert r["learned_aggregation_parameters_added"] is False
          assert r["representation_or_pairwise_head_changed"] is False
          assert r["reliability_target_reopened"] is False
          assert r["optimizer_lr_weight_decay_changed"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S70 integrity
        run: |
          (cd artifacts/s70-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s70-fused-anchored-pairwise
          path: artifacts/s70-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
