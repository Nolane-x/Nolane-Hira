name: hira-v1-s68-a0-context-modulated-pairwise

on:
  push:
    branches:
      - feat/hira-v1-s68-context-modulated-pairwise
    paths:
      - "research/HIRA-V1-S68-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S68 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S68 contracts
        run: |
          python -m py_compile src/nmd/v1_context_modulated_pairwise_head.py scripts/hira_v1_s68_a0_context_modulated_pairwise.py
          pytest -q tests/test_v1_context_modulated_pairwise_head.py tests/test_v1_s68_a0_harness.py tests/test_v1_s68_a0_workflow.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one S68 mechanical A0 court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s68_a0_context_modulated_pairwise.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --out artifacts/s68-a0

      - name: Verify S68 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/s68-a0")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s68-a0-context-modulated-pairwise-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S68_A0_CONTEXT_MODULATED_PAIRWISE_READY"
          assert r["scientific_authority"]=="S68_A0_CONTEXT_MODULATED_PAIRWISE_ONLY"
          assert r["seed"]==89001

          parent=r["parent_s67"]
          assert parent["merged_main"]=="942871bb44bbef3e28e74698f161b02c6796cdcb"
          assert parent["scientific_run"]==37336779415
          assert parent["verdict"]=="CASE_B"
          assert parent["actions_artifact_available"] is False
          assert parent["raw_receipt_frozen_in_repo"] is True

          assert r["correction_trainable_parameter_count"]==114688
          assert r["reference_pairwise_parameter_count"]==33344
          assert r["treatment_pairwise_parameter_count"]==33344
          assert r["added_treatment_parameter_count"]==0
          assert r["pairwise_trainable_tensor_names"]==["A","G","u"]
          assert r["base_s59_parameter_count"]==32832
          assert r["modulation_parameter_count"]==512
          assert r["context_dimension"]==8
          assert r["context_projection_seed"]==68068
          assert r["context_projection_trainable"] is False
          assert r["modulation_scale"]==0.5
          assert r["arm_parameter_initialization_bit_identical"] is True
          assert r["base_A_u_exact_s59_initialization"] is True
          assert r["G_initial_exact_zero"] is True
          assert r["initial_real_cache_s59_identity_max_abs_error"]==0.0
          assert r["initial_pair_vs_s59_max_abs_error"]==0.0
          assert r["initial_aggregate_vs_s59_max_abs_error"]==0.0
          assert r["initial_choice_vs_s59_exact"] is True
          assert r["initial_gamma_max_abs_error_from_one"]==0.0

          assert r["reference_treatment_context_max_abs_difference"]>1e-7
          assert r["joint_context_ablation_max_abs_error"]==0.0
          assert r["context_permutation_max_abs_error"]<=1e-7
          assert r["option_permutation_pair_max_abs_error"]<=2e-6
          assert r["antisymmetry_max_abs_error"]==0.0
          assert r["diagonal_max_abs_error"]==0.0
          assert r["max_probability_mass_error"]<=1e-6
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True

          assert r["reference_gradient_A_l1"]>0.0
          assert r["reference_gradient_u_l1"]>0.0
          assert r["reference_gradient_G_l1"]>0.0
          assert r["treatment_gradient_A_l1"]>0.0
          assert r["treatment_gradient_u_l1"]>0.0
          assert r["treatment_gradient_G_l1"]>0.0
          assert r["reference_treatment_G_gradient_l1_difference"]>1e-7
          assert r["representation_received_pairwise_gradient"] is False

          assert r["reference_real_cache_gradient_A_l1"]>0.0
          assert r["reference_real_cache_gradient_u_l1"]>0.0
          assert r["reference_real_cache_gradient_G_l1"]>0.0
          assert r["treatment_real_cache_gradient_A_l1"]>0.0
          assert r["treatment_real_cache_gradient_u_l1"]>0.0
          assert r["treatment_real_cache_gradient_G_l1"]>0.0
          assert r["correction_received_pairwise_gradient"] is False
          assert r["correction_state_unchanged_after_pairwise_backward"] is True
          assert r["native_trainable_parameter_count"]==0
          assert r["teacher_dependency"] is False
          assert r["pseudo_target_dependency"] is False
          assert r["one_encoder_state_once"] is True
          assert r["matched_head_checkpoint_replay_max_abs_error"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["fresh_train_dev_exposed"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S68 A0 integrity
        run: |
          (cd artifacts/s68-a0 && sha256sum result.json matched-pairwise-heads.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s68-a0-context-modulated-pairwise
          path: artifacts/s68-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
