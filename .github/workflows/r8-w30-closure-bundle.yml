name: r8-w30-closure-bundle

on:
  push:
    branches:
      - feat/r8-w30-semantic-transfer-bridge
    paths:
      - "research/R8-W30-CLOSURE-BUNDLE"

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-frozen-t0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36280493847

      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-bridge-training
          path: inputs/bridge
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36280493847

      - uses: actions/download-artifact@v4
        with:
          name: r8-w30-authoritative-audit
          path: inputs/confirm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36280493847

      - name: Build post-closure W30 bundle
        run: |
          python scripts/r8_w30_bundle.py \
            --repo-root . \
            --t0-dir inputs/T0 \
            --train-dir inputs/bridge \
            --confirm-dir inputs/confirm \
            --out artifacts/w30-bundle

      - name: Verify bundle from manifest root
        run: |
          test -f artifacts/w30-bundle/NOLANE-HIRA-R8-W30-FULL.zip
          test -f artifacts/w30-bundle/R8-W30-HANDOFF.md
          test -f artifacts/w30-bundle/R8-W30-CLOSURE.md
          test -f artifacts/w30-bundle/R8-W30-INTEGRITY.sha256
          cd artifacts/w30-bundle
          sha256sum -c R8-W30-INTEGRITY.sha256 --ignore-missing

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w30-closure-full-bundle
          path: artifacts/w30-bundle
          if-no-files-found: error
          retention-days: 90
