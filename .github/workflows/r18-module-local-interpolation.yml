name: r18-module-local-interpolation

on:
  push:
    branches:
      - feat/r18-module-local-interpolation
    paths:
      - "src/nmd/block_interpolation.py"
      - "scripts/r18_module_local_interpolation.py"
      - "tests/test_block_interpolation.py"
      - "research/R18-HANDOFF.md"
      - ".github/workflows/r18-module-local-interpolation.yml"

concurrency:
  group: r18-module-local-interpolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download exact R15 selected head
        uses: actions/download-artifact@v4
        with:
          name: r15-retention-evidence
          path: upstream/r15
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35688830869

      - name: Download exact R16 failure-analysis head
        uses: actions/download-artifact@v4
        with:
          name: r16-structural-evidence
          path: upstream/r16
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35690994565

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]"
          python -m py_compile scripts/r18_module_local_interpolation.py
          pytest -q tests/test_block_interpolation.py tests/test_interpolation.py

      - name: Verify frozen endpoint heads
        run: |
          test "$(sha256sum upstream/r15/hira-head.pt | cut -d' ' -f1)" = "007e24fff0e0e48a096de59276f7ab8d0e25bdb826a3f81a7838c5bd6151723f"
          test "$(sha256sum upstream/r16/hira-head.pt | cut -d' ' -f1)" = "dbe0ddd8bf3811c98f5062bbf482f5d5b4f1f5991fa6f734f7ca88c24e88cc75"

      - name: Run frozen R18 block-local tournament
        run: |
          python scripts/r18_module_local_interpolation.py \
            --r15-head upstream/r15/hira-head.pt \
            --r16-head upstream/r16/hira-head.pt \
            --out artifacts/r18-block-local \
            --alphas 0.025,0.05,0.10,0.20,0.30,0.50,1.00 \
            --structural-per-label 250 \
            --matched-val-n 1500 \
            --encode-batch-size 32 \
            --eval-batch-size 128 \
            --segments 8 \
            --seed 13
          cat artifacts/r18-block-local/receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: r18-block-local-evidence
          path: |
            artifacts/r18-block-local/receipt.json
            artifacts/r18-block-local/hira-head.pt
          if-no-files-found: error

      - name: Package exact R18 repository snapshot
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/NOLANE-HIRA-R18-FULL.zip HEAD
          cp research/R18-HANDOFF.md dist/R18-HANDOFF.md
          sha256sum dist/NOLANE-HIRA-R18-FULL.zip > dist/NOLANE-HIRA-R18-FULL.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: r18-full-bundle
          path: dist
          if-no-files-found: error
