name: hira-v1-s9-margin-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s9-margin-separation
    paths:
      - "research/HIRA-V1-S9-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s9-a0-identity
          path: inputs/S9A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36421792484

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S9 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]"             "transformers>=4.45,<6"             "safetensors>=0.4"             "huggingface_hub>=0.24"

      - name: Compile and run S9 contracts
        run: |
          python -m py_compile             src/nmd/v1_margin.py             src/nmd/v1_s9_semantic_core.py             src/nmd/v1_s9_checkpoint.py             src/nmd/v1_s9_authority.py             scripts/hira_v1_s9_train_dev.py
          pytest -q             tests/test_v1_margin.py             tests/test_v1_s9_authority.py             tests/test_v1_s9_checkpoint.py             tests/test_v1_invariance.py             tests/test_v1_a13_lora.py             tests/test_v1_triadic_semantic.py

      - name: Verify S9-A0 authority
        run: |
          (
            cd inputs/S9A0
            sha256sum -c INTEGRITY.sha256
          )
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("inputs/S9A0/result.json").read_text())
          assert r["outcome"] == "HIRA_V1_S9_A0_IDENTITY_READY"
          assert r["a13_token_output_identity"] is True
          assert r["a13_pooled_output_identity"] is True
          assert r["exact_logit_identity_rate"] == 1.0
          assert r["exact_choice_identity_rate"] == 1.0
          assert r["candidate_parameter_count"] == 49152
          assert r["runtime_trainable_parameter_count"] == 0
          assert r["canonical_margin_satisfaction_rate"] == 0.0
          assert r["used_for_model_selection"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (
            cd inputs/M4/hira-v0-m4-runtime
            sha256sum -c INTEGRITY.sha256
          )
          python - <<'PY'
          from nmd.local_runtime import read_runtime_bundle_manifest
          m = read_runtime_bundle_manifest("inputs/M4/hira-v0-m4-runtime")
          assert m["semantic_revision"] == "4226d9e4d2c08703e5cb0491b479bfc6a1607181"
          assert m["semantic_weight_sha256"] == "5b0593e0bb4620631320d2b4d5604cc39ca53348a9a240392c6c0b830dd8d880"
          assert m["t0_checkpoint_sha256"] == "1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          PY

      - name: Run fresh English S9 margin TRAIN DEV authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s9_train_dev.py             --bundle inputs/M4/hira-v0-m4-runtime             --a0-result inputs/S9A0/result.json             --out artifacts/s9-train-dev

      - name: Verify S9 TRAIN DEV receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/s9-train-dev")
          r = json.loads((root / "result.json").read_text())
          assert r["schema_version"] == "hira-v1-s9-margin-train-dev-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] in {
              "HIRA_V1_S9_MARGIN_DEV_READY",
              "HIRA_V1_S9_MARGIN_DEV_FAIL",
          }
          assert r["scientific_authority"] == "V1_S9_FRESH_ENGLISH_MARGIN_SEPARATION"
          assert r["seed"] == 14901
          assert r["optimizer"]["epochs"] == 24
          assert r["optimizer"]["batch_size_semantic_cases"] == 16
          assert r["partitions"]["train_semantic_cases"] == 768
          assert r["partitions"]["dev_semantic_cases"] == 192
          assert len(r["partitions"]["domains"]) == 12
          assert r["partitions"]["k"] == 4
          assert r["partitions"]["views_per_option"] == 2
          assert r["parameter_surface"]["total_trainable_parameters"] == 49152
          assert r["parameter_surface"]["lora_trainable_parameters"] == 16384
          assert r["parameter_surface"]["projection_trainable_parameters"] == 32768
          assert r["parameter_surface"]["original_a13_trainable"] == 0
          assert r["parameter_surface"]["hira_core_trainable"] == 0
          assert r["parameter_surface"]["learned_downstream_scorer_parameters"] == 0
          assert r["loss"]["all_negative_margin_coefficient"] == 0.25
          assert r["loss"]["all_negative_margin"] == 0.20
          assert r["state_once"]["train_state_view_encodes_per_epoch"] == 1536
          assert r["state_once"]["dev_state_view_encodes_per_eval"] == 384
          assert r["post_dev_tuning_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          assert (root / "margin-candidate.pt").is_file()
          PY

      - name: Freeze S9 TRAIN DEV integrity
        run: |
          (
            cd artifacts/s9-train-dev
            sha256sum               result.json               train-manifest.json               dev-manifest.json               margin-candidate.pt               > INTEGRITY.sha256
            sha256sum -c INTEGRITY.sha256
          )

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s9-margin-train-dev
          path: artifacts/s9-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
