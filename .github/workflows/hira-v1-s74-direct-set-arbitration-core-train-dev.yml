name: hira-v1-s74-direct-set-arbitration-core-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s74-direct-set-arbitration-core
    paths:
      - "research/HIRA-V1-S74-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s74-a0-direct-set-arbitration-core
          path: inputs/S74A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37484291103

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S74 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S74 contracts
        run: |
          python -m py_compile src/nmd/v1_direct_set_arbitration_core.py src/nmd/v1_s74_authority.py scripts/hira_v1_s74_train_dev.py
          pytest -q tests/test_v1_direct_set_arbitration_core.py tests/test_v1_s74_a0_harness.py tests/test_v1_s74_a0_workflow.py tests/test_v1_s74_authority.py tests/test_v1_s74_matched_harness.py tests/test_v1_s74_train_dev_workflow.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_query_gated_identity_interaction.py

      - name: Verify frozen S73 parent evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/HIRA-V1-S73-MATCHED-RECEIPT.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S73_COUNTERFACTUAL_SAFETY_VETO_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S73_FRESH_COUNTERFACTUAL_SAFETY_VETO"
          assert r["seed"]==94001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          PY

      - name: Verify canonical S74 A0 authority
        run: |
          (cd inputs/S74A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact id: 11422648744"
          echo "Pinned GitHub artifact digest: sha256:68620a7c563e5a22325b4415b53020720e37ba05e8f2eb675fef5d83d4089093"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S74A0/result.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S74_A0_DIRECT_SET_ARBITRATION_CORE_READY"
          assert r["scientific_authority"]=="S74_A0_DIRECT_SET_ARBITRATION_CORE_ONLY"
          assert r["seed"]==95001
          assert r["reference_parameter_count"]==257
          assert r["treatment_parameter_count"]==257
          assert r["added_treatment_parameter_count"]==0
          assert r["parameter_initialization_bit_identical"] is True
          assert r["reference_relational_channels_max_abs"]==0.0
          assert r["treatment_relational_channels_max_abs"]>1e-5
          assert r["permutation_max_abs_error"]<=2e-6
          assert r["direct_zero_parameter_logits_max_abs"]==0.0
          assert r["direct_zero_vs_fused_max_abs_difference"]>1e-3
          assert r["all_core_gradients_live"] is True
          assert r["gradient_to_upstream_zero"] is True
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S74 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s74_train_dev.py             --bundle inputs/M4/hira-v0-m4-runtime             --authority-checkpoint inputs/S51AUTH/native-authority.pt             --authority-receipt inputs/S51AUTH/authority-receipt.json             --a0-result inputs/S74A0/result.json             --out artifacts/s74-train-dev

      - name: Verify S74 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s74-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s74-direct-set-arbitration-core-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S74_DIRECT_SET_ARBITRATION_CORE_DEV_COMPLETE",
              "HIRA_V1_S74_DIRECT_SET_ARBITRATION_CORE_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S74_FRESH_DIRECT_SET_ARBITRATION_CORE"
          assert r["seed"]==95001

          parent=r["parent_s73"]
          assert parent["merged_main"]=="45ff1bc301972fc8aa04c1456200283f65616937"
          assert parent["scientific_run"]==37480212536
          assert parent["artifact_id"]==11420533826
          assert parent["artifact_digest"]=="sha256:0f08d05bea219333495529c6ae2c54d65fd9a276dd5f783adff0b0ac3925982f"
          assert parent["verdict"]=="CASE_C"

          a0=r["a0_authority"]
          assert a0["run"]==37484291103
          assert a0["artifact_id"]==11422648744
          assert a0["artifact_digest"]=="sha256:68620a7c563e5a22325b4415b53020720e37ba05e8f2eb675fef5d83d4089093"

          cv=r["controlled_variable"]
          assert cv["reference_input"]=="fused_native_plus_zero_relational"
          assert cv["treatment_input"]=="fused_native_plus_live_s69_relational"
          assert cv["dsac_trainable_parameters_per_arm"]==257
          assert cv["parameter_initialization_bit_identical"] is True
          assert cv["input_dim"]==12
          assert cv["hidden_dim"]==16
          assert cv["final_logit_semantics"]=="direct_dsac_scores"
          assert cv["objective_both_arms"]=="0.5_ce_c_plus_0.5_ce_p_plus_0.10_js"

          assert len(r["training_trajectory"])==24
          ref=r["reference_branch"]
          trt=r["treatment_branch"]
          assert ref["selected_dev_epoch"]==trt["selected_dev_epoch"]==cv["shared_selected_dev_epoch"]
          assert ref["correction_state_sha256"]==trt["correction_state_sha256"]
          assert ref["pairwise_head_state_sha256"]==trt["pairwise_head_state_sha256"]
          assert ref["selected_dev"]["pairwise_gold_pair_accuracy"]==trt["selected_dev"]["pairwise_gold_pair_accuracy"]
          assert ref["selected_dev"]["pairwise_mean_gold_pair_margin"]==trt["selected_dev"]["pairwise_mean_gold_pair_margin"]
          assert ref["selected_dev"]["dsac_relational_feature_max_abs"]==0.0
          assert trt["selected_dev"]["dsac_relational_feature_max_abs"]>1e-5

          for name,use_relational in (("reference_branch",False),("treatment_branch",True)):
              b=r[name]
              m=b["selected_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["pairwise_antisymmetry_max_abs_error"]==0.0
              assert m["fused_max_probability_mass_error"]<=1e-6
              ckpt=torch.load(root/b["checkpoint_file"],map_location="cpu",weights_only=False)
              assert ckpt["branch"]==name.removesuffix("_branch")
              assert ckpt["decision_core_parameter_count"]==257
              assert ckpt["use_relational_channels"] is use_relational
              assert ckpt["final_logit_semantics"]=="direct_dsac_scores"

          assert r["post_dev_tuning_performed"] is False
          assert r["hidden_width_sweep_performed"] is False
          assert r["channel_sweep_performed"] is False
          assert r["loss_weight_sweep_performed"] is False
          assert r["activation_sweep_performed"] is False
          assert r["fused_residual_fallback_added"] is False
          assert r["target_changed"] is False
          assert r["optimizer_lr_weight_decay_changed"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S74 integrity
        run: |
          (cd artifacts/s74-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s74-direct-set-arbitration-core
          path: artifacts/s74-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
