name: r8-w5c-semantic-alignment-probes

on:
  push:
    branches:
      - feat/r8-w5c-semantic-alignment-probes
    paths:
      - "src/nmd/semantic_alignment_probes.py"
      - "scripts/r8_w5c_build_cache.py"
      - "scripts/r8_w5c_train_probe.py"
      - "scripts/r8_w5c_confirm.py"
      - "tests/test_semantic_alignment_probes.py"
      - "research/R8-W5C-HANDOFF.md"
      - ".github/workflows/r8-w5c-semantic-alignment-probes.yml"
  pull_request:
    paths:
      - "src/nmd/semantic_alignment_probes.py"
      - "scripts/r8_w5c_build_cache.py"
      - "scripts/r8_w5c_train_probe.py"
      - "scripts/r8_w5c_confirm.py"
      - "tests/test_semantic_alignment_probes.py"
      - "research/R8-W5C-HANDOFF.md"
      - ".github/workflows/r8-w5c-semantic-alignment-probes.yml"

concurrency:
  group: r8-w5c-semantic-alignment-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W5c modules
        run: |
          python -m py_compile             src/nmd/semantic_alignment_probes.py             scripts/r8_w5c_build_cache.py             scripts/r8_w5c_train_probe.py             scripts/r8_w5c_confirm.py

      - name: Run W5c unit tests
        run: |
          pytest -q             tests/test_semantic_alignment_probes.py             tests/test_semantic_token_curriculum.py             tests/test_semantic_routing_curriculum.py

  cache:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen A13 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Build fresh TRAIN/DEV cache and raw probes
        run: |
          python scripts/r8_w5c_build_cache.py             --out artifacts/r8-w5c-cache
          cat artifacts/r8-w5c-cache/receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5c-frozen-inputs
          path: artifacts/r8-w5c-cache
          if-no-files-found: error
          retention-days: 14

  learned:
    if: github.event_name == 'push'
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        probe:
          - bilinear
          - pair_mlp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5c-frozen-inputs
          path: inputs/cache

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install learned-probe stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Train frozen learned probe
        run: |
          python scripts/r8_w5c_train_probe.py             --train-cache inputs/cache/train-cache.pt             --dev-cache inputs/cache/dev-cache.pt             --probe "${{ matrix.probe }}"             --out "artifacts/r8-w5c-probes/${{ matrix.probe }}"
          cat "artifacts/r8-w5c-probes/${{ matrix.probe }}/receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5c-probe-${{ matrix.probe }}
          path: artifacts/r8-w5c-probes/${{ matrix.probe }}
          if-no-files-found: error
          retention-days: 14

  confirm:
    if: github.event_name == 'push'
    needs: learned
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5c-frozen-inputs
          path: inputs/cache

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5c-probe-bilinear
          path: inputs/bilinear

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5c-probe-pair_mlp
          path: inputs/pair_mlp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Execute untouched representation CONFIRM
        run: |
          python scripts/r8_w5c_confirm.py             --bilinear inputs/bilinear/probe.pt             --bilinear-receipt inputs/bilinear/receipt.json             --pair-mlp inputs/pair_mlp/probe.pt             --pair-receipt inputs/pair_mlp/receipt.json             --cache-receipt inputs/cache/receipt.json             --out artifacts/r8-w5c-confirm
          cat artifacts/r8-w5c-confirm/confirm.json

      - name: Verify confirm scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/r8-w5c-confirm/confirm.json").read_text())
          assert x["status"]=="PASS"
          assert x["confirm_generated_after_probe_freeze"] is True
          assert x["confirm_case_count"]==256
          assert x["confirm_state_encode_calls"]==256
          assert x["forbidden_benchmark_data_used"] is False
          assert x["campaign_cells_populated"]==0
          assert x["verdict"] in {
              "DIRECT_POOLED_SIGNAL",
              "DIRECT_TOKEN_SIGNAL",
              "LINEAR_RECOVERABLE_SIGNAL",
              "NONLINEAR_RECOVERABLE_SIGNAL",
              "A13_PROBE_FAIL",
          }
          print(json.dumps({
              "verdict":x["verdict"],
              "pooled":x["metrics"]["pooled_cosine"]["accuracy"],
              "token":x["metrics"]["token_max"]["accuracy"],
              "bilinear":x["metrics"]["bilinear"]["accuracy"],
              "pair_mlp":x["metrics"]["pair_mlp"]["accuracy"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5c-semantic-confirm
          path: artifacts/r8-w5c-confirm
          if-no-files-found: error
          retention-days: 30
