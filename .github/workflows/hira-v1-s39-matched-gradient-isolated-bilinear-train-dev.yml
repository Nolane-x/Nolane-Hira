name: hira-v1-s39-matched-gradient-isolated-bilinear-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s39-full-bilinear-readout
    paths:
      - "research/HIRA-V1-S39-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s39-a0-gradient-isolated-bilinear
          path: inputs/S39A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37089648986

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S39 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S39 contracts
        run: |
          python -m py_compile src/nmd/v1_gradient_isolated_bilinear_readout.py src/nmd/v1_s39_authority.py scripts/hira_v1_s39_a0_gradient_isolated_bilinear.py scripts/hira_v1_s39_train_dev.py
          pytest -q tests/test_v1_gradient_isolated_bilinear_readout.py tests/test_v1_s39_authority.py tests/test_v1_native_relation_geometry.py tests/test_v1_relation_canonicalization.py tests/test_v1_a13_lora.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_invariance.py tests/test_v1_triadic_semantic.py

      - name: Verify canonical S39-A0 authority
        run: |
          (cd inputs/S39A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S39A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s39-a0-gradient-isolated-bilinear-readout-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S39_A0_GRADIENT_ISOLATED_BILINEAR_READY"
          assert r["scientific_authority"]=="S39_A0_GRADIENT_ISOLATED_FULL_BILINEAR_ONLY"
          assert r["operator_added_parameter_count"]==65536
          assert r["control_trainable_parameter_count"]==49152
          assert r["treatment_trainable_parameter_count"]==114688
          assert r["query_norm_epsilon"]==1e-12
          assert r["query_intervention_residual_max_abs"]>1e-6
          assert r["signature_intervention_residual_max_abs"]>1e-6
          assert r["correction_to_w_gradient_l1"]>0.0
          assert r["correction_to_w_offdiagonal_gradient_l1"]>0.0
          assert r["correction_to_lora_gradient_l1"]==0.0
          assert r["correction_to_projection_gradient_l1"]==0.0
          assert r["correction_to_hira_gradient_l1"]==0.0
          assert r["primary_to_w_gradient_l1"]==0.0
          assert r["native_relation_to_w_gradient_l1"]==0.0
          assert r["matched_runtime_gradient_max_abs"]==0.0
          assert r["matched_runtime_update_max_abs"]==0.0
          assert r["matched_w_update_max_abs"]>0.0
          assert r["zero_init_relation_logit_max_abs"]==0.0
          assert r["zero_init_signature_max_abs"]==0.0
          assert r["zero_init_primary_logit_max_abs"]==0.0
          assert r["zero_init_fused_logit_max_abs"]==0.0
          assert r["zero_init_selected_choice_identity_rate"]==1.0
          assert r["native_relation_to_lora_gradient_l1"]>0.0
          assert r["primary_to_projection_gradient_l1"]>0.0
          assert r["native_projection_perturbation_logit_max_abs"]==0.0
          assert r["native_projection_perturbation_signature_max_abs"]==0.0
          assert r["primary_projection_perturbation_logit_max_abs"]>0.0
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["full_k"] is True
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh matched S39 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s39_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S39A0/result.json --out artifacts/s39-train-dev

      - name: Verify S39 matched receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s39-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s39-matched-gradient-isolated-bilinear-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S39_MATCHED_GRADIENT_ISOLATED_DEV_COMPLETE",
              "HIRA_V1_S39_MATCHED_GRADIENT_ISOLATED_CONTROL_DEV_READY",
              "HIRA_V1_S39_MATCHED_GRADIENT_ISOLATED_TREATMENT_DEV_READY",
              "HIRA_V1_S39_MATCHED_GRADIENT_ISOLATED_BOTH_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S39_FRESH_MATCHED_NATIVE_CONTROL_VS_GRADIENT_ISOLATED_BILINEAR"
          assert r["seed"]==59001
          assert r["optimizer"]["epochs"]==24
          assert r["optimizer"]["batch_size_semantic_cases"]==16
          assert r["optimizer"]["lr"]==2e-4
          assert r["optimizer"]["weight_decay"]==0.01
          assert r["optimizer"]["grad_clip"]==1.0
          assert r["optimizer"]["readout_separate_lr"] is False

          loss=r["loss"]
          assert loss["control_relation_operator"]=="S35_NativeA13RelationCanonicalizer"
          assert loss["treatment_relation_operator"]=="S39_NativeGradientIsolatedBilinearCorrectnessReadout"
          assert loss["native_relation_dimension"]==256
          assert loss["treatment_uses_shared_projection"] is False
          assert loss["treatment_added_parameters"]==65536
          assert loss["treatment_query_summary"]=="masked_mean_l2"
          assert loss["treatment_bilinear_shape"]==[256,256]
          assert loss["treatment_factorized"] is False
          assert loss["treatment_query_norm_epsilon"]==1e-12
          assert loss["treatment_residual_scale"]==1.0
          assert loss["treatment_bias"] is False
          assert loss["treatment_nonlinearity"] is False
          assert loss["runtime_training_uses_native_relation_only"] is True
          assert loss["correction_features_detached"] is True
          assert loss["correction_coefficient"]==0.10
          assert loss["runtime_grad_clip"]==1.0
          assert loss["w_grad_clip"]==1.0

          p=r["partitions"]
          assert p["train_semantic_cases"]==768
          assert p["dev_semantic_cases"]==192
          assert len(p["domains"])==12
          assert p["k"]==4
          assert p["views_per_option"]==2
          assert p["identical_rows_across_arms"] is True
          assert p["identical_batch_order_across_arms"] is True
          assert p["prior_track_exact_rows_used"] is False
          assert p["s39_a0_rows_used"] is False

          t=r["trajectory_invariant"]
          assert t["all_epoch_runtime_state_sha256_equal"] is True
          assert t["epoch_count"]==24
          assert t["lora_state_max_abs_control_treatment"]==0.0
          assert t["projection_state_max_abs_control_treatment"]==0.0
          assert t["native_pre_w_logit_max_abs_control_treatment"]==0.0
          assert t["native_signature_max_abs_control_treatment"]==0.0
          assert r["control_arm"]["runtime_trajectory_sha256"]==r["treatment_arm"]["runtime_trajectory_sha256"]

          expected={"control":(49152,0,"control-native-candidate.pt"),"treatment":(114688,65536,"treatment-readout-candidate.pt")}
          for arm,(total,readout_count,filename) in expected.items():
              a=r[f"{arm}_arm"]
              assert 1<=a["selected_dev_epoch"]<=24
              assert len(a["history"])==24
              assert a["parameter_surface"]["total_trainable_parameters"]==total
              assert a["parameter_surface"]["lora_trainable_parameters"]==16384
              assert a["parameter_surface"]["projection_trainable_parameters"]==32768
              assert a["parameter_surface"]["readout_trainable_parameters"]==readout_count
              assert a["parameter_surface"]["original_a13_trainable"]==0
              assert a["parameter_surface"]["hira_core_trainable"]==0
              assert a["selected_dev"]["full_k"] is True
              assert a["selected_dev"]["fused_option_order_flip_rate"]==0.0
              assert a["selected_dev"]["fused_max_probability_mass_error"]<=1e-6
              if arm=="treatment":
                  assert a["gates"]["runtime_trajectory_identity"] is True
              path=root/filename
              assert path.is_file()
              payload=torch.load(path,map_location="cpu",weights_only=True)
              assert payload["arm"]==arm
              assert payload["total_parameter_count"]==total
              assert payload["readout_parameter_count"]==readout_count
              if arm=="control":
                  assert payload["readout_state_dict"]=={}
              else:
                  assert set(payload["readout_state_dict"])=={"bilinear.weight"}
                  assert tuple(payload["readout_state_dict"]["bilinear.weight"].shape)==(256,256)

          assert isinstance(r["matched_selected_dev_delta_treatment_minus_control"],dict)
          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S39 matched integrity
        run: |
          (cd artifacts/s39-train-dev && sha256sum result.json train-manifest.json dev-manifest.json control-native-candidate.pt treatment-readout-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s39-matched-gradient-isolated-bilinear-train-dev
          path: artifacts/s39-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
