name: r8-w25-unit

on:
  push:
    branches:
      - feat/r8-w25-atomic-severity-geometry
    paths:
      - "src/nmd/atomic_geometry_*.py"
      - "scripts/r8_w25_*.py"
      - "tests/test_atomic_geometry.py"
      - "research/R8-W25-HANDOFF.md"
      - ".github/workflows/r8-w25-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w25-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W25 stack
        run: |
          python -m py_compile \
            src/nmd/atomic_geometry_authority.py \
            src/nmd/atomic_geometry_cache.py \
            src/nmd/atomic_geometry_eval.py \
            scripts/r8_w25_build_cache.py \
            scripts/r8_w25_train_candidate.py \
            scripts/r8_w25_evaluate_confirm.py
      - name: Run W25 contracts
        run: pytest -q tests/test_atomic_geometry.py
      - name: Preflight exact-text freshness without materialization
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.atomic_geometry_authority import (
              all_w25_query_texts,
              all_w25_schema_texts,
              all_w25_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w25build","scripts/r8_w25_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w25_text_atoms() & mod.prior_text_atoms())
          assert not (all_w25_query_texts() & all_w25_schema_texts())
          print("w25_pre_exposure_freshness_pass")
          PY
