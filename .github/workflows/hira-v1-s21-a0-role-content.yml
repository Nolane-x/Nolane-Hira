name: hira-v1-s21-a0-role-content

on:
  push:
    branches:
      - feat/hira-v1-s21-role-gated-content-triadic
    paths:
      - "research/HIRA-V1-S21-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S21 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile S21 modules
        run: |
          python -m py_compile src/nmd/v1_role_gated_content_triadic.py src/nmd/v1_s21_semantic_core.py src/nmd/v1_s21_authority.py src/nmd/v1_s21_checkpoint.py scripts/hira_v1_s21_train_dev.py scripts/hira_v1_s21_a0_role_content.py
      - name: Run S21 and inherited contracts
        run: |
          pytest -q tests/test_v1_role_gated_content_triadic.py tests/test_v1_s21_authority.py tests/test_v1_s21_checkpoint.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_a13_lora.py tests/test_v1_triadic_semantic.py

  a0:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S21 source and HF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Verify exact frozen M4 bundle
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          from nmd.local_runtime import read_runtime_bundle_manifest
          m = read_runtime_bundle_manifest("inputs/M4/hira-v0-m4-runtime")
          assert m["hira_manifest"]["version"] == "0.0-m4a"
          assert m["semantic_revision"] == "4226d9e4d2c08703e5cb0491b479bfc6a1607181"
          assert m["t0_checkpoint_sha256"] == "1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          PY
      - name: Run fresh S21-A0 role-content authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s21_a0_role_content.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s21-a0
      - name: Verify S21-A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("artifacts/s21-a0/result.json").read_text())
          assert r["schema_version"] == "hira-v1-s21-a0-role-content-v1"
          assert r["status"] == "PASS"
          assert r["outcome"] == "HIRA_V1_S21_A0_ROLE_CONTENT_READY"
          assert r["scientific_authority"] == "S21_A0_ROLE_GATED_CONTENT_ONLY"
          assert r["semantic_case_count"] == 16
          assert r["decision_count"] == 64
          assert r["state_view_count"] == 32
          assert r["k"] == 4
          assert r["views_per_option"] == 2
          assert r["a13_token_output_identity"] is True
          assert r["a13_pooled_output_identity"] is True
          assert 0.0 <= r["baseline_logit_identity_rate"] <= 1.0
          assert 0.0 <= r["baseline_choice_identity_rate"] <= 1.0
          assert r["lora_parameter_count"] == 16384
          assert r["projection_parameter_count"] == 32768
          assert r["candidate_parameter_count"] == 49152
          assert r["runtime_trainable_parameter_count"] == 0
          assert r["original_a13_trainable_parameter_count"] == 0
          assert r["factorization_added_parameter_count"] == 0
          assert r["canonicalizer_added_parameter_count"] == 0
          assert r["fusion_added_parameter_count"] == 0
          assert r["fusion_epsilon"] == 1e-6
          assert r["fusion_expert_swap_max_abs"] == 0.0
          assert r["fusion_vs_s14_forward_max_abs"] == 0.0
          assert r["primary_triadic_gradient_nonzero"] is True
          assert r["primary_relation_direct_gradient_zero"] is True
          assert r["relation_auxiliary_gradient_nonzero"] is True
          p = r["shared_surface_gradient_probe"]
          assert p["surface_parameter_count"] == 49152
          assert p["semantic_case_count"] == 16
          assert p["balance_epsilon"] == 1e-12
          assert p["normalized_post_dot"] >= -1e-5
          assert r["synthetic_role_content_court_passed"] is True
          assert r["synthetic_question_a_selected"] == 0
          assert r["synthetic_question_b_selected"] == 2
          assert r["synthetic_correct_vs_same_role_wrong_margin"] > 0.0
          assert r["synthetic_correct_vs_wrong_role_same_content_margin"] > 0.0
          assert r["factorized_option_permutation_max_abs"] <= 1e-6
          assert r["factorized_degenerate_finite"] is True
          assert r["role_temperature"] == 0.10
          assert r["role_weight"] == 0.50
          assert r["content_weight"] == 0.50
          assert r["fused_option_order_flip_rate"] == 0.0
          assert r["fused_max_probability_mass_error"] <= 1e-6
          assert r["option_order_flip_rate"] == 0.0
          assert r["state_encode_calls"] == 32
          assert r["max_probability_mass_error"] <= 1e-6
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Freeze S21-A0 integrity
        run: |
          (cd artifacts/s21-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s21-a0-role-content
          path: artifacts/s21-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
