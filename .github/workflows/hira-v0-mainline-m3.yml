name: hira-v0-mainline-m3

on:
  push:
    branches:
      - feat/hira-v0-mainline-m3-multilingual
    paths:
      - "src/nmd/mainline.py"
      - "src/nmd/mainline_m3_authority.py"
      - "src/nmd/mainline_m3_eval.py"
      - "scripts/hira_v0_m3_paired_dev.py"
      - "scripts/hira_v0_m3_paired_confirm.py"
      - "tests/test_mainline_m3_authority.py"
      - "tests/test_mainline_m3_eval.py"
      - "src/nmd/mainline_m3_alignment.py"
      - "src/nmd/mainline_m3_r1_authority.py"
      - "src/nmd/mainline_m3_r1_cache.py"
      - "src/nmd/mainline_m3_r1_training.py"
      - "scripts/hira_v0_m3_r1_train.py"
      - "scripts/hira_v0_m3_r1_confirm.py"
      - "tests/test_mainline_m3_alignment.py"
      - "tests/test_mainline_m3_r1_authority.py"
      - "tests/test_mainline_m3_r1_cache.py"
      - "tests/test_mainline_m3_r1_training.py"
      - ".github/workflows/hira-v0-mainline-m3-r1-train-dev.yml"
      - "scripts/hira_v0_m3_bundle.py"
      - "research/HIRA-V0-MAINLINE-M3-CLOSURE.md"
      - "research/HIRA-V0-MAINLINE-M3-CLOSURE-BUNDLE"
      - ".github/workflows/hira-v0-mainline-m3-closure-bundle.yml"
      - "research/HIRA-V0-MAINLINE-M3-HANDOFF.md"
      - ".github/workflows/hira-v0-mainline-m3.yml"
      - ".github/workflows/hira-v0-mainline-m3-paired-dev.yml"

permissions:
  contents: read

concurrency:
  group: hira-v0-mainline-m3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile M3 stack
        run: |
          python -m py_compile \
            src/nmd/mainline.py \
            src/nmd/mainline_m3_authority.py \
            src/nmd/mainline_m3_eval.py \
            src/nmd/mainline_m3_alignment.py \
            src/nmd/mainline_m3_r1_authority.py \
            src/nmd/mainline_m3_r1_cache.py \
            src/nmd/mainline_m3_r1_training.py \
            scripts/hira_v0_m3_paired_dev.py \
            scripts/hira_v0_m3_paired_confirm.py \
            scripts/hira_v0_m3_r1_train.py \
            scripts/hira_v0_m3_r1_confirm.py \
            scripts/hira_v0_m3_bundle.py \
            tests/test_mainline_m3_authority.py \
            tests/test_mainline_m3_eval.py

      - name: Run M3 contracts
        run: |
          pytest -q \
            tests/test_mainline_m3_authority.py \
            tests/test_mainline_m3_eval.py \
            tests/test_mainline_m3_alignment.py \
            tests/test_mainline_m3_r1_authority.py \
            tests/test_mainline_m3_r1_cache.py \
            tests/test_mainline_m3_r1_training.py \
            tests/test_mainline.py \
            tests/test_mainline_high_k.py
