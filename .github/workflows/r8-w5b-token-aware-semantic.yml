name: r8-w5b-token-aware-semantic

on:
  push:
    branches:
      - feat/r8-w5b-token-aware-semantic
    paths:
      - "src/nmd/contracts.py"
      - "src/nmd/schema.py"
      - "src/nmd/runtime.py"
      - "src/nmd/semantic_token_curriculum.py"
      - "scripts/r8_w5b_*.py"
      - "tests/test_token_relation_modes.py"
      - "tests/test_semantic_token_curriculum.py"
      - "research/R8-W5B-HANDOFF.md"
      - ".github/workflows/r8-w5b-token-aware-semantic.yml"
  pull_request:
    paths:
      - "src/nmd/contracts.py"
      - "src/nmd/schema.py"
      - "src/nmd/runtime.py"
      - "src/nmd/semantic_token_curriculum.py"
      - "scripts/r8_w5b_*.py"
      - "tests/test_token_relation_modes.py"
      - "tests/test_semantic_token_curriculum.py"
      - "research/R8-W5B-HANDOFF.md"
      - ".github/workflows/r8-w5b-token-aware-semantic.yml"

concurrency:
  group: r8-w5b-token-aware-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W5b modules
        run: |
          python -m py_compile             src/nmd/contracts.py             src/nmd/schema.py             src/nmd/runtime.py             src/nmd/semantic_token_curriculum.py             scripts/r8_w5b_build_cache.py             scripts/r8_w5b_train_candidate.py             scripts/r8_w5b_select_candidate.py             scripts/r8_w5b_confirm.py

      - name: Run W5b unit and regression tests
        run: |
          pytest -q             tests/test_token_relation_modes.py             tests/test_semantic_token_curriculum.py             tests/test_hira.py             tests/test_runtime.py

  cache:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen W3 selected head
        uses: actions/download-artifact@v4
        with:
          name: r8-w3-selected-head
          path: upstream/w3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35748778854

      - name: Verify frozen W3 authority
        run: |
          test "$(sha256sum upstream/w3/hira-head.pt | cut -d' ' -f1)" = "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen A13 cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Build fresh TRAIN and DEV token cache only
        run: |
          python scripts/r8_w5b_build_cache.py             --out artifacts/r8-w5b-cache
          cat artifacts/r8-w5b-cache/receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5b-frozen-inputs
          path: |
            artifacts/r8-w5b-cache
            upstream/w3/hira-head.pt
          if-no-files-found: error
          retention-days: 14

  candidate:
    if: github.event_name == 'push'
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode:
          - pooled
          - option_tokens
          - state_tokens
          - dual_tokens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5b-frozen-inputs
          path: inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install head-only training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Train frozen relation-mode candidate
        run: |
          python scripts/r8_w5b_train_candidate.py             --train-cache inputs/artifacts/r8-w5b-cache/train-cache.pt             --dev-cache inputs/artifacts/r8-w5b-cache/dev-cache.pt             --w3-head inputs/upstream/w3/hira-head.pt             --mode "${{ matrix.mode }}"             --out "artifacts/candidates/${{ matrix.mode }}"
          cat "artifacts/candidates/${{ matrix.mode }}/receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5b-candidate-${{ matrix.mode }}
          path: artifacts/candidates/${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 14

  select:
    if: github.event_name == 'push'
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w5b-candidate-*
          path: inputs/candidates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install selector stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Freeze one DEV-selected relation mode and head
        run: |
          python scripts/r8_w5b_select_candidate.py             --candidates inputs/candidates             --out artifacts/r8-w5b-selected
          cat artifacts/r8-w5b-selected/selection.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/r8-w5b-selected/selection.json").read_text())
          assert x["status"]=="PASS"
          assert x["candidate_count"]==4
          assert x["selection_authority"]=="DEV_ONLY"
          assert x["confirm_exposed"] is False
          assert x["forbidden_benchmark_data_used"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5b-selected-head
          path: artifacts/r8-w5b-selected
          if-no-files-found: error
          retention-days: 30

  confirm:
    if: github.event_name == 'push'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5b-selected-head
          path: inputs/selected

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Execute untouched CONFIRM after selection
        run: |
          python scripts/r8_w5b_confirm.py             --selected-head inputs/selected/hira-head.pt             --selection inputs/selected/selection.json             --out artifacts/r8-w5b-confirm
          cat artifacts/r8-w5b-confirm/confirm.json

      - name: Verify confirm scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/r8-w5b-confirm/confirm.json").read_text())
          assert x["status"]=="PASS"
          assert x["verdict"] in {"TOKEN_SEMANTIC_PASS","TOKEN_SEMANTIC_FAIL"}
          assert x["confirm_generated_after_selection"] is True
          assert x["confirm_case_count"]==192
          assert x["forbidden_benchmark_data_used"] is False
          assert x["campaign_cells_populated"]==0
          print(json.dumps({
              "verdict":x["verdict"],
              "mode":x["selected_relation_mode"],
              "accuracy":x["metrics"]["accuracy"],
              "k128":x["metrics"]["per_k"]["128"]["accuracy"],
              "k255":x["metrics"]["per_k"]["255"]["accuracy"],
              "k255_top5":x["metrics"]["per_k"]["255"]["top5_recall"],
              "mechanism_gate":x["mechanism_evidence_gate"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5b-token-semantic-confirm
          path: artifacts/r8-w5b-confirm
          if-no-files-found: error
          retention-days: 30
