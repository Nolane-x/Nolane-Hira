name: r8-w17-unit

on:
  push:
    branches:
      - feat/r8-w17-field-isolated-state
    paths:
      - "src/nmd/field_isolated_authority.py"
      - "src/nmd/field_isolated_cache.py"
      - "src/nmd/field_isolated_eval.py"
      - "tests/test_field_isolated.py"
      - "scripts/r8_w17_build_cache.py"
      - "scripts/r8_w17_freeze.py"
      - "scripts/r8_w17_confirm.py"
      - "research/R8-W17-HANDOFF.md"
      - "research/R8-W17-PRIOR-ART.md"
      - ".github/workflows/r8-w17-unit.yml"
  pull_request:
    paths:
      - "src/nmd/field_isolated_authority.py"
      - "src/nmd/field_isolated_cache.py"
      - "src/nmd/field_isolated_eval.py"
      - "tests/test_field_isolated.py"
      - "scripts/r8_w17_build_cache.py"
      - "scripts/r8_w17_freeze.py"
      - "scripts/r8_w17_confirm.py"
      - "research/R8-W17-HANDOFF.md"
      - "research/R8-W17-PRIOR-ART.md"
      - ".github/workflows/r8-w17-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w17-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W17 stack
        run: |
          python -m py_compile \
            src/nmd/field_isolated_authority.py \
            src/nmd/field_isolated_cache.py \
            src/nmd/field_isolated_eval.py \
            scripts/r8_w17_build_cache.py \
            scripts/r8_w17_freeze.py \
            scripts/r8_w17_confirm.py
      - name: Run W17 pre-data contracts
        run: pytest -q tests/test_field_isolated.py
