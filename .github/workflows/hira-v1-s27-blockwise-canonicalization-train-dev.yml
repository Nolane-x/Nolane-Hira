name: hira-v1-s27-blockwise-canonicalization-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s27-blockwise-factor-canonicalization
    paths:
      - "research/HIRA-V1-S27-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s27-a0-blockwise-canonicalization
          path: inputs/S27A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36859567980
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S27 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Compile and run S27 contracts
        run: |
          python -m py_compile src/nmd/v1_blockwise_factor_canonicalization.py src/nmd/v1_s27_semantic_core.py src/nmd/v1_s27_authority.py src/nmd/v1_s27_checkpoint.py scripts/hira_v1_s27_a0_blockwise_canonicalization.py scripts/hira_v1_s27_train_dev.py
          pytest -q tests/test_v1_blockwise_factor_canonicalization.py tests/test_v1_s27_semantic_core.py tests/test_v1_s27_authority.py tests/test_v1_s27_checkpoint.py tests/test_v1_factorized_relation_signature.py tests/test_v1_s26_semantic_core.py tests/test_v1_s25_gradient_ownership.py tests/test_v1_role_gated_content_triadic.py tests/test_v1_evidence_fusion.py tests/test_v1_neutral_bisector_gradient.py tests/test_v1_a13_lora.py
      - name: Verify canonical S27-A0 authority
        run: |
          (cd inputs/S27A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S27A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s27-a0-blockwise-factor-canonicalization-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S27_A0_BLOCKWISE_CANONICALIZATION_READY"
          assert r["scientific_authority"]=="S27_A0_BLOCKWISE_CANONICALIZATION_ONLY"
          assert r["candidate_parameter_count"]==81920
          assert r["canonicalization_added_parameter_count"]==0
          assert r["primary_inference_identity_max_abs"]==0.0
          assert r["relation_inference_identity_max_abs"]==0.0
          assert r["signature_inference_identity_max_abs"]==0.0
          assert r["fused_inference_identity_max_abs"]==0.0
          assert r["signature_dimension"]==256
          assert r["role_block_dimension"]==128
          assert r["value_block_dimension"]==128
          assert r["identical_total"]<=1e-7
          assert r["role_only_role_total"]>0.1
          assert r["role_only_value_total"]<=1e-7
          assert r["value_only_value_total"]>0.1
          assert r["value_only_role_total"]<=1e-7
          assert r["primary_to_relation_private_max_abs"]==0.0
          assert r["relation_to_primary_private_max_abs"]==0.0
          assert r["fused_option_order_flip_rate"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run one fresh English S27 TRAIN DEV authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s27_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S27A0/result.json --out artifacts/s27-train-dev
      - name: Verify S27 TRAIN DEV receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/s27-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s27-blockwise-factor-canonicalization-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S27_BLOCKWISE_CANONICALIZATION_DEV_READY",
              "HIRA_V1_S27_BLOCKWISE_CANONICALIZATION_DEV_FAIL",
          }
          assert r["scientific_authority"]=="V1_S27_FRESH_ENGLISH_BLOCKWISE_FACTOR_CANONICALIZATION"
          assert r["seed"]==48001
          assert r["optimizer"]["epochs"]==24
          assert r["optimizer"]["batch_size_semantic_cases"]==16
          assert r["optimizer"]["lr"]==2e-4
          assert r["optimizer"]["weight_decay"]==0.01
          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["k"]==4
          assert r["partitions"]["views_per_option"]==2
          assert r["partitions"]["prior_track_exact_rows_used"] is False
          assert r["partitions"]["s27_a0_rows_used"] is False
          assert r["partitions"]["m5_final_rows_used"] is False
          assert r["partitions"]["w29_w34_sealed_rows_used"] is False
          assert r["parameter_surface"]["total_trainable_parameters"]==81920
          assert r["parameter_surface"]["lora_trainable_parameters"]==16384
          assert r["parameter_surface"]["primary_projection_trainable_parameters"]==32768
          assert r["parameter_surface"]["relation_projection_trainable_parameters"]==32768
          assert r["parameter_surface"]["canonicalization_added_parameters"]==0
          assert r["parameter_surface"]["factorized_signature_dimension"]==256
          assert r["parameter_surface"]["role_block_dimension"]==128
          assert r["parameter_surface"]["value_block_dimension"]==128
          assert r["parameter_surface"]["original_a13_trainable"]==0
          assert r["parameter_surface"]["hira_core_trainable"]==0
          assert r["loss"]["canonicalization_rule"]=="blockwise_role_value_cross_view"
          assert r["loss"]["canonicalization_role_block_weight"]==0.50
          assert r["loss"]["canonicalization_value_block_weight"]==0.50
          assert r["loss"]["cross_view_relation_canonicalization_coefficient"]==0.15
          assert r["loss"]["signature_separation_margin"]==0.20
          assert r["loss"]["fusion_rule"]=="s14_equal_standardized_full_k"
          assert r["loss"]["s27_blockwise_factor_canonicalization_preregistered"] is True
          assert r["loss"]["fused_primary_relation_logits_detached"] is True
          assert r["loss"]["shared_lora_gradient_rule"]=="equal_direction_neutral_bisector_no_projection"
          assert r["loss"]["balance_epsilon"]==1e-12
          assert r["gradient_ownership"]["primary_to_relation_private_max_abs"]==0.0
          assert r["gradient_ownership"]["relation_to_primary_private_max_abs"]==0.0
          assert r["gradient_ownership"]["private_updates_direct"] is True
          assert r["gradient_ownership"]["shared_only_neutral_bisector"] is True
          assert r["state_once"]["train_state_view_encodes_per_epoch"]==1536
          assert r["state_once"]["dev_state_view_encodes_per_eval"]==384
          assert r["post_dev_tuning_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          assert (root/"blockwise-factor-canonicalization-candidate.pt").is_file()
          PY
      - name: Verify frozen S27 candidate replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          root=Path("artifacts/s27-train-dev")
          r=json.loads((root/"result.json").read_text())
          payload=torch.load(root/"blockwise-factor-canonicalization-candidate.pt", map_location="cpu", weights_only=True)
          assert payload["schema_version"]=="hira-v1-s27-blockwise-factor-canonicalization-checkpoint-v1"
          assert payload["kind"]=="blockwise-factor-canonicalization-a13-w28"
          assert payload["total_parameter_count"]==81920
          assert payload["canonicalization_added_parameter_count"]==0
          assert payload["factorized_signature_dimension"]==256
          assert payload["role_block_dimension"]==128
          assert payload["value_block_dimension"]==128
          assert payload["selected_dev_epoch"]==r["selected_dev_epoch"]
          PY
      - name: Freeze S27 TRAIN DEV integrity
        run: |
          (cd artifacts/s27-train-dev && sha256sum result.json train-manifest.json dev-manifest.json blockwise-factor-canonicalization-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s27-blockwise-canonicalization-train-dev
          path: artifacts/s27-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
