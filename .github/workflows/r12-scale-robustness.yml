name: r12-scale-robustness

on:
  push:
    branches:
      - feat/r12-scale-relation-robustness
    paths:
      - "src/nmd/relation_cache.py"
      - "scripts/r12_scale_robustness.py"
      - "tests/test_relation_cache.py"
      - ".github/workflows/r12-scale-robustness.yml"
      - "pyproject.toml"

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Run R12 scale and permutation study
        run: |
          python scripts/r12_scale_robustness.py \
            --out artifacts/r12-scale \
            --max-train-n 15000 \
            --rungs 5000,10000,15000 \
            --val-n 1500 \
            --epochs 8 \
            --encode-batch-size 32 \
            --train-batch-size 96 \
            --segments 8 \
            --lr 0.002 \
            --seed 13
          cat artifacts/r12-scale/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: r12-scale-evidence
          path: |
            artifacts/r12-scale/receipt.json
            artifacts/r12-scale/hira-head.pt
          if-no-files-found: error
      - name: Package exact R12 repository snapshot
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/NOLANE-HIRA-R12-FULL.zip HEAD
          cp research/R12-SCALE-ROBUSTNESS-HANDOFF.md dist/R12-HANDOFF.md
          sha256sum dist/NOLANE-HIRA-R12-FULL.zip > dist/NOLANE-HIRA-R12-FULL.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: r12-full-bundle
          path: dist
          if-no-files-found: error
