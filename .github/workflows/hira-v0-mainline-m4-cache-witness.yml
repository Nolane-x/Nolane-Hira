name: hira-v0-mainline-m4-cache-witness

on:
  push:
    branches:
      - feat/hira-v0-mainline-m4-runtime
    paths:
      - "research/HIRA-V0-MAINLINE-M4-ENABLE-CACHE-WITNESS"

permissions:
  contents: read
  actions: read

concurrency:
  group: hira-v0-mainline-m4-cache-witness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen M4-B2 stack
        run: |
          python -m py_compile \
            src/nmd/schema.py \
            src/nmd/runtime.py \
            src/nmd/mainline.py \
            scripts/hira_v0_m4_cache_witness.py

      - name: Run cache contracts
        run: |
          pytest -q \
            tests/test_schema_batching.py \
            tests/test_schema_cache_bounds.py \
            tests/test_mainline_m4_runtime.py \
            tests/test_runtime.py

      - name: Verify exact M4-A authority
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10934506746 --jq .digest)" = "sha256:447c394a5a6b2246a354b21d49e9ee848c2271a636eedd019ba2ae23496324eb"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/runs/36327904288 --jq .conclusion)" = "success"

      - name: Verify immutable M4-B1 failure authority
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10934986918 --jq .digest)" = "sha256:e2624ce369a17c068cf8bb78fffb70615d86581a630dc49d31c3ae9d3cfc5ed4"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/runs/36328918665 --jq .conclusion)" = "success"

  witness:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w34-coevidence-training
          path: inputs/W34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36299087572

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-schema-benchmark
          path: inputs/M4A
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36327904288

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-cache-stress
          path: inputs/M4B1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36328918665

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact M4-B2 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" sentencepiece

      - name: Run exact LRU witness
        run: |
          python scripts/hira_v0_m4_cache_witness.py \
            --t0-dir inputs/T0 \
            --w34-dir inputs/W34 \
            --m4a-dir inputs/M4A \
            --m4b1-dir inputs/M4B1 \
            --out artifacts/m4-cache-witness

      - name: Verify M4-B2 receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/m4-cache-witness/receipt.json"))
          assert x["schema_version"]=="hira-v0-mainline-m4-cache-witness-v2"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "HIRA_V0_M4_BOUNDED_CACHE_READY",
            "HIRA_V0_M4_BOUNDED_CACHE_FAIL",
          }
          assert x["cache_limits"]=={"max_entries":16,"max_bytes":67108864}
          assert x["before_touch"]["entries"]==10
          assert x["before_touch"]["evictions"]==0
          assert x["after_pressure"]["entries"]<=16
          assert x["after_pressure"]["bytes"]<=67108864
          assert x["semantic_quality_promoted"] is False
          assert x["reliability_promoted"] is False
          assert x["multilingual_promoted"] is False
          assert x["production_ready_claimed"] is False
          print("HIRA_V0_M4_CACHE_WITNESS_RECEIPT="+json.dumps({
            "outcome":x["outcome"],
            "gates":x["gates"],
            "before_touch":x["before_touch"],
            "after_pressure":x["after_pressure"],
            "final_cache_info":x["final_cache_info"],
            "touched_survived":x["touched_survived"],
            "recompiled_probability_max_error":x["recompiled_probability_max_error"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m4-cache-witness
          path: artifacts/m4-cache-witness
          if-no-files-found: error
          retention-days: 90
