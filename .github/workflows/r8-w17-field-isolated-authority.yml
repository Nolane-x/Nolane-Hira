name: r8-w17-field-isolated-authority

on:
  push:
    branches:
      - feat/r8-w17-field-isolated-state
    paths:
      - ".github/workflows/r8-w17-field-isolated-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w17-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W17 stack
        run: |
          python -m py_compile \
            src/nmd/field_isolated_authority.py \
            src/nmd/field_isolated_cache.py \
            src/nmd/field_isolated_eval.py \
            scripts/r8_w17_build_cache.py \
            scripts/r8_w17_freeze.py \
            scripts/r8_w17_confirm.py
      - name: Run frozen W17 contracts
        run: pytest -q tests/test_field_isolated.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W9 freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .digest)" = "sha256:6f0eee6ae58d489f0486372f0311e0f420065a0d9499185af7904377ae6a4712"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w9-freeze
          path: inputs/freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36122220588
      - name: Verify W9 projection-semantic provenance
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/freeze")
          x=json.loads((root/"freeze.json").read_text())
          assert x["schema_version"] == "r8-w9-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          rows={r["candidate"]:r for r in x["candidates"]}
          row=rows["projection-semantic-control"]
          assert row["scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          checkpoint=root/row["checkpoint_dir"]
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          assert sha(checkpoint/"hira.pt") == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert sha(checkpoint/"scorer.pt") == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          print("w17_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w17-frozen-w9-checkpoints
          path: inputs/freeze
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first eligible W17 train-dev exposure
        run: echo R8_W17_CK_CO_A13_EXPOSURE_BEGIN
      - name: Build fresh CK-CN TRAIN and CO DEV cache
        run: |
          python scripts/r8_w17_build_cache.py --out artifacts/w17-cache
          cat artifacts/w17-cache/receipt.json
      - name: Verify pre-confirm cache boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w17-cache/receipt.json"))
          assert x["schema_version"] == "r8-w17-train-dev-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["train_case_count"] == 384
          assert x["dev_case_count"] == 96
          assert x["train_decision_count"] == 1920
          assert x["dev_decision_count"] == 480
          assert x["train_domains"] == ["CK","CL","CM","CN"]
          assert x["dev_domain"] == "CO"
          assert x["prior_exact_text_overlap"] == []
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["confirm_cp_exposed"] is False
          assert x["confirm_cq_exposed"] is False
          assert x["logical_state_compiles_per_candidate_case"] == {
              "FULL_SINGLE":1,
              "FULL_TRIPLICATE":1,
              "FIELD_ISOLATED":1,
          }
          assert x["a13_invocations_per_candidate_case"] == {
              "FULL_SINGLE":1,
              "FULL_TRIPLICATE":1,
              "FIELD_ISOLATED":1,
          }
          assert x["encoded_sequences_per_candidate_case"] == {
              "FULL_SINGLE":1,
              "FULL_TRIPLICATE":3,
              "FIELD_ISOLATED":3,
          }
          assert x["w15_rows_used"] is False
          assert x["w16_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print("w17_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w17-train-dev-cache
          path: artifacts/w17-cache
          if-no-files-found: error
          retention-days: 30

  freeze:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w17-train-dev-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Freeze zero-parameter W17 boundary before CONFIRM
        run: |
          python scripts/r8_w17_freeze.py \
            --cache-receipt inputs/cache/receipt.json \
            --train-cache inputs/cache/train.pt \
            --dev-cache inputs/cache/dev-co.pt \
            --out artifacts/w17-freeze
          cat artifacts/w17-freeze/freeze.json
      - name: Verify pre-confirm freeze
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w17-freeze/freeze.json"))
          assert x["schema_version"] == "r8-w17-preconfirm-freeze-v1"
          assert x["status"] == "PASS"
          assert x["mechanism"] == "FIELD_ISOLATED_ZERO_PARAMETER"
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["all_scientific_gates_frozen_before_confirm"] is True
          assert x["confirm_cp_exposed"] is False
          assert x["confirm_cq_exposed"] is False
          assert x["trainable_parameter_count"] == 0
          assert x["logical_state_compiles_per_candidate_case"] == {
              "FULL_SINGLE":1,
              "FULL_TRIPLICATE":1,
              "FIELD_ISOLATED":1,
          }
          assert x["encoded_sequences_per_candidate_case"] == {
              "FULL_SINGLE":1,
              "FULL_TRIPLICATE":3,
              "FIELD_ISOLATED":3,
          }
          assert x["w15_rows_used"] is False
          assert x["w16_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print("w17_preconfirm_frozen")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w17-preconfirm-freeze
          path: artifacts/w17-freeze
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: [upstream, freeze]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w17-frozen-w9-checkpoints
          path: inputs/w9
      - uses: actions/download-artifact@v4
        with:
          name: r8-w17-preconfirm-freeze
          path: inputs/preconfirm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]"
      - name: Materialize untouched CP/CQ and evaluate frozen paths
        run: |
          python scripts/r8_w17_confirm.py \
            --preconfirm-freeze inputs/preconfirm/freeze.json \
            --w9-freeze inputs/w9/freeze.json \
            --w9-checkpoints inputs/w9 \
            --out artifacts/w17-confirm
          cat artifacts/w17-confirm/confirm.json
      - name: Verify authoritative W17 receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w17-confirm/confirm.json"))
          assert x["schema_version"] == "r8-w17-confirm-v1"
          assert x["status"] == "PASS"
          assert x["training_performed"] is False
          assert x["selection_performed"] is False
          assert x["trainable_parameter_count"] == 0
          assert x["confirm_generated_after_preconfirm_freeze"] is True
          assert x["confirm_domains"] == ["CP","CQ"]
          assert x["confirm_cp_case_count"] == 96
          assert x["confirm_cq_case_count"] == 96
          assert x["confirm_cp_decision_count"] == 480
          assert x["confirm_cq_decision_count"] == 480
          assert set(x["paths"]) == {"CP","CQ"}
          for domain in ("CP","CQ"):
              assert set(x["paths"][domain]["paths"]) == {
                  "FULL_SINGLE",
                  "FULL_TRIPLICATE",
                  "FIELD_ISOLATED",
                  "PRODUCTION_D0_FULL",
              }
              assert x["paths"][domain]["control"]["triplicate_prediction_identity_rate"] == 1.0
              assert x["paths"][domain]["control"]["triplicate_max_semantic_logit_diff"] <= 1e-5
          assert x["reference_model"] == "sentence-transformers/all-MiniLM-L6-v2"
          assert x["reference_revision"] == "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
          assert x["reference_weight_sha256"] == "53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db"
          assert x["reference_is_hira_candidate"] is False
          assert x["w9_hira_sha256"] == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert x["w9_scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert x["verdict"] in {
              "FIELD_ISOLATED_TYPED_RESCUE",
              "FIELD_ISOLATED_TYPED_PARTIAL",
              "FIELD_ISOLATION_CONTROL_INVALID",
              "FIELD_ISOLATED_TYPED_FAIL",
          }
          assert x["w15_rows_used"] is False
          assert x["w16_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print(x["verdict"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w17-authoritative-confirm
          path: artifacts/w17-confirm
          if-no-files-found: error
          retention-days: 90
