name: r8-w6e-unit

on:
  push:
    branches:
      - feat/r8-w6e-joint-generalization-replication
    paths:
      - "src/nmd/typed_joint_replication_authority.py"
      - "tests/test_typed_joint_replication_authority.py"
      - "research/R8-W6E-HANDOFF.md"
      - ".github/workflows/r8-w6e-unit.yml"
  pull_request:
    paths:
      - "src/nmd/typed_joint_replication_authority.py"
      - "tests/test_typed_joint_replication_authority.py"
      - "research/R8-W6E-HANDOFF.md"
      - ".github/workflows/r8-w6e-unit.yml"

concurrency:
  group: r8-w6e-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6e authority
        run: |
          python -m py_compile             src/nmd/typed_joint_replication_authority.py             tests/test_typed_joint_replication_authority.py
      - name: Run W6e authority contracts and production regressions
        run: |
          pytest -q             tests/test_typed_joint_replication_authority.py             tests/test_typed_domain_generalization_authority.py             tests/test_typed_domain_generalization.py             tests/test_competitive_coarse_runtime.py             tests/test_runtime.py             tests/test_token_relation_modes.py             tests/test_training.py             tests/test_typed_decisions.py             tests/test_typed_competitive_cache.py
