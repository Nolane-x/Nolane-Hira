name: r8-w34-unit

on:
  push:
    branches:
      - feat/r8-w34-qualified-coevidence
    paths:
      - "src/nmd/w34_transfer_authority.py"
      - "src/nmd/w34_transfer_cache.py"
      - "src/nmd/w34_transfer_eval.py"
      - "src/nmd/w34_transfer_core.py"
      - "scripts/r8_w34_qualify.py"
      - "scripts/r8_w34_train.py"
      - "scripts/r8_w34_confirm.py"
      - "tests/test_w34_transfer_authority.py"
      - "tests/test_w34_transfer_training.py"
      - "research/R8-W34-HANDOFF.md"
      - ".github/workflows/r8-w34-reference-qualification.yml"
      - ".github/workflows/r8-w34-train-dev.yml"
      - ".github/workflows/r8-w34-sealed-confirm.yml"
      - ".github/workflows/r8-w34-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w34-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W34 qualification stack
        run: |
          python -m py_compile \
            src/nmd/w34_transfer_authority.py \
            src/nmd/w34_transfer_cache.py \
            src/nmd/w34_transfer_eval.py \
            src/nmd/w34_transfer_core.py \
            scripts/r8_w34_qualify.py \
            scripts/r8_w34_train.py \
            scripts/r8_w34_confirm.py
      - name: Run W34 authority and frozen candidate contracts
        run: |
          pytest -q \
            tests/test_w34_transfer_authority.py \
            tests/test_w34_transfer_training.py \
            tests/test_w33_coevidence_semantic.py \
            tests/test_symmetric_semantic_runtime.py
