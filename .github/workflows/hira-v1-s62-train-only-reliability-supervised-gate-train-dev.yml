name: hira-v1-s62-train-only-reliability-supervised-gate-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s62-train-only-reliability-gate
    paths:
      - "research/HIRA-V1-S62-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s62-a0-train-only-reliability-supervised-gate
          path: inputs/S62A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37305254725

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S62 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S62 contracts
        run: |
          python -m py_compile src/nmd/v1_confidence_adaptive_bounded_hybrid.py src/nmd/v1_reliability_supervised_adaptive_gate.py src/nmd/v1_s62_authority.py scripts/hira_v1_s62_train_dev.py
          pytest -q tests/test_v1_confidence_adaptive_bounded_hybrid.py tests/test_v1_reliability_supervised_adaptive_gate.py tests/test_v1_s62_a0_harness.py tests/test_v1_s62_authority.py tests/test_v1_s62_matched_harness.py tests/test_v1_s62_train_dev_workflow.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify canonical S62 A0 authority
        run: |
          (cd inputs/S62A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:3db27b3a3a9fdc4c0b276c72c05649a6b77f59b868b2329914e94ccd7d483d0e"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S62A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s62-a0-train-only-reliability-supervised-adaptive-gate-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S62_A0_TRAIN_ONLY_RELIABILITY_SUPERVISED_ADAPTIVE_GATE_READY"
          assert r["scientific_authority"]=="S62_A0_TRAIN_ONLY_RELIABILITY_SUPERVISED_ADAPTIVE_GATE_ONLY"
          assert r["seed"]==83001
          assert r["correction_trainable_parameter_count"]==114688
          assert r["pairwise_trainable_parameter_count"]==32832
          assert r["reference_gate_parameter_count"]==5
          assert r["treatment_gate_parameter_count"]==5
          assert r["added_treatment_parameter_count"]==0
          assert r["reference_gate_trainable_tensor_names"]==["b","w"]
          assert r["treatment_gate_trainable_tensor_names"]==["b","w"]
          assert r["gate_initialization_bit_identical"] is True
          assert r["feature_dimension"]==4
          assert r["alpha_probe"]==0.35
          assert r["target_tolerance"]==1e-8
          assert r["target_observed"]=={
              "beneficial":1.0,
              "both_harm":0.0,
              "correctness_harm":0.0,
              "stability_harm":0.0,
          }
          assert r["mixed_target_positive_count"]==1
          assert r["mixed_target_count"]==2
          assert r["reference_gold_ce_gradient_w_l1"]>0
          assert r["reference_gold_ce_gradient_b_l1"]>0
          assert r["treatment_reliability_gradient_w_l1"]>0
          assert r["treatment_reliability_gradient_b_l1"]>0
          assert r["reference_gradient_to_upstream_zero"] is True
          assert r["treatment_gradient_to_upstream_zero"] is True
          assert r["dev_target_dependency"] is False
          assert r["pairwise_only_final_path"] is False
          assert r["teacher_dependency"] is False
          assert r["self_anchor_dependency"] is False
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["one_encoder_state_once"] is True
          assert r["matched_gate_checkpoint_replay_max_abs_error"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S62 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s62_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S62A0/result.json \
            --out artifacts/s62-train-dev

      - name: Verify S62 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s62-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s62-train-only-reliability-supervised-adaptive-gate-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S62_TRAIN_ONLY_RELIABILITY_SUPERVISED_ADAPTIVE_GATE_DEV_COMPLETE",
              "HIRA_V1_S62_TRAIN_ONLY_RELIABILITY_SUPERVISED_ADAPTIVE_GATE_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S62_FRESH_TRAIN_ONLY_RELIABILITY_SUPERVISED_ADAPTIVE_GATE"
          assert r["seed"]==83001

          parent=r["parent_s61"]
          assert parent["merged_main"]=="e6c7053a8d24c75b5fcf1db75c8aa9f30cea35e2"
          assert parent["scientific_run"]==37302829277
          assert parent["artifact_id"]==11343045582
          assert parent["artifact_digest"]=="sha256:6e99ba1a5fab92cb6031c41eea54636721b78e690236dfb39788066803785f74"
          assert parent["verdict"]=="CASE_B"

          a0=r["a0_authority"]
          assert a0["run"]==37305254725
          assert a0["artifact_id"]==11342769947
          assert a0["artifact_digest"]=="sha256:3db27b3a3a9fdc4c0b276c72c05649a6b77f59b868b2329914e94ccd7d483d0e"

          cv=r["controlled_variable"]
          assert cv["reference_gate_objective"]=="gold_ce"
          assert cv["treatment_gate_objective"]=="train_only_reliability_bce"
          assert cv["correction_trainable_parameters"]==114688
          assert cv["pairwise_trainable_parameters"]==32832
          assert cv["reference_gate_trainable_parameters"]==5
          assert cv["treatment_gate_trainable_parameters"]==5
          assert cv["added_treatment_parameters"]==0
          assert cv["gate_feature_dimension"]==4
          assert cv["gate_architecture_identical"] is True
          assert cv["gate_initialization_bit_identical"] is True
          assert cv["alpha_initial"]==0.10
          assert cv["alpha_max"]==0.35
          assert cv["alpha_probe"]==0.35
          assert cv["target_tolerance"]==1e-8
          assert cv["teacher_dependency"] is False
          assert cv["dev_target_dependency"] is False
          assert cv["self_anchor_dependency"] is False
          assert cv["gate_gradient_enters_correction"] is False
          assert cv["gate_gradient_enters_pairwise"] is False
          assert cv["gate_gradient_enters_native"] is False
          assert cv["pairwise_only_final_path"] is False
          assert cv["shared_correction_head_trajectory"] is True
          assert cv["same_frozen_selector"] is True
          assert cv["fused_shadow_selection_arm"] is False

          assert len(r["training_trajectory"])==24
          for e,row in enumerate(r["training_trajectory"],start=1):
              assert row["epoch"]==e
              assert 0.0<=row["train_reliability_positive_fraction"]<=1.0
              assert len(row["correction_state_sha256"])==64
              assert len(row["pairwise_head_state_sha256"])==64
              assert len(row["reference_gate_state_sha256"])==64
              assert len(row["treatment_gate_state_sha256"])==64
              assert row["train_pairwise"]["antisymmetry_max_abs_error"]==0.0

          for name in ("reference_branch","treatment_branch"):
              b=r[name]
              assert 1<=b["selected_dev_epoch"]<=24
              assert len(b["correction_state_sha256"])==64
              assert len(b["pairwise_head_state_sha256"])==64
              assert len(b["gate_state_sha256"])==64
              m=b["selected_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["fused_max_probability_mass_error"]<=1e-6
              assert 0.0<m["gate_min_alpha"]<=m["gate_mean_alpha"]<=m["gate_max_alpha"]<0.35
              assert m["gate_residual_max_abs"]<=m["gate_bound_max"]+1e-7

          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["exact_s61_state_question_option_overlap"]==0

          for filename,branch_name,objective in (
              ("reference-candidate.pt","reference","gold_ce"),
              ("treatment-candidate.pt","treatment","train_only_reliability_bce"),
          ):
              p=torch.load(root/filename,map_location="cpu",weights_only=True)
              assert p["schema_version"]=="hira-v1-s62-private-candidate-v1"
              assert p["branch"]==branch_name
              assert p["seed"]==83001
              assert p["correction_parameter_count"]==114688
              assert p["pairwise_parameter_count"]==32832
              assert p["gate_parameter_count"]==5
              assert p["gate_feature_dimension"]==4
              assert p["gate_objective"]==objective
              assert p["alpha_probe"]==0.35
              assert p["target_tolerance"]==1e-8
              assert p["native_parameter_count_in_optimizer"]==0
              assert p["teacher_dependency"] is False

          assert r["post_dev_tuning_performed"] is False
          assert r["alpha_probe_sweep_performed"] is False
          assert r["target_tolerance_changed"] is False
          assert r["target_rule_changed"] is False
          assert r["bce_weighting_performed"] is False
          assert r["feature_change_performed"] is False
          assert r["hidden_layer_added"] is False
          assert r["alpha_max_initialization_sweep_performed"] is False
          assert r["optimizer_lr_weight_decay_changed"] is False
          assert r["gate_regularizer_added"] is False
          assert r["gradient_coupling_performed"] is False
          assert r["architecture_capacity_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S62 integrity
        run: |
          (cd artifacts/s62-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s62-train-only-reliability-supervised-gate
          path: artifacts/s62-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
