name: r8-w7-unit

on:
  push:
    branches:
      - feat/r8-w7-conjunctive-coarse
    paths:
      - "src/nmd/conjunctive_coarse.py"
      - "tests/test_conjunctive_coarse.py"
      - "research/R8-W7-HANDOFF.md"
      - ".github/workflows/r8-w7-unit.yml"
  pull_request:
    paths:
      - "src/nmd/conjunctive_coarse.py"
      - "tests/test_conjunctive_coarse.py"
      - "research/R8-W7-HANDOFF.md"
      - ".github/workflows/r8-w7-unit.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W7 scorer stack
        run: |
          python -m py_compile \
            src/nmd/conjunctive_coarse.py \
            tests/test_conjunctive_coarse.py
      - name: Run W7 scorer and production contracts
        run: |
          pytest -q \
            tests/test_conjunctive_coarse.py \
            tests/test_competitive_coarse_runtime.py
