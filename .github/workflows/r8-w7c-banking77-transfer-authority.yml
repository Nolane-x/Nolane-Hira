name: r8-w7c-banking77-transfer-authority

on:
  push:
    branches:
      - feat/r8-w7c-banking77-transfer
    paths:
      - ".github/workflows/r8-w7c-banking77-transfer-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w7c-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W7c stack
        run: |
          python -m py_compile src/nmd/banking77_transfer.py scripts/r8_w7c_banking77_transfer.py
      - name: Run frozen W7c contracts
        run: |
          pytest -q tests/test_banking77_transfer.py tests/test_competitive_coarse_runtime.py
      - name: Verify exact frozen protocol constants
        run: |
          PYTHONPATH=src python - <<'PY'
          from nmd.banking77_transfer import (
              DATASET_ID, DATASET_REVISION, DATASET_SPLIT,
              START_INDEX, END_INDEX, EXAMPLE_COUNT,
              EXPECTED_LABELS, QUESTION, FORCED_BUDGET, CANDIDATES,
          )
          assert DATASET_ID == "mteb/banking77"
          assert DATASET_REVISION == "18072d2685ea682290f7b8924d94c62acc19c0b2"
          assert DATASET_SPLIT == "test"
          assert (START_INDEX, END_INDEX, EXAMPLE_COUNT) == (400, 800, 400)
          assert EXPECTED_LABELS == 77
          assert QUESTION == "Which banking intent does `message` express?"
          assert FORCED_BUDGET == 77
          assert CANDIDATES == (
              "frozen-w6e-control",
              "typed-only-retune",
              "pair-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          )
          print("w7c_protocol_verified")
          PY

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W7b freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10852555298 --jq .digest)" = "sha256:e586cdb2ddea0185ff6663690868fec586a98b7eb617804eb4ea92ed8f45a6f4"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10852555298 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7b-freeze
          path: inputs/freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36107487032
      - name: Verify exact W7b freeze boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("inputs/freeze/freeze.json").read_text())
          assert x["schema_version"] == "r8-w7b-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          assert x["selection_authority"] == "DEV_AR_INDEPENDENT_PER_CANDIDATE"
          assert x["confirm_as_exposed"] is False
          assert x["confirm_at_exposed"] is False
          names={
              "frozen-w6e-control",
              "typed-only-retune",
              "pair-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          assert {r["candidate"] for r in x["candidates"]} == names
          assert x["primary_replica_seed_independence"] is True
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6j_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          print("w7b_freeze_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7c-frozen-w7b-checkpoints
          path: inputs/freeze
          if-no-files-found: error
          retention-days: 14

  external:
    needs: upstream
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7c-frozen-w7b-checkpoints
          path: inputs/freeze
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen external evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Execute frozen Banking77 rows 400-799 transfer authority
        run: |
          python scripts/r8_w7c_banking77_transfer.py \
            --freeze inputs/freeze/freeze.json \
            --checkpoints inputs/freeze \
            --out artifacts/w7c
          cat artifacts/w7c/result.json
      - name: Verify external authority receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w7c/result.json"))
          assert x["schema_version"] == "r8-w7c-banking77-transfer-v1"
          assert x["status"] == "PASS"
          assert x["scientific_scope"] == "PUBLIC_TRANSFER_DIAGNOSTIC_ONLY"
          assert x["dataset"]["id"] == "mteb/banking77"
          assert x["dataset"]["revision"] == "18072d2685ea682290f7b8924d94c62acc19c0b2"
          assert x["dataset"]["split"] == "test"
          assert x["dataset"]["slice_start"] == 400
          assert x["dataset"]["slice_end_exclusive"] == 800
          assert x["dataset"]["case_count"] == 400
          assert x["w4a_first400_reused"] is False
          assert x["banking77_task_training_used"] is False
          assert x["retrieval_used"] is False
          assert x["calibration_fit_used"] is False
          assert x["checkpoint_selection_on_w7c"] is False
          assert x["laya_scorecard_populated"] is False
          assert x["jev_scorecard_populated"] is False
          assert x["w7b_frozen_verdict_overridden"] is False
          names={
              "frozen-w6e-control",
              "typed-only-retune",
              "pair-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          assert set(x["paths"]) == names
          for row in x["paths"].values():
              assert row["case_count"] == 400
              assert row["label_count"] == 77
              assert row["slice_start"] == 400
              assert row["slice_end_exclusive"] == 800
              assert row["state_encode_calls_per_case"] == 1.0
              assert row["candidate_budget_min"] == 77
              assert row["candidate_budget_max"] == 77
              assert row["probability_mass_max_error"] <= 1e-6
          assert x["verdict"] in {
              "PUBLIC_HIGH_K_TRANSFER_SIGNAL",
              "PUBLIC_HIGH_K_TRANSFER_WEAK",
              "PUBLIC_HIGH_K_TRANSFER_ABSENT",
          }
          print(x["verdict"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w7c-banking77-transfer
          path: artifacts/w7c
          if-no-files-found: error
          retention-days: 90
