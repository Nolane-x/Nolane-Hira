name: hira-v0-mainline-m2-integration

on:
  push:
    branches:
      - feat/hira-v0-mainline-m2-high-k
    paths:
      - "research/HIRA-V0-MAINLINE-M2-ENABLE-INTEGRATION"

permissions:
  contents: read
  actions: read

concurrency:
  group: hira-v0-mainline-m2-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile exact M2 integration stack
        run: |
          python -m py_compile \
            src/nmd/mainline.py \
            src/nmd/mainline_high_k.py \
            scripts/hira_v0_m2_integration.py

      - name: Run M2 pre-integration contracts
        run: |
          pytest -q \
            tests/test_mainline_high_k.py \
            tests/test_mainline.py \
            tests/test_mainline_reliability.py \
            tests/test_high_cardinality_stress.py

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

      - name: Verify exact W34 provisional transfer artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .digest)" = "sha256:8374f2eb849cf80d1201e4ad05a8c8bf4c9bf1f824da17306f57c87456fd186c"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .expired)" = "false"

  integrate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w34-coevidence-training
          path: inputs/W34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36299087572

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact M2 integration stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" sentencepiece

      - name: Run exact A13 W28 W34 M2 mechanics proof
        run: |
          python scripts/hira_v0_m2_integration.py \
            --t0-dir inputs/T0 \
            --w34-dir inputs/W34 \
            --out artifacts/m2-integration

      - name: Verify M2 integration receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/m2-integration/receipt.json"))
          assert x["schema_version"]=="hira-v0-mainline-m2-mechanics-integration-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "HIRA_V0_M2_MECHANICS_READY",
            "HIRA_V0_M2_MECHANICS_FAIL",
          }
          assert x["t0_checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert x["transfer_checkpoint_sha256"]=="d69fa11805291e6a06631d5bda941065f209ea96f5c46091187e984ff083834c"
          assert x["k_ladder"]==[4,8,16,32,64,128,255]
          assert x["max_k"]==255
          assert x["state_encode_delta"]==1
          assert x["query_count"]==14
          assert x["parameter_report"]["trainable_total"]==0
          assert x["semantic_quality_claim_made"] is False
          assert x["reliability_promotion_claim_made"] is False
          assert x["candidate_pruning_used"] is False
          assert x["relation_refinement_used"] is False
          assert x["adaptive_budget_used"] is False
          assert x["suite"]["max_probability_mass_error"]<=1e-6
          print("HIRA_V0_M2_MECHANICS_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "suite":x["suite"],
            "parameter_report":x["parameter_report"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m2-mechanics-integration
          path: artifacts/m2-integration
          if-no-files-found: error
          retention-days: 90
