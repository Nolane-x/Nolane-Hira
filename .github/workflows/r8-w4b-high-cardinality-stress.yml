name: r8-w4b-high-cardinality-stress

on:
  push:
    branches:
      - feat/r8-w4b-k128-k255-stress
    paths:
      - "src/nmd/high_cardinality_stress.py"
      - "scripts/r8_w4b_high_cardinality_stress.py"
      - "tests/test_high_cardinality_stress.py"
      - "research/R8-W4B-HANDOFF.md"
      - ".github/workflows/r8-w4b-high-cardinality-stress.yml"
  pull_request:
    paths:
      - "src/nmd/high_cardinality_stress.py"
      - "scripts/r8_w4b_high_cardinality_stress.py"
      - "tests/test_high_cardinality_stress.py"
      - "research/R8-W4B-HANDOFF.md"
      - ".github/workflows/r8-w4b-high-cardinality-stress.yml"

concurrency:
  group: r8-w4b-high-cardinality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W4b modules
        run: |
          python -m py_compile             src/nmd/high_cardinality_stress.py             scripts/r8_w4b_high_cardinality_stress.py

      - name: Run W4b contract tests
        run: |
          pytest -q             tests/test_high_cardinality_stress.py             tests/test_hira.py             tests/test_runtime.py

  empirical:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen W3a selected head
        uses: actions/download-artifact@v4
        with:
          name: r8-w3-selected-head
          path: inputs/selected
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35748778854

      - name: Verify selected head before execution
        run: |
          test "$(sha256sum inputs/selected/hira-head.pt | cut -d' ' -f1)" = "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("inputs/selected/selection.json").read_text())
          assert x["status"] == "PASS"
          assert x["selected_head_sha256"] == "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"
          assert x["final_test_exposed"] is False
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen empirical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Execute fresh K128 K255 stress
        run: |
          python scripts/r8_w4b_high_cardinality_stress.py             --selected-head inputs/selected/hira-head.pt             --out artifacts/r8-w4b

      - name: Verify W4b scope and mechanical receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("artifacts/r8-w4b/result.json").read_text())
          assert x["status"] == "PASS"
          assert x["mechanics_verdict"] in {"MECHANICS_PASS", "MECHANICS_FAIL"}
          assert x["mechanical"]["banking77_data_used"] is False
          assert x["mechanical"]["campaign_cells_populated"] == 0
          assert x["semantic_key"]["banking77_data_used"] is False
          assert x["semantic_key"]["campaign_cells_populated"] == 0
          assert [r["k"] for r in x["mechanical"]["k_results"]] == [128, 255]
          assert [r["k"] for r in x["semantic_key"]["k_results"]] == [128, 255]
          print(json.dumps({
              "mechanics_verdict": x["mechanics_verdict"],
              "semantic_k128_accuracy": x["semantic_key"]["k_results"][0]["accuracy"],
              "semantic_k255_accuracy": x["semantic_key"]["k_results"][1]["accuracy"],
          }, sort_keys=True))
          PY

      - name: Display aggregate receipts only
        if: always()
        run: |
          test ! -f artifacts/r8-w4b/mechanical.json || cat artifacts/r8-w4b/mechanical.json
          test ! -f artifacts/r8-w4b/semantic-key.json || cat artifacts/r8-w4b/semantic-key.json
          test ! -f artifacts/r8-w4b/result.json || cat artifacts/r8-w4b/result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r8-w4b-high-cardinality-stress
          path: artifacts/r8-w4b
          if-no-files-found: warn
          retention-days: 90
