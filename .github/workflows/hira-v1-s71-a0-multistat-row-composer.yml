name: hira-v1-s71-a0-multistat-row-composer

on:
  push:
    branches:
      - feat/hira-v1-s71-multistat-row-composer
    paths:
      - "research/HIRA-V1-S71-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s70-fused-anchored-pairwise
          path: inputs/S70
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37423476142

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S71 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S71 contracts
        run: |
          python -m py_compile src/nmd/v1_multistat_pairwise_row_composer.py scripts/hira_v1_s71_a0_multistat_row_composer.py
          pytest -q tests/test_v1_multistat_pairwise_row_composer.py tests/test_v1_s71_a0_harness.py tests/test_v1_s71_a0_workflow.py tests/test_v1_contextual_reliability_gate.py tests/test_v1_per_view_responsibility.py

      - name: Verify frozen S70 parent evidence
        run: |
          (cd inputs/S70 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact id: 11394610000"
          echo "Pinned GitHub artifact digest: sha256:8af711f789efb9717eaed0eff882fade7bab37b546f86a35502db82242ad221f"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S70/result.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S70_FUSED_ANCHORED_PAIRWISE_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S70_FRESH_FUSED_ANCHORED_PAIRWISE_AGGREGATION"
          assert r["seed"]==91001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Run one S71 mechanical A0 court
        run: |
          python scripts/hira_v1_s71_a0_multistat_row_composer.py \
            --parent-result inputs/S70/result.json \
            --out artifacts/s71-a0

      - name: Verify S71 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/s71-a0")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s71-a0-multistat-row-composer-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S71_A0_MULTISTAT_ROW_COMPOSER_READY"
          assert r["scientific_authority"]=="S71_A0_MULTISTAT_ROW_COMPOSER_ONLY"
          assert r["seed"]==92001

          parent=r["parent_s70"]
          assert parent["merged_main"]=="751161746887b795149fcd924735ee2d043b43b3"
          assert parent["scientific_run"]==37423476142
          assert parent["artifact_id"]==11394610000
          assert parent["artifact_digest"]=="sha256:8af711f789efb9717eaed0eff882fade7bab37b546f86a35502db82242ad221f"
          assert parent["verdict"]=="CASE_C"

          assert r["reference_parameter_count"]==80
          assert r["treatment_parameter_count"]==80
          assert r["added_treatment_parameter_count"]==0
          assert r["parameter_initialization_bit_identical"] is True
          assert r["context_projection_bit_identical"] is True

          assert r["reference_extra_row_channels_max_abs"]==0.0
          assert r["reference_treatment_mean_channel_max_abs_error"]==0.0
          assert r["treatment_extra_row_channels_max_abs"]>1e-7
          assert r["row_permutation_max_abs_error"]<=2e-6
          assert r["output_permutation_max_abs_error"]<=2e-6
          assert r["alpha_permutation_max_abs_error"]<=2e-6
          assert r["diagonal_row_mean_max_abs_error"]==0.0
          assert r["fixed_alpha_residual_direction_max_abs_error"]==0.0

          assert r["initial_alpha_max_abs_error"]<=1e-7
          assert r["identity_override_max_abs_error"]==0.0
          assert r["residual_bound_violation_max"]<=1e-7
          assert r["max_probability_mass_error"]<=1e-6
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True

          for arm in ("reference","treatment"):
              assert r[f"{arm}_initial_W_phi_gradient_l1"]==0.0
              assert r[f"{arm}_initial_b_phi_gradient_l1"]==0.0
              assert r[f"{arm}_initial_w_out_gradient_l1"]>0.0
              assert r[f"{arm}_initial_b_out_gradient_l1"]>0.0
              assert r[f"{arm}_post_output_warm_W_phi_gradient_l1"]>0.0
              assert r[f"{arm}_post_output_warm_b_phi_gradient_l1"]>0.0
              assert r[f"{arm}_gradient_to_upstream_zero"] is True

          assert r["one_encoder_state_once"] is True
          assert r["matched_composer_checkpoint_replay_max_abs_error"]==0.0
          assert r["teacher_dependency"] is False
          assert r["pseudo_target_dependency"] is False
          assert r["reliability_target_reopened"] is False
          assert r["residual_direction_changed"] is False
          assert r["fresh_train_dev_exposed"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S71 A0 integrity
        run: |
          (cd artifacts/s71-a0 && sha256sum result.json matched-composers.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s71-a0-multistat-row-composer
          path: artifacts/s71-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
