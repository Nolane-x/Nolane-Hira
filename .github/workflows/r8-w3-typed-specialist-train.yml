name: r8-w3-typed-specialist-train

on:
  push:
    branches:
      - feat/r8-w3-typed-specialist-train
    paths:
      - "src/nmd/typed_feature_cache.py"
      - "scripts/r8_w3_build_typed_cache.py"
      - "scripts/r8_w3_train_candidate.py"
      - "scripts/r8_w3_select_candidate.py"
      - "tests/test_typed_feature_cache.py"
      - "research/R8-W3-HANDOFF.md"
      - ".github/workflows/r8-w3-typed-specialist-train.yml"
  pull_request:
    paths:
      - "src/nmd/typed_feature_cache.py"
      - "scripts/r8_w3_build_typed_cache.py"
      - "scripts/r8_w3_train_candidate.py"
      - "scripts/r8_w3_select_candidate.py"
      - "tests/test_typed_feature_cache.py"
      - "research/R8-W3-HANDOFF.md"
      - ".github/workflows/r8-w3-typed-specialist-train.yml"

concurrency:
  group: r8-w3-typed-specialist-train-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W3a modules
        run: |
          python -m py_compile \
            src/nmd/typed_feature_cache.py \
            scripts/r8_w3_build_typed_cache.py \
            scripts/r8_w3_train_candidate.py \
            scripts/r8_w3_select_candidate.py

      - name: Run W3a unit tests
        run: |
          pytest -q \
            tests/test_typed_feature_cache.py \
            tests/test_typed_decisions.py \
            tests/test_losses.py

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download exact R15 selected head
        uses: actions/download-artifact@v4
        with:
          name: r15-retention-evidence
          path: upstream/r15
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35688830869

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen feature stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Verify exact R15 authority
        run: |
          test "$(sha256sum upstream/r15/hira-head.pt | cut -d' ' -f1)" = "007e24fff0e0e48a096de59276f7ab8d0e25bdb826a3f81a7838c5bd6151723f"

      - name: Build frozen A13 TRAIN-only feature cache
        run: |
          python scripts/r8_w3_build_typed_cache.py \
            --out artifacts/r8-w3-cache
          cat artifacts/r8-w3-cache/receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w3-frozen-inputs
          path: |
            artifacts/r8-w3-cache/typed-feature-cache.pt
            artifacts/r8-w3-cache/receipt.json
            upstream/r15/hira-head.pt
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: r15-balanced-lr3e4
            init: r15
            loss: balanced
            lr: "0.0003"
          - name: r15-balanced-lr1e3
            init: r15
            loss: balanced
            lr: "0.001"
          - name: r15-soft-lr3e4
            init: r15
            loss: soft
            lr: "0.0003"
          - name: r15-soft-lr1e3
            init: r15
            loss: soft
            lr: "0.001"
          - name: fresh13-balanced-lr3e4
            init: fresh13
            loss: balanced
            lr: "0.0003"
          - name: fresh13-balanced-lr1e3
            init: fresh13
            loss: balanced
            lr: "0.001"
          - name: fresh13-soft-lr3e4
            init: fresh13
            loss: soft
            lr: "0.0003"
          - name: fresh13-soft-lr1e3
            init: fresh13
            loss: soft
            lr: "0.001"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w3-frozen-inputs
          path: inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install head-only stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Train preregistered candidate
        run: |
          python scripts/r8_w3_train_candidate.py \
            --cache inputs/artifacts/r8-w3-cache/typed-feature-cache.pt \
            --r15-head inputs/upstream/r15/hira-head.pt \
            --init "${{ matrix.init }}" \
            --loss-family "${{ matrix.loss }}" \
            --lr "${{ matrix.lr }}" \
            --name "${{ matrix.name }}" \
            --out "artifacts/candidates/${{ matrix.name }}"
          cat "artifacts/candidates/${{ matrix.name }}/receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w3-candidate-${{ matrix.name }}
          path: artifacts/candidates/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w3-candidate-*
          path: inputs/candidates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install selector stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Freeze one TRAIN-DEV selected head
        run: |
          python scripts/r8_w3_select_candidate.py \
            --candidates inputs/candidates \
            --out artifacts/r8-w3-selected
          cat artifacts/r8-w3-selected/selection.json
          test "$(python -c 'import json; print(json.load(open("artifacts/r8-w3-selected/selection.json"))["final_test_exposed"])')" = "False"

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w3-selected-head
          path: artifacts/r8-w3-selected
          if-no-files-found: error
          retention-days: 30
