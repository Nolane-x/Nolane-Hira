name: hira-v0-mainline-m4-cache-stress

on:
  push:
    branches:
      - feat/hira-v0-mainline-m4-runtime
    paths:
      - "research/HIRA-V0-MAINLINE-M4-ENABLE-CACHE-STRESS"

permissions:
  contents: read
  actions: read

concurrency:
  group: hira-v0-mainline-m4-cache-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen M4-B stack
        run: |
          python -m py_compile \
            src/nmd/schema.py \
            src/nmd/runtime.py \
            src/nmd/mainline.py \
            scripts/hira_v0_m4_cache_stress.py

      - name: Run M4-B contracts
        run: |
          pytest -q \
            tests/test_schema_batching.py \
            tests/test_schema_cache_bounds.py \
            tests/test_mainline_m4_runtime.py \
            tests/test_runtime.py

      - name: Verify exact M4-A authority
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10934506746 --jq .digest)" = "sha256:447c394a5a6b2246a354b21d49e9ee848c2271a636eedd019ba2ae23496324eb"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10934506746 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/runs/36327904288 --jq .conclusion)" = "success"

      - name: Verify exact W28 and W34 artifacts
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10924803779 --jq .digest)" = "sha256:8374f2eb849cf80d1201e4ad05a8c8bf4c9bf1f824da17306f57c87456fd186c"

  stress:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w34-coevidence-training
          path: inputs/W34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36299087572

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-schema-benchmark
          path: inputs/M4A
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36327904288

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact M4-B stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" sentencepiece

      - name: Run exact bounded-cache stress
        run: |
          python scripts/hira_v0_m4_cache_stress.py \
            --t0-dir inputs/T0 \
            --w34-dir inputs/W34 \
            --m4a-dir inputs/M4A \
            --out artifacts/m4-cache-stress

      - name: Verify M4-B receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/m4-cache-stress/receipt.json"))
          assert x["schema_version"]=="hira-v0-mainline-m4-cache-stress-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "HIRA_V0_M4_BOUNDED_CACHE_READY",
            "HIRA_V0_M4_BOUNDED_CACHE_FAIL",
          }
          assert x["cache_limits"]=={"max_entries":16,"max_bytes":67108864}
          assert x["unique_schema_count"]==21
          assert x["k"]==255
          assert x["after_pressure"]["entries"]<=16
          assert x["after_pressure"]["bytes"]<=67108864
          assert x["semantic_quality_promoted"] is False
          assert x["reliability_promoted"] is False
          assert x["multilingual_promoted"] is False
          assert x["production_ready_claimed"] is False
          print("HIRA_V0_M4_CACHE_RECEIPT="+json.dumps({
            "outcome":x["outcome"],
            "gates":x["gates"],
            "after_pressure":x["after_pressure"],
            "after_recompile":x["after_recompile"],
            "anchor_survived":x["anchor_survived"],
            "early_probability_max_error":x["early_probability_max_error"],
            "rss_peak_delta_kib":x["rss_peak_delta_kib"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v0-mainline-m4-cache-stress
          path: artifacts/m4-cache-stress
          if-no-files-found: error
          retention-days: 90
