name: hira-v1-s66-per-view-responsibility-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s66-per-view-responsibility
    paths:
      - "research/HIRA-V1-S66-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s66-a0-per-view-responsibility
          path: inputs/S66A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37329441437

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S66 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S66 contracts
        run: |
          python -m py_compile src/nmd/v1_per_view_responsibility.py src/nmd/v1_s66_authority.py scripts/hira_v1_s66_train_dev.py
          pytest -q tests/test_v1_per_view_responsibility.py tests/test_v1_s66_a0_harness.py tests/test_v1_s66_authority.py tests/test_v1_s66_matched_harness.py tests/test_v1_s66_train_dev_workflow.py tests/test_v1_contextual_reliability_gate.py tests/test_v1_reliability_supervised_adaptive_gate.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_private_correction_fork.py

      - name: Verify canonical S66 A0 authority
        run: |
          (cd inputs/S66A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:61d76394e79457f26251468fea6e73be53e0507d979aa64d5b24c67f18562c39"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S66A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s66-a0-per-view-responsibility-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S66_A0_PER_VIEW_RESPONSIBILITY_READY"
          assert r["scientific_authority"]=="S66_A0_PER_VIEW_RESPONSIBILITY_ONLY"
          assert r["seed"]==87001
          assert r["correction_trainable_parameter_count"]==114688
          assert r["pairwise_trainable_parameter_count"]==32832
          assert r["reference_gate_parameter_count"]==60
          assert r["treatment_gate_parameter_count"]==60
          assert r["added_treatment_parameter_count"]==0
          assert r["parameter_initialization_bit_identical"] is True
          assert r["context_projection_bit_identical"] is True
          assert r["responsibility_states"]==[[0,0],[0,1],[1,0],[1,1]]
          assert r["responsibility_disagreement_fraction"]>0.0
          assert r["view_swap_target_max_abs_error"]==0.0
          assert r["treatment_target_distinct_from_pair_target"] is True
          assert r["canonical_correctness_veto_observed"] is True
          assert r["paraphrase_correctness_veto_observed"] is True
          assert r["canonical_stability_veto_observed"] is True
          assert r["paraphrase_stability_veto_observed"] is True
          assert r["reference_gradient_to_upstream_zero"] is True
          assert r["treatment_gradient_to_upstream_zero"] is True
          assert r["alpha_probe"]==0.35
          assert r["target_tolerance"]==1e-8
          assert r["teacher_dependency"] is False
          assert r["dev_target_dependency"] is False
          assert r["self_anchor_dependency"] is False
          assert r["pairwise_only_final_path"] is False
          assert r["single_view_inference"] is True
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["one_encoder_state_once"] is True
          assert r["matched_gate_checkpoint_replay_max_abs_error"]==0.0
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S66 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s66_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S66A0/result.json \
            --out artifacts/s66-train-dev

      - name: Verify S66 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s66-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s66-per-view-responsibility-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S66_PER_VIEW_RESPONSIBILITY_DEV_COMPLETE",
              "HIRA_V1_S66_PER_VIEW_RESPONSIBILITY_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S66_FRESH_PER_VIEW_RESPONSIBILITY"
          assert r["seed"]==87001

          parent=r["parent_s65"]
          assert parent["merged_main"]=="6bae27159fc2f9577f72540c7070da3e41ef3d15"
          assert parent["scientific_run"]==37325995163
          assert parent["artifact_id"]==11352920320
          assert parent["artifact_digest"]=="sha256:a44c560d304537bb7acaa1b5d569160ec744f897ae728edf95ceca7701be9dfc"
          assert parent["verdict"]=="CASE_B"

          a0=r["a0_authority"]
          assert a0["run"]==37329441437
          assert a0["artifact_id"]==11353806431
          assert a0["artifact_digest"]=="sha256:61d76394e79457f26251468fea6e73be53e0507d979aa64d5b24c67f18562c39"

          cv=r["controlled_variable"]
          assert cv["reference_gate_family"]=="s64_context_injected"
          assert cv["treatment_gate_family"]=="s64_context_injected"
          assert cv["reference_gate_objective"]=="shared_pair_target_independent_bce"
          assert cv["treatment_gate_objective"]=="per_view_counterfactual_responsibility_bce"
          assert cv["reference_shared_pair_target"] is True
          assert cv["treatment_per_view_responsibility"] is True
          assert cv["single_view_inference_both_arms"] is True
          assert cv["correction_trainable_parameters"]==114688
          assert cv["pairwise_trainable_parameters"]==32832
          assert cv["reference_gate_trainable_parameters"]==60
          assert cv["treatment_gate_trainable_parameters"]==60
          assert cv["added_treatment_parameters"]==0
          assert cv["parameter_initialization_bit_identical"] is True
          assert cv["same_context_path"] is True
          assert cv["context_projection_seed"]==64064
          assert cv["context_projection_trainable_parameters"]==0
          assert cv["encoder_init_seed"]==64164
          assert cv["alpha_initial"]==0.10
          assert cv["alpha_max"]==0.35
          assert cv["alpha_probe"]==0.35
          assert cv["target_tolerance"]==1e-8
          assert cv["same_probe_and_tolerance"] is True
          assert cv["teacher_dependency"] is False
          assert cv["dev_target_dependency"] is False
          assert cv["self_anchor_dependency"] is False
          assert cv["gate_gradient_enters_correction"] is False
          assert cv["gate_gradient_enters_pairwise"] is False
          assert cv["gate_gradient_enters_native"] is False
          assert cv["pairwise_only_final_path"] is False
          assert cv["shared_correction_head_trajectory"] is True
          assert cv["same_frozen_selector"] is True
          assert cv["fused_shadow_selection_arm"] is False

          assert len(r["training_trajectory"])==24
          assert any(row["treatment_phi_gradient_ever_live"] for row in r["training_trajectory"])
          assert any(row["train_responsibility_disagreement_fraction"]>0.0 for row in r["training_trajectory"])
          for e,row in enumerate(r["training_trajectory"],start=1):
              assert row["epoch"]==e
              assert 0.0<=row["train_pair_target_positive_fraction"]<=1.0
              assert 0.0<=row["train_canonical_responsibility_positive_fraction"]<=1.0
              assert 0.0<=row["train_paraphrase_responsibility_positive_fraction"]<=1.0
              assert 0.0<=row["train_responsibility_disagreement_fraction"]<=1.0
              assert len(row["correction_state_sha256"])==64
              assert len(row["pairwise_head_state_sha256"])==64
              assert len(row["reference_gate_state_sha256"])==64
              assert len(row["treatment_gate_state_sha256"])==64
              assert row["train_pairwise"]["antisymmetry_max_abs_error"]==0.0

          for name in ("reference_branch","treatment_branch"):
              b=r[name]
              assert 1<=b["selected_dev_epoch"]<=24
              m=b["selected_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["fused_max_probability_mass_error"]<=1e-6
              assert 0.0<m["gate_min_alpha"]<=m["gate_mean_alpha"]<=m["gate_max_alpha"]<0.35
              assert m["gate_residual_max_abs"]<=m["gate_bound_max"]+1e-7

          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["exact_s65_state_question_option_overlap"]==0

          for filename,branch_name,objective in (
              ("reference-candidate.pt","reference","shared_pair_target_independent_bce"),
              ("treatment-candidate.pt","treatment","per_view_counterfactual_responsibility_bce"),
          ):
              p=torch.load(root/filename,map_location="cpu",weights_only=True)
              assert p["schema_version"]=="hira-v1-s66-private-candidate-v1"
              assert p["branch"]==branch_name
              assert p["seed"]==87001
              assert p["correction_parameter_count"]==114688
              assert p["pairwise_parameter_count"]==32832
              assert p["gate_parameter_count"]==60
              assert p["gate_family"]=="s64_context_injected"
              assert p["gate_objective"]==objective
              assert p["single_view_inference"] is True
              assert p["alpha_probe"]==0.35
              assert p["target_tolerance"]==1e-8
              assert p["native_parameter_count_in_optimizer"]==0
              assert p["teacher_dependency"] is False

          assert r["post_dev_tuning_performed"] is False
          assert r["responsibility_tolerance_sweep_performed"] is False
          assert r["responsibility_target_smoothing_performed"] is False
          assert r["responsibility_target_mixing_performed"] is False
          assert r["ce_js_coefficient_added"] is False
          assert r["alpha_probe_changed"] is False
          assert r["context_architecture_change_performed"] is False
          assert r["optimizer_lr_weight_decay_changed"] is False
          assert r["gate_regularizer_added"] is False
          assert r["gradient_coupling_performed"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S66 integrity
        run: |
          (cd artifacts/s66-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s66-per-view-responsibility
          path: artifacts/s66-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
