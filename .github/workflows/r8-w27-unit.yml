name: r8-w27-unit

on:
  push:
    branches:
      - feat/r8-w27-compositional-f2-authority
    paths:
      - "src/nmd/f2_compositional_*.py"
      - "scripts/r8_w27_*.py"
      - "tests/test_f2_compositional_authority.py"
      - "research/R8-W27-HANDOFF.md"
      - ".github/workflows/r8-w27-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w27-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W27 stack
        run: |
          python -m py_compile \
            src/nmd/f2_compositional_authority.py \
            src/nmd/f2_compositional_reference.py \
            scripts/r8_w27_qualify_f2.py
      - name: Run W27 contracts
        run: pytest -q tests/test_f2_compositional_authority.py
      - name: Preflight exact-text freshness without exposure
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.f2_compositional_authority import (
              all_w27_query_texts,
              all_w27_schema_texts,
              all_w27_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w27qual","scripts/r8_w27_qualify_f2.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          assert not (all_w27_text_atoms() & mod.prior_text_atoms())
          assert not (all_w27_query_texts() & all_w27_schema_texts())
          print("w27_pre_exposure_freshness_pass")
          PY
