name: r8-w5f-late-interaction-binding

on:
  push:
    branches:
      - feat/r8-w5f-late-interaction-binding
    paths:
      - "src/nmd/semantic_late_interaction.py"
      - "scripts/r8_w5f_build_cache.py"
      - "scripts/r8_w5f_train_candidate.py"
      - "scripts/r8_w5f_select_candidate.py"
      - "scripts/r8_w5f_confirm.py"
      - "tests/test_semantic_late_interaction.py"
      - "research/R8-W5F-HANDOFF.md"
      - ".github/workflows/r8-w5f-late-interaction-binding.yml"
  pull_request:
    paths:
      - "src/nmd/semantic_late_interaction.py"
      - "scripts/r8_w5f_build_cache.py"
      - "scripts/r8_w5f_train_candidate.py"
      - "scripts/r8_w5f_select_candidate.py"
      - "scripts/r8_w5f_confirm.py"
      - "tests/test_semantic_late_interaction.py"
      - "research/R8-W5F-HANDOFF.md"
      - ".github/workflows/r8-w5f-late-interaction-binding.yml"

concurrency:
  group: r8-w5f-late-interaction-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W5f
        run: |
          python -m py_compile             src/nmd/semantic_late_interaction.py             scripts/r8_w5f_build_cache.py             scripts/r8_w5f_train_candidate.py             scripts/r8_w5f_select_candidate.py             scripts/r8_w5f_confirm.py
      - name: Run W5f unit tests
        run: pytest -q tests/test_semantic_late_interaction.py

  cache:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build frozen A13 W5f caches
        run: |
          python scripts/r8_w5f_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5f-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - raw-maxsim
          - proj64-maxsim
          - proj128-maxsim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w5f-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install matcher stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Execute frozen candidate
        run: |
          python scripts/r8_w5f_train_candidate.py             --train-cache inputs/cache/train.pt             --dev-cache inputs/cache/dev.pt             --candidate "${{ matrix.candidate }}"             --out "artifacts/candidates/${{ matrix.candidate }}"
          cat "artifacts/candidates/${{ matrix.candidate }}/receipt.json"
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5f-candidate-${{ matrix.candidate }}
          path: artifacts/candidates/${{ matrix.candidate }}
          if-no-files-found: error
          retention-days: 14

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w5f-candidate-*
          path: inputs/candidates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install selector stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Freeze one W5f candidate
        run: |
          python scripts/r8_w5f_select_candidate.py             --candidates inputs/candidates             --out artifacts/selected
          cat artifacts/selected/selection.json
          test "$(python -c 'import json; print(json.load(open("artifacts/selected/selection.json"))["confirm_exposed"])')" = "False"
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5f-selected
          path: artifacts/selected
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w5f-selected
          path: inputs/selected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Evaluate untouched W5f CONFIRM
        run: |
          python scripts/r8_w5f_confirm.py             --selection inputs/selected/selection.json             --matcher inputs/selected/matcher.pt             --out artifacts/confirm
          cat artifacts/confirm/confirm.json
      - name: Verify scientific scope
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/confirm.json"))
          assert x["status"] == "PASS"
          assert x["confirm_generated_after_selection_freeze"] is True
          assert x["forbidden_benchmark_data_used"] is False
          assert x["campaign_cells_populated"] == 0
          assert x["verdict"] in {
              "LATE_INTERACTION_RESCUE",
              "LATE_INTERACTION_PARTIAL",
              "LATE_INTERACTION_FAIL",
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5f-confirm
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90
