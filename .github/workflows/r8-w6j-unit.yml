name: r8-w6j-unit

on:
  push:
    branches:
      - feat/r8-w6j-high-cardinality-decomposition
    paths:
      - "src/nmd/high_cardinality_decomposition.py"
      - "src/nmd/high_cardinality_decomposition_authority.py"\n      - "src/nmd/high_cardinality_decomposition_eval.py"
      - "tests/test_high_cardinality_decomposition.py"
      - "tests/test_high_cardinality_decomposition_authority.py"\n      - "tests/test_high_cardinality_decomposition_eval.py"
      - "research/R8-W6J-HANDOFF.md"
      - ".github/workflows/r8-w6j-unit.yml"
  pull_request:
    paths:
      - "src/nmd/high_cardinality_decomposition.py"
      - "src/nmd/high_cardinality_decomposition_authority.py"
      - "tests/test_high_cardinality_decomposition.py"
      - "tests/test_high_cardinality_decomposition_authority.py"
      - "research/R8-W6J-HANDOFF.md"
      - ".github/workflows/r8-w6j-unit.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6j stack
        run: |
          python -m py_compile \
            src/nmd/high_cardinality_decomposition.py \
            src/nmd/high_cardinality_decomposition_authority.py \
            tests/test_high_cardinality_decomposition.py \
            tests/test_high_cardinality_decomposition_authority.py \\\n            tests/test_high_cardinality_decomposition_eval.py
      - name: Run W6j pre-diagnostic contracts
        run: |
          pytest -q \
            tests/test_high_cardinality_decomposition.py \
            tests/test_high_cardinality_decomposition_authority.py
