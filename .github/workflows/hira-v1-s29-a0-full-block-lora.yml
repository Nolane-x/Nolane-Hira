name: hira-v1-s29-a0-full-block-lora

on:
  push:
    branches:
      - feat/hira-v1-s29-final-block-ffn-lora-clean
    paths:
      - "research/HIRA-V1-S29-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S29 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile S29 modules
        run: |
          python -m py_compile src/nmd/v1_a13_fullblock_lora.py src/nmd/v1_s29_semantic_core.py src/nmd/v1_s29_authority.py src/nmd/v1_s29_checkpoint.py scripts/hira_v1_s29_a0_fullblock_lora.py scripts/hira_v1_s29_train_dev.py
      - name: Run S29 and inherited contracts
        run: |
          pytest -q tests/test_v1_a13_fullblock_lora.py tests/test_v1_s29_semantic_core.py tests/test_v1_s29_authority.py tests/test_v1_s29_checkpoint.py tests/test_v1_a13_lora.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_triadic_semantic.py

  a0:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S29 source and HF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Verify frozen M4 runtime
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh S29-A0 authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s29_a0_fullblock_lora.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s29-a0
      - name: Verify S29-A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s29-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s29-a0-full-block-lora-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S29_A0_FULL_BLOCK_LORA_READY"
          assert r["scientific_authority"]=="S29_A0_FINAL_BLOCK_FFN_LORA_ONLY"
          assert r["semantic_case_count"]==16
          assert r["decision_count"]==64
          assert r["state_view_count"]==32
          assert r["k"]==4
          assert r["views_per_option"]==2
          assert r["a13_token_output_identity_max_abs"]==0.0
          assert r["a13_pooled_output_identity_max_abs"]==0.0
          assert r["exact_logit_identity_rate"]==1.0
          assert r["exact_choice_identity_rate"]==1.0
          assert r["fused_c_max_abs"]==0.0
          assert r["fused_p_max_abs"]==0.0
          assert r["raw_c_max_abs"]==0.0
          assert r["raw_p_max_abs"]==0.0
          assert r["relation_c_max_abs"]==0.0
          assert r["relation_p_max_abs"]==0.0
          assert r["signature_c_max_abs"]==0.0
          assert r["signature_p_max_abs"]==0.0
          assert r["attention_lora_parameter_count"]==16384
          assert r["ffn_intermediate_lora_parameter_count"]==10240
          assert r["ffn_output_lora_parameter_count"]==10240
          assert r["ffn_lora_parameter_count"]==20480
          assert r["lora_parameter_count"]==36864
          assert r["projection_parameter_count"]==32768
          assert r["candidate_parameter_count"]==69632
          assert r["runtime_trainable_parameter_count"]==0
          assert r["original_a13_trainable_parameter_count"]==0
          assert r["hira_core_trainable_parameter_count"]==0
          assert r["six_module_parameter_counts"]==[4096,4096,4096,4096,10240,10240]
          assert r["checkpoint_key_count"]==12
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["attention_lora_b_gradient_l1_max"]>0.0
          assert r["ffn_intermediate_lora_b_gradient_l1"]>0.0
          assert r["ffn_output_lora_b_gradient_l1"]>0.0
          assert r["projection_gradient_l1"]>0.0
          assert r["primary_block_gradient_norm"]>0.0
          assert r["relation_block_gradient_norm"]>0.0
          assert r["fused_option_order_flip_rate"]==0.0
          assert r["fused_max_probability_mass_error"]<=1e-6
          assert r["option_order_flip_rate"]==0.0
          assert r["state_encode_calls"]==32
          assert r["max_probability_mass_error"]<=1e-6
          assert r["full_k"] is True
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Freeze S29-A0 integrity
        run: |
          (cd artifacts/s29-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s29-a0-full-block-lora
          path: artifacts/s29-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
