name: r8-w32-closure-bundle

on:
  push:
    branches:
      - feat/r8-w32-interaction-semantic-adapter
    paths:
      - "research/R8-W32-CLOSURE-BUNDLE"

permissions:
  contents: read
  actions: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w32-reference-qualification
          path: inputs/qualification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36292606367

      - uses: actions/download-artifact@v4
        with:
          name: r8-w32-interaction-training
          path: inputs/train
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36293558503

      - uses: actions/download-artifact@v4
        with:
          name: r8-w32-authoritative-audit
          path: inputs/confirm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36294714414

      - name: Build complete W32 closure bundle
        run: |
          python scripts/r8_w32_bundle.py \
            --repo-root . \
            --t0-dir inputs/T0 \
            --qualification-dir inputs/qualification \
            --train-dir inputs/train \
            --confirm-dir inputs/confirm \
            --out artifacts/w32-bundle

      - name: Verify W32 bundle integrity
        run: |
          test -f artifacts/w32-bundle/NOLANE-HIRA-R8-W32-FULL.zip
          test -f artifacts/w32-bundle/R8-W32-HANDOFF.md
          test -f artifacts/w32-bundle/R8-W32-CLOSURE.md
          test -f artifacts/w32-bundle/R8-W32-INTEGRITY.sha256
          cd artifacts/w32-bundle
          sha256sum -c R8-W32-INTEGRITY.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w32-closure-full-bundle
          path: artifacts/w32-bundle
          if-no-files-found: error
          retention-days: 90
