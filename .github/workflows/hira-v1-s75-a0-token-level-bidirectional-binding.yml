name: hira-v1-s75-a0-token-level-bidirectional-binding

on:
  push:
    branches:
      - feat/hira-v1-s75-token-level-bidirectional-binding
    paths:
      - "research/HIRA-V1-S75-ENABLE-A0"

permissions:
  contents: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S75 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile and run S75 contracts
        run: |
          python -m py_compile src/nmd/v1_token_level_bidirectional_evidence_binding.py scripts/hira_v1_s75_a0_token_level_bidirectional_binding.py
          pytest -q tests/test_v1_token_level_bidirectional_evidence_binding.py tests/test_v1_s75_a0_harness.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_query_gated_identity_interaction.py

      - name: Verify frozen S74 parent evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("research/HIRA-V1-S74-MATCHED-RECEIPT.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S74_DIRECT_SET_ARBITRATION_CORE_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S74_FRESH_DIRECT_SET_ARBITRATION_CORE"
          assert r["seed"]==95001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          PY

      - name: Run one S75 mechanical A0 court
        run: |
          python scripts/hira_v1_s75_a0_token_level_bidirectional_binding.py             --parent-result research/HIRA-V1-S74-MATCHED-RECEIPT.json             --out artifacts/s75-a0

      - name: Verify S75 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s75-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s75-a0-token-level-bidirectional-binding-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S75_A0_TOKEN_LEVEL_BIDIRECTIONAL_BINDING_READY"
          assert r["scientific_authority"]=="S75_A0_TOKEN_LEVEL_BIDIRECTIONAL_BINDING_ONLY"
          assert r["seed"]==96001
          assert r["reference_representation_dimension"]==512
          assert r["treatment_representation_dimension"]==512
          assert r["reference_representation_parameter_count"]==0
          assert r["treatment_representation_parameter_count"]==0
          assert r["reference_pairwise_parameter_count"]==32832
          assert r["treatment_pairwise_parameter_count"]==32832
          assert r["added_treatment_parameter_count"]==0
          assert r["pairwise_initialization_bit_identical"] is True
          assert r["temperature"]==0.10
          assert r["interaction_scale"]==16.0
          assert r["nontrivial_representation_max_abs_difference"]>1e-5
          assert r["reference_option_permutation_max_abs_error"]<=2e-6
          assert r["treatment_option_permutation_max_abs_error"]<=2e-6
          assert r["neutral_collapse_max_abs_error"]<=2e-6
          assert r["max_probability_mass_error"]<=1e-6
          assert r["gradient_to_upstream_zero"] is True
          assert r["checkpoint_replay_max_abs_error"]==0.0
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Freeze S75 A0 integrity
        run: |
          (cd artifacts/s75-a0 && sha256sum result.json matched-s59-heads.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s75-a0-token-level-bidirectional-binding
          path: artifacts/s75-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
