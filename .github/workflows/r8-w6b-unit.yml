name: r8-w6b-unit

on:
  push:
    branches:
      - feat/r8-w6b-typed-reliability-authority
    paths:
      - "src/nmd/typed_competitive_authority.py"
      - "tests/test_typed_competitive_authority.py"
      - ".github/workflows/r8-w6b-unit.yml"
  pull_request:
    paths:
      - "src/nmd/typed_competitive_authority.py"
      - "tests/test_typed_competitive_authority.py"
      - ".github/workflows/r8-w6b-unit.yml"

concurrency:
  group: r8-w6b-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6b authority
        run: python -m py_compile src/nmd/typed_competitive_authority.py
      - name: Run W6b authority contracts
        run: pytest -q tests/test_typed_competitive_authority.py
