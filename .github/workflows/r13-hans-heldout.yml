name: r13-hans-heldout

on:
  push:
    branches:
      - feat/r13-heldout-nli-stress
    paths:
      - "scripts/r13_hans_eval.py"
      - ".github/workflows/r13-hans-heldout.yml"
      - "research/R13-HANDOFF.md"

jobs:
  hans:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout HIRA
        uses: actions/checkout@v4

      - name: Checkout pinned HANS
        uses: actions/checkout@v4
        with:
          repository: tommccoy1/hans
          ref: 7299f6f657089ce06a0f98e7e81f8d0f5b7741ce
          path: external/hans

      - name: Download exact R12 selected head
        uses: actions/download-artifact@v4
        with:
          name: r12-scale-evidence
          path: upstream/r12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35665673683

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install evaluator stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf]"
          python -m py_compile scripts/r13_hans_eval.py

      - name: Verify frozen inputs
        run: |
          echo "R12 head:"
          sha256sum upstream/r12/hira-head.pt
          test "$(sha256sum upstream/r12/hira-head.pt | cut -d' ' -f1)" = "0ca95572399d15717e1069545439165e46083c58afea8707cbbadeca67ad3b86"
          test "$(git -C external/hans rev-parse HEAD)" = "7299f6f657089ce06a0f98e7e81f8d0f5b7741ce"

      - name: Run untouched HANS full evaluation
        run: |
          python scripts/r13_hans_eval.py \
            --hans-jsonl external/hans/heuristics_evaluation_set.jsonl \
            --r12-head upstream/r12/hira-head.pt \
            --out artifacts/r13-hans/receipt.json \
            --batch-size 64 \
            --segments 8
          cat artifacts/r13-hans/receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: r13-hans-evidence
          path: artifacts/r13-hans/receipt.json
          if-no-files-found: error

      - name: Package exact R13 repository snapshot
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/NOLANE-HIRA-R13-FULL.zip HEAD
          cp research/R13-HANDOFF.md dist/R13-HANDOFF.md
          sha256sum dist/NOLANE-HIRA-R13-FULL.zip > dist/NOLANE-HIRA-R13-FULL.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: r13-full-bundle
          path: dist
          if-no-files-found: error
