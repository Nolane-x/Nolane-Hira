name: r8-w32-sealed-confirm

on:
  push:
    branches:
      - feat/r8-w32-interaction-semantic-adapter
    paths:
      - "research/R8-W32-ENABLE-CONFIRM"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w32-sealed-confirm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen W32 confirm stack
        run: |
          python -m py_compile \
            src/nmd/w32_interaction_semantic_adapter.py \
            src/nmd/w32_transfer_authority.py \
            src/nmd/w32_transfer_cache.py \
            src/nmd/w32_transfer_eval.py \
            src/nmd/w32_transfer_core.py \
            scripts/r8_w32_confirm.py

      - name: Run W32 frozen contracts
        run: |
          pytest -q \
            tests/test_w32_interaction_semantic_adapter.py \
            tests/test_w32_transfer_authority.py \
            tests/test_w32_transfer_training.py \
            tests/test_symmetric_semantic_runtime.py

      - name: Verify exact frozen W32 training artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10923630412 --jq .digest)" = "sha256:4b8289345f92f7fb45b5af1f4c2e6d2765ca56b4e1e52dffc62968f26b868f92"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10923630412 --jq .expired)" = "false"

      - name: Verify frozen W32 qualification artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10922738458 --jq .digest)" = "sha256:02cafde04b10c075df848d3c0d45b9f9c139b3ae1516a82c2a428e2163131751"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10922738458 --jq .expired)" = "false"

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

  confirm:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w32-interaction-training
          path: inputs/candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36293558503

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece

      - name: Mark first W32 RH RI sealed exposure
        run: echo R8_W32_RH_RI_SEALED_CONFIRM_EXPOSURE_BEGIN

      - name: Run sealed W32 authority
        run: |
          python scripts/r8_w32_confirm.py \
            --t0-dir inputs/T0 \
            --candidate-dir inputs/candidate \
            --out artifacts/w32-confirm

      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w32-confirm/audit.json"))
          assert x["schema_version"]=="r8-w32-interaction-adapter-audit-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {"W32_INTERACTION_ADAPTER_FAIL","HIRA_V0_TRANSFER_CORE_READY"}
          assert x["domains"]==["RH","RI"]
          assert x["case_count"]==192
          assert x["qualification_outcome"]=="W32_REFERENCE_QUALIFIED"
          assert x["t0_checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert x["candidate_checkpoint_sha256"]=="212caf6d5cdb06743979da5d7b64fff5887fc5c2b11e1be91006bc6463e63a5f"
          assert x["candidate_parameter_count"]==6144
          assert x["runtime_state_encode_count"]==192
          assert x["confirm_cache_state_encode_count"]==192
          assert x["candidate_truncation_used"] is False
          assert x["relation_refinement_used"] is False
          assert x["confirm_used_for_training_or_selection"] is False
          assert x["qualification_rows_used_for_training"] is False
          assert x["w31_rows_used"] is False
          assert x["w30_rows_used"] is False
          assert x["w29_rows_used"] is False
          assert x["older_authority_rows_used"] is False
          assert x["reference_outputs_used_as_model_inputs"] is False
          assert x["exact_text_overlap"]==[]
          print("W32_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "quality":x["quality_per_domain"],
            "runtime":x["runtime_per_domain"],
            "transfer":x["transfer"],
            "baseline":x["baseline"]["pooled"],
            "candidate":x["candidate"]["pooled"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w32-authoritative-audit
          path: artifacts/w32-confirm
          if-no-files-found: error
          retention-days: 90
