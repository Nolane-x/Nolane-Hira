name: hira-v1-s34-a0-entropic-relation-transport

on:
  push:
    branches:
      - feat/hira-v1-s34-entropic-relation-transport
    paths:
      - "research/HIRA-V1-S34-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S34 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile S34 stack
        run: |
          python -m py_compile             src/nmd/v1_entropic_relation_transport.py             src/nmd/v1_s34_authority.py             src/nmd/v1_s34_checkpoint.py             scripts/hira_v1_s34_a0_entropic_relation_transport.py             scripts/hira_v1_s34_train_dev.py
      - name: Run S34 and inherited contracts
        run: |
          pytest -q             tests/test_v1_entropic_relation_transport.py             tests/test_v1_s34_authority_checkpoint.py             tests/test_v1_relation_canonicalization.py             tests/test_v1_a13_lora.py             tests/test_v1_evidence_fusion.py             tests/test_v1_gradient_isolated_fusion.py             tests/test_v1_norm_balanced_gradient.py             tests/test_v1_invariance.py             tests/test_v1_triadic_semantic.py

  a0:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S34 source and HF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Verify frozen M4 runtime
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh S34-A0 transport court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s34_a0_entropic_relation_transport.py             --bundle inputs/M4/hira-v0-m4-runtime             --out artifacts/s34-a0
      - name: Verify S34-A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s34-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s34-a0-entropic-relation-transport-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S34_A0_ENTROPIC_RELATION_TRANSPORT_READY"
          assert r["scientific_authority"]=="S34_A0_QUERY_CONDITIONED_ENTROPIC_TRANSPORT_ONLY"
          assert r["semantic_case_count"]==16
          assert r["state_view_count"]==32
          assert r["k"]==4
          assert r["views_per_option"]==2
          assert r["state_relevance_temperature"]==0.1
          assert r["option_relevance_temperature"]==0.1
          assert r["kernel_temperature"]==0.1
          assert r["logit_temperature"]==0.1
          assert r["sinkhorn_iterations"]==12
          assert r["epsilon"]==1e-12
          assert r["operator_added_parameter_count"]==0
          assert r["physical_trainable_parameter_count"]==49152
          assert r["lora_parameter_count"]==16384
          assert r["projection_parameter_count"]==32768
          assert r["runtime_trainable_parameter_count"]==0
          assert r["original_a13_trainable_parameter_count"]==0
          assert r["hira_core_trainable_parameter_count"]==0
          assert r["checkpoint_key_count"]==8
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["treatment_probability_mass_error"]<=1e-6
          assert r["full_k"] is True
          assert r["controlled_q_a_selected_option"]==0
          assert r["controlled_q_b_selected_option"]==1
          assert r["controlled_state_marginal_intervention_max_abs"]>0.0
          assert r["controlled_option_marginal_intervention_max_abs"]>0.0
          assert r["controlled_transport_plan_intervention_max_abs"]>0.0
          for key in (
              "controlled_state_token_permutation_logit_error",
              "controlled_state_token_permutation_signature_error",
              "controlled_option_token_permutation_logit_error",
              "controlled_option_token_permutation_signature_error",
              "controlled_logical_option_permutation_logit_error",
              "controlled_logical_option_permutation_signature_error",
              "controlled_padding_logit_error",
              "controlled_padding_signature_error",
          ):
              assert r[key]<=1e-6
          assert r["controlled_max_row_marginal_residual"]<=1e-4
          assert r["controlled_max_column_marginal_residual"]<=1e-4
          assert r["real_max_row_marginal_residual"]<=1e-4
          assert r["real_max_column_marginal_residual"]<=1e-4
          assert r["controlled_degenerate_finite"] is True
          assert all(v>0.0 for v in r["gradient"]["lora_b_gradient_l1"])
          assert r["gradient"]["projection_gradient_l1"]>0.0
          assert r["gradient"]["relation_block"]>0.0
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Freeze S34-A0 integrity
        run: |
          (cd artifacts/s34-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s34-a0-entropic-relation-transport
          path: artifacts/s34-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
