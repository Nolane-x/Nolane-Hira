name: r8-w6g-second-order-localization

on:
  push:
    branches:
      - feat/r8-w6g-second-order-localization
    paths:
      - "src/nmd/second_order_localization_authority.py"
      - "src/nmd/second_order_localization.py"
      - "scripts/r8_w6g_build_cache.py"
      - "scripts/r8_w6g_evaluate.py"
      - "tests/test_second_order_localization_authority.py"
      - "tests/test_second_order_localization.py"
      - "research/R8-W6G-HANDOFF.md"
      - ".github/workflows/r8-w6g-second-order-localization.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w6g-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W6g stack
        run: |
          python -m py_compile \
            src/nmd/second_order_localization_authority.py \
            src/nmd/second_order_localization.py \
            scripts/r8_w6g_build_cache.py \
            scripts/r8_w6g_evaluate.py \
            tests/test_second_order_localization_authority.py \
            tests/test_second_order_localization.py
      - name: Run W6g and production contracts
        run: |
          pytest -q \
            tests/test_second_order_localization_authority.py \
            tests/test_second_order_localization.py \
            tests/test_competitive_coarse_runtime.py \
            tests/test_typed_competitive_cache.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen W6e artifact digests and availability
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805971002 --jq .digest)" = "sha256:d08f00881e40a3aa5e8a24995299c1f9cb15d34a34b9b53fa544718165bd4fe2"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .digest)" = "sha256:fe0f176514b1cee0964212978b839b351ba6f35260ce0a035a1346680fc855bd"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805871471 --jq .digest)" = "sha256:fcc542322965108095f9c689ace970bfdd779905471140fb3318844ddba30a80"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805971002 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805871471 --jq .expired)" = "false"

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-scorer-only
          path: inputs/scorer-only
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-primary
          path: inputs/joint-primary
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-replica
          path: inputs/joint-replica
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202

      - name: Verify exact frozen checkpoint receipts and file hashes
        run: |
          python - <<'PY'
          import hashlib, json
          expected = {
              "inputs/scorer-only": {
                  "candidate": "multi-source-scorer-only",
                  "hira": "925f74094ac4ae583c015ea2a0be32ec692d885ec64dcf9cf3d94b64be0ccf42",
                  "scorer": "1b7ec81488c2aa79ac99ed8eea77c903995523c58e5a58eff1d339d167841918",
                  "epoch": 5,
                  "seed": 1409,
                  "trainable": 32769,
              },
              "inputs/joint-primary": {
                  "candidate": "multi-source-joint-primary",
                  "hira": "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588",
                  "scorer": "6d5a7f2d3ed63ecd756181b1cb54e4704f68e5f74983a897f0a68fb4d1d63d2e",
                  "epoch": 6,
                  "seed": 1409,
                  "trainable": 454928,
              },
              "inputs/joint-replica": {
                  "candidate": "multi-source-joint-replica",
                  "hira": "d55766e6f1999bbb73c376c708c28271cf5d7af7138129c46d356ac7d87eadae",
                  "scorer": "fd118f19d6a38cd97ec8d3a8d47a10addd47bf0921a2edf825e70634225cc9e5",
                  "epoch": 6,
                  "seed": 2411,
                  "trainable": 454928,
              },
          }
          def digest(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          for path, e in expected.items():
              x=json.load(open(path+"/receipt.json"))
              assert x["schema_version"] == "r8-w6e-candidate-receipt-v1"
              assert x["status"] == "PASS"
              assert x["candidate"] == e["candidate"]
              assert x["selected_epoch"] == e["epoch"]
              assert x["global_seed"] == e["seed"]
              assert x["trainable_parameter_count"] == e["trainable"]
              assert x["total_parameter_count"] == 454928
              assert x["confirm_l_exposed"] is False
              assert x["confirm_m_exposed"] is False
              assert x["hira_sha256"] == e["hira"]
              assert x["scorer_sha256"] == e["scorer"]
              assert digest(path+"/hira.pt") == e["hira"]
              assert digest(path+"/scorer.pt") == e["scorer"]
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6g-frozen-w6e-checkpoints
          path: inputs
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh W6g base-centric diagnostic cache
        run: |
          python scripts/r8_w6g_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["schema_version"] == "r8-w6g-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 192
          assert x["view_count"] == 1920
          assert x["domain_base_counts"] == {"Q":64,"R":64,"S":64}
          assert set(x["view_counts"]) == {
              "pair-entity","pair-location","pair-anomaly","pair-channel",
              "core-k8","far64","dense-entity64","dense-location64",
              "dense-anomaly64","dense-channel64",
          }
          assert set(x["view_counts"].values()) == {192}
          assert x["state_encode_calls"] == 192
          assert x["state_encodes_per_base"] == 1.0
          assert x["state_encodes_per_view"] == 0.1
          assert x["field_probe_encoder_batches"] == 192
          assert x["field_probe_texts_per_base"] == 20
          assert x["field_probe_text_count"] == 3840
          assert len(x["case_id_sha256"]) == 64
          assert len(x["semantic_view_sha256"]) == 64
          assert set(x["domain_semantic_view_sha256"]) == {"Q","R","S"}
          assert all(len(v)==64 for v in x["domain_semantic_view_sha256"].values())
          assert x["prior_authority_value_overlap"] == []
          assert x["training_performed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["w6d_confirm_rows_used"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6g-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6g-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6g-frozen-w6e-checkpoints
          path: inputs/checkpoints
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fixed-checkpoint evaluation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run second-order high-K localization
        run: |
          python scripts/r8_w6g_evaluate.py \
            --cache inputs/cache/diagnostics.pt \
            --scorer-only inputs/checkpoints/scorer-only \
            --joint-primary inputs/checkpoints/joint-primary \
            --joint-replica inputs/checkpoints/joint-replica \
            --out artifacts/localization
          cat artifacts/localization/localization.json
      - name: Verify diagnostic scope and frozen outcome vocabulary
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("artifacts/localization/localization.json"))
          assert x["schema_version"] == "r8-w6g-second-order-localization-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 192
          assert x["view_count"] == 1920
          assert x["state_encodes_per_base"] == 1.0
          assert x["probability_mass_max_error"] <= 1e-6
          assert x["training_performed"] is False
          assert x["w6b_confirm_rows_used"] is False
          assert x["w6c_confirm_rows_used"] is False
          assert x["w6d_confirm_rows_used"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          assert set(x["candidate_provenance"]) == {
              "multi-source-scorer-only",
              "multi-source-joint-primary",
              "multi-source-joint-replica",
          }
          allowed = {
              "FIELD_SEMANTIC_COLLAPSE",
              "ROLE_BINDING_COLLAPSE",
              "IDF_AGGREGATION_INTERFERENCE",
              "IDF_COMMON_MODE_INTERFERENCE",
              "MIXED_IDF_PATHWAY_INTERFERENCE",
              "DENSITY_NEAR_NEIGHBOR_LIMIT",
              "NO_SECOND_ORDER_LOCALIZATION",
          }
          for candidate in x["results"].values():
              assert set(candidate["per_domain"]) == {"Q","R","S"}
              for domain in candidate["per_domain"].values():
                  assert set(domain["roles"]) == {
                      "entity","location","anomaly","channel"
                  }
                  for role in domain["roles"].values():
                      assert role["classification"]["classification"] in allowed
                      assert role["trajectory"]["complete_base_count"] == 64
                      for context in ("pair","core_k8","far64","dense64"):
                          assert role[context]["n"] == 64
                          assert math.isfinite(role[context]["native_margin_mean"])
                          assert math.isfinite(role[context]["isolated_value_margin_mean"])
                          assert math.isfinite(role[context]["role_value_phrase_margin_mean"])
              for block in candidate["pooled"]["fullset"].values():
                  assert block["probability_mass_max_error"] <= 1e-6
          stability=x["stability"]
          assert stability["diagnostic_outcome"] in {
              "STABLE_SECOND_ORDER_LOCALIZATION",
              "MIXED_STABLE_SECOND_ORDER_LOCALIZATION",
              "NO_STABLE_SECOND_ORDER_LOCALIZATION",
          }
          if stability["rescue_lane_authorized"]:
              assert stability["diagnostic_outcome"] == "STABLE_SECOND_ORDER_LOCALIZATION"
              assert len(stability["stable_mechanism_classes"]) == 1
          else:
              assert stability["diagnostic_outcome"] != "STABLE_SECOND_ORDER_LOCALIZATION"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6g-localization
          path: artifacts/localization
          if-no-files-found: error
          retention-days: 90
