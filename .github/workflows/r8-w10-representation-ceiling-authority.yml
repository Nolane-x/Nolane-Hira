name: r8-w10-representation-ceiling-authority

on:
  push:
    branches:
      - feat/r8-w10-representation-ceiling
    paths:
      - ".github/workflows/r8-w10-representation-ceiling-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w10-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W10 stack
        run: |
          python -m py_compile             src/nmd/representation_ceiling.py             src/nmd/representation_ceiling_authority.py             src/nmd/representation_ceiling_cache.py             src/nmd/representation_ceiling_eval.py             scripts/r8_w10_build_cache.py             scripts/r8_w10_evaluate.py
      - name: Run frozen W10 contracts
        run: pytest -q tests/test_representation_ceiling.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W9 freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .digest)" = "sha256:6f0eee6ae58d489f0486372f0311e0f420065a0d9499185af7904377ae6a4712"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10858424139 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w9-freeze
          path: inputs/freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36122220588
      - name: Verify W9 frozen checkpoint provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("inputs/freeze/freeze.json").read_text())
          assert x["schema_version"] == "r8-w9-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          rows={r["candidate"]:r for r in x["candidates"]}
          assert {"frozen-w6e-control","projection-semantic-control"} <= set(rows)
          assert rows["frozen-w6e-control"]["scorer_sha256"] == "6d5a7f2d3ed63ecd756181b1cb54e4704f68e5f74983a897f0a68fb4d1d63d2e"
          assert rows["projection-semantic-control"]["scorer_sha256"] == "8078acd153be4cadf109713faa1efede0c58c31397f41db7f5aff3a12ab74102"
          assert rows["frozen-w6e-control"]["hira_sha256"] == "d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588"
          assert x["w8_diagnostic_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          print("w10_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w10-frozen-w9-checkpoints
          path: inputs/freeze
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first eligible W10 exposure
        run: echo R8_W10_BF_BI_A13_EXPOSURE_BEGIN
      - name: Build fresh representation cache
        run: |
          python scripts/r8_w10_build_cache.py --out artifacts/w10-cache
          cat artifacts/w10-cache/receipt.json
      - name: Verify cache receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w10-cache/receipt.json"))
          assert x["schema_version"] == "r8-w10-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 256
          assert x["view_count"] == 1536
          assert x["state_encode_calls"] == 256
          assert x["state_encodes_per_base"] == 1.0
          assert x["domain_base_counts"] == {"BF":64,"BG":64,"BH":64,"BI":64}
          assert x["prior_exact_text_overlap"] == []
          assert x["training_performed"] is False
          assert x["w8_diagnostic_rows_used"] is False
          assert x["w9_confirm_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print("w10_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w10-representation-cache
          path: artifacts/w10-cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w10-frozen-w9-checkpoints
          path: inputs/freeze
      - uses: actions/download-artifact@v4
        with:
          name: r8-w10-representation-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen evaluator stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]"
      - name: Evaluate frozen representation operators
        run: |
          python scripts/r8_w10_evaluate.py             --cache inputs/cache/diagnostic.pt             --freeze inputs/freeze/freeze.json             --checkpoints inputs/freeze             --out artifacts/w10-audit
          cat artifacts/w10-audit/audit.json
      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w10-audit/audit.json"))
          assert x["schema_version"] == "r8-w10-representation-ceiling-v1"
          assert x["status"] == "PASS"
          assert x["training_performed"] is False
          assert x["cached_base_count"] == 256
          assert x["cached_view_count"] == 1536
          assert x["state_encodes_per_base"] == 1.0
          assert x["probability_mass_max_error"] <= 1e-6
          assert set(x["operators"]) == {"A0","A1","P0","P1","S0","S1","R0"}
          assert x["reference_model"] == "sentence-transformers/all-MiniLM-L6-v2"
          assert x["reference_revision"] == "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
          assert x["reference_is_hira_candidate"] is False
          assert x["outcome"] in {
              "STABLE_REPRESENTATION_CEILING_LOCALIZATION",
              "MIXED_REPRESENTATION_CEILING_LOCALIZATION",
              "REPRESENTATION_CEILING_UNRESOLVED",
          }
          assert x["w8_diagnostic_rows_used"] is False
          assert x["w9_confirm_rows_used"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          print(x["outcome"], x["stable_classification"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w10-representation-ceiling-audit
          path: artifacts/w10-audit
          if-no-files-found: error
          retention-days: 90
