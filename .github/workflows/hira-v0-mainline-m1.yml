name: hira-v0-mainline-m1

on:
  push:
    branches:
      - feat/hira-v0-mainline-m1-reliability
    paths:
      - "src/nmd/mainline.py"
      - "src/nmd/mainline_reliability.py"
      - "src/nmd/mainline_m1_authority.py"
      - "src/nmd/mainline_m1_cache.py"
      - "src/nmd/mainline_m1_training.py"
      - "tests/test_mainline.py"
      - "tests/test_mainline_reliability.py"
      - "tests/test_mainline_m1_authority.py"
      - "tests/test_mainline_m1_cache.py"
      - "tests/test_mainline_m1_training.py"
      - "research/HIRA-V0-MAINLINE-M1-HANDOFF.md"
      - ".github/workflows/hira-v0-mainline-m1.yml"

permissions:
  contents: read

concurrency:
  group: hira-v0-mainline-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile M1 mechanism
        run: |
          python -m py_compile \
            src/nmd/mainline.py \
            src/nmd/mainline_reliability.py \
            src/nmd/mainline_m1_authority.py \
            src/nmd/mainline_m1_cache.py \
            src/nmd/mainline_m1_training.py \
            tests/test_mainline_reliability.py \
            tests/test_mainline_m1_authority.py

      - name: Run M1 fail-closed contracts
        run: |
          pytest -q \
            tests/test_mainline_reliability.py \
            tests/test_mainline_m1_authority.py \
            tests/test_mainline_m1_cache.py \
            tests/test_mainline_m1_training.py \
            tests/test_mainline.py \
            tests/test_typed_reliability_calibration.py

      - name: Run OOD and runtime regressions
        run: |
          pytest -q \
            tests/test_runtime.py \
            tests/test_symmetric_semantic_runtime.py
