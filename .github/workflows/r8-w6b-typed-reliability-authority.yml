name: r8-w6b-typed-reliability-authority

on:
  push:
    branches:
      - feat/r8-w6b-typed-reliability-authority
    paths:
      - "src/nmd/typed_competitive_authority.py"
      - "src/nmd/typed_competitive_cache.py"
      - "scripts/r8_w6b_build_cache.py"
      - "scripts/r8_w6b_train_candidate.py"
      - "scripts/r8_w6b_select_candidate.py"
      - "scripts/r8_w6b_confirm.py"
      - "tests/test_typed_competitive_authority.py"
      - "tests/test_typed_competitive_cache.py"
      - "research/R8-W6B-HANDOFF.md"
      - ".github/workflows/r8-w6b-typed-reliability-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w6b-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6b authority stack
        run: |
          python -m py_compile             src/nmd/typed_competitive_authority.py             src/nmd/typed_competitive_cache.py             scripts/r8_w6b_build_cache.py             scripts/r8_w6b_train_candidate.py             scripts/r8_w6b_select_candidate.py             scripts/r8_w6b_confirm.py
      - name: Run frozen W6b contracts
        run: |
          pytest -q             tests/test_typed_competitive_authority.py             tests/test_typed_competitive_cache.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen upstream artifact metadata
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10706135649 --jq .digest)" = "sha256:8a2efd31a6ccea3b987957d328c4b73267ab00ff9024c469bcb7f3cd578d5d92"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10706135649 --jq .expired)" = "false"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10764240783 --jq .digest)" = "sha256:f3c0ff451c976caff10b8098b010abc7b8758d4c4797110c4cce18943edb4f74"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10764240783 --jq .expired)" = "false"
      - name: Download frozen W3 head
        uses: actions/download-artifact@v4
        with:
          name: r8-w3-selected-head
          path: inputs/frozen/w3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35748778854
      - name: Download frozen W5i forward scorer
        uses: actions/download-artifact@v4
        with:
          name: r8-w5i-candidate-idf-competitive-forward-proj128
          path: inputs/frozen/w5i
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35884130186
      - name: Verify frozen upstream receipts and file hashes
        run: |
          test "$(sha256sum inputs/frozen/w3/hira-head.pt | cut -d' ' -f1)" = "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"
          test "$(sha256sum inputs/frozen/w5i/matcher.pt | cut -d' ' -f1)" = "5ce9cdceb5a87c8b18b8d50e68396f23184e1dfb9acad338f25f24277d438a0d"
          python - <<'PY'
          import json
          w3=json.load(open("inputs/frozen/w3/selection.json"))
          assert w3["status"] == "PASS"
          assert w3["selected_candidate"] == "r15-balanced-lr1e3"
          assert w3["selected_config"]["selected_epoch"] == 7
          assert w3["selected_head_sha256"] == "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"
          assert w3["final_test_exposed"] is False
          w5=json.load(open("inputs/frozen/w5i/receipt.json"))
          assert w5["status"] == "PASS"
          assert w5["candidate"] == "idf-competitive-forward-proj128"
          assert w5["matcher_sha256"] == "5ce9cdceb5a87c8b18b8d50e68396f23184e1dfb9acad338f25f24277d438a0d"
          assert w5["trainable_parameter_count"] == 32769
          assert w5["confirm_exposed"] is False
          assert w5["forbidden_benchmark_data_used"] is False
          assert w5["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6b-frozen-upstream
          path: inputs/frozen
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh W6b TRAIN+DEV cache
        run: |
          python scripts/r8_w6b_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["status"] == "PASS"
          assert x["train_seed"] == 161127
          assert x["dev_seed"] == 162229
          assert x["reserved_confirm_seed"] == 163331
          assert x["train_case_count"] == 320
          assert x["dev_case_count"] == 128
          assert x["train_decision_count"] == 1600
          assert x["dev_decision_count"] == 640
          assert x["prior_w5_value_overlap"] == []
          assert x["state_encodes_per_case_train"] == 1.0
          assert x["state_encodes_per_case_dev"] == 1.0
          assert x["confirm_exposed"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6b-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 14

  candidate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - legacy-w3-joint
          - competitive-w5i-joint
          - competitive-w5i-scorer-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6b-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6b-frozen-upstream
          path: inputs/frozen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install cached training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Train W6b candidate
        run: |
          python scripts/r8_w6b_train_candidate.py             --train-cache inputs/cache/train.pt             --dev-cache inputs/cache/dev.pt             --w3-head inputs/frozen/w3/hira-head.pt             --w5i-scorer inputs/frozen/w5i/matcher.pt             --candidate "${{ matrix.candidate }}"             --out "artifacts/candidates/${{ matrix.candidate }}"
          cat "artifacts/candidates/${{ matrix.candidate }}/receipt.json"
          python - "${{ matrix.candidate }}" <<'PY'
          import json, pathlib, sys
          name=sys.argv[1]
          x=json.load(open(pathlib.Path("artifacts/candidates")/name/"receipt.json"))
          assert x["status"] == "PASS"
          assert x["candidate"] == name
          expected_trainable={
            "legacy-w3-joint": 422159,
            "competitive-w5i-joint": 454928,
            "competitive-w5i-scorer-only": 32769,
          }[name]
          expected_total=422159 if name=="legacy-w3-joint" else 454928
          assert x["trainable_parameter_count"] == expected_trainable
          assert x["total_parameter_count"] == expected_total
          assert x["epochs"] == 6
          assert x["global_seed"] == 809
          assert x["full_k_only"] is True
          assert x["adaptive_budget"] is False
          assert x["confirm_exposed"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6b-candidate-${{ matrix.candidate }}
          path: artifacts/candidates/${{ matrix.candidate }}
          if-no-files-found: error
          retention-days: 14

  select:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w6b-candidate-*
          path: inputs/candidates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install selector stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Freeze competitive and legacy checkpoints on DEV
        run: |
          python scripts/r8_w6b_select_candidate.py             --candidates inputs/candidates             --out artifacts/selected
          cat artifacts/selected/selection.json
          python - <<'PY'
          import json
          x=json.load(open("artifacts/selected/selection.json"))
          assert x["status"] == "PASS"
          assert x["selection_authority"] == "DEV_ONLY"
          assert x["selected_competitive_candidate"] in {
              "competitive-w5i-joint",
              "competitive-w5i-scorer-only",
          }
          assert x["legacy_candidate"] == "legacy-w3-joint"
          assert len(x["candidates"]) == 3
          assert x["base_w3_head_sha256"] == "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"
          assert x["base_w5i_scorer_sha256"] == "5ce9cdceb5a87c8b18b8d50e68396f23184e1dfb9acad338f25f24277d438a0d"
          assert x["confirm_exposed"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6b-selected
          path: artifacts/selected
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6b-selected
          path: inputs/selected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Evaluate untouched W6b CONFIRM
        run: |
          python scripts/r8_w6b_confirm.py             --selection inputs/selected/selection.json             --competitive-hira inputs/selected/competitive-hira.pt             --competitive-scorer inputs/selected/competitive-scorer.pt             --legacy-hira inputs/selected/legacy-hira.pt             --out artifacts/confirm
          cat artifacts/confirm/confirm.json
      - name: Verify frozen scientific scope
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/confirm.json"))
          assert x["schema_version"] == "r8-w6b-confirm-v1"
          assert x["status"] == "PASS"
          assert x["confirm_seed"] == 163331
          assert x["confirm_generated_after_selection_freeze"] is True
          assert x["confirm_case_count"] == 160
          assert x["confirm_decision_count"] == 800
          assert x["state_encodes_per_case"] == 1.0
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["w5_semantic_confirm_rows_used"] is False
          assert x["campaign_cells_populated"] == 0
          assert x["selected"]["probability_mass_max_error"] <= 1e-6
          assert x["legacy_control"]["probability_mass_max_error"] <= 1e-6
          assert x["selected"]["source_state_encodes_per_case"] == 1.0
          assert x["legacy_control"]["source_state_encodes_per_case"] == 1.0
          assert x["verdict"] in {
              "PRODUCTION_COMPETITIVE_RESCUE",
              "PRODUCTION_LEGACY_ALREADY_STRONG",
              "PRODUCTION_COMPETITIVE_PARTIAL",
              "PRODUCTION_COMPETITIVE_FAIL",
          }
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6b-confirm
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90
