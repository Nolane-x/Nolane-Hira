name: hira-v1-s64-a0-context-projected-reliability-gate

on:
  push:
    branches:
      - feat/hira-v1-s64-context-projected-reliability-gate
    paths:
      - "research/HIRA-V1-S64-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s63-learned-set-reliability-gate
          path: inputs/S63
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37314015283

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S64 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S64 contracts
        run: |
          python -m py_compile src/nmd/v1_context_projected_reliability_gate.py scripts/hira_v1_s64_a0_context_projected_reliability_gate.py
          pytest -q tests/test_v1_context_projected_reliability_gate.py tests/test_v1_s64_a0_harness.py tests/test_v1_s64_a0_workflow.py tests/test_v1_learned_set_reliability_gate.py tests/test_v1_reliability_supervised_adaptive_gate.py tests/test_v1_confidence_adaptive_bounded_hybrid.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py

      - name: Verify frozen S63 parent evidence
        run: |
          (cd inputs/S63 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:dcb69358dfa97f3644198534faa1c2f5f214b4f1773d79008eec13cafaf2a97e"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S63/result.json").read_text())
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S63_LEARNED_SET_RELIABILITY_GATE_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S63_FRESH_LEARNED_SET_RELIABILITY_GATE"
          assert r["seed"]==84001
          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one S64 mechanical A0 court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s64_a0_context_projected_reliability_gate.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --parent-s63-result inputs/S63/result.json \
            --out artifacts/s64-a0

      - name: Verify S64 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("artifacts/s64-a0")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s64-a0-context-projected-reliability-gate-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S64_A0_CONTEXT_PROJECTED_RELIABILITY_GATE_READY"
          assert r["scientific_authority"]=="S64_A0_CONTEXT_PROJECTED_RELIABILITY_GATE_ONLY"
          assert r["seed"]==85001

          parent=r["parent_s63"]
          assert parent["merged_main"]=="4fcb58f0c35e2feca841b08f6f560c092ae600fd"
          assert parent["scientific_run"]==37314015283
          assert parent["artifact_id"]==11347706059
          assert parent["artifact_digest"]=="sha256:dcb69358dfa97f3644198534faa1c2f5f214b4f1773d79008eec13cafaf2a97e"
          assert parent["verdict"]=="CASE_B"

          assert r["correction_trainable_parameter_count"]==114688
          assert r["pairwise_trainable_parameter_count"]==32832
          assert r["reference_gate_parameter_count"]==61
          assert r["treatment_gate_parameter_count"]==61
          assert r["added_treatment_parameter_count"]==0
          assert r["reference_trainable_tensor_names"]==["W_phi","b_out","b_phi","w_out"]
          assert r["treatment_trainable_tensor_names"]==["W_phi","b_out","b_phi","w_out"]
          assert r["learned_initialization_bit_identical"] is True

          assert r["context_dimension"]==512
          assert r["projection_dimension"]==4
          assert r["projection_seed"]==64064
          assert r["projection_shape"]==[4,512]
          assert r["projection_requires_grad"] is False
          assert len(r["projection_digest"])==64
          assert r["projection_rademacher_exact"] is True
          assert r["real_context_shape"][-1]==512
          assert r["real_context_requires_grad"] is False

          assert r["initial_alpha_max_abs_error"]<=1e-7
          assert r["option_permutation_alpha_max_abs_error"]<=1e-6
          assert r["context_affine_alpha_max_abs_error"]<=1e-6
          assert r["flat_context_finite"] is True
          assert r["identity_override_max_abs_error"]==0.0
          assert r["residual_bound_violation_max"]<=1e-7
          assert r["max_probability_mass_error"]<=1e-6
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True

          assert r["inherited_target_values"]==[1,0]
          assert r["reference_initial_W_phi_gradient_l1"]==0.0
          assert r["reference_initial_b_phi_gradient_l1"]==0.0
          assert r["reference_initial_w_out_gradient_l1"]>0.0
          assert r["reference_initial_b_out_gradient_l1"]>0.0
          assert r["treatment_initial_W_phi_gradient_l1"]==0.0
          assert r["treatment_initial_b_phi_gradient_l1"]==0.0
          assert r["treatment_initial_w_out_gradient_l1"]>0.0
          assert r["treatment_initial_b_out_gradient_l1"]>0.0
          assert r["treatment_post_warm_W_phi_gradient_l1"]>0.0
          assert r["treatment_post_warm_b_phi_gradient_l1"]>0.0
          assert r["gradient_to_fused_pairwise_context_zero"] is True
          assert r["production_initial_state_unchanged"] is True

          assert r["reference_gradient_to_upstream_zero"] is True
          assert r["treatment_gradient_to_upstream_zero"] is True
          assert r["alpha_probe"]==0.35
          assert r["target_tolerance"]==1e-8
          assert r["teacher_dependency"] is False
          assert r["dev_target_dependency"] is False
          assert r["self_anchor_dependency"] is False
          assert r["pairwise_only_final_path"] is False
          assert r["one_encoder_state_once"] is True
          assert r["matched_gate_checkpoint_replay_max_abs_error"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["fresh_train_dev_exposed"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S64 A0 integrity
        run: |
          (cd artifacts/s64-a0 && sha256sum result.json matched-gates.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s64-a0-context-projected-reliability-gate
          path: artifacts/s64-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
