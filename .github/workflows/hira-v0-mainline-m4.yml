name: hira-v0-mainline-m4

on:
  push:
    branches:
      - feat/hira-v0-mainline-m4-runtime
    paths:
      - "src/nmd/schema.py"
      - "src/nmd/mainline.py"
      - "tests/test_schema_batching.py"
      - "tests/test_schema_cache_bounds.py"
      - "tests/test_mainline_m4_runtime.py"
      - "scripts/hira_v0_m4_schema_benchmark.py"
      - ".github/workflows/hira-v0-mainline-m4-schema-benchmark.yml"
      - "research/HIRA-V0-MAINLINE-M4-HANDOFF.md"
      - ".github/workflows/hira-v0-mainline-m4.yml"

permissions:
  contents: read

concurrency:
  group: hira-v0-mainline-m4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile M4 stack
        run: |
          python -m py_compile \
            src/nmd/schema.py \
            src/nmd/mainline.py \
            tests/test_schema_batching.py \
            tests/test_schema_cache_bounds.py \
            tests/test_mainline_m4_runtime.py \
            scripts/hira_v0_m4_schema_benchmark.py

      - name: Run M4 contracts
        run: |
          pytest -q \
            tests/test_schema_batching.py \
            tests/test_mainline_m4_runtime.py \
            tests/test_runtime.py \
            tests/test_mainline.py \
            tests/test_mainline_high_k.py
