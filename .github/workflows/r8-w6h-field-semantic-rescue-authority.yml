name: r8-w6h-field-semantic-rescue-authority

on:
  push:
    branches:
      - feat/r8-w6h-field-semantic-rescue
    paths:
      - "src/nmd/field_semantic_rescue.py"
      - "src/nmd/field_semantic_rescue_authority.py"
      - "scripts/r8_w6h_build_cache.py"
      - "scripts/r8_w6h_train_candidate.py"
      - "scripts/r8_w6h_freeze_candidates.py"
      - "scripts/r8_w6h_confirm.py"
      - "tests/test_field_semantic_rescue.py"
      - "tests/test_field_semantic_rescue_authority.py"
      - ".github/workflows/r8-w6h-field-semantic-rescue-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w6h-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6h stack
        run: |
          python -m py_compile             src/nmd/field_semantic_rescue.py             src/nmd/field_semantic_rescue_authority.py             scripts/r8_w6h_build_cache.py             scripts/r8_w6h_train_candidate.py             scripts/r8_w6h_freeze_candidates.py             scripts/r8_w6h_confirm.py             tests/test_field_semantic_rescue.py             tests/test_field_semantic_rescue_authority.py
      - name: Run W6h and production contracts
        run: |
          pytest -q             tests/test_field_semantic_rescue.py             tests/test_field_semantic_rescue_authority.py             tests/test_competitive_coarse_runtime.py             tests/test_typed_competitive_cache.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W6e joint-primary artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .digest)" = "sha256:fe0f176514b1cee0964212978b839b351ba6f35260ce0a035a1346680fc855bd"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10805567861 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6e-candidate-multi-source-joint-primary
          path: inputs/upstream
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35993402202
      - name: Verify W6e receipt and checkpoint hashes
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("inputs/upstream")
          x=json.load(open(root/"receipt.json"))
          assert x["schema_version"] == "r8-w6e-candidate-receipt-v1"
          assert x["status"] == "PASS"
          assert x["candidate"] == "multi-source-joint-primary"
          assert x["selected_epoch"] == 6
          assert x["global_seed"] == 1409
          assert x["trainable_parameter_count"] == 454928
          assert x["total_parameter_count"] == 454928
          assert x["confirm_l_exposed"] is False
          assert x["confirm_m_exposed"] is False
          expected={
              "hira.pt":"d1d3359b01f0ef863de226bf51144c295eebafdeae6245fdd6d68d1db22b2588",
              "scorer.pt":"6d5a7f2d3ed63ecd756181b1cb54e4704f68e5f74983a897f0a68fb4d1d63d2e",
          }
          for name, digest in expected.items():
              h=hashlib.sha256((root/name).read_bytes()).hexdigest()
              assert h == digest, (name,h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6h-frozen-w6e-joint-primary
          path: inputs/upstream
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen encoder stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Build fresh T-W TRAIN and DEV-X cache
        run: |
          python scripts/r8_w6h_build_cache.py --out artifacts/cache
          cat artifacts/cache/receipt.json
      - name: Verify cache and semantic-pair contracts
        run: |
          python - <<'PY'
          import json, torch
          x=json.load(open("artifacts/cache/receipt.json"))
          assert x["schema_version"] == "r8-w6h-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["train_case_count"] == 384
          assert x["dev_case_count"] == 192
          assert x["train_decision_count"] == 1920
          assert x["dev_decision_count"] == 960
          assert x["train_domain_counts"] == {"T":96,"U":96,"V":96,"W":96}
          assert x["state_encodes_per_case_train"] == 1.0
          assert x["state_encodes_per_case_dev"] == 1.0
          assert x["prior_authority_value_overlap"] == []
          assert x["confirm_y_exposed"] is False
          assert x["confirm_z_exposed"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["w6g_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          for path in ("artifacts/cache/train.pt","artifacts/cache/dev-x.pt"):
              cache=torch.load(path,map_location="cpu",weights_only=True)
              for case in cache["cases"]:
                  labels=case["decisions"][0]["one_field_negative_indices"]
                  assert set(int(k) for k in labels) == {0,1,2,3}
                  assert all(len(v) >= 1 for v in labels.values())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6h-cache
          path: artifacts/cache
          if-no-files-found: error
          retention-days: 30

  candidate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - frozen-joint-control
          - projection-retune-control
          - semantic-residual-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6h-cache
          path: inputs/cache
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6h-frozen-w6e-joint-primary
          path: inputs/upstream
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[research]"
      - name: Train/freeze candidate on DEV-X only
        run: |
          python scripts/r8_w6h_train_candidate.py             --train-cache inputs/cache/train.pt             --dev-cache inputs/cache/dev-x.pt             --w6e-hira inputs/upstream/hira.pt             --w6e-scorer inputs/upstream/scorer.pt             --candidate "${{ matrix.candidate }}"             --out "artifacts/candidate"
          cat artifacts/candidate/receipt.json
      - name: Verify candidate receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/candidate/receipt.json"))
          assert x["schema_version"] == "r8-w6h-candidate-receipt-v1"
          assert x["status"] == "PASS"
          assert x["candidate"] in {
              "frozen-joint-control",
              "projection-retune-control",
              "semantic-residual-adapter",
          }
          expected={
              "frozen-joint-control":0,
              "projection-retune-control":32769,
              "semantic-residual-adapter":8192,
          }
          assert x["trainable_parameter_count"] == expected[x["candidate"]]
          if x["candidate"] == "frozen-joint-control":
              assert x["selected_epoch"] == 0
          else:
              assert 1 <= x["selected_epoch"] <= 6
              assert len(x["history"]) == 6
              assert x["optimizer_case_steps"] == 2304
          assert x["hira_frozen"] is True
          assert x["confirm_y_exposed"] is False
          assert x["confirm_z_exposed"] is False
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["w6g_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6h-candidate-${{ matrix.candidate }}
          path: artifacts/candidate
          if-no-files-found: error
          retention-days: 30

  freeze:
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w6h-candidate-*
          path: inputs/candidates
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "."
      - name: Freeze all DEV-X checkpoints
        run: |
          python scripts/r8_w6h_freeze_candidates.py             --candidates inputs/candidates             --out artifacts/freeze
          cat artifacts/freeze/freeze.json
      - name: Verify freeze boundary
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/freeze/freeze.json"))
          assert x["schema_version"] == "r8-w6h-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          assert x["selection_authority"] == "DEV_X_INDEPENDENT_PER_CANDIDATE"
          assert {r["candidate"] for r in x["candidates"]} == {
              "frozen-joint-control",
              "projection-retune-control",
              "semantic-residual-adapter",
          }
          assert x["confirm_y_exposed"] is False
          assert x["confirm_z_exposed"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6h-freeze
          path: artifacts/freeze
          if-no-files-found: error
          retention-days: 30

  confirm:
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w6h-freeze
          path: inputs/freeze
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Materialize untouched Y/Z and evaluate once
        run: |
          python scripts/r8_w6h_confirm.py             --freeze inputs/freeze/freeze.json             --checkpoints inputs/freeze             --out artifacts/confirm
          cat artifacts/confirm/confirm.json
      - name: Verify immutable authority result
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/confirm/confirm.json"))
          assert x["schema_version"] == "r8-w6h-confirm-v1"
          assert x["status"] == "PASS"
          assert x["confirm_generated_after_all_dev_freezes"] is True
          assert x["confirm_y_case_count"] == 192
          assert x["confirm_z_case_count"] == 192
          assert x["confirm_y_decision_count"] == 960
          assert x["confirm_z_decision_count"] == 960
          assert x["state_encodes_per_case_y"] == 1.0
          assert x["state_encodes_per_case_z"] == 1.0
          assert set(x["paths"]) == {"Y","Z"}
          for domain in ("Y","Z"):
              assert set(x["paths"][domain]) == {
                  "frozen-joint-control",
                  "projection-retune-control",
                  "semantic-residual-adapter",
              }
          assert x["verdict"] in {
              "FIELD_SEMANTIC_RESCUE",
              "FIELD_SEMANTIC_PARTIAL",
              "FIELD_SEMANTIC_FAIL",
          }
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6f_diagnostic_rows_used"] is False
          assert x["w6g_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w6h-confirm
          path: artifacts/confirm
          if-no-files-found: error
          retention-days: 90
