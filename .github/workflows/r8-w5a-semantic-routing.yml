name: r8-w5a-semantic-routing

on:
  push:
    branches:
      - feat/r8-w5a-semantic-routing
    paths:
      - "src/nmd/semantic_routing_curriculum.py"
      - "scripts/r8_w5a_build_cache.py"
      - "scripts/r8_w5a_train_candidate.py"
      - "scripts/r8_w5a_select_candidate.py"
      - "scripts/r8_w5a_confirm.py"
      - "tests/test_semantic_routing_curriculum.py"
      - "research/R8-W5A-HANDOFF.md"
      - ".github/workflows/r8-w5a-semantic-routing.yml"
  pull_request:
    paths:
      - "src/nmd/semantic_routing_curriculum.py"
      - "scripts/r8_w5a_build_cache.py"
      - "scripts/r8_w5a_train_candidate.py"
      - "scripts/r8_w5a_select_candidate.py"
      - "scripts/r8_w5a_confirm.py"
      - "tests/test_semantic_routing_curriculum.py"
      - "research/R8-W5A-HANDOFF.md"
      - ".github/workflows/r8-w5a-semantic-routing.yml"

concurrency:
  group: r8-w5a-semantic-routing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile W5a modules
        run: |
          python -m py_compile             src/nmd/semantic_routing_curriculum.py             scripts/r8_w5a_build_cache.py             scripts/r8_w5a_train_candidate.py             scripts/r8_w5a_select_candidate.py             scripts/r8_w5a_confirm.py

      - name: Run W5a unit tests
        run: |
          pytest -q             tests/test_semantic_routing_curriculum.py             tests/test_hira.py             tests/test_runtime.py

  cache:
    if: github.event_name == 'push'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Download exact R15 head
        uses: actions/download-artifact@v4
        with:
          name: r15-retention-evidence
          path: inputs/r15
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35688830869

      - name: Download frozen W3 selected head
        uses: actions/download-artifact@v4
        with:
          name: r8-w3-selected-head
          path: inputs/w3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 35748778854

      - name: Verify frozen head authorities
        run: |
          test "$(sha256sum inputs/r15/hira-head.pt | cut -d' ' -f1)" = "007e24fff0e0e48a096de59276f7ab8d0e25bdb826a3f81a7838c5bd6151723f"
          test "$(sha256sum inputs/w3/hira-head.pt | cut -d' ' -f1)" = "2505e2cf99d741e590ff26ff7c70a587065e5713a4c6a3e53b6783a03b20446c"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen A13 cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Build TRAIN and DEV cache only
        run: |
          python scripts/r8_w5a_build_cache.py             --out artifacts/r8-w5a-cache
          cat artifacts/r8-w5a-cache/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/r8-w5a-cache/receipt.json").read_text())
          assert x["status"]=="PASS"
          assert x["confirm_generated"] is False
          assert x["train"]["case_count"]==640
          assert x["dev"]["case_count"]==160
          assert x["forbidden_benchmark_data_used"] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5a-frozen-inputs
          path: |
            artifacts/r8-w5a-cache
            inputs/r15/hira-head.pt
            inputs/w3/hira-head.pt
          if-no-files-found: error
          retention-days: 14

  candidate:
    if: github.event_name == 'push'
    needs: cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: w3-lr3e4
            init: w3
            lr: "0.0003"
          - name: w3-lr1e3
            init: w3
            lr: "0.001"
          - name: r15-lr3e4
            init: r15
            lr: "0.0003"
          - name: r15-lr1e3
            init: r15
            lr: "0.001"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5a-frozen-inputs
          path: inputs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install head-only training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . numpy

      - name: Train frozen candidate
        run: |
          python scripts/r8_w5a_train_candidate.py             --train-cache inputs/artifacts/r8-w5a-cache/train-cache.pt             --dev-cache inputs/artifacts/r8-w5a-cache/dev-cache.pt             --r15-head inputs/inputs/r15/hira-head.pt             --w3-head inputs/inputs/w3/hira-head.pt             --init "${{ matrix.init }}"             --lr "${{ matrix.lr }}"             --name "${{ matrix.name }}"             --out "artifacts/candidates/${{ matrix.name }}"
          cat "artifacts/candidates/${{ matrix.name }}/receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5a-candidate-${{ matrix.name }}
          path: artifacts/candidates/${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14

  select:
    if: github.event_name == 'push'
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: r8-w5a-candidate-*
          path: inputs/candidates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install selector stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Freeze one DEV-selected semantic head
        run: |
          python scripts/r8_w5a_select_candidate.py             --candidates inputs/candidates             --out artifacts/r8-w5a-selected
          cat artifacts/r8-w5a-selected/selection.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/r8-w5a-selected/selection.json").read_text())
          assert x["status"]=="PASS"
          assert x["candidate_count"]==4
          assert x["confirm_exposed"] is False
          assert x["selection_authority"]=="DEV_ONLY"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5a-selected-head
          path: artifacts/r8-w5a-selected
          if-no-files-found: error
          retention-days: 30

  confirm:
    if: github.event_name == 'push'
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w5a-selected-head
          path: inputs/selected

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"

      - name: Execute untouched CONFIRM after selection
        run: |
          python scripts/r8_w5a_confirm.py             --selected-head inputs/selected/hira-head.pt             --selection inputs/selected/selection.json             --out artifacts/r8-w5a-confirm
          cat artifacts/r8-w5a-confirm/confirm.json

      - name: Verify confirm scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("artifacts/r8-w5a-confirm/confirm.json").read_text())
          assert x["status"]=="PASS"
          assert x["verdict"] in {"SEMANTIC_COMPETENCE_PASS","SEMANTIC_COMPETENCE_FAIL"}
          assert x["selection_authority"]=="DEV_ONLY"
          assert x["confirm_generated_after_selection"] is True
          assert x["confirm_case_count"]==256
          assert x["forbidden_benchmark_data_used"] is False
          assert x["campaign_cells_populated"]==0
          print(json.dumps({
              "verdict":x["verdict"],
              "accuracy":x["metrics"]["accuracy"],
              "k128":x["metrics"]["per_k"]["128"]["accuracy"],
              "k255":x["metrics"]["per_k"]["255"]["accuracy"],
              "k255_top5":x["metrics"]["per_k"]["255"]["top5_recall"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w5a-semantic-confirm
          path: artifacts/r8-w5a-confirm
          if-no-files-found: error
          retention-days: 90
