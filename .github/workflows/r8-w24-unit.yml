name: r8-w24-unit

on:
  push:
    branches:
      - feat/r8-w24-atomic-severity-factors
    paths:
      - "src/nmd/atomic_severity_authority.py"
      - "src/nmd/atomic_severity_cache.py"
      - "src/nmd/atomic_severity_eval.py"
      - "scripts/r8_w24_build_cache.py"
      - "scripts/r8_w24_evaluate.py"
      - "tests/test_atomic_severity_authority.py"
      - "research/R8-W24-HANDOFF.md"
      - ".github/workflows/r8-w24-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w24-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W24 stack
        run: |
          python -m py_compile \
            src/nmd/atomic_severity_authority.py \
            src/nmd/atomic_severity_cache.py \
            src/nmd/atomic_severity_eval.py \
            scripts/r8_w24_build_cache.py \
            scripts/r8_w24_evaluate.py
      - name: Run W24 contracts
        run: pytest -q tests/test_atomic_severity_authority.py
      - name: Preflight exact-text freshness without materialization
        run: |
          python - <<'PY'
          import importlib.util
          from nmd.atomic_severity_authority import (
              all_w24_prototype_texts,
              all_w24_query_texts,
              all_w24_text_atoms,
          )
          spec=importlib.util.spec_from_file_location("w24build","scripts/r8_w24_build_cache.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          overlap=all_w24_text_atoms() & mod.prior_text_atoms()
          assert not overlap, sorted(overlap)
          assert not (all_w24_query_texts() & all_w24_prototype_texts())
          print("w24_preflight_fresh")
          PY
