name: r8-w34-reference-qualification

on:
  push:
    branches:
      - feat/r8-w34-qualified-coevidence
    paths:
      - "research/R8-W34-ENABLE-QUALIFICATION"

permissions:
  contents: read

concurrency:
  group: r8-w34-reference-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pre-qualification contracts
        run: |
          python -m py_compile \
            src/nmd/w34_transfer_authority.py \
            scripts/r8_w34_qualify.py
          pytest -q \
            tests/test_w34_transfer_authority.py \
            tests/test_w33_coevidence_semantic.py

  qualify:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen reference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece
      - name: Mark first W34 qualification exposure
        run: echo R8_W34_TA_TB_REFERENCE_QUALIFICATION_BEGIN
      - name: Run reference-only qualification
        run: |
          python scripts/r8_w34_qualify.py \
            --out artifacts/w34-qualification
      - name: Verify qualification receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w34-qualification/qualification.json"))
          assert x["schema_version"]=="r8-w34-reference-qualification-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
            "W34_REFERENCE_QUALIFIED",
            "W34_REFERENCE_QUALIFICATION_FAIL",
          }
          assert x["domains"]==["TA","TB"]
          assert x["case_count"]==192
          assert x["hira_candidate_evaluated"] is False
          assert x["a13_loaded"] is False
          assert x["w33_rows_used"] is False
          assert x["w32_rows_used"] is False
          assert x["w31_rows_used"] is False
          assert x["w30_rows_used"] is False
          assert x["w29_rows_used"] is False
          assert x["older_authority_rows_used"] is False
          assert x["exact_text_overlap"]==[]
          print("W34_QUALIFICATION_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "per_domain":x["per_domain"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w34-reference-qualification
          path: artifacts/w34-qualification
          if-no-files-found: error
          retention-days: 90
