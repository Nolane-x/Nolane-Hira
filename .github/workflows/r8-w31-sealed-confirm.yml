name: r8-w31-sealed-confirm

on:
  push:
    branches:
      - feat/r8-w31-qualified-dual-semantic-adapter
    paths:
      - "research/R8-W31-ENABLE-CONFIRM"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w31-sealed-confirm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install unit stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile frozen W31 confirm stack
        run: |
          python -m py_compile \
            src/nmd/w31_dual_semantic_adapter.py \
            src/nmd/w31_transfer_authority.py \
            src/nmd/w31_transfer_cache.py \
            src/nmd/w31_transfer_eval.py \
            src/nmd/w31_transfer_core.py \
            scripts/r8_w31_confirm.py

      - name: Run W31 frozen contracts
        run: |
          pytest -q \
            tests/test_w31_dual_semantic_adapter.py \
            tests/test_w31_transfer_authority.py \
            tests/test_w31_transfer_training.py \
            tests/test_symmetric_semantic_runtime.py

      - name: Verify exact frozen W31 training artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10922330271 --jq .digest)" = "sha256:2e055d2050b3fc27c85bdb47aa0044947b5b33b27b76d5c4f96989286aef358c"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10922330271 --jq .expired)" = "false"

      - name: Verify qualification artifact still frozen
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10918919102 --jq .digest)" = "sha256:badc9d6e91864519d7a3472b6b7cde313e42908611be38faa978a95b8f622d5e"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10918919102 --jq .expired)" = "false"

      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"

  confirm:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948

      - uses: actions/download-artifact@v4
        with:
          name: r8-w31-dual-adapter-training
          path: inputs/adapter
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36290117569

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install frozen confirm stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece

      - name: Mark first W31 QO QP sealed exposure
        run: echo R8_W31_QO_QP_SEALED_CONFIRM_EXPOSURE_BEGIN

      - name: Run sealed W31 authority
        run: |
          python scripts/r8_w31_confirm.py \
            --t0-dir inputs/T0 \
            --adapter-dir inputs/adapter \
            --out artifacts/w31-confirm

      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w31-confirm/audit.json"))
          assert x["schema_version"]=="r8-w31-dual-adapter-audit-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {"W31_DUAL_ADAPTER_FAIL","HIRA_V0_TRANSFER_CORE_READY"}
          assert x["domains"]==["QO","QP"]
          assert x["case_count"]==192
          assert x["qualification_outcome"]=="W31_REFERENCE_QUALIFIED"
          assert x["t0_checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert x["adapter_checkpoint_sha256"]=="2a14479cc45b4e92c9ac76ce1535500b11778c8aa5b194b4ff53669f7f11054f"
          assert x["adapter_parameter_count"]==4096
          assert x["runtime_state_encode_count"]==192
          assert x["confirm_cache_state_encode_count"]==192
          assert x["candidate_truncation_used"] is False
          assert x["relation_refinement_used"] is False
          assert x["confirm_used_for_training_or_selection"] is False
          assert x["qualification_rows_used_for_training"] is False
          assert x["w30_rows_used"] is False
          assert x["w29_rows_used"] is False
          assert x["older_authority_rows_used"] is False
          assert x["reference_outputs_used_as_model_inputs"] is False
          assert x["exact_text_overlap"]==[]
          print("W31_FINAL="+json.dumps({
            "outcome":x["outcome"],
            "quality":x["quality_per_domain"],
            "runtime":x["runtime_per_domain"],
            "transfer":x["transfer"],
            "baseline":x["baseline"]["pooled"],
            "dual":x["dual"]["pooled"],
          },sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r8-w31-authoritative-audit
          path: artifacts/w31-confirm
          if-no-files-found: error
          retention-days: 90
