name: hira-v1-s29-full-block-lora-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s29-final-block-ffn-lora-clean
    paths:
      - "research/HIRA-V1-S29-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s29-a0-full-block-lora
          path: inputs/S29A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36883766054
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S29 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Compile and run S29 contracts
        run: |
          python -m py_compile src/nmd/v1_a13_fullblock_lora.py src/nmd/v1_s29_semantic_core.py src/nmd/v1_s29_authority.py src/nmd/v1_s29_checkpoint.py scripts/hira_v1_s29_a0_fullblock_lora.py scripts/hira_v1_s29_train_dev.py
          pytest -q tests/test_v1_a13_fullblock_lora.py tests/test_v1_s29_semantic_core.py tests/test_v1_s29_authority.py tests/test_v1_s29_checkpoint.py tests/test_v1_a13_lora.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_triadic_semantic.py
      - name: Verify canonical S29-A0 authority
        run: |
          (cd inputs/S29A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S29A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s29-a0-full-block-lora-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S29_A0_FULL_BLOCK_LORA_READY"
          assert r["scientific_authority"]=="S29_A0_FINAL_BLOCK_FFN_LORA_ONLY"
          assert r["candidate_parameter_count"]==69632
          assert r["lora_parameter_count"]==36864
          assert r["projection_parameter_count"]==32768
          assert r["runtime_trainable_parameter_count"]==0
          assert r["original_a13_trainable_parameter_count"]==0
          assert r["hira_core_trainable_parameter_count"]==0
          assert r["a13_token_output_identity_max_abs"]==0.0
          assert r["a13_pooled_output_identity_max_abs"]==0.0
          assert r["exact_logit_identity_rate"]==1.0
          assert r["exact_choice_identity_rate"]==1.0
          assert r["fused_c_max_abs"]==0.0
          assert r["fused_p_max_abs"]==0.0
          assert r["relation_c_max_abs"]==0.0
          assert r["relation_p_max_abs"]==0.0
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["attention_lora_b_gradient_l1_max"]>0.0
          assert r["ffn_intermediate_lora_b_gradient_l1"]>0.0
          assert r["ffn_output_lora_b_gradient_l1"]>0.0
          assert r["projection_gradient_l1"]>0.0
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run one fresh English S29 TRAIN DEV authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s29_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S29A0/result.json --out artifacts/s29-train-dev
      - name: Verify S29 TRAIN DEV receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/s29-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s29-full-block-lora-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S29_FULL_BLOCK_LORA_DEV_READY",
              "HIRA_V1_S29_FULL_BLOCK_LORA_DEV_FAIL",
          }
          assert r["scientific_authority"]=="V1_S29_FRESH_ENGLISH_FULL_BLOCK_LORA"
          assert r["seed"]==50001
          assert r["optimizer"]["epochs"]==24
          assert r["optimizer"]["batch_size_semantic_cases"]==16
          assert r["optimizer"]["lr"]==2e-4
          assert r["optimizer"]["weight_decay"]==0.01
          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["k"]==4
          assert r["partitions"]["views_per_option"]==2
          assert r["partitions"]["prior_track_exact_rows_used"] is False
          assert r["partitions"]["s29_a0_rows_used"] is False
          assert r["partitions"]["m5_final_rows_used"] is False
          assert r["partitions"]["w29_w34_sealed_rows_used"] is False
          assert r["parameter_surface"]["total_trainable_parameters"]==69632
          assert r["parameter_surface"]["lora_trainable_parameters"]==36864
          assert r["parameter_surface"]["projection_trainable_parameters"]==32768
          assert r["parameter_surface"]["original_a13_trainable"]==0
          assert r["parameter_surface"]["hira_core_trainable"]==0
          assert r["parameter_surface"]["canonicalizer_added_parameters"]==0
          assert r["parameter_surface"]["fusion_added_parameters"]==0
          assert r["loss"]["encoder_adaptation_rule"]=="final_block_attention_plus_ffn_lora_rank8"
          assert r["loss"]["norm_balanced_gradient"]=="equal_direction_relation_priority_projection"
          assert r["loss"]["fused_primary_relation_logits_detached"] is True
          assert r["loss"]["inference_numerically_identical_to_s14"] is True
          assert r["loss"]["balance_epsilon"]==1e-12
          assert r["state_once"]["train_state_view_encodes_per_epoch"]==1536
          assert r["state_once"]["dev_state_view_encodes_per_eval"]==384
          assert r["post_dev_tuning_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["multilingual_probe_opened"] is False
          assert r["production_ready_claimed"] is False
          assert (root/"full-block-lora-candidate.pt").is_file()
          PY
      - name: Verify frozen S29 candidate checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch
          root=Path("artifacts/s29-train-dev")
          r=json.loads((root/"result.json").read_text())
          p=torch.load(root/"full-block-lora-candidate.pt",map_location="cpu",weights_only=True)
          assert p["schema_version"]=="hira-v1-s29-full-block-lora-checkpoint-v1"
          assert p["kind"]=="full-block-lora-s17-shell-a13-w28"
          assert p["lora_parameter_count"]==36864
          assert p["projection_parameter_count"]==32768
          assert p["total_parameter_count"]==69632
          assert len(p["lora_state_dict"])==12
          assert p["selected_dev_epoch"]==r["selected_dev_epoch"]
          PY
      - name: Freeze S29 TRAIN DEV integrity
        run: |
          (cd artifacts/s29-train-dev && sha256sum result.json train-manifest.json dev-manifest.json full-block-lora-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s29-full-block-lora-train-dev
          path: artifacts/s29-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
