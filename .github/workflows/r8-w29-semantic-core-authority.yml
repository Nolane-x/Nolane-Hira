name: r8-w29-semantic-core-authority

on:
  push:
    branches:
      - feat/r8-w29-hira-v0-semantic-core
    paths:
      - "research/R8-W29-ENABLE-AUTHORITY"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w29-semantic-core-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W29 stack
        run: |
          python -m py_compile \
            src/nmd/contracts.py \
            src/nmd/schema.py \
            src/nmd/runtime.py \
            src/nmd/symmetric_semantic.py \
            src/nmd/semantic_core.py \
            src/nmd/hira_v0_authority.py \
            src/nmd/hira_v0_eval.py \
            scripts/r8_w29_evaluate.py
      - name: Run frozen W29 contracts
        run: |
          pytest -q \
            tests/test_symmetric_semantic_runtime.py \
            tests/test_hira_v0_authority.py \
            tests/test_runtime.py \
            tests/test_competitive_coarse_runtime.py

  t0:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W28 T0 artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .digest)" = "sha256:e47020da54c45f896ebb957f852e09dc3cb1719caa14ef2ae1af605927c57258"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10905153620 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w28-candidate-T0
          path: inputs/T0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36240250948
      - name: Verify exact T0 checkpoint
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("inputs/T0")
          receipt=json.loads((root/"receipt.json").read_text())
          sha=hashlib.sha256((root/"candidate.pt").read_bytes()).hexdigest()
          assert receipt["schema_version"]=="r8-w28-candidate-receipt-v1"
          assert receipt["status"]=="PASS"
          assert receipt["candidate"]=="T0"
          assert receipt["checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert sha==receipt["checkpoint_sha256"]
          assert receipt["trainable_parameter_count"]==32768
          assert receipt["selected_dev_epoch"]==8
          print("w29_t0_provenance_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w29-frozen-t0
          path: inputs/T0
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [unit, t0]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w29-frozen-t0
          path: inputs/T0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen empirical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research,dev]" sentencepiece
      - name: Mark first W29 EW-EZ integration exposure
        run: echo R8_W29_EW_EZ_HIRA_V0_INTEGRATION_EXPOSURE_BEGIN
      - name: Run fresh W29 semantic-core authority
        run: |
          python scripts/r8_w29_evaluate.py \
            --t0-dir inputs/T0 \
            --out artifacts/w29-audit
      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w29-audit/audit.json"))
          assert x["schema_version"]=="r8-w29-hira-v0-semantic-core-audit-v1"
          assert x["status"]=="PASS"
          assert x["outcome"] in {
              "W29_REFERENCE_INADEQUATE",
              "W29_RUNTIME_INTEGRATION_FAIL",
              "HIRA_V0_SEMANTIC_CORE_READY",
          }
          assert x["case_count"]==384
          assert x["domains"]==["EW","EX","EY","EZ"]
          assert x["t0_checkpoint_sha256"]=="1ed6c94d179fddffa2859a67ee3f9f383e677d456365d7e87bdcd844cc49010f"
          assert x["a13_weight_sha256"]=="5b0593e0bb4620631320d2b4d5604cc39ca53348a9a240392c6c0b830dd8d880"
          assert x["projection_training_performed"] is False
          assert x["projection_selection_performed"] is False
          assert x["relation_refinement_used"] is False
          assert x["reliability_calibration_used"] is False
          assert x["reference_outputs_used_as_model_inputs"] is False
          assert x["prior_exact_text_overlap"]==[]
          assert x["query_schema_exact_sentence_overlap"]==[]
          assert x["runtime_integrity"]["projection_trainable_parameter_count"]==0
          assert x["runtime_integrity"]["projection_parameter_count"]==32768
          assert x["runtime_integrity"]["schema_cache_hit_after_first_compile"] is True
          assert x["runtime_integrity"]["relation_refinement_disabled"] is True
          assert x["runtime_integrity"]["candidate_truncation_used"] is False
          assert x["runtime_integrity"]["state_encode_calls_total"]==384
          for key in ["w28_rows_used","w27_rows_used","w26_rows_used","w25_rows_used","w24_rows_used"]:
              assert x[key] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"]==0
          print("W29_FINAL="+json.dumps({
              "outcome":x["outcome"],
              "reference":x["reference_per_domain"],
              "hira":x["hira_per_domain"],
              "runtime":x["runtime_per_domain"],
              "global_runtime_integrity":x["global_runtime_integrity"],
              "hira_pooled":x["hira"]["pooled"],
          },sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w29-authoritative-audit
          path: artifacts/w29-audit
          if-no-files-found: error
          retention-days: 90
