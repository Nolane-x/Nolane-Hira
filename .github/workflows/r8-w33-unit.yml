name: r8-w33-unit

on:
  push:
    branches:
      - feat/r8-w33-coevidence-composition
    paths:
      - "src/nmd/w33_coevidence_semantic.py"
      - "src/nmd/w33_transfer_authority.py"
      - "src/nmd/w33_transfer_cache.py"
      - "src/nmd/w33_transfer_eval.py"
      - "src/nmd/w33_transfer_core.py"
      - "src/nmd/runtime.py"
      - "scripts/r8_w33_qualify.py"
      - "scripts/r8_w33_train.py"
      - ".github/workflows/r8-w33-reference-qualification.yml"
      - "tests/test_w33_coevidence_semantic.py"
      - "tests/test_w33_transfer_authority.py"
      - "tests/test_w33_transfer_training.py"
      - "research/R8-W33-HANDOFF.md"
      - ".github/workflows/r8-w33-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w33-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W33 pre-qualification stack
        run: |
          python -m py_compile \
            src/nmd/w33_coevidence_semantic.py \
            src/nmd/w33_transfer_authority.py \
            src/nmd/w33_transfer_cache.py \
            src/nmd/w33_transfer_eval.py \
            src/nmd/w33_transfer_core.py \
            src/nmd/runtime.py \
            scripts/r8_w33_qualify.py \
            scripts/r8_w33_train.py
      - name: Run W33 contracts
        run: |
          pytest -q \
            tests/test_w33_coevidence_semantic.py \
            tests/test_w33_transfer_authority.py \
            tests/test_w33_transfer_training.py \
            tests/test_w32_interaction_semantic_adapter.py \
            tests/test_symmetric_semantic_runtime.py
      - name: Runtime regressions
        run: |
          pytest -q \
            tests/test_runtime.py \
            tests/test_competitive_coarse_runtime.py
