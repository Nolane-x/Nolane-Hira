name: hira-v1-s31-a0-global-relation-contrastive

on:
  push:
    branches:
      - feat/hira-v1-s31-global-relation-contrastive
    paths:
      - "research/HIRA-V1-S31-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install S31 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile S31 stack
        run: |
          python -m py_compile src/nmd/v1_s31_global_relation_contrastive.py src/nmd/v1_s31_training.py src/nmd/v1_s31_authority.py scripts/hira_v1_s31_a0_global_relation_contrastive.py
      - name: Run S31 and inherited contracts
        run: |
          pytest -q tests/test_v1_s31_global_relation_contrastive.py tests/test_v1_s31_training.py tests/test_v1_s31_authority.py tests/test_v1_a13_lora.py tests/test_v1_evidence_fusion.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_norm_balanced_gradient.py tests/test_v1_relation_canonicalization.py tests/test_v1_invariance.py tests/test_v1_triadic_semantic.py

  a0:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact S31 source and HF runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"
      - name: Verify frozen M4 runtime
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)
      - name: Run fresh S31-A0 authority
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/hira_v1_s31_a0_global_relation_contrastive.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s31-a0
      - name: Verify S31-A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s31-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s31-a0-global-relation-contrastive-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S31_A0_GLOBAL_RELATION_CONTRASTIVE_READY"
          assert r["scientific_authority"]=="S31_A0_MATCHED_LOCAL_VS_GLOBAL_RELATION"
          assert r["operator_parameter_count"]==0
          assert r["temperature"]==0.10
          assert r["outer_coefficient"]==0.15
          assert r["arm_token_output_identity_max_abs"]==0.0
          assert r["arm_pooled_output_identity_max_abs"]==0.0
          assert r["exact_logit_identity_rate"]==1.0
          assert r["exact_choice_identity_rate"]==1.0
          for key in ("fused_c_max_abs","fused_p_max_abs","raw_c_max_abs","raw_p_max_abs","relation_c_max_abs","relation_p_max_abs","signature_c_max_abs","signature_p_max_abs"):
              assert r[key]==0.0
          assert r["control_physical_parameter_count"]==49152
          assert r["treatment_physical_parameter_count"]==49152
          assert r["runtime_trainable_parameter_count"]==0
          assert r["original_a13_trainable_parameter_count"]==0
          assert r["hira_core_trainable_parameter_count"]==0
          assert r["checkpoint_key_count"]==8
          assert r["checkpoint_roundtrip_exact"] is True
          assert r["controlled_good_loss"]<0.01
          assert r["controlled_shuffled_minus_good"]>1.0
          assert r["controlled_matched_permutation_error"]<=1e-7
          assert r["controlled_view_swap_error"]<=1e-7
          assert r["controlled_canonical_gradient_l1"]>0.0
          assert r["controlled_paraphrase_gradient_l1"]>0.0
          assert all(v>0.0 for v in r["gradient"]["lora_b_gradient_l1"])
          assert r["gradient"]["projection_gradient_l1"]>0.0
          assert r["gradient"]["primary_norm"]>0.0
          assert r["gradient"]["relation_norm"]>0.0
          assert r["state_encode_calls"]==32
          assert r["option_order_flip_rate"]==0.0
          assert r["max_probability_mass_error"]<=1e-6
          assert r["full_k"] is True
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY
      - name: Freeze S31-A0 integrity
        run: |
          (cd artifacts/s31-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s31-a0-global-relation-contrastive
          path: artifacts/s31-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
