name: hira-v1-s68-context-modulated-pairwise-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s68-context-modulated-pairwise
    paths:
      - "research/HIRA-V1-S68-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s51-native-authority
          path: inputs/S51AUTH
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37192490832

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s68-a0-context-modulated-pairwise
          path: inputs/S68A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37388612141

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S68 court stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S68 contracts
        run: |
          python -m py_compile src/nmd/v1_context_modulated_pairwise_head.py src/nmd/v1_s68_authority.py scripts/hira_v1_s68_train_dev.py
          pytest -q tests/test_v1_context_modulated_pairwise_head.py tests/test_v1_s68_a0_harness.py tests/test_v1_s68_a0_workflow.py tests/test_v1_s68_authority.py tests/test_v1_s68_matched_harness.py tests/test_v1_s68_train_dev_workflow.py tests/test_v1_per_view_responsibility.py tests/test_v1_contextual_reliability_gate.py tests/test_v1_explicit_pairwise_decision_head.py tests/test_v1_joint_state_query_option_interaction.py

      - name: Verify frozen S67 parent receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/HIRA-V1-S67-MATCHED-RECEIPT.json")
          assert p.is_file()
          r=json.loads(p.read_text())
          assert r["schema_version"]=="hira-v1-s67-safe-oracle-alpha-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S67_SAFE_ORACLE_ALPHA_DEV_COMPLETE"
          assert r["scientific_authority"]=="V1_S67_FRESH_SAFE_ORACLE_ALPHA"
          assert r["seed"]==88001
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["parent_s66"]["merged_main"]=="e898314b51995db7e6fa18b06256a59551d0797e"
          PY

      - name: Verify canonical S68 A0 authority
        run: |
          (cd inputs/S68A0 && sha256sum -c INTEGRITY.sha256)
          echo "Pinned GitHub artifact digest: sha256:06cd73759293281780a4ba8e9aa1c375dd95ea1a632061c2351cf21fd5787da5"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S68A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s68-a0-context-modulated-pairwise-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S68_A0_CONTEXT_MODULATED_PAIRWISE_READY"
          assert r["scientific_authority"]=="S68_A0_CONTEXT_MODULATED_PAIRWISE_ONLY"
          assert r["seed"]==89001
          assert r["reference_pairwise_parameter_count"]==33344
          assert r["treatment_pairwise_parameter_count"]==33344
          assert r["added_treatment_parameter_count"]==0
          assert r["pairwise_trainable_tensor_names"]==["A","G","u"]
          assert r["base_s59_parameter_count"]==32832
          assert r["modulation_parameter_count"]==512
          assert r["context_dimension"]==8
          assert r["context_projection_seed"]==68068
          assert r["context_projection_trainable"] is False
          assert r["modulation_scale"]==0.5
          assert r["arm_parameter_initialization_bit_identical"] is True
          assert r["base_A_u_exact_s59_initialization"] is True
          assert r["G_initial_exact_zero"] is True
          assert r["initial_real_cache_s59_identity_max_abs_error"]==0.0
          assert r["initial_pair_vs_s59_max_abs_error"]==0.0
          assert r["initial_aggregate_vs_s59_max_abs_error"]==0.0
          assert r["initial_choice_vs_s59_exact"] is True
          assert r["reference_treatment_context_max_abs_difference"]>1e-7
          assert r["joint_context_ablation_max_abs_error"]==0.0
          assert r["reference_gradient_G_l1"]>0.0
          assert r["treatment_gradient_G_l1"]>0.0
          assert r["reference_treatment_G_gradient_l1_difference"]>1e-7
          assert r["representation_received_pairwise_gradient"] is False
          assert r["correction_received_pairwise_gradient"] is False
          assert r["teacher_dependency"] is False
          assert r["pseudo_target_dependency"] is False
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["max_probability_mass_error"]<=1e-6
          assert r["matched_head_checkpoint_replay_max_abs_error"]==0.0
          assert r["fresh_train_dev_exposed"] is False
          PY

      - name: Verify sealed S51 native authority
        run: |
          (cd inputs/S51AUTH && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          from nmd.v1_persisted_native_authority import file_sha256
          receipt=json.loads(Path("inputs/S51AUTH/authority-receipt.json").read_text())
          assert receipt["outcome"]=="HIRA_V1_S51_PERSISTED_NATIVE_AUTHORITY_READY"
          assert receipt["runtime_state_sha256"]=="ef205661a9a8e8fb96518444be3baf8588968f685fb4622dc2aed423dd30a628"
          assert receipt["checkpoint_file_sha256"]=="19104b46c88cb3dcc0e4f4fe3c5f61a98cb7bb646184075dee3762566e6d5916"
          assert file_sha256(Path("inputs/S51AUTH/native-authority.pt"))==receipt["checkpoint_file_sha256"]
          assert receipt["dev_encoded"] is False
          assert receipt["dev_scored"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S68 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s68_train_dev.py \
            --bundle inputs/M4/hira-v0-m4-runtime \
            --authority-checkpoint inputs/S51AUTH/native-authority.pt \
            --authority-receipt inputs/S51AUTH/authority-receipt.json \
            --a0-result inputs/S68A0/result.json \
            --out artifacts/s68-train-dev

      - name: Verify S68 scientific receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s68-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s68-context-modulated-pairwise-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S68_CONTEXT_MODULATED_PAIRWISE_DEV_COMPLETE",
              "HIRA_V1_S68_CONTEXT_MODULATED_PAIRWISE_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S68_FRESH_CONTEXT_MODULATED_PAIRWISE"
          assert r["seed"]==89001

          parent=r["parent_s67"]
          assert parent["merged_main"]=="942871bb44bbef3e28e74698f161b02c6796cdcb"
          assert parent["scientific_run"]==37336779415
          assert parent["verdict"]=="CASE_B"
          assert parent["actions_artifact_available"] is False
          assert parent["raw_receipt_frozen_in_repo"] is True

          a0=r["a0_authority"]
          assert a0["run"]==37388612141
          assert a0["artifact_id"]==11380079442
          assert a0["artifact_digest"]=="sha256:06cd73759293281780a4ba8e9aa1c375dd95ea1a632061c2351cf21fd5787da5"

          cv=r["controlled_variable"]
          assert cv["reference_pairwise_trainable_parameters"]==33344
          assert cv["treatment_pairwise_trainable_parameters"]==33344
          assert cv["added_treatment_pairwise_parameters"]==0
          assert cv["pairwise_context_dimension"]==8
          assert cv["pairwise_context_projection_seed"]==68068
          assert cv["pairwise_modulation_scale"]==0.5
          assert cv["pairwise_objective_both_arms"]=="gold_vs_distractor_pairwise_softplus"
          assert cv["pairwise_parameter_initialization_bit_identical"] is True
          assert cv["gate_family_both_arms"]=="s64_context_injected"
          assert cv["gate_objective_both_arms"]=="per_view_counterfactual_responsibility_bce"
          assert cv["gate_trainable_parameters_per_arm"]==60
          assert cv["gate_parameter_initialization_bit_identical"] is True
          assert cv["correction_trainable_parameters"]==114688
          assert cv["shared_correction_trajectory"] is True
          assert cv["same_train_rows_and_order"] is True
          assert cv["same_optimizer_lr_weight_decay"] is True
          assert cv["same_frozen_selector"] is True
          assert cv["teacher_dependency"] is False
          assert cv["pseudo_target_dependency"] is False
          assert cv["oracle_alpha_target_reopened"] is False

          assert len(r["training_trajectory"])==24
          assert any(x["reference_G_gradient_ever_live"] for x in r["training_trajectory"])
          assert any(x["treatment_G_gradient_ever_live"] for x in r["training_trajectory"])
          for e,row in enumerate(r["training_trajectory"],start=1):
              assert row["epoch"]==e
              assert row["reference_train_pairwise"]["antisymmetry_max_abs_error"]==0.0
              assert row["treatment_train_pairwise"]["antisymmetry_max_abs_error"]==0.0
              assert len(row["correction_state_sha256"])==64
              assert len(row["reference_pairwise_head_state_sha256"])==64
              assert len(row["treatment_pairwise_head_state_sha256"])==64

          for name,use_joint in (("reference_branch",False),("treatment_branch",True)):
              b=r[name]
              assert 1<=b["selected_dev_epoch"]<=24
              assert len(b["correction_state_sha256"])==64
              assert len(b["pairwise_head_state_sha256"])==64
              assert len(b["gate_state_sha256"])==64
              m=b["selected_dev"]
              pm=b["selected_pairwise_aggregate_dev"]
              assert m["state_view_encodes"]==0
              assert m["full_k"] is True
              assert m["pairwise_antisymmetry_max_abs_error"]==0.0
              assert m["pairwise_diagonal_max_abs_error"]==0.0
              assert m["fused_max_probability_mass_error"]<=1e-6
              assert pm["antisymmetry_max_abs_error"]==0.0
              assert pm["diagonal_max_abs_error"]==0.0
              assert pm["max_probability_mass_error"]<=1e-6

              p=torch.load(root/b["checkpoint_file"],map_location="cpu",weights_only=True)
              assert p["schema_version"]=="hira-v1-s68-private-candidate-v1"
              assert p["seed"]==89001
              assert p["pairwise_parameter_count"]==33344
              assert p["pairwise_use_joint_context"] is use_joint
              assert p["pairwise_context_projection_seed"]==68068
              assert p["pairwise_modulation_scale"]==0.5
              assert p["gate_parameter_count"]==60
              assert p["gate_objective"]=="per_view_counterfactual_responsibility_bce"
              assert p["native_parameter_count_in_optimizer"]==0
              assert p["teacher_dependency"] is False

          assert r["partitions"]["train_semantic_cases"]==768
          assert r["partitions"]["dev_semantic_cases"]==192
          assert len(r["partitions"]["domains"])==12
          assert r["partitions"]["exact_s67_state_question_option_overlap"]==0

          assert r["post_dev_tuning_performed"] is False
          assert r["context_projection_seed_changed"] is False
          assert r["context_dimension_changed"] is False
          assert r["modulation_scale_changed"] is False
          assert r["additive_context_bias_added"] is False
          assert r["pairwise_hidden_width_changed"] is False
          assert r["pairwise_rank_changed"] is False
          assert r["context_source_retrofit_performed"] is False
          assert r["loss_coefficient_changed"] is False
          assert r["optimizer_lr_weight_decay_changed"] is False
          assert r["reliability_target_reopened"] is False
          assert r["native_retraining_performed"] is False
          assert r["selector_changed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S68 integrity
        run: |
          (cd artifacts/s68-train-dev && sha256sum result.json reference-candidate.pt treatment-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s68-context-modulated-pairwise
          path: artifacts/s68-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
