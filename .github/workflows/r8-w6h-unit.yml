name: r8-w6h-unit

on:
  push:
    branches:
      - feat/r8-w6h-field-semantic-rescue
    paths:
      - "src/nmd/field_semantic_rescue.py"
      - "src/nmd/field_semantic_rescue_authority.py"
      - "scripts/r8_w6h_*.py"
      - "tests/test_field_semantic_rescue.py"
      - "tests/test_field_semantic_rescue_authority.py"
      - ".github/workflows/r8-w6h-unit.yml"
  pull_request:
    paths:
      - "src/nmd/field_semantic_rescue.py"
      - "src/nmd/field_semantic_rescue_authority.py"
      - "scripts/r8_w6h_*.py"
      - "tests/test_field_semantic_rescue.py"
      - "tests/test_field_semantic_rescue_authority.py"
      - ".github/workflows/r8-w6h-unit.yml"

permissions:
  contents: read

concurrency:
  group: r8-w6h-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W6h stack
        run: |
          python -m py_compile             src/nmd/field_semantic_rescue.py             src/nmd/field_semantic_rescue_authority.py             scripts/r8_w6h_build_cache.py             scripts/r8_w6h_train_candidate.py             scripts/r8_w6h_freeze_candidates.py             scripts/r8_w6h_confirm.py             tests/test_field_semantic_rescue.py             tests/test_field_semantic_rescue_authority.py
      - name: Run W6h and production contracts
        run: |
          pytest -q             tests/test_field_semantic_rescue.py             tests/test_field_semantic_rescue_authority.py             tests/test_competitive_coarse_runtime.py             tests/test_typed_competitive_cache.py
