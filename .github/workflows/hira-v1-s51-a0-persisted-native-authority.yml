name: hira-v1-s51-a0-persisted-native-authority

on:
  push:
    branches:
      - feat/hira-v1-s51-persisted-native-authority
    paths:
      - "research/HIRA-V1-S51-ENABLE-A0"

permissions:
  contents: read
  actions: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S51 A0 stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S51 contracts
        run: |
          python -m py_compile src/nmd/v1_persisted_native_authority.py src/nmd/v1_s51_authority.py scripts/hira_v1_s51_native_authority.py scripts/hira_v1_s51_private_court.py scripts/hira_v1_s51_a0_persisted_native_authority.py
          pytest -q tests/test_v1_persisted_native_authority.py tests/test_v1_s51_authority.py tests/test_v1_s51_phase_a_isolation.py tests/test_v1_s51_phase_b_isolation.py tests/test_v1_s51_a0_harness.py tests/test_v1_shared_native_private_readouts.py tests/test_v1_query_free_option_identity.py tests/test_v1_private_correction_fork.py

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run S51 A0 persisted-native court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s51_a0_persisted_native_authority.py --bundle inputs/M4/hira-v0-m4-runtime --out artifacts/s51-a0

      - name: Verify S51 A0 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/s51-a0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s51-a0-persisted-native-authority-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S51_A0_PERSISTED_NATIVE_AUTHORITY_READY"
          assert r["scientific_authority"]=="S51_A0_PERSIST_LOAD_CACHE_ISOLATION_ONLY"
          assert r["seed"]==72001
          assert r["semantic_case_count"]==16
          assert r["original_runtime_state_sha256"]==r["loaded_runtime_state_sha256"]
          assert r["loaded_runtime_state_sha256"]==r["second_load_runtime_state_sha256"]
          assert len(r["logical_native_tensor_digest"])==64
          assert len(r["checkpoint_file_sha256"])==64
          assert r["tamper_rejected"] is True
          assert r["loaded_native_trainable_parameter_count"]==0
          assert r["loaded_native_optimizer_parameter_count"]==0
          assert r["cache_tensor_count"]>0
          assert r["cache_part_digest_count"]>0
          assert r["cache_tensors_require_grad"] is False
          assert r["cache_tensors_are_inference"] is False
          assert r["branch_order_replay_max_abs_error"]==0.0
          assert r["correction_initialization_bit_identical"] is True
          assert r["reference_correction_parameter_count"]==114688
          assert r["treatment_correction_parameter_count"]==114688
          assert r["identity_parameter_count"]==0
          assert r["phase_a_dev_generation_absent"] is True
          assert r["phase_a_private_construction_absent"] is True
          assert r["phase_b_native_training_call_absent"] is True
          assert r["second_encoder_pass"] is False
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S51 A0 integrity
        run: |
          (cd artifacts/s51-a0 && sha256sum result.json > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s51-a0-persisted-native-authority
          path: artifacts/s51-a0
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
