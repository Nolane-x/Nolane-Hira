name: r8-w8-semantic-transfer-authority

on:
  push:
    branches:
      - feat/r8-w8-semantic-transfer
    paths:
      - ".github/workflows/r8-w8-semantic-transfer-authority.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: r8-w8-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile frozen W8 stack
        run: |
          python -m py_compile \
            src/nmd/semantic_transfer.py \
            src/nmd/semantic_transfer_authority.py \
            src/nmd/semantic_transfer_cache.py \
            src/nmd/semantic_transfer_eval.py \
            scripts/r8_w8_build_cache.py \
            scripts/r8_w8_evaluate.py
      - name: Run frozen W8 contracts
        run: |
          pytest -q \
            tests/test_semantic_transfer.py \
            tests/test_semantic_transfer_cache.py

  upstream:
    needs: unit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact W7b freeze artifact
        run: |
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10852555298 --jq .digest)" = "sha256:e586cdb2ddea0185ff6663690868fec586a98b7eb617804eb4ea92ed8f45a6f4"
          test "$(gh api repos/Nolane-x/Nolane-Hira/actions/artifacts/10852555298 --jq .expired)" = "false"
      - uses: actions/download-artifact@v4
        with:
          name: r8-w7b-freeze
          path: inputs/freeze
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36107487032
      - name: Verify frozen W7b checkpoint set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("inputs/freeze/freeze.json").read_text())
          assert x["schema_version"] == "r8-w7b-freeze-v1"
          assert x["status"] == "PASS"
          assert x["all_candidates_frozen_before_confirm"] is True
          required={
              "frozen-w6e-control",
              "typed-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          rows={r["candidate"]:r for r in x["candidates"]}
          assert required <= set(rows)
          assert x["w6e_confirm_rows_used"] is False
          assert x["w6j_diagnostic_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          print("w8_upstream_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w8-frozen-w7b-checkpoints
          path: inputs/freeze
          if-no-files-found: error
          retention-days: 14

  cache:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen cache stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,research]"
      - name: Mark first eligible W8 A13 exposure
        run: |
          echo R8_W8_AU_AX_A13_EXPOSURE_BEGIN
      - name: Build fresh paired semantic-transfer cache
        run: |
          python scripts/r8_w8_build_cache.py --out artifacts/w8-cache
          cat artifacts/w8-cache/receipt.json
      - name: Verify fresh cache receipt
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w8-cache/receipt.json"))
          assert x["schema_version"] == "r8-w8-cache-receipt-v1"
          assert x["status"] == "PASS"
          assert x["base_count"] == 256
          assert x["view_count"] == 3072
          assert x["state_encode_calls"] == 256
          assert x["state_encodes_per_base"] == 1.0
          assert x["domain_base_counts"] == {"AU":64,"AV":64,"AW":64,"AX":64}
          assert x["prior_exact_text_overlap"] == []
          assert x["training_performed"] is False
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          for key,value in x.items():
              if key.endswith("_rows_used"):
                  assert value is False
          print("w8_cache_verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w8-semantic-transfer-cache
          path: artifacts/w8-cache
          if-no-files-found: error
          retention-days: 30

  evaluate:
    needs: [upstream, cache]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r8-w8-frozen-w7b-checkpoints
          path: inputs/freeze
      - uses: actions/download-artifact@v4
        with:
          name: r8-w8-semantic-transfer-cache
          path: inputs/cache
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen evaluator stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Evaluate all frozen checkpoints
        run: |
          python scripts/r8_w8_evaluate.py \
            --cache inputs/cache/diagnostic.pt \
            --freeze inputs/freeze/freeze.json \
            --checkpoints inputs/freeze \
            --out artifacts/w8-audit
          cat artifacts/w8-audit/audit.json
      - name: Verify authoritative audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open("artifacts/w8-audit/audit.json"))
          assert x["schema_version"] == "r8-w8-semantic-transfer-v1"
          assert x["status"] == "PASS"
          assert x["training_performed"] is False
          assert x["cached_base_count"] == 256
          assert x["cached_view_count"] == 3072
          assert x["state_encodes_per_base"] == 1.0
          assert x["probability_mass_max_error"] <= 1e-6
          assert set(x["results"]) == {
              "frozen-w6e-control",
              "typed-only-retune",
              "typed-plus-pair-primary",
              "typed-plus-pair-replica",
          }
          for result in x["results"].values():
              assert set(result["per_domain"]) == {"AU","AV","AW","AX"}
          assert x["outcome"] in {
              "STABLE_SEMANTIC_TRANSFER_LOCALIZATION",
              "MIXED_SEMANTIC_TRANSFER_LOCALIZATION",
              "SEMANTIC_TRANSFER_UNRESOLVED",
          }
          assert x["banking77_rows_used"] is False
          assert x["typed_decisions_final_or_test_used"] is False
          assert x["campaign_cells_populated"] == 0
          for key,value in x.items():
              if key.endswith("_rows_used"):
                  assert value is False
          print(x["outcome"], x["stable_classification"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r8-w8-semantic-transfer-audit
          path: artifacts/w8-audit
          if-no-files-found: error
          retention-days: 90
