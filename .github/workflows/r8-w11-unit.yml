name: r8-w11-unit

on:
  push:
    branches:
      - feat/r8-w11-interface-decomposition
    paths:
      - "src/nmd/interface_decomposition*.py"
      - "scripts/r8_w11_*.py"
      - "tests/test_interface_decomposition.py"
      - ".github/workflows/r8-w11-unit.yml"
      - "research/R8-W11-HANDOFF.md"
  pull_request:
    branches:
      - main
    paths:
      - "src/nmd/interface_decomposition*.py"
      - "scripts/r8_w11_*.py"
      - "tests/test_interface_decomposition.py"
      - ".github/workflows/r8-w11-unit.yml"
      - "research/R8-W11-HANDOFF.md"

permissions:
  contents: read

concurrency:
  group: r8-w11-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile W11 stack
        run: |
          python -m py_compile \
            src/nmd/interface_decomposition.py \
            src/nmd/interface_decomposition_authority.py \
            src/nmd/interface_decomposition_cache.py \
            src/nmd/interface_decomposition_eval.py \
            scripts/r8_w11_build_cache.py \
            scripts/r8_w11_evaluate.py
      - name: Run W11 pre-data contracts
        run: pytest -q tests/test_interface_decomposition.py
