name: hira-v0-mainline-m0

on:
  push:
    branches:
      - feat/hira-v0-mainline-m0
    paths:
      - "src/nmd/mainline.py"
      - "tests/test_mainline.py"
      - "research/HIRA-V0-MAINLINE-M0-HANDOFF.md"
      - ".github/workflows/hira-v0-mainline-m0.yml"

permissions:
  contents: read

concurrency:
  group: hira-v0-mainline-m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile mainline M0
        run: |
          python -m py_compile src/nmd/mainline.py tests/test_mainline.py
      - name: Run mainline M0 contracts
        run: |
          pytest -q \
            tests/test_mainline.py \
            tests/test_w33_coevidence_semantic.py \
            tests/test_symmetric_semantic_runtime.py \
            tests/test_runtime.py
