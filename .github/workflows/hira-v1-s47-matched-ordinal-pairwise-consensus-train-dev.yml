name: hira-v1-s47-matched-ordinal-pairwise-consensus-train-dev

on:
  push:
    branches:
      - feat/hira-v1-s47-ordinal-pairwise-consensus
    paths:
      - "research/HIRA-V1-S47-ENABLE-TRAIN-DEV"

permissions:
  contents: read
  actions: read

jobs:
  train-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hira-v0-mainline-m4-runtime-bundle
          path: inputs/M4
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 36357825580

      - uses: actions/download-artifact@v4
        with:
          name: hira-v1-s47-a0-ordinal-pairwise-consensus
          path: inputs/S47A0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Nolane-x/Nolane-Hira
          run-id: 37167755900

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install exact S47 training stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[hf,dev]" "transformers>=4.45,<6" "safetensors>=0.4" "huggingface_hub>=0.24"

      - name: Compile and run S47 contracts
        run: |
          python -m py_compile src/nmd/v1_ordinal_pairwise_consensus.py src/nmd/v1_s47_authority.py scripts/hira_v1_s47_a0_ordinal_pairwise_consensus.py scripts/hira_v1_s47_train_dev.py
          pytest -q tests/test_v1_ordinal_pairwise_consensus.py tests/test_v1_s47_a0_harness.py tests/test_v1_s47_authority.py tests/test_v1_s47_matched_harness.py tests/test_v1_private_correction_fork.py tests/test_v1_s45_cross_view_consistency.py tests/test_v1_gradient_isolated_fusion.py tests/test_v1_invariance.py

      - name: Verify canonical S47-A0 authority
        run: |
          (cd inputs/S47A0 && sha256sum -c INTEGRITY.sha256)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("inputs/S47A0/result.json").read_text())
          assert r["schema_version"]=="hira-v1-s47-a0-ordinal-pairwise-consensus-v1"
          assert r["status"]=="PASS"
          assert r["outcome"]=="HIRA_V1_S47_A0_ORDINAL_PAIRWISE_CONSENSUS_READY"
          assert r["scientific_authority"]=="S47_A0_ORDINAL_PAIRWISE_CONSENSUS_ONLY"
          assert r["seed"]==68001
          assert r["native_trainable_parameter_count"]==49152
          assert r["correction_parameter_count"]==114688
          assert r["treatment_total_trainable_parameter_count"]==163840
          assert r["decision_parameter_count"]==0
          assert r["decision_family"]=="pairwise_majority_copeland_private_ordinal_tiebreak"
          assert r["lexicographic_base_rule"]=="2K-1"
          assert r["arbitrary_k3_pass"] is True
          assert r["arbitrary_k7_pass"] is True
          assert r["arbitrary_k255_pass"] is True
          assert r["logical_option_permutation_max_abs_error"]==0.0
          assert r["independent_positive_affine_max_abs_error"]==0.0
          assert r["strictly_increasing_nonlinear_max_abs_error"]==0.0
          assert r["extreme_magnitude_blowup_max_abs_error"]==0.0
          assert r["two_identical_expert_dominance_top_index"]==0
          assert r["strict_copeland_dominance_violations"]==0
          assert r["cycle_copeland_tied"] is True
          assert r["cycle_private_tiebreak_matches"] is True
          assert r["actual_shell_legacy_vs_ordinal_max_abs"]>1e-7
          assert r["actual_shell_one_encoder_batch"] is True
          assert r["second_encoder_pass"] is False
          o=r["ownership"]
          assert o["matched_native_one_step_parameter_max_abs"]==0.0
          assert o["matched_native_one_step_output_max_abs"]==0.0
          assert o["zero_init_correction_native_runtime_gradient_l1"]==0.0
          assert o["native_objective_correction_gradient_l1"]==0.0
          assert o["js_only_native_runtime_gradient_l1"]==0.0
          assert r["used_for_model_selection"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Verify frozen M4 runtime integrity
        run: |
          (cd inputs/M4/hira-v0-m4-runtime && sha256sum -c INTEGRITY.sha256)

      - name: Run one fresh S47 TRAIN DEV court
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python scripts/hira_v1_s47_train_dev.py --bundle inputs/M4/hira-v0-m4-runtime --a0-result inputs/S47A0/result.json --out artifacts/s47-train-dev

      - name: Verify S47 matched receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import torch

          root=Path("artifacts/s47-train-dev")
          r=json.loads((root/"result.json").read_text())
          assert r["schema_version"]=="hira-v1-s47-matched-ordinal-pairwise-consensus-train-dev-v1"
          assert r["status"]=="PASS"
          assert r["outcome"] in {
              "HIRA_V1_S47_ORDINAL_PAIRWISE_CONSENSUS_DEV_COMPLETE",
              "HIRA_V1_S47_ORDINAL_PAIRWISE_CONSENSUS_DEV_READY",
          }
          assert r["scientific_authority"]=="V1_S47_FRESH_SAME_CHECKPOINT_LEGACY_VS_ORDINAL_PAIRWISE_CONSENSUS"
          assert r["seed"]==68001

          t=r["training_mechanics"]
          assert t["family"]=="exact_s45_cross_view_consistent_private_correction"
          assert t["checkpoint_selection"]=="exact_s45_selection_rule_before_ordinal_shell_evaluation"
          assert t["epochs"]==24
          assert t["batch_size_semantic_cases"]==16
          assert t["lr"]==2e-4
          assert t["weight_decay"]==0.01
          assert t["grad_clip"]==1.0
          assert t["correction_ce_coefficient"]==0.10
          assert t["correction_cross_view_js_coefficient"]==0.25
          assert t["second_encoder_pass"] is False

          shell=r["decision_shell"]
          assert shell["baseline"]=="S45_equal_mean_standardized_primary_plus_corrected_relation"
          assert shell["treatment"]=="S47_pairwise_majority_copeland_private_ordinal_tiebreak"
          assert shell["lexicographic_base_rule"]=="2K-1"
          assert shell["treatment_trainable_parameters"]==0
          assert shell["uses_raw_magnitude_after_ranking"] is False
          assert shell["learned_gate"] is False
          assert shell["temperature"] is None
          assert shell["threshold"] is None

          p=r["partitions"]
          assert p["train_semantic_cases"]==768
          assert p["dev_semantic_cases"]==192
          assert len(p["domains"])==12
          assert p["k"]==4
          assert p["views_per_option"]==2
          assert p["identical_rows_across_training_arms"] is True
          assert p["prior_track_exact_rows_used"] is False
          assert p["s46_train_dev_rows_used"] is False
          assert p["s47_a0_rows_used"] is False

          tr=r["trajectory_invariant"]
          assert tr["all_epoch_runtime_state_sha256_equal"] is True
          assert tr["reference_runtime_trajectory_sha256"]==tr["treatment_runtime_trajectory_sha256"]
          assert tr["epoch_count"]==24

          cp=r["selected_treatment_checkpoint"]
          assert 1<=cp["epoch"]<=24
          assert cp["total_parameter_count"]==163840
          assert cp["correction_parameter_count"]==114688

          sc=r["same_checkpoint"]
          legacy=sc["legacy_s45_shell"]
          ordinal=sc["ordinal_s47_shell"]
          assert legacy["semantic_cases"]==192
          assert ordinal["semantic_cases"]==192
          assert legacy["state_view_encodes"]==384
          assert ordinal["state_view_encodes"]==384
          assert legacy["full_k"] is True
          assert ordinal["full_k"] is True
          assert legacy["fused_option_order_flip_rate"]<=0.02
          assert ordinal["fused_option_order_flip_rate"]<=0.02
          assert legacy["fused_max_probability_mass_error"]<=1e-6
          assert ordinal["fused_max_probability_mass_error"]<=1e-6
          assert isinstance(sc["delta_ordinal_minus_legacy"],dict)
          for key in (
              "fused_canonical_accuracy",
              "fused_paraphrase_accuracy",
              "fused_canonical_paired_both_correct_rate",
              "fused_question_swap_choice_change_rate",
              "fused_cross_view_selected_choice_agreement",
              "fused_cross_view_mean_js",
              "fused_canonical_mean_gold_margin",
              "fused_paraphrase_mean_gold_margin",
          ):
              assert key in sc["delta_ordinal_minus_legacy"]
          assert isinstance(sc["ordinal_diagnostics"],dict)
          assert isinstance(sc["ordinal_gates"],dict)
          assert sc["ordinal_dev_ready"]==all(sc["ordinal_gates"].values())

          experts=sc["expert_metrics"]
          for key in (
              "raw_triadic_canonical_accuracy",
              "raw_triadic_paraphrase_accuracy",
              "native_relation_canonical_accuracy",
              "native_relation_paraphrase_accuracy",
              "corrected_relation_canonical_accuracy",
              "corrected_relation_paraphrase_accuracy",
              "corrected_relation_cross_view_agreement",
              "corrected_relation_cross_view_mean_js",
              "mean_same_option_signature_cosine",
              "mean_signature_same_vs_strongest_wrong_margin",
          ):
              assert key in experts

          treatment=r["treatment_training_arm"]
          assert treatment["parameter_surface"]["total_trainable_parameters"]==163840
          assert treatment["parameter_surface"]["correction_trainable_parameters"]==114688
          assert treatment["gates"]["runtime_trajectory_identity"] is True

          for filename,arm,total,corr in (
              ("reference-native-candidate.pt","reference",49152,0),
              ("treatment-private-correction-candidate.pt","treatment",163840,114688),
          ):
              path=root/filename
              assert path.is_file()
              payload=torch.load(path,map_location="cpu",weights_only=True)
              assert payload["arm"]==arm
              assert payload["total_parameter_count"]==total
              assert payload["correction_parameter_count"]==corr

          assert r["post_dev_tuning_performed"] is False
          assert r["second_dev_run_performed"] is False
          assert r["sealed_confirm_opened"] is False
          assert r["external_laya_jev_evaluation_opened"] is False
          assert r["production_ready_claimed"] is False
          PY

      - name: Freeze S47 matched integrity
        run: |
          (cd artifacts/s47-train-dev && sha256sum result.json train-manifest.json dev-manifest.json reference-native-candidate.pt treatment-private-correction-candidate.pt > INTEGRITY.sha256 && sha256sum -c INTEGRITY.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: hira-v1-s47-matched-ordinal-pairwise-consensus-train-dev
          path: artifacts/s47-train-dev
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
